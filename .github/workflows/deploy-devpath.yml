name: 🚀 Deploy DevPath to Cloudflare Workers

on:
  push:
    branches: [main, develop]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "__tests__/**"
      - ".husky/**"
      - "vitest.config.ts"
      - "tsconfig.json"
      - ".eslintrc.json"
      - "tailwind.config.ts"
      - "postcss.config.js"
      - "package.json"
      - "package-lock.json"
      - "next.config.js"
      - "open-next.config.ts"
      - "wrangler.toml"
      - ".github/workflows/deploy-devpath.yml"
  workflow_dispatch:

jobs:
  quality-gate:
    name: Quality Gate (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript Typecheck
        run: npm run typecheck
      - name: Unit Tests
        run: npm test

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build for Cloudflare (OpenNext)
        run: npx opennextjs-cloudflare build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify Cloudflare Secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "API Token set: $([[ -n "$CF_API_TOKEN" ]] && echo 'YES' || echo 'NO - MISSING!')"
          echo "Account ID set: $([[ -n "$CF_ACCOUNT_ID" ]] && echo 'YES' || echo 'NO - MISSING!')"
          echo "Account ID value: ${CF_ACCOUNT_ID:0:4}****${CF_ACCOUNT_ID: -4}"
          if [[ -z "$CF_API_TOKEN" || -z "$CF_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret is missing! Please add them in GitHub Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Output Deployment URL
        if: always()
        run: |
          echo "✅ Deployment completed!"
          echo "🔗 Workers: https://dash.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/services/devpath-ai"
          echo "🌐 Production URL: https://devpath-ai.pages.dev (via custom domain) or https://devpath-ai.workers.dev"
