# wrangler.toml
# Cloudflare Workers 配置（OpenNext adapter）
# 部署：npx wrangler deploy
#
# 2026-07-27 从 @cloudflare/next-on-pages 迁移到 @opennextjs/cloudflare：
#   - pages_build_output_dir → main + [assets]
#   - Pages Functions → Workers（nodejs_compat 模式，不再需要 edge runtime 声明）
#   - 保留所有 KV bindings 和 AI binding

name = "devpath-ai"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[kv_namespaces]]
binding = "KV"
id = "086d793456e5425bacb04836da93ad9b"
# 预览环境使用独立 namespace，避免污染生产数据
preview_id = "preview-kv-namespace-placeholder"

# apiKey Session 安全架构专用 namespace
[[kv_namespaces]]
binding = "AUTH_SESSIONS"
id = "ff753a3ce9664d93a79f2e25c36f3433"

[[kv_namespaces]]
binding = "AUTH_NONCES"
id = "02684817b6884df4a1eb48416426cf07"

[[kv_namespaces]]
binding = "AUTH_AUDIT"
id = "31f90bc37a644f55902e1a8b4ebce13f"

# Workers AI binding（知识库向量化：/api/embed 调 bge-base-en-v1.5 嵌入查询文本）
# OpenNext 通过 getRequestContext().env.AI 读取（与 next-on-pages 相同的 symbol 机制）
[ai]
binding = "AI"

[vars]
AI_PROVIDER = "deepseek"
# 以下密钥通过 `wrangler secret put <NAME>` 上传：
# - MASTER_KEY        : 加密会话根密钥（32 字节 base64，必须配置，openssl rand -base64 32 生成）
# - DEEPSEEK_API_KEY : DeepSeek API Key
# - GLM_API_KEY       : 智谱 GLM API Key（如使用 glm provider）
