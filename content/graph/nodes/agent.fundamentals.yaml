id: agent.fundamentals
title: Agent 基础（循环、工具、状态）
summary: Agent = LLM + 工具调用 + 循环。模型自主决定下一步做什么，直到任务完成或中止。区别于单次 LLM 调用，Agent 有状态机与终止条件。
tracks: [frontend-to-ai-engineer]
phase: 3
prerequisites: [llm-api.function-calling, rag.production-pipeline]
estimatedMinutes: 120
difficulty: 3
frontendBridge: >-
  Agent ≈ 一个带"大脑"（LLM）和"手脚"（工具）的事件循环。你写过 React 的状态机（idle/loading/
  success/error），Agent 也是状态机：观察（看工具返回）→ 思考（LLM 决策）→ 行动（调工具）→ 循环，
  直到"完成"或"中止"。区别是这里的"状态转移函数"是概率性的 LLM。
concepts:
  - Agent 三要素：LLM（决策）+ Tools（行动）+ Loop（循环直到终止）
  - ReAct 模式：Reason（思考）→ Act（调工具）→ Observe（看结果）→ 循环
  - 终止条件：模型返回 finish / 达到 max_steps / 触发安全闸 / 超时
  - 状态管理：每步的 thought + action + observation 组成 trajectory，作为下一步上下文
  - 与 RAG 的区别：RAG 是"检索一次生成一次"，Agent 是"多步行动+多轮检索+多轮生成"
sourceIds: [anthropic-agents-guide, langchain-agent-docs, lilian-weng-agents]
gotchas:
  - Agent 不是"更强的 LLM"——是 LLM + 循环 + 工具，循环失控是最大风险（烧钱/死循环/危险操作）
  - max_steps 必须设——不然一个死循环能烧掉一个月预算
  - 工具描述写不好 Agent 就不会用——Agent 读的是 description 不是源码
interview:
  - q: Agent 和单次 LLM 调用、RAG 的本质区别是什么？
    answerSkeleton: >-
      【分层原理】三者的本质区别是"自主性"与"循环结构"。单次 LLM 调用：输入→输出，无状态无工具
      无循环，是确定性任务的"纯函数"，适合翻译、摘要、格式转换。RAG：检索一次→生成一次，给模型
      接了"外脑知识"，但决策链路仍是写死的两步，没有多步行动能力。Agent：LLM+工具+循环，模型自己
      决定下一步干什么——调哪个工具、传什么参数、看到结果后是继续还是收工。ReAct 模式把这个循环
      显式化：Reason（思考）→Act（调工具）→Observe（读结果）→再 Reason，每步的 thought+action+
      observation 拼成 trajectory 作为下一步上下文。所以 Agent 本质是一个"以概率模型为状态转移函数
      的状态机"，这也是它所有工程风险（死循环、工具误用、成本失控）的根源。【实际案例】我在一个
      "竞品监控 Agent"项目里踩过全套坑。功能是每天自动搜 20 个竞品的更新并写日报。第一版没设
      max_steps，有个竞品官网改版后搜索工具一直返回空，Agent 反复换关键词重试，一晚上跑了 400 多步、
      烧掉 60 多美金，早上看 trace 才发现它在循环里自己给自己打气"再试一次也许就有了"。第二个坑是
      工具误用：我把"写日报"和"存草稿"两个工具的 description 写得太像，14% 的运行里 Agent 把草稿
      直接当日报发出去了。修法是把 description 改成带正误用例的"使用说明书"，发日报前加一步人工
      确认，再补上 max_steps=30 和单工具调用上限，之后没再出过事故。【举一反三】前端经验直接映射：
      Agent ≈ 带大脑的事件循环，你用 XState 写过的 idle/loading/success/error 状态机思维完全适用，
      区别只是转移函数从确定性代码换成概率模型。判断该不该上 Agent，就问自己"流程能写死吗"——
      能写死的是工作流，写不死的才需要模型自主决策。【扣分点对照】背八股的答案是罗列"单次调用
      没工具、RAG 有检索、Agent 有循环"的定义；真做过的能讲出死循环烧钱、工具 description 写烂
      导致误用这类具体事故，以及 max_steps、调用上限这些止血措施——没踩过坑的人不知道坑长什么样。
    followups:
      - 什么场景该用 Agent，什么场景用 RAG 或单次调用就够？
      - 工具 description 怎么写才能让 Agent 不误用？你踩过什么坑？
      - Agent 的 trajectory 越来越长，上下文爆了怎么办？
  - q: 什么样的任务该用固定工作流（workflow），什么样才该上 Agent 自主决策？
    answerSkeleton: >-
      【分层原理】Anthropic 在 Building Effective Agents 里的口径很直接：能固定流程就别让模型
      自主决策，从最简单的方案起步，按需增加复杂度。判断标准三条。一是步骤可枚举性：流程能画成
      确定流程图（先检索、再生成、再审校）就用 workflow——可预测、好调试、成本低；步骤取决于
      中间结果、事先枚举不出来（"研究一个开放问题"）才需要 Agent 自主规划。二是容错成本：Agent
      每步决策都有错误率，10 步链路错误率级联放大，workflow 把路径写死就没有决策误差。三是价值
      密度：自主决策带来灵活性溢价，只有当"灵活性收益 > 错误率+成本+调试代价"时才划算。
      【实际案例】我在客服工单分类项目里验证过这个边界。最初直接上了 Agent：模型自主决定调
      "查订单/查物流/转人工"工具。上线一周 bad case 分析发现，80% 的咨询路径其实高度固定——
      用户报订单号→查状态→给答复，根本不需要自主决策，而 Agent 在剩下 20% 里也常选错工具。
      重构成 workflow：前置一个轻量分类器（准确率 96%），按类别走三条写死的处理链，只有分类
      置信度低的才降级到 Agent 自由处理。结果：平均延迟从 9 秒降到 3 秒，单次成本降 58%，
      错误率反而比纯 Agent 更低。【举一反三】这和前端"能用受控组件就别写非受控组件"一个道理：
      确定性是工程友好的，概率性是不得已的。面试被问"你的项目为什么用 Agent"时，答"因为步骤
      无法预先枚举、中间结果决定路径"是合格答案，答"Agent 比较先进"是扣分答案。
      【扣分点对照】把 Agent 当默认选项、觉得"工作流是低级方案"的是追热点；能说出错误率级联、
      决策成本、以及"先 workflow 后 Agent"演进路径的，才是被账单和 bad case 教育过的人。
    followups:
      - 怎么判断一个现有工作流里哪个环节值得"Agent 化"？
      - 前置分类器的置信度阈值怎么定？定高定低各有什么代价？
  - q: ReAct 模式里显式的 thought（推理轨迹）到底起什么作用？终止条件怎么设计才可靠？
    answerSkeleton: >-
      【分层原理】thought 不是"让模型显得在思考"，它有三个机制作用。一是目标对齐：每步行动前
      强制把当前观察与原始目标对照，不带 thought 的循环在长轨迹里会逐步漂移——模型收集起
      无关数据还自洽。二是留痕可调试：出错能分清是"想错了"还是"工具返回错了"。三是上下文
      锚点：模型读自己上一步的推理，比只读干瘪的工具返回更能保持策略连贯。代价是每步多花
      token，工程上常用"按需思考"：执行性步骤省略，分叉决策点强制 thought。终止条件要四层
      叠加：模型主动 finish 是主路径；max_steps 兜死循环；同一工具连续失败 N 次熔断兜"换
      参数重试"；成本与超时上限兜账单——只靠模型自己宣布完成，等于把刹车交给司机。
      【实际案例】我在竞品监控 Agent 里实测：去掉 thought 后 20 步任务的目标漂移率从 4% 涨
      到 19%，加回"每 3 步强制一次目标对齐 thought"后降回 5%。终止条件用 max_steps=30 +
      单工具连续失败 3 次熔断 + 单次成本上限 0.5 美金，三层都兜住过真实事故——熔断那次是
      搜索接口挂了，Agent 连换 17 组关键词重试。【举一反三】thought ≈ 状态机里的
      transition log，没有它机器照跑，但出 bug 只能靠猜；终止条件叠加 ≈ 前端请求的超时 +
      重试上限 + 熔断器，防御从单闸变多闸。【扣分点对照】把 thought 说成"思维链提示词技巧"
      的是只读过论文；能讲出目标漂移实测数据、按需思考的 token 权衡、终止条件各层兜什么
      事故的，才是把 ReAct 跑上过生产的人。
    followups:
      - 按需思考怎么判断哪些步骤必须显式 thought？判断本身要不要再花一次模型调用？
      - 模型提前宣布 finish（其实没做完）怎么检测？
  - q: Agent 上线后怎么观测？trace、指标、eval 怎么做，最常见的失败模式有哪些？
    answerSkeleton: >-
      【分层原理】Agent 观测难在"每步输入输出是自然语言、链路动态生成"。体系分三层。第一层
      trace：每次运行记录完整 trajectory（每步的 thought/action/observation/耗时/token），
      按 run_id 串联——没 trace 的 Agent 等于没日志的服务端。第二层指标：任务成功率、步数
      分布、工具调用分布、单任务成本——步数 P95 突然变长往往是环境变了（网站改版、接口变
      慢）的先兆。第三层 eval：固定任务集定期回归，模型升级、prompt 改动、工具变化都会改变
      行为，不回归就是裸奔。最常见失败模式按频率排：工具误用、死循环/重试循环、目标漂移、
      提前宣布完成、工具返回误读（把报错当正常结果继续推理）。【实际案例】我在竞品监控
      Agent 上搭过最小观测：trace 落 LangSmith，每周抽 50 条人工标注。第一周就发现 22% 的
      失败是工具返回误读——搜索接口返回"无结果"HTML，Agent 当成正常页面总结了一段。修法
      是工具侧返回结构化 status 字段 + prompt 写明"status=empty 时换策略"。eval 回归还抓住
      过一次模型小版本升级：成功率从 87% 掉到 79%，当天回滚模型版本——没有 eval，这个回归
      会以 bad case 形式被用户陆续撞见。【举一反三】和前端监控完全同构：trace ≈ 全链路埋点，
      成功率/成本 ≈ 核心指标看板，eval ≈ UI 回归截图对比——区别只是被测对象从确定性渲染
      变成概率性决策。【扣分点对照】只说"打日志"的是把 Agent 当普通服务；能讲出步数分布
      漂移预警、工具返回误读这类失败形态、eval 抓住模型升级事故的，才是真运维过 Agent 的人。
    followups:
      - trace 数据量很大，抽样人工标注的策略怎么定？
      - eval 任务集怎么建？任务成功率怎么自动判定，LLM-as-judge 靠谱吗？
