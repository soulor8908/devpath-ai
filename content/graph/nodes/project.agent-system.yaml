id: project.agent-system
title: 里程碑项目 · 生产级 Agent 系统
summary: Phase 3 出口项目：实现一个有真实用途的 Agent 系统（如"研究助手""代码 PR 审查员""客服 Agent"），含 LangGraph 编排、工具生态、记忆、HITL 安全闸。这是 Agent 工程师的求职名片。
tracks: [frontend-to-ai-engineer]
phase: 3
prerequisites: [agent.langgraph-orchestration, agent.tool-ecosystem, agent.memory-and-state, agent.hitl-safety]
estimatedMinutes: 480
difficulty: 4
frontendBridge: >-
  这是 Phase 0-2 技能的集成 + Agent 全栈落地。你做过的前端工程化（状态机、错误边界、监控、
  二次确认）全部适用，只是"决策者"从"用户点击"换成了"LLM 自主"。重点是有真实用途 + HITL
  安全闸，不是炫技 demo。
concepts:
  - LangGraph 编排：节点图 + 条件路由 + checkpointer 持久化
  - 工具生态：至少 3 个工具（含 1 个危险操作），MCP server 或自实现
  - 记忆管理：结构化 state + 滑动窗口 + 长期记忆（向量库）
  - HITL 安全闸：工具分级 + 危险操作暂停确认 + 审计日志
  - 可观测：每步 trajectory 落盘，token 成本统计，失败可回放
sourceIds: [langgraph-docs, anthropic-agents-guide, lilian-weng-agents]
lab: content/labs/agent-system
gotchas:
  - 不要做"通用 Agent"——聚焦一个真实场景（研究/审查/客服），通用 Agent 做不深且难评估
  - HITL 不是"加上去就行"——要设计好暂停/恢复的 UX，人工确认的上下文要清晰呈现
  - 评测 Agent 比评测 RAG 更难——定义清楚"任务成功"的标准（如"研究助手产出的报告含 3+ 可信来源"）
interview:
  - q: 介绍一下你的 Agent 系统——它完成什么任务，架构怎么设计？
    answerSkeleton: >-
      【分层原理】一句话定调：这是一个"研究助手"Agent——给一个课题，它自主完成搜索、
      阅读、交叉验证，产出带可信引用的研究报告，全程有 HITL 安全闸与成本熔断。架构
      分四层：编排层用 LangGraph 节点图，任务拆解 → 工具执行 → 反思的路由由状态驱动，
      checkpointer 持久化每一步；工具层五个工具按危险度分级——搜索/网页抓取是只读
      安全级直接放行，写文件/发邮件是危险级必须人工确认后才执行；记忆层是结构化
      state + 滑动窗口 + 向量库长期记忆；保障层是 trajectory 全落盘、token 成本实时
      累计进 state、max_steps/max_cost 双熔断。【实际案例】用数据收尾：在 20 个真实
      研究课题上测试，报告可用率（含 3+ 可信来源、抽核无事实错误）85%，平均每个课题
      14 步、耗时 4 分钟、成本 0.6 美元；HITL 闸真拦下过一次误操作——模型试图把
      初步结论邮件发给受访者，人工确认环节发现收件人填错，拦下了；熔断机制拦过两次
      死循环，最典型一次是搜索 query 反复同义改写但结果集不变，跑了 23 步被
      max_steps 截停，避免了账单继续燃烧。【举一反三】这套架构对贵司任何 Agent 场景
      通用：客服 Agent 的工具分级、代码审查 Agent 的 trajectory 回放、数据分析 Agent
      的成本熔断——"任务拆解图 + 工具分级 + HITL + 熔断"四件套是生产 Agent 的标配，
      与具体业务无关。【扣分点对照】Demo 级回答："用 ReAct 循环，模型自己决定调什么
      工具"——这是玩具。生产级回答：能讲出工具按危险度分级的设计、HITL 暂停/恢复的
      实现、死循环怎么检测熔断、成本怎么控制——只讲"模型自主性"不讲"约束机制"的，
      面试官默认你没上过线。
    followups:
      - 任务拆解靠模型一次规划还是边做边规划？怎么选？
      - 工具的接口 schema 怎么设计？给模型的工具描述有什么讲究？
      - 20 个课题的"可用率 85%"是怎么评出来的？
  - q: 你设计的 Agent 在生产中"卡住"了（循环但不进展），怎么检测与恢复？
    answerSkeleton: >-
      【分层原理】"卡住"指循环在跑但 trajectory 不再有实质进展——比崩溃隐蔽，会无声
      烧钱。检测分三层：结构化检测最可靠——监测"连续 N 步 action 重复"或"state 关键
      字段连续 M 步不变"，命中即判定；LLM 评判做补充——每 K 步让另一个模型看
      trajectory 判断是否在取得进展，但增加成本与延迟；硬上限兜底——max_steps/
      max_tokens/max_cost/timeout，前两层都漏了也能强制中止。恢复三招：回滚到上一个
      进展检查点重新分支（依赖 checkpointer）、注入"你似乎卡住了，换个思路"的元提示
      让模型换策略、降级为简单 RAG 或转人工。【实际案例】我撞过真实案例：Agent 研究
      某小众框架的部署问题，搜索引擎始终返回相同的 5 篇无关博客，模型陷入"换个同义词
      再搜"的循环，23 步花了 1.8 美元还没停——是 max_steps=25 把它截停的。复盘后加了
      两道防线：一是"结果集去重检测"，连续 3 次搜索结果重合度超 80% 就判定该方向无
      进展，强制换工具（从搜索切到直接抓取官方文档）；二是"进展打分"，每 5 步检查
      state 里已收集事实数是否增长，连续零增长两次即触发元提示干预。之后同类卡住从
      每周 3-4 次降到每月 1 次以内。【举一反三】这和前端"loading 转圈但不报错"的卡死
      排查同构——核心是定义"进展"的可观测指标。贵司任何长流程自动化（审批流、数据
      pipeline、RPA）都需要同样的"无进展检测 + 熔断 + 降级"三件套。【扣分点对照】
      Demo 级回答："设个 max_steps 就行"——只有兜底没有检测。生产级回答：能区分三层
      检测（结构化/LLM 评判/硬上限）各自的定位与成本、讲出恢复策略而不只是中止、有
      "搜索结果重合度"这种具体可实现的进展指标。
    followups:
      - 怎么区分"Agent 在长时间思考"和"Agent 卡住了"？
      - 回滚到检查点后，怎么避免又走同一条死路？
  - q: Agent 项目里你遇过最严重的事故或最贵的教训是什么？
    answerSkeleton: >-
      【分层原理】Agent 最贵的教训几乎都关于"自主性 × 循环 × 计费"的乘积——传统服务
      死循环烧的是 CPU，Agent 死循环烧的是按 token 计费的真金白银。系统性防御分四层：
      预算硬熔断（单任务/单日成本上限，命中即停）、成本实时可见（每步 token 累计进
      state，任何一步都知道已花多少）、循环检测前置（无进展早发现早停）、告警外送
      （成本异常增速时通知人）。【实际案例】教训发生在上线第一周：一个用户输入了表述
      矛盾的任务，Agent 陷入"规划 → 发现矛盾 → 重新规划"的循环，每次重规划都把完整
      上下文（含已积累的 3 万多 token 历史）重发一遍。我当晚没设成本告警，第二天早上
      看到账单：单个任务 9 小时跑了 340 多美元，是正常任务成本的 500 倍。止损靠手动
      kill，根因是三个缺失：没有单任务成本上限、没有重规划次数限制、没有成本告警。
      修复后同类事故归零：单任务成本上限 2 美元、重规划限 3 次、成本增速超阈值（5
      分钟内翻 3 倍）触发告警并自动暂停等人工确认。这张账单我截图存在 README 里，
      是最好的设计文档。【举一反三】这个教训对贵司任何用 LLM 的场景都值钱：chatbot
      的死循环对话、批量任务的异常重试风暴、RAG 的查询放大——凡是"模型自主决定循环
      次数"的系统，成本熔断必须是第一版就有的功能，不是优化项。【扣分点对照】Demo 级
      回答："我会注意控制成本的"——空头支票。生产级回答：能讲出事故的具体数字链
      （多久、多少步、多少钱、是正常值多少倍）、根因归因到具体缺失的机制、修复后每条
      防御线的具体阈值——账单是最好的老师，被它教育过的人一讲数字就听得出来。
    followups:
      - 单任务成本上限 2 美元怎么定出来的？误杀正常长任务怎么办？
      - trajectory 落盘都记哪些字段？事后怎么用它复盘这次事故？
