id: llm-api.structured-output
title: 结构化输出（JSON Schema 与校验闭环）
summary: 让模型输出机器可消费的 JSON：JSON Mode、Structured Outputs（Schema 强制）、Pydantic/Zod 校验与失败重试闭环。
tracks: [frontend-to-ai-engineer]
phase: 1
prerequisites: [llm.api-first-call]
estimatedMinutes: 120
difficulty: 3
frontendBridge: >-
  你在前端处理过"后端返回的 JSON 不可信"问题——运行时校验（Zod）是标准答案。
  这里的区别在于：生产者不是后端服务而是概率模型。
  Structured Outputs ≈ 在模型侧加了类型约束（生成时强制遵循 Schema），
  Pydantic/Zod 校验 ≈ 消费侧的二次保险——两道闸门缺一不可。
concepts:
  - JSON Mode：保证输出是合法 JSON，但不保证结构
  - Structured Outputs：提供 JSON Schema，生成过程被约束，结构有保证
  - 校验闭环：解析失败 → 错误信息回喂模型 → 重试（最多 N 次）→ 人工兜底
  - Schema 设计：字段命名、枚举约束、可选字段的显式 null
sourceIds: [openai-structured-outputs, pydantic-docs, vercel-ai-sdk]
gotchas:
  - JSON Mode 下模型仍可能输出结构错误的 JSON——Mode ≠ Schema
  - Schema 嵌套过深会显著降低遵循度——扁平结构优于深层嵌套
  - 重试不带错误反馈是死循环：必须把校验错误信息喂回给模型
interview:
  - q: 如何保证 LLM 输出的 JSON 100% 可解析且结构正确？
    answerSkeleton: >-
      【分层原理】分层防御，因为模型是概率系统、任何单层都给不了 100%。生成层是第一道闸门：
      Structured Outputs 把 JSON Schema 编译进解码过程（约束解码），不合法的 token 在采样时被
      直接屏蔽——这是"结构上不可能错"，和 JSON Mode 的"只保证是合法 JSON、结构靠模型自觉"有
      本质区别。校验层是第二道：消费侧用 Zod/Pydantic 做运行时校验，拦住生成层的漏网和业务规则
      错误。修复层是第三道：校验失败时把具体错误（哪个字段、期望什么类型、实际是什么）回喂模型
      重试——裸重试是死循环，带错误反馈的重试收敛很快；重试 N 次仍失败走人工或默认值兜底。
      监控层：解析失败率接告警，它是 prompt 漂移的上游信号。工程上接受"有限重试 + 监控"而不是
      追求字面意义的 100%——后者的成本无上限。【实际案例】我在简历解析项目实测过这道防线的价值：
      用 JSON Mode 时 500 份真实简历解析失败率 7.2%（主要死法是字段缺失、把字符串塞进数组）；切
      Structured Outputs 后结构错误归零，但业务校验（日期格式、枚举值范围）仍有 1.8% 失败，靠
      "错误信息回喂重试一次"收敛到 0.3%，剩余进人工队列。另一个教训：schema 最初设计成三层嵌套
      （工作经历史里嵌项目经历），遵循度明显差，拍平成并列数组后业务错误率从 3.1% 降到 1.2%。
      【举一反三】这就是前端的"客户端校验 + 服务端校验"双闸门：Structured Outputs ≈ TS 编译期
      类型（生产侧强约束），Zod ≈ 运行时校验（消费侧不信任输入），错误回喂 ≈ 表单把校验错误标到
      具体字段。【扣分点对照】背八股的答案是"JSON Mode + try/catch 重试"；真做过的能讲清约束解码
      vs 语法保证的本质区别、嵌套深度影响遵循度的实测经验，以及失败率从百分之几收敛到千分之几的
      完整数字链。
    followups:
      - 校验失败的错误信息回喂，具体怎么组织模型才改得准？
      - 什么场景你宁愿放弃结构化、用自然语言 + 正则提取？
      - 解析失败率监控到什么水位该告警？怎么定？
  - q: Schema 怎么设计模型的遵循度最高？强约束解码会不会影响输出质量？
    answerSkeleton: >-
      【分层原理】四条实证原则。一，扁平优于嵌套：嵌套每深一层，模型的注意力分配与括号配对负担
      就重一分，三层以上嵌套遵循度明显下降——能拍平成并列数组就别做树。二，枚举优于自由文本：
      enum 把开放生成变成分类问题，错误率差一个量级；自由文本字段加 minLength/maxLength 也有帮助。
      三，字段命名要语义直白：用 company 而不是 c，模型对字段的理解就靠字面。四，可选字段要小心：
      太多 optional 会教会模型"偷懒留空"，能要求显式填 null 就不要省略字段。至于质量影响：约束
      解码把 token 空间收窄到合法范围，对结构化字段（日期/枚举/数字）是纯增益；有研究观察到极严格
      约束在长推理链任务上可能轻微限制发散，但对提取/分类这类主流场景收益远大于代价。【实际案例】
      我在发票信息提取项目把 schema 从"嵌套 4 层 + 自由文本"重构为"扁平 18 个字段 + 12 个枚举"：
      结构遵循度从 91% 到 99.7%，业务校验失败率从 5.4% 降到 0.9%。代价是字段变多、schema 占的
      prompt token 涨了 40%，这笔成本用 Prompt 缓存兜住。踩过的坑：早期"发票类型"用自由文本，
      模型输出"增值税专票""增值税专用发票""专票"三种写法，下游 switch 全崩，改枚举后根治。
      【举一反三】这和你设计组件 props 的直觉完全一致：扁平 props 比深嵌套 config 对象好用，字面量
      联合类型比 string 安全，语义化命名比缩写强——Schema 就是给模型看的接口文档。【扣分点对照】
      只答"给模型一个 schema 就行"的是 Demo 级理解；能讲出扁平化、枚举化、显式 null 三条原则各自
      背后的失败案例，以及"约束解码对发散任务的潜在影响"这种 tradeoff 的，才是真调过 schema 的人。
    followups:
      - 必填字段太多时模型会"编造"内容来填满，这个矛盾怎么处理？
      - schema 里每个字段的 description 写什么有用？（提示：它会进 prompt）
  - q: JSON Mode、Function Calling 的 parameters、Structured Outputs 三者有什么区别？怎么选型？
    answerSkeleton: >-
      【分层原理】三者常被混为一谈，但保证强度完全不同。JSON Mode 只保证输出是语法合法的 JSON，
      结构全靠 prompt 里口头约定——本质是语法保证，约束发生在模型自觉。Structured Outputs 是把
      JSON Schema 编译进解码器做约束解码：每个采样步骤屏蔽会让输出违反 schema 的 token，结构
      错误在物理上不可能出现——这是结构保证，OpenAI 2024 年 8 月正式推出，response_format 传
      json_schema 加 strict: true。Function Calling 的 parameters 用的是同一套 schema 约束机制，
      但语义不同：它的产出是一个待执行的函数调用请求，模型在多个工具间做选择；Structured Outputs
      是这次回答本身的格式。选型一句话：要模型给出机器消费的数据用 Structured Outputs，要模型
      决定调用什么能力用 Function Calling，JSON Mode 只在 provider 不支持 Structured Outputs 时
      当备胎。工程注意点：约束解码首次编译 schema 有几百毫秒初始化延迟（后续被缓存）；strict 模式
      要求 additionalProperties: false、全字段 required，且只支持 JSON Schema 的一个子集。【实际案例】
      我在信息抽取系统里三件套全用过：早期 JSON Mode 结构错误率 7.2%；切 Structured Outputs 后
      归零，但第一次上线没设 additionalProperties: false，模型往输出里塞了个解释性字段，下游严格
      反序列化直接报错，补上后稳定。Function Calling 用在同一系统的查询路由上：选查数据库还是查
      文档是工具决策，选中后的参数同样受 schema 约束——抽取和路由是同一套机制的两种语义。
      【举一反三】三者关系 ≈ 前端三种约束：JSON Mode 像只约定了接口文档没有任何检查，Structured
      Outputs 像 TS 编译期类型（不合法根本产不出来），Function Calling 像事件派发（类型保证载荷
      结构，但派哪个事件是另一层决策）。【扣分点对照】说 JSON Mode 就能保证结构的是踩坑预告；能
      讲清约束解码的机制区别、strict 模式的 schema 硬性要求、首次编译延迟、以及格式约束与工具
      决策是两种语义的，才是把三者都上过线的人。
    followups:
      - strict 模式对 schema 有什么硬性要求？哪些 JSON Schema 特性不支持？
      - 约束解码首次编译有延迟，低延迟场景怎么处理？（提示：预热、复用、容忍首请求）
      - 什么场景 Structured Outputs 也保证不了你要的结果？（提示：合法但错误的业务语义）
  - q: 校验失败后的重试闭环怎么设计？错误信息怎么回喂模型才改得准？
    answerSkeleton: >-
      【分层原理】核心认知：校验失败裸重试（原 prompt 原样再发）是掷骰子，模型不知道自己错在哪，
      失败率几乎不降；有效闭环是诊断式重试——把校验器输出的结构化错误回喂，让模型在知道错因的
      前提下修正。回喂内容三要素：哪个字段（JSON path 精确定位）、期望什么（schema 约束原文）、
      实际给了什么（模型错误输出原文），Zod 的 issues 数组天然就是这个结构。重试策略三原则：一是
      带上完整原始输出让模型改错而不是重写——重写会引入新错误；二是最多重试一到两次，两次还改
      不对说明是系统性问题（schema 与任务不匹配），再重试是烧钱，转人工或降级；三是重试用低温度，
      修正任务不需要发散。监控闭环：按错误类型分桶统计（缺字段/类型错/枚举越界/格式错），桶分布
      是 schema 与 prompt 优化的路标——类型错多说明字段描述不清，枚举越界多说明枚举值没覆盖
      业务真实分布。【实际案例】我在简历解析项目把闭环从裸重试 3 次改成诊断式重试 1 次：裸重试
      把 7.2% 失败率只压到 5.9% 还烧三倍 token；诊断式一次压到 0.3%，成本只有 1.3 倍。关键细节
      是把 Zod issues 转成自然语言短句回喂（直接丢错误码模型改得慢），并把原始输出截断到错误字段
      附近 200 字——整篇回喂时模型会顺手改动没错的字段，引入 2% 新错误，截断后降到 0.2%。
      【举一反三】这就是表单校验交互：错误标到具体字段（JSON path 定位）、显示期望值与当前值
      （校验信息）、用户局部修改而不是重填整个表单（带原文改错）——你设计过的表单纠错 UX，
      模型也需要同款。【扣分点对照】答失败了把错误塞回 prompt 重试的是方向对但没做过；能讲出
      改错 vs 重写的区别、重试温度调低、截断防连带改动、按错误类型分桶反哺 schema 设计的，才是
      把闭环跑通过的人。
    followups:
      - 重试时换更强的模型来救火值得吗？成本收益怎么算？
      - 两次重试还失败的 case 长什么样？怎么从根上消除？
      - 回喂错误用自然语言还是结构化 JSON？你实测过差异吗？
