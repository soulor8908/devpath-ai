id: llm-api.function-calling
title: Function Calling（工具调用）
summary: 让模型请求调用你定义的函数：工具声明（name/description/parameters）、模型决策、执行与结果回喂。这是 Agent 的原子能力。
tracks: [frontend-to-ai-engineer]
phase: 1
prerequisites: [llm-api.structured-output]
estimatedMinutes: 120
difficulty: 3
frontendBridge: >-
  声明一个 tool ≈ 定义一个组件的 props 接口：name 是组件名，
  description 是文档注释，parameters 是 TypeScript interface。
  模型扮演"调用方"，根据上下文决定调哪个函数、传什么参。
  你的工程直觉——单一职责、清晰接口、可组合——直接决定工具设计质量。
concepts:
  - 工具三要素：name、description（决定模型何时选它）、parameters（JSON Schema）
  - 调用循环：模型返回 tool_call → 你执行函数 → 结果以 tool 角色回喂 → 模型继续生成
  - 并行工具调用：一次响应可请求多个 tool_call
  - 危险操作闸门：写操作（发邮件/删数据）必须人工确认后才执行
sourceIds: [openai-function-calling, anthropic-tool-use, vercel-ai-sdk]
gotchas:
  - description 写不好，模型就不会在正确时机调用——它读的是文档不是代码
  - 工具执行结果可能很大（如搜索结果），直接回喂会爆上下文——需要截断或摘要
  - 模型可能幻觉出不存在的参数值——执行端必须再做一次参数校验
interview:
  - q: Function Calling 的完整调用循环是什么？并行调用怎么处理？哪一步最容易出 bug？
    answerSkeleton: >-
      【分层原理】完整循环五步：声明工具（name/description/parameters 的 JSON Schema）→ 模型决策
      返回 tool_calls（可一个可多个）→ 你的代码逐个执行 → 每个结果以 tool 角色消息回喂、与
      tool_call_id 一一配对 → 模型基于结果继续生成，可能发起新一轮调用直到给出最终回复。并行调用
      指同一个响应里返回多个 tool_call：执行侧要并发跑而不是串行等，回喂时每个结果都必须带对应的
      tool_call_id——漏一个或配错对，协议层直接报错。最易出 bug 的三处：一是回喂消息的配对与顺序，
      id 对不上是新手第一大坑；二是工具结果过大（如搜索返回 50 条记录）直接回喂爆上下文，要截断或
      摘要；三是执行异常的处理——工具抛错不能让循环崩掉，要把错误信息也作为 tool 结果回喂，让模型
      知道"调用失败、换个思路"。【实际案例】我在数据查询 Agent 项目里，并行调用是性能命脉：用户问
      "对比华东和华南上季度销售"，模型一次发起两个查询，串行执行 4.2s，改并发后 2.3s。最疼的坑是
      工具超时被 try/catch 吞掉、回喂了空字符串——模型把空结果解读为"没有数据"并据此编造结论。
      后来统一把异常序列化成 {"error": "timeout after 5s"} 回喂，模型会主动降级为"数据暂时查不到，
      建议稍后重试"，幻觉式回答消失。【举一反三】这就是前端的 Promise.all + 错误边界：并行请求要
      聚合错误而非吞掉，每个异步结果要和请求句柄配对——tool_call_id ≈ 你的 requestId。【扣分点对照】
      能把五步背出来的是八股；能讲出并行调用的并发执行与 id 配对、异常结果也必须回喂（否则模型把
      空当答案编）、结果截断防爆上下文这三个实战点的，才是写过调用循环的人。
    followups:
      - 并行调用里两个工具有依赖关系（第二个的参数依赖第一个的结果）怎么办？
      - 工具执行超时设多少合适？超时后的回喂内容怎么写模型才读得懂？
      - 危险写操作（发邮件/删数据）的人工确认闸门插在循环哪一步？
  - q: 模型工具调不准——选错工具、填错参数，怎么治理？
    answerSkeleton: >-
      【分层原理】模型选工具、填参数，依据只有你写的 name/description/parameters——它读的是文档
      不是代码，所以"调不准"本质是接口文档没写好。三个治理方向。描述当 prompt 写：description 要
      说清"什么时候用、什么时候不用、和相似工具的边界"，反面描述（"仅支持昨日及之前的数据，实时
      查询请用 X"）和正向描述同样重要；放一两个典型 query 例子效果显著。参数 schema 收紧：能枚举
      的绝不留自由文本（枚举把生成变成分类）；必填字段明确标 required，可选参数给默认值并写进
      描述；参数命名语义化；参数间的互斥/联动关系写进描述。系统性诊断：建"调用准确率"评测集——
      一批 query 标注"该调哪个工具、参数该是什么"，区分"选错工具"和"填错参数"两类错误分别治理，
      线上抽样持续对比。【实际案例】我在企业知识库 Agent 项目里调用准确率一度只有 76%。对 bad case
      分类：60% 是两个工具边界不清（search_docs 和 search_faq 的描述都写了"搜索资料"），25% 是参数
      格式错（日期爱填"上周三"这种相对时间）。三板斧：重写 description 划清边界并各加两个典型
      query；日期参数改枚举（today/yesterday/last_7d/last_30d）+ 要求先调 get_current_time 拿基准；
      评测集上线回归。三轮迭代后到 94%，剩余错误集中在真正的语义歧义，那部分加澄清追问兜底。
      【举一反三】这就是你写组件 API 文档的直觉：props 注释写清边界 case、字面量联合类型替代
      string、required 标明白——只是读者从同事变成模型，而模型是最"字面"的读者。【扣分点对照】
      调不准就只会"换更强的模型"的是烧钱思维；能按选错/填错分类诊断、讲出反面描述、枚举化、典型
      query 示例三个手段及各自修复比例的，才是真调过工具的人。
    followups:
      - description 里写"什么时候不要用它"为什么有效？原理是什么？
      - 为什么日期参数不建议让模型直接填绝对时间？（提示：模型不知道"今天"是哪天）
      - 调用准确率评测集怎么建？多少条够用？
  - q: 工具数量涨到几十上百个时，会出现什么问题？怎么架构？
    answerSkeleton: >-
      【分层原理】两个硬性瓶颈：一是 token 成本——每个工具的声明都占 prompt，100 个工具光声明就
      几千 token，每次调用都重发；二是选择准确率——选项越多模型越容易选错，和下拉框超过 20 个
      用户就乱选同理。解法是"别把所有工具一次性摆上桌"。工具检索：把工具描述 embedding 入库，
      运行时按当前 query 召回 top-k（如 5-10 个）相关工具注入——本质是拿 RAG 的思路管理工具库。
      分层路由：先用轻量分类器判断域（数据查询类还是通知类），再在域内给全量工具。常驻 + 按需
      两档：高频核心工具（搜索、计算）常驻 prompt，长尾工具检索注入。兜底设计：检索没召回到正确
      工具时，模型应能调"请求更多工具"的元工具显式求助，而不是硬选一个错的。【实际案例】我在内部
      办公 Agent 项目工具从 8 个长到 60+ 时撞上这面墙：全量注入光声明就 4000+ token/次，调用准确率
      从 94% 滑到 81%。改成语义检索注入 top-6 + 4 个常驻核心工具后，prompt 降到 800 token，准确率
      回到 92%。剩下的 bad case 主要是跨域组合任务（"查完数据发邮件"需要两个域的工具同时在场），
      解法是多轮会话做工具记忆：已调用成功的工具在后续轮次保持注入，不重新检索。【举一反三】这就是
      前端的按需加载 + 路由分包：首屏只加载当前路由的 chunk（检索注入），公共组件打进 vendor
      （常驻工具），prefetch 已访问过的路由（工具记忆）。【扣分点对照】答"把工具全塞给模型让它
      自己选"的是没算过 token 账和准确率账；能讲出工具检索/分层路由/常驻+按需分档、以及多轮会话
      工具记忆这种细节的，才是运营过大型工具库的人。
    followups:
      - 工具检索召回漏了正确工具，这个用户请求就必死吗？有什么兜底设计？
      - 新增一个工具后，多久能对线上生效？检索索引和缓存怎么更新？
