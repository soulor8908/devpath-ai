id: project.rag-pipeline
title: 里程碑项目 · 生产级 RAG 问答系统
summary: Phase 2 出口项目：对一个真实文档集（如公司 wiki / 开源项目文档）构建端到端 RAG 问答系统，含增量索引、混合检索、重排、评测、可观测。这是求职的硬通货。
tracks: [frontend-to-ai-engineer]
phase: 2
prerequisites: [rag.production-pipeline]
estimatedMinutes: 480
difficulty: 4
frontendBridge: >-
  这是 Phase 0-1 技能的集成 + RAG 全链路落地。你做过的前端工程化（模块化、缓存、错误边界、
  监控）全部适用，只是数据流从"UI 状态"换成"文档→embedding→检索→生成"。重点不是炫技，
  是把每个环节做扎实，附评测报告证明它真的好用。
concepts:
  - 端到端管线：文档摄入 → 切分 → embedding → 入库 → 查询改写 → 混合检索 → 重排 → 上下文组装 → LLM 生成
  - 增量索引：文档 hash 变更队列，只更新变化的 chunk
  - 评测闭环：50+ 条人工标注评测集，RAGAS 三维度评分，输出 baseline 报告
  - 可观测：每步 trace 延迟，查询日志落盘供离线分析，召回率漂移监控
  - 部署：API 服务（FastAPI）+ 向量库（Qdrant/PGVector）+ 前端问答 UI（可选）
sourceIds: [langchain-rag, jerry-liu-rag-eval, eugene-yan-rag]
lab: content/labs/rag-pipeline
gotchas:
  - 不要用 demo 数据集（如 LangChain 自带的 state_of_union）——用真实文档才能暴露切分/召回的真实问题
  - 评测报告比功能演示更重要——面试官看的是"你能否用数据证明它好用"，不是"它能跑"
  - 增量索引是加分项但别过度设计——文档规模小（<1000）时全量重建更简单可靠
interview:
  - q: 用两分钟介绍一下你的 RAG 项目——架构怎么搭的，效果如何量化？
    answerSkeleton: >-
      【分层原理】一句话定调：这是对一个真实文档集（约 4000 篇技术 Wiki）构建的端到端
      RAG 问答系统，重点不是"能问答"，而是每个环节都有评测数据支撑、可观测、可持续
      调优。按数据流向五层讲：数据层负责文档解析与切分——按标题层级递归切分、表格
      整块保留、15% overlap；索引层做 embedding 与向量入库，文档 hash 驱动增量更新，
      只重建变化的 chunk；检索层是 BM25 + 向量混合检索，RRF 融合后过 rerank；生成层
      组装上下文、强制引用、temperature=0；监控层全链路 trace + 每天线上抽样跑
      faithfulness。【实际案例】用数据收尾：评测集 56 条人工标注 query，端到端召回
      命中率从初版 61% 迭代到 87%，faithfulness 从 0.78 到 0.93，答案引用准确率 96%；
      检索 P95 延迟 480ms，端到端 P95 3.8 秒；增量更新让单次文档改版的索引重建时间
      从 40 分钟降到 90 秒。这组数字链是我在面试里最有说服力的部分——每个数字背后
      都有一次具体的迭代，追问任何一个都能往下讲三层。【举一反三】这套架构对贵司的
      知识库场景直接可搬：文档源换成你们的 Confluence 或飞书文档、向量库换成你们基建
      里已有的（PGVector/ES 都行）、评测与监控的打法原样复用。更重要的是方法论可搬：
      先建评测集再动手调优，任何改动用数据说话。【扣分点对照】Demo 级回答："LangChain
      加载文档，存 Chroma，RetrievalQA 一把梭"。生产级回答：讲架构按数据流向分层、
      每层有选型理由、收尾有一组自洽的量化指标（召回率/faithfulness/延迟/成本）——
      只罗列组件、讲不出任何数字的，面试官默认你只跑通过 demo。
    followups:
      - 为什么选混合检索而不是纯向量检索？BM25 补上了什么？
      - 增量更新的触发机制是什么？文档 hash 怎么设计？
      - 检索 P95 480ms 里各环节耗时分布是什么？瓶颈在哪？
  - q: 你的 RAG 系统在生产中召回率突然下降，怎么排查？
    answerSkeleton: >-
      【分层原理】按"数据→索引→查询→模型"四层排查，每层有可执行的检查项。数据层：
      新入库文档的质量与分布是否变了——对比降前降后的查询日志与文档统计；索引层：
      embedding 模型是否升级过（升级必须全量重建，否则新旧向量不在同一空间）、向量
      索引是否退化（高频增删让 HNSW 图质量下降）；查询层：查询改写、HyDE、RRF 权重
      这些检索侧组件是否被改坏；模型层：LLM 生成质量下降经常被误判为召回问题——看
      faithfulness 与召回命中率是否同步下降来区分。【实际案例】我真遇到过一次：周一
      早上召回命中率从 87% 掉到 71%。按层排查，数据层发现上周五运营批量导入了 800
      篇会议记录——大量一两百字的短文档把索引稀释了，很多查询的 top-k 被短文档占位。
      验证方式是把新文档暂时从索引剔除，召回率立刻回到 85%，假设确认。修复分两步：
      短期给短文档设入库下限与质量分过滤，低于 300 字且无信息量的不进主索引；长期加
      "入库分布监控"，每日文档量、字数分布异常即告警。因为有每步 trace 和每日召回率
      趋势监控，从发现到定位只用了两小时。【举一反三】这和前端线上 bug 排查完全同构：
      分层定位缩小范围、监控趋势发现拐点、可回放数据快速验证假设。贵司任何数据驱动
      的系统（搜索、推荐、Feeds）都是这套打法。【扣分点对照】Demo 级回答："重新
      embed 一遍试试"。生产级回答：能给出分层排查顺序、每层具体检查项、以及"先验证
      假设再动手"的纪律——能讲出"短文档稀释索引"这种非直觉故障形态的，是真维护过
      线上 RAG 的人。
    followups:
      - 怎么区分是检索召回问题还是生成质量问题？
      - embedding 模型升级怎么做无损切换？
  - q: 讲讲你通过评测驱动调优的一次完整迭代——从发现 bad case 到指标提升的全过程。
    answerSkeleton: >-
      【分层原理】评测驱动调优的标准动作是五步循环：收集 bad case → 按失败模式分类
      → 定位到具体环节 → 针对性修复 → 评测集回归验证。最关键的是"分类"这一步——
      bad case 不能混在一起看，必须按失败形态归因，不同形态指向不同环节的修复，乱改
      一通只会把指标改来改去不知道哪刀起效。【实际案例】印象最深的一次迭代：召回率
      61% 的 baseline 出来后，我把 21 个 bad case 逐条分类，分出三类形态——9 条是
      "答案句被从中间切断，前后两半各自召不回"，指向切分策略；7 条是"产品参数表被
      切散，检到的块没有表头、模型读不懂"，指向表格特殊处理；5 条是"用户问法和文档
      措辞差异大"，指向检索方式。针对修复：切分从固定窗口改成按标题层级递归切分 +
      15% overlap，召回率 +14 个点；表格整块保留并带上表头上下文，+8 个点；检索从
      纯向量改成 BM25 + 向量混合，+4 个点。三轮迭代后到 87%，每轮都跑评测集回归，
      确认提升不是过拟合调参。【举一反三】这套循环在贵司场景同样成立：客服问答的
      bad case 分类、搜索的零结果率治理、推荐的 bad case review——都是"先分类归因、
      再针对性修、用数据闭环"。面试官想听的不是"我用了混合检索"，而是"我为什么用、
      解决了哪类 bad case、提升几个点"。【扣分点对照】Demo 级回答："我试了换
      embedding 模型，好了一点"——没有分类归因，纯瞎试。生产级回答：能讲出 bad case
      的具体分类与占比、每类指向的修复、每轮迭代的量化提升，数字链自洽——能把
      "9 条切断、7 条表格、5 条措辞"这种颗粒度讲出来的，bad case 列表是真一页页
      翻过的。
    followups:
      - 评测集怎么建？56 条够吗，怎么防过拟合？
      - 三轮迭代有没有引入回归？怎么发现的？
