id: eng.production-deployment
title: 生产部署与运维
summary: 从 demo 到生产——环境隔离、密钥管理、灰度发布、故障演练、SLO。LLM 应用的运维纪律，与传统 Web 服务同构但有新挑战。
tracks: [frontend-to-ai-engineer]
phase: 4
prerequisites: [eng.observability, eng.cost-latency-optimization]
estimatedMinutes: 90
difficulty: 3
frontendBridge: >-
  这是你的前端运维直觉全面迁移：环境隔离 ≈ dev/staging/prod，密钥管理 ≈ 不把 key 写进代码，
  灰度 ≈ feature flag，SLO ≈ 性能预算。新增的是"模型版本管理"——LLM 是概率性的，换模型版本
  等于换了个"新员工"，必须灰度 + eval 验证。
concepts:
  - 环境隔离：dev/staging/prod 三环境，密钥用环境变量/Secrets Store，绝不进代码
  - 模型版本管理：锁定模型版本（如 gpt-4o-2024-08-06），升级要灰度 + eval 验证（模型是概率性的，换版本=换行为）
  - 灰度发布：feature flag 控制新 prompt/新模型/新功能的流量比例，5%→20%→100%
  - 故障演练：上游 AI 服务挂了的降级链（备模型/缓存/兜底文案），定期演练非"纸上谈兵"
  - SLO：p99 延迟 / 可用性 / 成本预算 / 质量评分的错误预算（error budget）
sourceIds: [langchain-deploy, langfuse-docs]
gotchas:
  - 模型版本不锁会被"静默升级"——OpenAI/Anthropic 会更新默认版本，行为变了你却不知道
  - 灰度只看技术指标不看 eval——prompt/模型改动必须同时跑 eval，否则质量回归发现不了
  - 降级链不演练等于没有——上游真挂时才发现降级路径有 bug 是常见事故
interview:
  - q: LLM 应用上生产，运维上和传统 Web 服务有什么不同？
    answerSkeleton: >-
      【分层原理】同构部分占八成——环境隔离、密钥管理、监控告警、灰度发布，纪律照搬。新的两成
      来自"概率性组件"。第一，模型版本管理：传统服务升级依赖库行为是确定的，LLM 换版本行为是
      概率性变化——同一 prompt 输出分布变了。所以模型版本必须锁定（用带日期的具体版本号而非
      latest 别名），升级走灰度+eval 门禁，否则供应商一次静默更新就能改变你的产品行为。第二，
      配额与成本运维：LLM 按用量计费，要有租户级配额、速率限制、预算告警，防滥用防失控——传统
      服务没有"用户多聊两句账单爆炸"的问题。第三，降级链更复杂：上游失败模式分限流/超时/内容
      过滤/全区故障，对应不同降级策略（换备模型/读缓存/兜底文案），且降级本身要演练。第四，数据
      合规：prompt 和检索内容可能含用户敏感信息，出域（跨境/第三方 API）要评估合规，必要时脱敏
      后调用或本地化部署。【实际案例】我在知识库产品被"静默升级"咬过：供应商把默认别名指向新
      版本后，一批答案风格突变、faithfulness 一周滑了 3 个点，排查两天才发现是模型变了——从此
      锁死版本号，升级必走"5% 流量+eval 门禁→20%→全量"流程。配额侧也救过场：某租户脚本 bug
      导致同请求每分钟重放，租户级速率限制+预算告警在 2 小时内拦截，没让它烧穿当月预算。降级链
      我们每季度演练一次拔网线：主模型不可用→自动切备模型→核心 FAQ 走语义缓存兜底，演练真抓到过
      备模型鉴权配置过期的 bug。【举一反三】前端直觉直接迁移：锁模型版本≈锁依赖版本
      （package-lock），灰度≈feature flag，降级链≈CDN 故障切备用源——唯一的新心智是"这个依赖
      的每次输出都是概率性的"。【扣分点对照】只讲环境隔离和密钥的是通用运维答案；能讲出静默
      升级真实事故、按失败模式设计降级链、配额防滥用、数据出域合规的，才是对 LLM 生产特性有体感。
    followups:
      - 模型版本升级怎么做灰度 + eval 验证？
      - 上游 AI 服务挂了，降级链怎么设计？
  - q: 模型版本升级（或换供应商）的完整发布流程怎么设计？出问题时回滚怎么保证时效？
    answerSkeleton: >-
      【分层原理】完整流程五段。一是基线冻结：升级前在当前版本跑全量 eval，保存基线分与代表性
      输出样本，作为对比锚点。二是离线门禁：新版本在评测集+黄金集上跑分，关键指标（faithfulness/
      完成率）不掉点、非关键指标掉幅小于 1 个点，才允许进线上流程。三是灰度放量：feature flag
      按用户哈希分流 5%→20%→50%→100%，每档观察 24-48 小时，盯在线指标（差评率、转人工率、
      延迟、成本）+抽样评委分。四是回滚预案：模型路由配置化（版本号是运行时配置不是代码），
      回滚=改配置秒级生效；预案里还要写明"配置中心本身挂了"的兜底（本地缓存最后可用配置）。
      五是复盘归档：每次升级记录指标变化与 bad case 进版本档案，下次升级有据可查。换供应商比
      换版本多两步：prompt 适配验证（不同模型对同一 prompt 响应差异大）与数据合规重估（新供应商
      的数据驻留与 retention 政策）。【实际案例】我们一次大版本升级在 20% 灰度档被拦下：离线
      eval 全绿，但在线抽样发现"多轮追问场景"差评率翻倍——新版模型更"健忘"，多轮上下文里丢
      约束。因为版本号是路由配置，回滚 5 分钟内完成、只影响灰度用户，之后把多轮 case 补进评测集，
      该版本最终被跳过。反例是另一次没走流程的热修：直接全量切版本修一个格式 bug，结果引入新的
      引用格式错误，回滚还碰上配置中心缓存未刷新拖了 40 分钟——那次之后"回滚路径也进演练"写进
      了制度。【举一反三】这和前端发版同理：CI 门禁（离线 eval）+灰度（分流）+秒级回滚（配置化）
      ——区别在于前端回滚回的是确定性代码，LLM 回滚回的是概率行为，所以基线输出样本的留存更重要。
      【扣分点对照】说"先小流量试试不行就换回来"的是没有把回滚当工程对象；能讲出基线冻结、
      离线+在线双指标门禁、配置化秒级回滚、回滚路径演练的，才是真发过多版模型。
    followups:
      - 灰度期间怎么保证同一用户会话内模型版本一致？
      - 换供应商时 prompt 适配验证具体怎么做？
  - q: 上游 AI 服务的降级链怎么设计？限流、超时、内容过滤、全区故障分别对应什么策略？故障演练怎么做？
    answerSkeleton: >-
      【分层原理】降级链的前提是承认"上游失败不是二元的"——四种失败模式各有对应
      策略。限流 429：短时现象，指数退避重试+非实时请求转异步排队+切备用密钥池或
      备用区域配额。超时与 5xx：可能是过载，快速失败（超时阈值设短，别让连接池被
      拖死）→重试一次→切备模型。内容过滤拦截：不是故障是判定，重试无意义，降级到
      更保守的 prompt 或明确的拒答话术。全区故障：主备模型切换（跨供应商备份，如
      主 OpenAI 备 Anthropic 或自托管开源模型），极端情况核心 FAQ 走语义缓存兜底
      +人工话术。两个设计要点：切换决策必须自动化（人工介入的降级在凌晨三点等于
      没有）；备模型的 prompt 要提前适配过——不同模型对同一 prompt 行为差异大，
      临时切的备模型可能答得更糟。故障演练要真做：每季度真拔网线（阻断主模型出口
      流量），验证切换时延、备模型质量分、缓存兜底命中率。【实际案例】我们的降级链
      在真实故障里跑通过：主模型区域故障 47 分钟，健康检查 90 秒内自动切换，备模型
      承接期间 faithfulness 从 0.91 降到 0.84（可接受区间），核心 FAQ 因语义缓存
      命中率 34% 体验几乎无损。但第一次季度演练翻得很惨：备模型鉴权密钥过期半年
      没人发现、切换脚本的分级路由规则没同步（简单问题也被打到大模型，成本翻倍）、
      缓存兜底 TTL 过期已清空——三个坑全中。此后"降级链每季度真演练+备模型每周
      跑 10 条金丝雀"进了制度。【举一反三】这就是前端 CDN 主备切换与静态资源
      兜底：灾备不演练等于没有，演练的价值恰恰是暴露"你以为能用其实不能"的路径。
      【扣分点对照】只说"配个备模型就行"的是没切过流量；能按四种失败模式讲差异
      化策略、讲出备模型 prompt 预适配、演练真实翻车清单的，才是真运维过降级链。
    followups:
      - 主备模型输出风格差异大，用户感知到"忽聪明忽笨"怎么处理？
      - 切换备模型的触发阈值怎么定？误切换的代价是什么？
  - q: LLM 应用的 SLO 怎么定？错误预算（error budget）怎么指导发布决策？
    answerSkeleton: >-
      【分层原理】LLM 应用的 SLO 比传统服务多两个维度：技术指标（可用性、p99 延迟）
      之外还有质量指标（faithfulness 不低于基线、差评率）与成本指标（单位请求成本
      不超预算）。定义方法从用户旅程反推：问答场景 TTFT p99 两秒内、月可用性 99.9%、
      faithfulness 周均不低于 0.88、单次成功问答成本不超预算线——每条都要有对应
      测量手段，测不了的指标写进 SLO 是自欺。错误预算的用法是"把可靠性换成迭代
      速度"：预算充足时允许激进的模型升级与实验；预算烧到八成就冻结非必要变更、
      转入稳定性加固——把"要不要收敛"的争论变成查表。LLM 特有的坑：质量 SLO 的
      预算消耗是慢性的——一次供应商静默更新可能每天烧掉一点预算而不触发任何告警，
      质量趋势必须纳入预算消耗计算。SLO 还要分层：面向付费租户的核心功能用严格
      SLO，内部工具与实验功能放宽，资源向高承诺场景倾斜。【实际案例】我给知识库
      产品定过首版 SLO：TTFT p99 2s、可用性 99.9%、faithfulness 0.88、单次问答
      成本 $0.008。最有用的是错误预算机制——模型升级季连升三个版本，预算健康
      全速推进；随后供应商一次故障烧掉 60% 预算，当月下旬新 prompt 实验全部叫停，
      先补降级链演练。教训来自质量维度：初版 SLO 只有技术指标，某月 faithfulness
      滑到 0.84 但"技术指标全绿、预算充足"，团队还按节奏推新功能——质量 SLO 入
      预算后才堵住这个洞。【举一反三】这和前端性能预算（bundle 不超 200KB、LCP
      不超 2.5s）完全同构：预算的意义不是数字本身，是给"要不要收敛"提供决策依据。
      【扣分点对照】背"99.9% 可用性"却说不出质量与成本维度的，是把 SLO 当传统
      运维概念；能讲出四维度定义、错误预算驱动变更冻结、质量慢性消耗入预算的，
      才是真用 SLO 做过决策。
    followups:
      - 质量指标测量有滞后（抽样评分 T+1），SLO 违规怎么及时发现？
      - 多租户场景 SLO 要按租户分别承诺吗？成本与体验怎么取舍？
