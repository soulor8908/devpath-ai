id: eng.cost-latency-optimization
title: 成本与延迟工程化优化
summary: 从"能跑"到"扛得住"——批量、缓存、并发、分级、流式、模型蒸馏的系统化降本提速。LLM 应用的工程内功。
tracks: [frontend-to-ai-engineer]
phase: 4
prerequisites: [llm.cost-and-latency, eng.observability]
estimatedMinutes: 120
difficulty: 3
frontendBridge: >-
  这是你前端性能优化直觉的全面迁移：缓存 ≈ HTTP 缓存/Service Worker，批量 ≈ 批量请求合并，
  分级 ≈ 代码分割按需加载，流式 ≈ 流式渲染。区别是资源单位从 MB/次变成 token，且 LLM 调用慢
  且贵，优化杠杆更大。
concepts:
  - 批量（batch）：多请求合并成一次 API 调用（OpenAI Batch API 半价但延迟高），或并发池限速
  - 缓存分层：embedding 缓存 / 语义缓存（相似查询复用答案）/ 响应缓存（精确匹配）
  - 分级路由：简单任务小模型，复杂任务大模型，按任务复杂度动态路由
  - 流式 + 预计算：流式降感知延迟；预计算常见查询结果（如离线生成 + 缓存）
  - 模型蒸馏/微调：用大模型标注数据微调小模型，长期降本（但前期投入大）
sourceIds: [eugene-yan-llm-patterns, openai-cookbook]
gotchas:
  - 语义缓存是双刃剑——相似查询复用答案会放大错误，必须配质量监控
  - 批 API 半价但要等批满（延迟数小时）——只适合离线任务，实时场景不能用
  - 微调小模型前期成本高（数据标注 + 训练）——量不够大时不如直接用托管小模型
interview:
  - q: 一个 LLM 应用月账单 10 万、p99 延迟 8 秒，怎么系统化优化？
    answerSkeleton: >-
      【分层原理】先审计后优化，盲优是浪费。延迟侧先做拆解：一次 RAG 请求的典型构成是 embedding
      约 20ms+向量检索约 5ms+LLM 生成 1-3s（生成里 TTFT 占几百 ms，其余是逐 token 输出）——一看
      就知道大头在生成，优化检索那 25ms 没意义。Agent 场景则是"单次生成×步数"，步数本身常是
      最大杠杆。成本侧拆账单：按功能、模型、输入/输出 token 分解，找 80/20 大头（输出 token 单价
      通常是输入的 3-5 倍，输出侧杠杆更大）。然后按投入递增打组合拳。延迟：流式输出把感知延迟从
      总时长降到 TTFT，体感收益最大成本最低；语义缓存（相似问题直接复用答案）命中率到两三成就能
      显著削峰；prompt/KV cache 让重复的长系统提示不再每轮全价；投机采样（小模型起草大模型校验）
      不换模型提速生成；模型分级让简单问题路由到小模型，延迟成本双降。成本：上述缓存与分级全部
      生效，再加输出侧限 max_tokens 与结构化输出（少废话）、离线任务走批量 API（半价但延迟数
      小时）。【实际案例】我接手过一个客服 RAG：p99 延迟 7.8s、月账单 4.2 万。拆解发现生成占
      6.9s，其中 1.2s 是每轮重复处理 2000 token 的系统提示。动作按周上线：流式输出（感知延迟
      降到 1.1s）；prompt 缓存（重复前缀成本降约一半）；意图分类器把 65% 的简单 FAQ 路由到小
      模型（这部分延迟从 5s 降到 1.8s、单次成本降 80%）；语义缓存命中 24%。六周后 p99 降到
      2.3s、月账单 1.4 万，faithfulness 监控无显著变化。【举一反三】这就是前端性能优化方法论
      平移：先火焰图定位瓶颈段，再用缓存/按需加载/流式渲染分段击破——"先测量、再优化、每步
      验证不损质量"的纪律一模一样。【扣分点对照】上来就喊"换小模型""上缓存"的是背方案清单；
      能先做延迟拆解证明大头在生成、给出组合拳上线顺序与验证指标的，才是真优化过账单。
    followups:
      - 语义缓存怎么判断"相似到可以复用答案"？
      - 什么时候该微调小模型，什么时候直接用托管模型？
  - q: 把流量从大模型降级到小模型（模型分级路由），怎么保证质量不塌？
    answerSkeleton: >-
      【分层原理】模型分级不是"换便宜模型"一个动作，是一套带护栏的路由系统，四个组件缺一不可。
      一是路由分类器：判断请求复杂度——可以用小模型分类、规则（FAQ 库精确命中）或特征（是否需要
      工具、历史轮次），目标是把简单流量识别出来，识别准确率决定整套方案的上限。二是双跑验证：
      上线初期分流但不真切换，小模型的答案和大模型离线比对一致率，达到门槛（我们定的 95%）才真
      切流量。三是灰度+eval 门禁：按 5%→20%→50% 梯度放量，每档跑离线 eval，faithfulness/完成率
      掉点即回滚。四是升级兜底：小模型输出低置信（或自检发现不确定）时自动升级到大模型重答——
      保证下限体验，成本仍优于全量大模型。【实际案例】我在客服项目落地过分级：意图分类器把咨询
      分"FAQ 类/流程指引类/复杂排查类"，前两类占 63% 走小模型。双跑阶段发现"流程指引类"一致率
      只有 89%——小模型在多步骤条件分支的指引上漏步骤，于是把这类留在大模型，只切 FAQ 类
      （一致率 97%）。切流后加升级兜底：小模型回答里检测到"建议您联系人工核实"等不确定话术时
      自动用大模型重答。最终 41% 流量走小模型、其中 6% 触发升级重答，整体成本降 52%，差评率反而
      微降——因为小模型延迟低，FAQ 场景体验更好。【举一反三】这就是前端渐进增强反过来用：默认
      给"够用"的能力，检测到不够再升级——和"弱网先给骨架屏再补完整渲染"是一个思想。
      【扣分点对照】说"简单问题切小模型就行"的是没算过误路由代价；能讲出双跑一致率门槛、按类别
      差异化切换、升级兜底机制的，才是真切过流量。
    followups:
      - 路由分类器本身也是模型，它的成本和延迟怎么算？
      - 升级兜底会不会被用户感知为"忽快忽慢"？怎么处理体验一致性？
