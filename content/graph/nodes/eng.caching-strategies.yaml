id: eng.caching-strategies
title: LLM 缓存体系（语义缓存 / Prompt 缓存 / 响应缓存）
summary: LLM 应用最大的成本杠杆往往不是换模型而是缓存：字面缓存精确命中、语义缓存模糊命中、prompt 缓存复用前缀。命中一次，成本与延迟同时归零。
tracks: [frontend-to-ai-engineer]
phase: 4
prerequisites: [llm.cost-and-latency]
estimatedMinutes: 90
difficulty: 3
frontendBridge: >-
  LLM 缓存 ≈ 前端缓存三层的完全同构：响应缓存 ≈ HTTP 强缓存（key 完全一致才命中）、
  语义缓存 ≈ CDN 智能回源（近似请求复用结果）、prompt 缓存 ≈ 构建产物增量编译
  （前缀不变的部分不重算）。缓存失效策略的难题也一模一样。
concepts:
  - 响应缓存（精确缓存）：key = 完整 prompt 哈希，字面一致才命中——实现最简单，命中率看场景
  - 语义缓存：key = 查询 embedding 近邻，"意思一样"就命中（如"北京今天几度"≈"今天北京天气"）——命中率高一个量级但有错配风险
  - Prompt 缓存：提供商侧复用长前缀（system prompt/长文档）的 KV，命中部分输入费用大幅下降—— Anthropic/OpenAI 均支持
  - 失效策略：答案依赖的知识更新后缓存必须失效——按 doc_version 或时间窗 TTL
  - 三道防线：相似度阈值（错配拦截）+ 版本戳（知识更新失效）+ 抽样回源校验（缓存质量监控）
sourceIds: [openai-docs, gptcache-repo]
gotchas:
  - 语义缓存的错配是静默的："苹果手机多少钱"命中"苹果多少钱一斤"的缓存——阈值定不好就是线上事故
  - 个性化答案不能缓存：含用户名的回答被另一个用户命中，轻则尴尬重则泄露——缓存 key 要含用户维度或干脆跳过
  - prompt 缓存要求前缀稳定：把变化的内容（如当前时间）放前缀开头会击穿整个缓存
interview:
  - q: LLM 应用的缓存体系怎么设计？语义缓存和普通缓存有什么区别、风险在哪？
    answerSkeleton: >-
      【分层原理】三层缓存各管一段。响应缓存：key 是完整 prompt 哈希，字面一致
      才命中——实现一晚搞定，但用户问法千变万化，客服场景命中率通常不到 10%。
      语义缓存：把查询 embedding 后近邻查找，相似度超阈值就返回历史答案——
      "北京今天几度"和"今天北京天气如何"都能命中同一缓存，命中率可做到 30-40%，
      成本延迟同步归零；核心风险是错配，必须有相似度阈值 + 领域过滤。Prompt
      缓存：提供商侧机制，长前缀（system prompt、产品文档）KV 复用，命中部分
      输入价大幅下降——它不管"答案复用"，管的是"每次调用内部少重算"。生产
      系统是三层叠加：响应缓存挡字面重复、语义缓存挡同义重复、prompt 缓存
      压低每次调用的前缀成本。【实际案例】我在企业知识库上过语义缓存：首日
      上线阈值设 0.95，命中率高但出了两起错配事故（"退款政策"命中了"会员
      政策"的答案）；调到 0.985 + 缓存 key 加产品线维度后，稳定在 34% 命中率、
      零错配投诉，月度 API 成本降 28%。配套做了失效机制：文档更新时按
      doc_version 戳批量失效相关缓存，否则知识更新了答案还是旧的。
      【举一反三】和前端缓存完全同构的权衡：命中率 vs 新鲜度 vs 正确性——
      你处理过 CDN 缓存击穿和 stale-while-revalidate，语义缓存的阈值与失效
      就是同一个问题。【扣分点对照】只说"加个 Redis 缓存"的是没想清楚
      key 是什么；能讲出三层分工、错配事故、版本失效机制的，才是上过
      生产缓存的人。
    followups:
      - 语义缓存的相似度阈值怎么定？定高了定低了各牺牲什么？
      - 个性化答案（含用户信息）的查询怎么缓存？
  - q: Prompt 缓存（prompt caching）的原理是什么？怎么用满它？什么写法会击穿缓存？
    answerSkeleton: >-
      【分层原理】Prompt 缓存是提供商侧的 KV 复用：一次调用处理过的前缀
      （从第一个 token 到某个断点）会被保留，下次调用前缀一致的部分直接
      复用、不重算注意力——命中部分的输入费用大幅下降（Anthropic 缓存读
      约为原价的 10%），TTFT 也同步改善。用满它的核心纪律是"前缀稳定"：
      把不变的长内容（system prompt、工具定义、长文档）放最前面，变化的
      内容（用户问题、当前时间、会话状态）放最后；断点设在稳定内容末尾。
      击穿缓存的典型写法：前缀开头塞当前时间戳（每次调用前缀都变）、
      system prompt 里拼接用户画像（每用户不同）、工具定义顺序不稳定
      （序列化顺序漂移）。【实际案例】我在文档问答功能里实测：产品手册
      12k token 放前缀，未用缓存时每次调用输入 12.5k token；开缓存后
      命中调用输入只按 0.5k 计费 + 缓存读折扣，单轮成本降 71%，TTFT
      从 1.8s 降到 0.6s。第一次翻车是因为我在 system prompt 开头拼了
      "当前时间：{now}"——命中率 0%，移到末尾后命中率 92%。【举一反三】
      这和前端的"保持组件 props 引用稳定以命中 memo"是同一个心智：
      缓存命中的前提是输入逐字节一致，任何抖动都会击穿。【扣分点对照】
      只知道"开缓存省钱"但把动态内容放前缀的，等于没开；能讲出 KV
      复用原理、断点位置、三个击穿写法的，才是真调优过。
    followups:
      - 多轮对话每轮前缀都在变长，prompt 缓存还有效吗？（提示：增量前缀仍命中）
      - 缓存断点（breakpoint）应该设在什么位置？
  - q: 语义缓存上线后怎么发现错配和陈旧答案？缓存失效与质量监控体系怎么设计？
    answerSkeleton: >-
      【分层原理】缓存质量的两个敌人是错配（命中了不该命中的）和陈旧（知识更新后还返回
      旧答案），监控体系要对症下药。错配监控靠抽样回源：按 1-5% 比例把命中缓存的请求
      同时发给 LLM 实算，比对缓存答案与实算答案的一致性，一致率跌破阈值就告警回调
      阈值；再叠加用户侧信号——命中缓存的请求若差评率显著高于未命中的，说明缓存在
      放大错误。陈旧防控靠失效策略两条腿：被动 TTL 按知识更新频率定档（政策类小时级、
      稳定文档天级），主动失效靠文档更新事件驱动——每条缓存记录来源文档 id，文档
      更新时按反向索引精准失效相关条目，而不是全库清空。【实际案例】我在企业知识库
      遇过真实事故：产品更新退款政策后，缓存里的旧政策答案又活了 9 天，直到客服投诉
      才发现——TTL 定了一周，赌输了。那次之后做了反向索引，文档更新走消息队列广播
      失效，从"靠 TTL 碰运气"变成"秒级精准失效"。抽样回源也抓过一次阈值漂移：
      embedding 模型升级后向量分布变了，旧阈值 0.985 的错配率从 0.3% 涨到 2.1%，
      重新校准到 0.99 才恢复——embedding 升级必须重校阈值这条从此进了 checklist。
      【举一反三】这就是前端 CDN 的 purge 机制加 stale-while-revalidate 的监控版：
      失效要事件驱动不能靠 TTL 赌运气，抽样回源就是缓存界的金丝雀发布。
      【扣分点对照】只会说"设个 TTL"的是把缓存当无状态组件；能讲出反向索引精准
      失效、抽样回源校验、embedding 升级要重校阈值的，才是真运维过语义缓存的人。
    followups:
      - 一篇文档被大量缓存条目引用时，失效风暴怎么防？（提示：批量异步失效+降级）
      - 抽样回源本身要花 LLM 成本，抽样率与成本怎么平衡？
  - q: 多租户、个性化场景下缓存 key 怎么设计才不会串答案？什么场景应该主动放弃缓存？
    answerSkeleton: >-
      【分层原理】缓存 key 设计的本质是"答案的合法性边界在哪"：key 缺了哪个维度，
      该维度不同的用户就会串答案。维度清单五条：查询语义（embedding 或哈希）、
      用户/租户 id（个性化答案必加）、知识版本（doc_version，文档更新后旧答案作废）、
      模型与 prompt 版本（换模型后旧缓存是另一个"人"答的）、locale 与权限档位
      （免费与付费用户答案详略不同就不该共享）。个性化内容两条处理路线：能拆的拆——
      答案骨架走缓存、个性化片段（用户名、账户数据）运行时拼接，命中率保住大半；
      不能拆的（整段答案围绕用户数据生成）直接跳过缓存——这类查询强行缓存命中率
      也极低。隐私红线：跨用户共享的缓存层绝不存含 PII 的答案，一次泄露事故比省下
      的 token 费贵几个量级。【实际案例】我在 SaaS 知识库定过缓存矩阵：产品文档
      问答（无个性化）走语义缓存，命中率 34%；"我的工单进度"拆成"状态查询工具
      调用+模板化回答"，模板可缓存、状态数据不缓存；"基于我的使用数据给建议"直接
      标记不缓存。早期没拆时后两类把整体命中率拖到 4%，还出过一次 A 租户命中 B 租户
      答案的近事故——加租户维度后命中率回升、串答案归零。【举一反三】和前端缓存
      key 完全同构：HTTP 缓存的 Vary header 就是维度声明，GraphQL 持久化查询缓存
      也要带变量签名——key 少一个维度就是一个潜伏 bug。【扣分点对照】只说"key 用
      query 哈希"的是没遇过串答案事故；能列出五维度清单、讲出"拆分个性化片段"
      路线和放弃缓存判据的，才是真设计过缓存边界。
    followups:
      - 换模型或改 prompt 后旧缓存要全清吗？能不能灰度切换缓存？
      - 命中率低于多少说明这个场景不值得缓存？判断依据是什么？
