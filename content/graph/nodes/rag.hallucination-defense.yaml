id: rag.hallucination-defense
title: 幻觉的全链路治理
summary: 幻觉不是"模型爱编"一句话能概括的——检索不到、检索错了、模型不听话都会表现为幻觉。生产系统要按"源头-生成-兜底"全链路治理，金融政务场景这是红线。
tracks: [frontend-to-ai-engineer]
phase: 2
prerequisites: [rag.evaluation]
estimatedMinutes: 90
difficulty: 4
frontendBridge: >-
  幻觉治理 ≈ 前端表单的全链路校验：前端校验（生成侧约束）、后端校验（检索侧保证输入对）、
  兜底错误页（拒答与降级）。只在一层做校验的系统，和只在 prompt 里写"不要编"的系统一样脆弱。
concepts:
  - 幻觉的三类来源：检索缺失（库里没有硬答）/ 检索错误（召错块）/ 生成漂移（块里有但模型自由发挥）
  - 检索侧治理：混合检索 + rerank + 相似度阈值——先保证给模型的上下文是对的
  - 生成侧治理：system prompt 硬约束（只基于上下文）+ temperature=0 + 强制引用
  - 兜底治理：faithfulness 校验（逐 claim 核对上下文）+ 拒答机制（低于阈值明确说不知道）
  - 引用是信任接口：每条答案挂来源块，让幻觉"可被发现"而不是悄悄发生
sourceIds: [openai-docs, eugene-yan-llm-patterns]
gotchas:
  - '"在 prompt 里写不要编"是最弱的一层——模型在上下文缺失时照样编，必须有检索阈值和拒答兜底'
  - 拒答率与幻觉率是跷跷板：阈值卡太严会把能答的也拒掉，要用评测集调到业务可接受的平衡点
  - faithfulness 校验本身也是 LLM 调用，会判错——高 stakes 场景要抽样人工复核校验器本身
interview:
  - q: 你的 RAG 系统怎么治理幻觉？用户反馈答案编信息，你的排查与治理链路是什么？
    answerSkeleton: >-
      【分层原理】先把"幻觉"拆成三类来源对症治理，而不是一句"模型爱编"。检索侧：库里
      没有答案时模型硬答（检索缺失）、召回了错误块（检索错误）——用混合检索 + rerank
      提高上下文质量，加相似度阈值拦截无知识查询。生成侧：上下文里有答案但模型自由
      发挥（生成漂移）——system prompt 硬约束"只基于提供的上下文、逐条引用来源"，
      temperature 调 0，输出格式要求每个论点挂引用块编号。兜底侧：上线后仍会有漏网
      ——用 faithfulness 校验器逐 claim 核对上下文，不通过的答案拦截重生成或拒答；
      相似度低于阈值的查询直接拒答转人工。【实际案例】我在企业政策问答场景按这条链
      治理：上线前 faithfulness 只有 0.81，用户投诉集中在"政策数字被改"。第一步查
      bad case 发现 60% 是检索缺失（新政策还没入库），先补了入库 SLA；第二步加引用
      强制与 temperature=0，faithfulness 到 0.91；第三步上 faithfulness 校验器拦截
      剩余漏网，到 0.97，拒答率控制在 8% 以内业务可接受。【举一反三】同一框架迁移到
      Agent 场景：工具返回错数据 = 检索错误，模型无视工具结果 = 生成漂移，解法同样是
      输入校验 + 输出校验 + 降级链。【扣分点对照】只答"调低 temperature + prompt 里
      写不要编"的是单层思维；能按"检索缺失/检索错误/生成漂移"分类、说出每层的具体
      手段和量化效果的，才是治理过线上幻觉的人。
    followups:
      - 拒答率和幻觉率怎么平衡？阈值怎么定？
      - faithfulness 校验器本身判错怎么办？
      - 为什么说"强制引用"既是约束也是检测手段？
  - q: 怎么量化一个 RAG 系统的幻觉率？线上怎么持续监控？
    answerSkeleton: >-
      【分层原理】幻觉率不是单一指标，分三层度量。检索层：召回命中率（评测集中答案块
      是否进 top-k）与相似度分布——监控"低分查询占比"能预警知识缺口。生成层：
      faithfulness（答案的每个 claim 能否被检索上下文支撑，用 LLM 评委逐条核）是核心
      指标，目标是 0.95 以上；辅以引用准确率（挂的引用块是否真的支持该论点）。业务层：
      用户侧信号——点踩率、"答非所问"投诉率、拒答率，这些才是最终裁判。落地方式是
      三层各建监控：离线用评测集每次发版回归 faithfulness（掉了就 block 上线）；线上
      抽样（如每天 1% 的问答对）过 faithfulness 校验器做趋势监控；业务指标接告警。
      【实际案例】我搭过这套监控：一次 embedding 模型升级后离线回归通过，但线上抽样
      的 faithfulness 三天内从 0.94 缓跌到 0.89——排查发现新模型对历史文档的编码分布
      变了，旧向量没重嵌入导致检索质量慢性退化。没有线上抽样监控，这类慢退化要等到
      投诉爆发才被发现。【举一反三】这就是前端性能监控的思路：离线 Lighthouse 回归
      （发版门禁）+ 线上 RUM 采样（慢退化检测）+ 业务转化（最终裁判），三层缺一不可。
      【扣分点对照】只说"用 RAGAS 跑一次评分"的是把评估当一次性动作；能区分离线回归/
      线上抽样/业务信号三层、并讲出慢退化案例的，才是把 eval 当体系做过。
    followups:
      - 线上抽样跑 faithfulness 的成本怎么控制？
      - 用户点踩率高但 faithfulness 正常，说明什么？往哪查？
