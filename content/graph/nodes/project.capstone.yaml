id: project.capstone
title: Capstone 项目 · 端到端 AI 工程化系统
summary: Phase 4 出口项目（也是整条轨道的毕业项目）：把 Phase 0-3 的全部技能集成进一个可上线的 AI 应用，含 RAG + Agent + Eval + 可观测 + 安全 + 成本优化 + 生产部署。这是能直接拿去面试的硬资产。
tracks: [frontend-to-ai-engineer]
phase: 4
prerequisites: [eng.llm-eval-system, eng.observability, eng.prompt-injection-defense, eng.cost-latency-optimization, eng.production-deployment]
estimatedMinutes: 960
difficulty: 5
frontendBridge: >-
  这是整条轨道的集大成。你做前端时经历过"从组件到页面到工程化到上线"的完整链路——这里是一样的，
  只是技术栈换成 AI 工程化。你的工程纪律（模块化、测试、监控、灰度、安全）是最大优势，AI 知识
  是新维度。重点不是堆功能，是每个环节都有数据支撑（eval 报告、trace 日志、成本对比）。
concepts:
  - 集成 RAG + Agent：Agent 调用 RAG 工具检索知识，多步推理解决复杂查询
  - 完整 Eval 体系：离线标注集 + LLM-as-judge + 黄金集，在线用户反馈 + 抽样评分
  - 全链路可观测：trace 串联检索/重排/生成/工具调用，成本与质量双监控
  - 安全纵深：prompt 注入防御 + HITL + 最小权限 + 审计日志
  - 生产就绪：模型版本锁定 + 灰度 + 降级链 + SLO + 成本配额
sourceIds: [langfuse-docs, hamel-husain-evals, owasp-llm-top10, langchain-deploy]
lab: content/labs/capstone
gotchas:
  - 不要做"大而全"——聚焦一个真实场景做深（如"AI 代码审查员""企业知识库问答 Agent"），比通用 demo 强
  - Capstone 的价值在"工程化深度"而非"功能数量"——一个有完整 eval + 监控 + 安全的小系统胜过功能多但没保障的大系统
  - 必须有可验证的"质量证据"——eval 报告、trace 日志、成本对比、安全测试，面试官看的是这些而非 demo
interview:
  - q: 完整介绍一下你的 Capstone 项目——从需求到上线的全过程。
    answerSkeleton: >-
      【分层原理】一句话定调：这是一个企业知识库问答 Agent——员工用自然语言提问，
      系统自主决定是检索知识库、查工单系统还是追问澄清，产出带引用的答案，全程
      可观测、有安全纵深、成本可控。叙事按时间线五段：需求阶段先定可验收指标——
      问答准确率 >90%、单答案成本 <0.05 美元；设计阶段定架构——LangGraph 编排的
      Agent 把 RAG 检索作为工具调用，而非两条独立链路；实现阶段按"先 RAG 基线、
      再 Agent 编排、后工程化"的顺序推进；验证阶段 60 条评测集 + LLM-as-judge +
      3 周真实用户灰度；上线阶段灰度发布、SLO 监控、降级链兜底。【实际案例】用
      数据收尾：评测集答案准确率 91%、faithfulness 0.94；线上 3 周灰度接了 2000+
      真实提问，用户点赞率 82%，平均单答案成本 0.031 美元，端到端 P95 延迟 5.2
      秒；一次 embedding 模型升级通过双写切换零事故完成；prompt 注入红队测试 40
      个攻击样本全部拦截。每个数字都有 eval 报告或 trace 日志可查——这是 Capstone
      与 demo 的本质区别。【举一反三】这套"从可验收指标出发、按数据流分层设计、
      灰度上线"的交付方法论，和前端大型项目交付完全同构——只是质量维度从"性能/
      兼容"换成"准确率/成本/安全"。贵司任何 AI 项目我都能按这个模板走一遍。
      【扣分点对照】Demo 级回答按功能罗列："有 RAG、有 Agent、有监控"——堆名词。
      生产级回答按交付叙事讲：需求有可验收指标、架构有选型理由、验证有评测数据、
      上线有灰度纪律——讲得出"先基线后编排"的推进顺序和每个阶段退出标准的，才是
      真交付过系统的人。
    followups:
      - 需求阶段的两个指标（90% 准确率、0.05 美元成本）是怎么定出来的？
      - 灰度阶段发现过什么预发布没暴露的问题？
  - q: 你的系统里既有 RAG 又有 Agent——什么场景用哪个？技术选型的权衡是什么？
    answerSkeleton: >-
      【分层原理】RAG 与 Agent 不是替代关系，是"确定性链路"与"自主性链路"的分工。
      判断标准三条：任务步骤数——单步"查一下答一下"用 RAG，多步"查 A、再查 B、
      交叉比对"用 Agent；路径确定性——路径固定的走硬编码管线（便宜、快、可预测），
      路径依赖中间结果的才给模型自主权；错误代价——高风险操作的链路越短越可控越好。
      落地到我的系统：简单事实问答走纯 RAG 管线（约占流量 70%）；多源比对、需要查
      工单的走 Agent（25%）；涉及写操作的一律 Agent + HITL 人工闸（5%）。【实际
      案例】这个分流是数据驱动的结果，不是一开始的设计。最初我把所有查询都走 Agent，
      让模型自主决定调不调检索工具——评测发现简单问答的准确率与纯 RAG 持平，但平均
      成本高 4 倍、延迟高 3 倍，还引入 3% 的"模型误判不需要检索、直接编答案"的幻觉。
      于是加了前置路由：轻量分类器（规则 + 小模型）判断查询复杂度，简单查询直接进
      RAG 管线。分流后整体平均成本从 0.09 美元降到 0.031 美元，准确率反而升了 2 个
      点——因为简单查询不再暴露在 Agent 的决策噪音下。【举一反三】"能用确定性链路
      就不用自主性链路"的原则在贵司同样成立：客服系统里 FAQ 走检索、多轮排障走
      Agent；代码审查里风格检查走 linter、架构问题才上 LLM。面试官问"为什么这里用
      Agent"时，最差的答案是"因为 Agent 火"，最好的答案是"因为这条链路的路径依赖
      中间结果，且我用数据证明过它比 RAG 好"。【扣分点对照】Demo 级回答："都用
      Agent，Agent 更智能"。生产级回答：能讲出三条判断标准（步骤数/路径确定性/错误
      代价）、有分流前后的量化对比（成本降多少、准确率升降）、知道 Agent 引入的决策
      噪音本身就是幻觉来源。
    followups:
      - 前置路由的分类器误判了怎么办？简单查询被送进 Agent 的代价是什么？
      - 如果重做，路由会放在更前还是更后？为什么？
  - q: 你的 Capstone 项目从 demo 到生产，最大的工程挑战是什么？怎么解决的？
    answerSkeleton: >-
      【分层原理】最大挑战是"概率性组件的工程化保障"——传统服务行为确定可预测，
      LLM 不确定，所以质量、成本、安全三条线都要重建保障体系。质量线：召回率会随
      数据分布漂移，需要离线评测集防回归 + 线上抽样监控漂移 + 黄金集每次发版必跑。
      成本线：Agent 多步循环 × RAG 多次检索很容易烧爆预算，需要分层缓存 + 分级路由
      + 成本配额与告警。安全线：Agent 自主调工具 + prompt 注入可能让模型执行危险
      操作，需要深度防御——工具分级、HITL、输入输出护栏、最小权限、审计日志。贯穿
      三者的是全链路 trace：没有可观测，事故后只能盲猜。【实际案例】三条线我都被
      线上教育过。质量线：一次 embedding 模型小版本升级后离线回归通过，但线上抽样
      faithfulness 三天从 0.94 缓跌到 0.89——新模型编码分布变了、旧向量没重嵌入，
      这种慢性退化没有线上监控根本发现不了。成本线：灰度第二周单日成本突增 3 倍，
      告警逮住后发现是某类复杂查询触发 Agent 反复重规划，加单任务成本上限与重规划
      次数限制后回落。安全线：红队测试时一个"文档里埋指令"的间接注入差点让 Agent
      把内部文档摘要发到外部 webhook——输出护栏拦下了，从此工具调用一律过出站内容
      检查。【举一反三】这套"概率性组件工程化"框架对贵司任何 LLM 系统通用：先承认
      它不可预测，再用评测管质量、配额管成本、护栏管安全、trace 管一切——和前端
      生产化的监控/灰度/性能预算完全同构，只是对象从确定性代码换成了概率性模型。
      【扣分点对照】Demo 级回答："最大的挑战是把各个模块调通"——这是开发期问题不是
      生产问题。生产级回答：能讲出质量/成本/安全三条线的具体事故与量化细节（缓跌
      0.94→0.89、成本突增 3 倍、间接注入案例），且每条线的防御都有"事后建的什么
      机制"——面试官要听的是真实问题与数据驱动的决策，不是概念罗列。
    followups:
      - 你的 eval 体系怎么发现过一次真实的质量回归？
      - 成本告警的阈值怎么定？误报怎么处理？
      - 如果重做这个项目，你会改哪三个地方？为什么？
  - q: 如果你的 Capstone 系统明天流量涨 10 倍、知识库涨 10 倍，哪里先撑不住？怎么演进？
    answerSkeleton: >-
      【分层原理】容量演进要先定位瓶颈层级，LLM 系统的瓶颈排序和传统服务不同。
      10 倍流量下最先倒的是三处：一是 LLM API 的速率与成本——QPS 涨上去后对端
      RPM 配额先打满，线性成本也变成预算问题；二是检索延迟——向量库从 40 万
      chunk 涨到 400 万，HNSW 召回延迟和内存都上一个台阶，rerank 候选数要重新
      权衡；三是质量监控的抽样带宽——流量大了每天该抽审的量跟着涨，否则质量
      盲区变大。数据涨 10 倍另有坑：增量索引的变更队列会堵，召回被海量相似
      chunk 稀释。【实际案例】我用压测真推过这个演算：把灰度期 2000 条提问的
      分布回放放大 10 倍打向系统，第一个爆的是速率限制——账户 RPM 300，峰值
      加 Agent 多步放大直接超限，失败率冲到 18%。应对分三层：入口加队列削峰、
      检索结果与常见答案两级缓存（命中率预估 35%，LLM 调用直接砍三分之一）、
      按查询复杂度路由大小模型。向量库侧 400 万 chunk 时 P95 从 480ms 劣化到
      1.4 秒，解法是按空间分区索引加时间衰减过滤，回到 700ms 内。【举一反三】
      这套"压测回放、定位第一块骨牌、分层扩容"的方法论和前端大促保障完全
      同构：先找最先倒的组件，再决定加缓存、加队列还是加机器。【扣分点对照】
      Demo 级回答："加机器、换更强的模型"——LLM 系统的瓶颈根本不在你的机器。
      生产级回答：能按速率、检索、质量三条线排瓶颈顺序、给每层具体手段和量化
      预期——知道水平扩容解决不了 API 限流的，才是真想过规模的人。
    followups:
      - 两级缓存的 key 怎么设计？知识库更新后缓存怎么失效？
      - 为什么水平扩容解决不了 LLM API 限流？多账户轮询是不是好主意？
      - 向量库分区按什么维度切？分区后跨分区查询怎么办？
