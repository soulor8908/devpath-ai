id: eng.local-deployment
title: 本地/私有化部署（Ollama / vLLM / 量化与显存估算）
summary: 数据不出内网、成本结构重写、离线可用——私有化部署是很多 B 端项目的硬门槛。面试核心考点是三个：Ollama/vLLM/llama.cpp 的定位差异、显存估算与量化位宽的算术、以及"自建 vs 调 API"的决策框架。
tracks: [frontend-to-ai-engineer]
phase: 4
prerequisites: [llm.cost-and-latency]
estimatedMinutes: 100
difficulty: 4
frontendBridge: >-
  自建模型服务 ≈ 自建 CDN vs 用云服务的经典权衡：调 API 是按需付费的 SaaS，
  零运维但成本随用量线性涨、数据要出门；自建是一次性买显卡的重资产投入，
  边际成本近零但要自己扛运维与扩容。量化 ≈ 静态资源压缩（FP16 是原图、
  Q4 是有损压缩的 WebP），显存估算 ≈ 你给页面算内存预算的同款算术。
concepts:
  - Ollama：本地开发与小团队自用的事实标准，一行命令起模型，基于 llama.cpp——胜在体验，输在并发吞吐
  - vLLM：生产级推理引擎，PagedAttention 把 KV cache 当虚拟内存分页管理 + 连续批处理——吞吐比朴素方案高一个量级
  - llama.cpp：GGUF 格式的 CPU/消费级 GPU 推理引擎，是 Ollama 的底层——极致可移植，单文件模型即拷即跑
  - 显存估算：权重 ≈ 参数量 × 字节/参数（FP16 为 2，Q4 约 0.5-0.6），7B FP16 ≈ 14GB，Q4 ≈ 4GB；再加 KV cache 与激活开销 20-40%
  - KV cache：长上下文 × 高并发是显存第二吞金兽——32k 上下文下单请求 KV 可到 GB 级，是 vLLM 分页管理的对象
  - 量化位宽：FP16 → Q8 → Q4 体积近似等比缩（16GB → 8GB → 4GB），Q4 质量损失通常 1-3 个百分点，Q2 以下慎用于生产
  - 消费级显卡边界：24GB（4090）≈ 7B-8B FP16 富余 / 13B-14B Q4 刚好 / 70B 必须多卡或极低量化——选型先算显存再谈效果
sourceIds: [ollama-docs, llama-cpp-repo]
gotchas:
  - 只算权重不算 KV cache：7B FP16 权重 14GB 看着能塞进 16GB 卡，一上 8k 上下文加并发直接 OOM——预算要加 30% 余量
  - Ollama 直接上生产：默认并发与批处理配置保守，几十并发就排队——生产吞吐场景换 vLLM 或调 Ollama 的 num_parallel
  - 量化掉点是任务相关的：闲聊场景 Q4 无感，结构化输出/工具调用场景 Q4 的 JSON 格式错误率可能翻倍——上线前必须按任务指标回归
  - 私有化项目的隐藏成本：显卡采购只是首付，推理优化、模型升级、故障值守的人力成本常被低估——决策时要算 TCO 不是算 GPU 价
interview:
  - q: Ollama、vLLM、llama.cpp 三者的定位和适用场景有什么区别？
    answerSkeleton: >-
      【分层原理】三者是栈的不同层。llama.cpp 是底层引擎：C++ 写的 CPU/消费级
      GPU 推理实现，定义了 GGUF 单文件模型格式（权重+元数据+分词器打包），
      极致可移植，MacBook 上也能跑 7B——但它是"引擎"不是"服务"，并发调度
      能力有限。Ollama 是 llama.cpp 的产品化封装：一行 ollama run 拉模型起
      OpenAI 兼容 API，模型管理、热加载、多模型共存全包——开发联调和小团队
      内部工具的事实标准，但默认配置偏保守，高并发下吞吐不是它的设计目标。
      vLLM 是生产级推理服务：核心技术 PagedAttention 把 KV cache 像操作
      系统虚拟内存一样分页管理，消除显存碎片，加连续批处理（新请求不等旧
      批次结束随时插入），吞吐比朴素实现高 5-10 倍——给真实用户扛并发的
      场景就该用它。【实际案例】我们内网客服助手的演进就是这条路径：原型
      期 Ollama + 8B Q4 跑在我的开发机，5 个客服试用良好；试点扩到 40 人
      并发后排队明显，高峰期 P95 首 token 到 12 秒；切到 vLLM + 单张 A10
      跑 FP16，连续批处理生效后同样 40 并发 P95 降到 1.9 秒，吞吐翻了 6
      倍，模型质量还因 FP16 略有提升。Ollama 没有退场——它留在每个开发
      者本地做联调。【举一反三】这就是前端依赖链的同构：llama.cpp 是
      esbuild 这种底层编译器，Ollama 是 Vite 这种开发体验封装，vLLM 是
      生产 CDN 加边缘缓存——同一份资产，开发态与生产态用不同工具服务。
      【扣分点对照】说"都是跑模型的差不多"的是只玩过 demo；能讲出
      PagedAttention 解决什么问题、Ollama 的并发短板、按开发/生产分态
      选型的，才是真部署过的人。
    followups:
      - vLLM 的连续批处理为什么能提吞吐？牺牲了什么？（提示：单请求延迟略增）
      - 除了这三个还知道哪些推理引擎？（提示：TGI、SGLang、TensorRT-LLM）
      - Mac 本地开发选型有什么特殊性？（提示：统一内存、MLX）
  - q: 怎么估算一个模型要多少显存？7B 模型在不同量化下分别是多少？KV cache 占多少？
    answerSkeleton: >-
      【分层原理】显存分三块：权重、KV cache、激活与框架开销。权重 = 参数量
      × 每参数字节数：FP16/BF16 每参数 2 字节，7B ≈ 14GB；Q8 约 1 字节，
      ≈ 7GB；Q4 约 0.5 字节加少量缩放系数，≈ 4-4.5GB。心算口诀：十亿参数
      FP16 约 2GB，量化到 Q4 打二五折。KV cache 是第二吞金兽：每个 token
      每层存 K 和 V 两份向量，粗算 7B 模型 8k 上下文单请求约 1-2GB，且随
      上下文长度与并发数线性涨——这就是为什么 24GB 卡跑 7B FP16 权重富余，
      但 32k 长文档加 8 并发照样 OOM。激活与框架开销再留 10-20%。实用预算
      公式：权重 × 1.2 + 预期最大上下文 × 并发 × 单 token KV 量，再乘 1.1
      安全余量。【实际案例】我给客户私有化方案算过这笔账：需求是 14B 模型、
      16k 上下文、20 并发。粗算 Q4 权重约 8.5GB 看着能进 24GB 的 4090，
      但 KV cache 实测 16k × 20 并发吃掉 9GB，加激活开销直接顶到 23GB
      边缘，跑两周后出现碎片化 OOM。最终方案换 Q8 权重上 48GB 的 A6000，
      或降上下文到 8k 加滑动窗口——客户选了后者，预算省一半。教训是显存
      估算必须按"峰值并发 × 峰值上下文"算，按平均值算就是给线上埋雷。
      【举一反三】和前端算内存预算一模一样：静态资源体积（权重）只是起点，
      运行时堆（KV cache）随用户操作涨，OOM 都发生在峰值路径不是平均路径。
      【扣分点对照】只背"7B FP16 是 14GB"的是参数党；能把 KV cache 随
      上下文和并发的线性关系算进去、讲出按峰值预算原则的，才是真的
      OOM 过的人。
    followups:
      - Q4 和 Q8 的质量差距在什么任务上最明显？怎么验证？
      - 70B 模型想在私有化环境跑起来，硬件方案有哪些？
      - vLLM 的 PagedAttention 怎么缓解 KV cache 的碎片问题？
  - q: 什么情况下该自建模型服务、什么情况下该调 API？你的决策框架是什么？
    answerSkeleton: >-
      【分层原理】四维决策框架，按一票否决优先级排。数据合规：金融、医疗、
      政企的内网数据不能出门是一票否决项——合规要求私有化就不用谈成本。
      成本结构：调 API 是变动成本随量线性涨，自建是固定成本加近零边际——
      分界点粗算：月 API 账单持续超过自建月摊销（显卡 2-3 年折旧加电费加
      运维人力）1.5 倍以上，自建开始划算；通常日调用千万 token 级进入
      可讨论区。质量要求：头部闭源模型的能力上限仍高于可自部署的开源
      模型——任务需要顶级推理能力时，API 是唯一选项；任务垂直固定
      （分类、抽取、格式化），开源 7B-14B 微调后常够用。工程能力：自建
      意味着自己扛推理优化、扩缩容、模型升级、故障值守——团队没有
      1-2 个能扛 GPU 运维的人，自建的隐性成本会吃掉账面节省。
      【实际案例】我经手过两个方向相反的决策。电商客服项目：日 3000 万
      token，API 月账单 1.8 万美元，自建 2 张 A10 加运维摊销约 6000
      美元/月，14B 微调后质量达标——切自建，八个月回本。另一个是初创
      内容工具：CEO 想"省钱自建"，但日调用才 20 万 token，月 API 费
      不到 200 美元，自首付首付都不够——否掉，把预算投在 prompt 优化
      上。两个决策用的是同一个框架，结论相反。【举一反三】这就是"自建
      CDN vs 云服务"的经典权衡复刻：流量大到拐点自建才划算，且自建买的
      不只是硬件而是一整套运维责任——你算过 CDN 流量账，就懂 GPU 账。
      【扣分点对照】张口"自建省钱"或"API 永远划算"的都是单极思维；能
      按合规、成本拐点、质量差距、运维能力四维讲，并给出具体拐点数字的，
      才是做过真实选型的人。
    followups:
      - 混合架构怎么设计？（提示：简单任务本地小模型 + 难任务路由 API）
      - 自建后模型版本升级怎么管？和 API 侧的模型弃用有什么对称问题？
      - 私有化部署的客户说"就要 70B 的效果"，但预算只够 14B，你怎么谈？
  - q: 私有化部署上线后你踩过哪些坑？和调 API 的坑有什么本质不同？
    answerSkeleton: >-
      【分层原理】调 API 的坑是"别人的系统给你意外"：限流、涨价、模型偷偷
      更新导致行为漂移。自建的坑全是"自己的系统自己扛"：显存 OOM 出现在
      峰值并发加最长上下文的叠加时刻，平均负载监控完全看不到；量化模型
      的质量退化是任务特异的——闲聊评测没问题，JSON 结构化输出错误率
      悄悄翻倍；驱动、CUDA、推理框架的版本依赖是脆弱链条，升级一个
      组件全链路要回归；还有容量规划陷阱：自建不能弹性扩容，业务增长
      50% 意味着买卡而不是加配额，交付周期以月计。最根本的差异是故障
      边界：API 挂了是供应商的 SLA，自建挂了是你的电话在凌晨响。
      【实际案例】我们私有化客服系统上线后翻过三车。一是峰值 OOM：
      月底批量对账场景上下文冲到 24k，并发翻倍，连续两晚 OOM 重启——
      修复是加请求级上下文预算闸门加排队降级，超载请求转人工队列。
      二是量化翻车：为省显存从 Q8 换 Q4，闲聊评测指标没变，但工具
      调用的参数格式错误率从 2% 涨到 9%，回滚 Q8 才恢复——此后量化
      变更必须过任务级回归集。三是 CUDA 驱动升级后 vLLM 版本不匹配
      起不来，凌晨救火——此后驱动与框架版本锁进同一个镜像，升级
      走预发环境全量回归。【举一反三】这和前端"自研组件库 vs 用
      AntD"的权衡同构：用别人的，坑在升级 breaking change；自己
      的，坑在每个 edge case 都得自己修——自由度和责任永远一起卖。
      【扣分点对照】只说"自建要考虑运维"的是纸上谈兵；能报出峰值
      叠加 OOM、量化任务特异退化、驱动版本锁定这三类具体事故与
      修复的，才是真扛过自建生产的人。
    followups:
      - 自建集群怎么做容量规划？业务说"下季度量翻倍"你该问什么？
      - 量化回归集怎么建？为什么闲聊指标测不出结构化输出的退化？
      - API 模型的静默更新和自建模型的手动升级，哪个更难管？
