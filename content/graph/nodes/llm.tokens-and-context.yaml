id: llm.tokens-and-context
title: Token、上下文窗口与模型参数
summary: LLM 的计量单位（token）、工作记忆边界（context window）、核心采样参数（temperature/top_p）。一切成本、延迟、能力讨论的原子概念。
tracks: [frontend-to-ai-engineer]
phase: 0
prerequisites: []
estimatedMinutes: 90
difficulty: 2
frontendBridge: >-
  token ≈ 计费与限流的"流量包"：像运营商按 MB 计费一样按 token 计费。
  context window ≈ 一块固定大小的内存条：所有对话历史、系统提示、
  检索内容都挤在里面，超了就得截断或压缩——和你做虚拟列表
  的窗口化思维完全同构，只是窗口外的东西模型真的"看不见"。
concepts:
  - token：模型读写的基本单位，消耗取决于分词器——英文约 0.75 词/token；中文在旧分词器（cl100k_base）约 1-2 token/字，GPT-4o 起的 o200k_base 已优化到约 1 token/字量级
  - 上下文窗口：单次请求可处理的最大 token 数（输入+输出共享）
  - temperature：采样随机性，0 更确定、1+ 更发散；工程默认值随任务定
  - top_p：核采样，只从累积概率前 p 的候选中选
  - 计费模型：输入 token 与输出 token 单价不同，输出通常贵 3-5 倍
sourceIds: [openai-tokenizer, openai-docs, karpathy-lets-build-gpt]
gotchas:
  - 中文 token 消耗不能套英文经验：旧分词器（cl100k_base）一个中文字约 1-2 token、整句成本普遍高于英文，GPT-4o 起的 o200k_base 已大幅收窄——成本估算必须用目标模型的 tokenizer 实测真实语料
  - 上下文窗口是输入输出共享的：128k 窗口不代表能输入 128k 再输出 128k
  - temperature=0 不保证严格确定性（浮点与批处理非确定性），关键逻辑要加校验而非赌概率
interview:
  - q: 为什么 LLM 应用要做 token 预算？怎么做？
    answerSkeleton: >-
      【分层原理】token 预算的必要性来自三条硬约束。成本：token 是计费原子，输入输出分开计价、
      输出通常贵 3-5 倍，成本随用量线性增长，没有预算就是裸奔。延迟：首 token 延迟随输入长度
      增长（Attention 还有 O(n²) 打底），塞得越多越慢。窗口：上下文窗口是输入输出共享的硬
      上限，128k 不意味着能输入 128k 再输出 128k。预算公式：单次请求 = system prompt + 历史
      消息 + 检索内容 + 工具定义 + 预留输出额度，每一项都要记账。超限策略按代价递增排列：
      截断最早消息（最简单、丢上下文）、滑动窗口（保最近 N 轮）、摘要压缩（用小模型提炼历史，
      花 token 省 token）、RAG 外置记忆（按需检索而非全量携带）。【实际案例】我在客服机器人
      项目上线前做成本模型：最初按英文经验值"字符数除 4"估算，用 tiktoken 跑真实语料（中文
      工单）后发现成本被低估近一倍——旧分词器 cl100k_base 下中文一字约 1-2 token，整句成本
      普遍高于英文。换目标模型的 encoding 重测后重做预算：system prompt 从 800 token 砍到
      350、历史从全量改成最近 6 轮加摘要，单会话平均成本从 0.042 美元降到 0.019 美元，p95 首
      token 延迟降了约三成，上线三个月账单与预算偏差控制在 8% 以内。【举一反三】这就是前端
      的性能预算：bundle size 限额 ≈ token 预算，虚拟列表窗口化 ≈ 滑动窗口，懒加载 ≈ RAG
      按需取。"预算-实测-超限策略"的闭环肌肉记忆直接平移，只是测量工具从 Lighthouse 换成
      tiktoken。【扣分点对照】背八股的会说"控制历史长度"；真做过的能讲出用目标模型分词器
      实测真实语料的校准动作、预算公式的逐项构成，以及优化前后成本与延迟的量化对比。
    followups:
      - 多轮历史无限增长，压缩策略怎么选？（提示：截断/摘要/滑窗/RAG 的代价对比）
      - 输出 token 比输入贵 3-5 倍，优化方向因此是什么？（提示：限 max_tokens、让模型少啰嗦）
      - temperature=0 为什么还不保证严格确定性？（提示：浮点与批处理非确定性，关键逻辑要加校验）
  - q: 上下文窗口越来越大（100k+），还需要 RAG 吗？超长上下文有什么坑？
    answerSkeleton: >-
      【分层原理】窗口大不等于用得好，四个原因。成本与延迟：每次请求都背 100k 历史，账单和
      TTFT 随输入线性上涨——RAG 是"按需取"，长上下文是"全量背"，业务量上来算不过账。
      lost-in-the-middle：模型对长上下文中间部分的利用率显著低于头尾，塞进去了不等于看到了，
      关键事实埋在中段照样漏。信噪比：无关内容灌得越多，关键指令被稀释、幻觉率上升。静默
      截断：客户端不管理历史，超上限后服务端截断或报错，模型"失忆"是悄悄发生的，没有异常
      可抓。正确关系是分层：热上下文（最近对话）放窗口里，冷知识（文档库）走检索。
      【实际案例】我们的 Agent 产品曾收到"聊着聊着就失忆"的投诉：用户第 3 轮说的偏好，第
      20 轮模型完全不认。排查发现 messages 数组无限增长，超窗口后网关做了简单的头部截断——
      system prompt 和早期偏好一起被丢了。修复分两步：先把 system prompt 固定保护、历史改为
      最近 8 轮加更早轮次摘要，失忆投诉消失；再把用户显式陈述的偏好抽成结构化档案存库、每轮
      作为独立字段注入，而不是赌它还在窗口里。此后 30 轮以上长会话的任务完成率从 64% 升到
      89%。【举一反三】这和前端列表渲染完全同构：窗口里只放视口内的（虚拟列表），视口外的
      按需取（分页/检索）；全量渲染十万行不是不行，是卡。lost-in-the-middle 则像"用户只看
      首屏和结尾"——重要信息放两头。【扣分点对照】背八股的会喊"长上下文杀死 RAG"；真做过
      的能讲出 lost-in-the-middle、成本随轮次滚雪球、静默截断导致失忆这三个真实痛点，以及
      热/冷分层的工程解法。
    followups:
      - lost-in-the-middle 对 prompt 组织有什么实操指导？（提示：关键指令与关键事实放头尾）
      - 历史摘要谁来生成？摘要丢了关键信息怎么办？（提示：小模型压缩、结构化档案兜底）
      - 什么场景反而适合全量长上下文？（提示：单文档精读、代码库一次性分析这类"用完即走"任务）
