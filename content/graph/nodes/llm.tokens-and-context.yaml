id: llm.tokens-and-context
title: Token、上下文窗口与模型参数
summary: LLM 的计量单位（token）、工作记忆边界（context window）、核心采样参数（temperature/top_p）。一切成本、延迟、能力讨论的原子概念。
tracks: [frontend-to-ai-engineer]
phase: 0
prerequisites: []
estimatedMinutes: 90
difficulty: 2
frontendBridge: >-
  token ≈ 计费与限流的"流量包"：像运营商按 MB 计费一样按 token 计费。
  context window ≈ 一块固定大小的内存条：所有对话历史、系统提示、
  检索内容都挤在里面，超了就得截断或压缩——和你做虚拟列表
  的窗口化思维完全同构，只是窗口外的东西模型真的"看不见"。
concepts:
  - token：模型读写的基本单位，消耗取决于分词器——英文约 0.75 词/token；中文在旧分词器（cl100k_base）约 1-2 token/字，GPT-4o 起的 o200k_base 已优化到约 1 token/字量级
  - 上下文窗口：单次请求可处理的最大 token 数（输入+输出共享）
  - temperature：采样随机性，0 更确定、1+ 更发散；工程默认值随任务定
  - top_p：核采样，只从累积概率前 p 的候选中选
  - 计费模型：输入 token 与输出 token 单价不同，输出通常贵 3-5 倍
sourceIds: [openai-tokenizer, openai-docs, karpathy-lets-build-gpt]
gotchas:
  - 中文 token 消耗不能套英文经验：旧分词器（cl100k_base）一个中文字约 1-2 token、整句成本普遍高于英文，GPT-4o 起的 o200k_base 已大幅收窄——成本估算必须用目标模型的 tokenizer 实测真实语料
  - 上下文窗口是输入输出共享的：128k 窗口不代表能输入 128k 再输出 128k
  - temperature=0 不保证严格确定性（浮点与批处理非确定性），关键逻辑要加校验而非赌概率
interview:
  - q: 什么是 token？上下文窗口为什么说输入输出共享？计费具体怎么算？
    answerSkeleton: >-
      【分层原理】token 是模型读写与计费的统一原子：分词器把文本切成子词单元，英文约 0.75 词一个
      token，中文取决于分词器代际——cl100k_base 下一个汉字常占 1-2 个 token，GPT-4o 起的
      o200k_base 词表扩到约 20 万、常用中文成词入表，压到 1 token/字量级，同一句话在两个分词器下
      成本能差近一倍。上下文窗口是单次请求能处理的最大 token 数，关键是输入输出共享：128k 窗口里
      system prompt、历史消息、检索内容、用户输入和模型即将生成的输出全挤在同一块空间——输入占了
      120k，输出就只剩 8k 可用，超了要么报错要么被截断。计费按输入 token 与输出 token 分开计价，
      输出通常贵 3-5 倍，单价按模型档位查官方价目表，缓存命中部分另有折价。【实际案例】我做成本
      模型时的实测方法：从线上捞 500 条真实用户语料，用 tiktoken 加载目标模型的 encoding 逐条
      encode 取均值——而不是拿文档示例估算。实测中文工单在旧模型 encoding 下平均 1.6 token/字，
      比按"一字一 token"拍脑袋的估算高出 60%，直接推翻原预算；换 o200k_base 口径重测后预算才落地，
      上线三个月账单偏差控制在 8% 以内。【举一反三】token ≈ 网络计费的 MB、窗口 ≈ 固定容量内存条，
      估成本前先用真实样本标定"字符-token 汇率"，和你用真实用户设备测 bundle 体积而不是猜是同一
      纪律。【扣分点对照】背题的会说"token 是模型最小单位、窗口越大越好"；真算过账的能报出
      cl100k_base 与 o200k_base 的中文差异量级、输入输出共享窗口的预算含义，以及"真实语料实测
      encoding"的校准动作。
    followups:
      - 为什么输出 token 比输入贵 3-5 倍？（提示：prefill 并行 vs decode 自回归逐 token）
      - 怎么验证 tiktoken 的 encoding 与目标模型真的匹配？
      - 窗口 128k、max_tokens 设多少合适？两者什么关系？
  - q: 为什么上下文塞得越长，模型回答质量反而下降？
    answerSkeleton: >-
      【分层原理】三个机制叠加。一是 lost in the middle：大量实证显示模型对长上下文头尾利用率高、
      中段显著塌陷，关键事实埋在中间区域时召回率可掉两三成——注意力权重经 softmax 归一后在长序列
      上被摊平，头尾还有位置先验加持。二是注意力稀释：每个位置的注意力是对全部上下文归一化后的
      分配，序列越长、无关内容越多，分给关键 token 的权重越薄，信噪比下降，指令遵循与事实召回
      同步劣化。三是位置编码外推：模型的位置表示在训练长度内是内插，超出后靠外推或插值拉伸，
      等效位置精度下降，长程依赖（"第三章的约束和第十章的例子矛盾吗"）先崩。所以"标称 128k"只
      代表塞得下，不代表用得好，有效上下文远小于标称值。还要注意：简单的"大海捞针"测试（找一句
      特定话）往往满分，真正的塌陷发生在多事实关联与推理任务上——厂商晒的针尖成绩不能当生产依据。
      【实际案例】我在合同审查功能踩过：把 80k
      token 整本合同直接塞窗，问"违约金条款和付款条款是否一致"，模型漏了埋在第 40 页前后的矛盾；
      改成检索出两个条款块（共 3k token）放 prompt 尾部再问，矛盾一次命中。产品形态就此定为
      "检索定位加局部精读"，长合同问答准确率从 71% 到 93%，单次成本还降了一个量级。
      【举一反三】这就是"用户只看首屏和结尾"的模型版——重要信息放头尾、中段靠检索导航，和你做
      长页面信息架构完全同构。【扣分点对照】背题的会喊"窗口够大直接塞"；真做过的能讲出中段塌陷、
      注意力稀释、外推精度三条机制，以及"塞得进不等于看得见"的对照实验。
    followups:
      - 既然中段塌陷，prompt 组织上怎么利用头尾效应？
      - 位置编码外推问题，工程上有哪些缓解手段？
      - 什么任务反而适合全量长上下文而不是 RAG？（提示：单文档精读、一次性代码库分析）
  - q: 多轮对话系统的 token 预算怎么设计？超限了你选什么策略？
    answerSkeleton: >-
      【分层原理】先拆账：每轮输入 = system prompt + 历史消息 + 检索内容 + 工具定义 + 预留输出额度，
      总和必须小于窗口，每一项都要有归属和上限。配比顺序是输出额度先锁定（如 800-2000），system
      prompt 压到 300-500，检索内容按 top-k 限额，剩下的才分给历史——历史是最先膨胀也最该被挤压
      的项。超限策略按信息损失从小到大排：滑动窗口（只带最近 N 轮，零实现成本，丢早期上下文）、
      滚动摘要（用小模型把旧历史压成几百 token，有损但留梗概，摘要本身花 token）、关键信息结构化
      （用户偏好、订单号抽成档案字段每轮注入，对可结构化信息无损）、RAG 外置（历史向量化按需召回，
      覆盖不可预期的回溯）。生产上通常组合：滑窗保底、结构化档案兜底、摘要做中层。【实际案例】
      我们的客服机器人按这套落地：锁定输出 800 token、system 380、检索 1.5k，历史预算 4k 放最近
      6 轮，更早的压成 300 token 滚动摘要，用户显式偏好抽成 JSON 档案独立注入。20 轮会话的输入
      峰值从 18k 压到 6.5k，单会话成本降 57%，30 轮以上长会话任务完成率反而从 64% 升到 89%——
      窗口清爽后指令遵循也变好了。【举一反三】就是前端性能预算：bundle 限额 ≈ 窗口预算，虚拟列表
      ≈ 滑窗，懒加载 ≈ RAG 按需取，"先锁关键路径预算再分剩余"的顺序也一样。【扣分点对照】只说
      "控制历史长度"的是没拆过账；能报出配比公式、四种策略的信息损失排序，以及组合方案量化收益的，
      才是做过预算设计的人。预算表还是活文档，流量结构变化后要按季度复盘重标。
    followups:
      - 滚动摘要丢了关键信息怎么办？（提示：结构化档案兜底）
      - 摘要由主模型还是小模型生成？成本怎么算？
      - 历史预算和检索内容冲突时，你的挤压顺序是什么？
  - q: 中文场景的成本估算你踩过什么坑？正确的估算姿势是什么？
    answerSkeleton: >-
      【分层原理】坑的根源是 token 与字符没有固定汇率，汇率由分词器词表决定。cl100k_base 的词表
      以英文为主，大量常用汉字不成词、被拆成字节级碎片，一个汉字常占 1-2 个 token，一句 20 字的
      中文可能吃掉 30 多个 token；o200k_base 词表扩到约 20 万、常用中文成词入表，同样一句话能省
      40-60%。于是按英文经验"字符数除以 4"或按"一字一 token"估中文，在旧模型上低估近一倍、在新
      模型上又可能高估——估算口径错了，后面整条成本模型全是错的。正确姿势只有一条：用目标模型的
      分词器实测真实语料——tiktoken 加载对应 encoding，捞线上真实样本（不是文档示例，示例偏短偏
      规整），逐条 encode 统计分布，取 p50 与 p95，输入输出分开测。【实际案例】我立项客服助手时
      按"约 1 token/字"估出月账单 6.5 万，用 cl100k_base 口径实测 500 条真实工单后均值 1.6
      token/字，输入侧重估到 1.6 倍，预算重做；后来模型换代到 o200k_base，重测同批语料降回 1.05
      token/字，我们把省出的预算换成了更长的回复额度。输出侧也要实测：模型回复比用户提问更书面，
      token/字 略低，两个方向用同一个汇率又是另一种失真。"换模型必重测 encoding"从此进了团队
      checklist。【举一反三】和你用真实用户设备加真实网络测性能、而不是用开发机拍脑袋是同一纪律：
      标定样本必须来自真实分布。【扣分点对照】背题的会说"中文 token 多一些"；真踩过坑的能报出两代
      分词器的具体差异量级、实测方法的四步动作，以及"换模型必重测"的纪律。
    followups:
      - 实测样本要多少条才够？分布上要注意什么？
      - 模型换代后单价降了但分词器也换了，总成本一定降吗？
      - 工具调用产生的中间轮次怎么计入成本估算？
