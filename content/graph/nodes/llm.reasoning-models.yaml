id: llm.reasoning-models
title: 推理模型与思维链（CoT / o1 / R1）
summary: 普通模型是"快思考"，推理模型用显式思维链换准确率——在数学、代码、多步规划上强一个量级，但贵 5-20 倍且慢。知道什么时候该切换是生产选型的基本功。
tracks: [frontend-to-ai-engineer]
phase: 1
prerequisites: [llm.api-first-call]
estimatedMinutes: 90
difficulty: 3
frontendBridge: >-
  推理模型 ≈ 把"脱口而出"改成"打草稿再答"。像 code review：快扫一遍给结论（普通模型）
  vs 逐行走查边界条件再下结论（推理模型）。后者慢且贵，但在"错一步全错"的场景值得。
concepts:
  - CoT（Chain-of-Thought）：让模型显式写出中间推理步骤，多步问题的准确率显著提升
  - 推理模型（o1 / DeepSeek-R1 类）：用 RL 训练模型自主生成长思维链，推理 token 计入输出成本
  - test-time compute：用更多推理时计算换准确率——与"更大模型"正交的另一条扩展轴
  - 适用边界：数学/代码/多步规划收益大；创意写作、简单问答上反而又慢又贵还可能想太多
  - 工程形态：推理过程通常单独字段返回（如 reasoning_content），前端可选择折叠展示
  - 思维链展示设计：默认折叠 + 摘要化状态条——用户要的是"知道它认真想过"，不是逐字阅读草稿
  - overthinking（过度思考）：简单任务上推理模型会想太久烧 token——用 max_tokens 上限 + 任务分流控制
sourceIds: [openai-docs, deepseek-api-docs]
gotchas:
  - 推理模型的思维链 token 也按输出计费——一次"深度思考"可能是普通回答 5-20 倍的成本
  - 不要把推理模型当默认模型：简单分类/提取任务上它是纯浪费，路由层要按任务复杂度分流
  - temperature 等采样参数对推理模型往往不生效或被忽略——照抄旧代码的参数可能静默失效
  - 升级推理模型前逐条核对参数支持矩阵：采样参数失效不报错、max_tokens 含推理 token——只能靠监控输出长度分布与截断率发现
interview:
  - q: 推理模型（o1/R1 类）和普通模型有什么区别？什么任务该用推理模型？
    answerSkeleton: >-
      【分层原理】普通模型是"快思考"：直接输出答案，中间过程隐式；推理模型用强化学习
      训练出显式长思维链——先自我提问、拆解、验证、纠错，再给最终答案，本质是
      test-time compute 扩展：用更多推理时 token 换准确率。差异体现在三点：能力上，
      数学/代码/多步规划类问题准确率强一个量级；成本上，思维链按输出计费，单次调用
      常是普通模型 5-20 倍；延迟上，思考数秒到数十秒，TTFT 显著变差。适用边界很清晰：
      答案"错一步全错"的可验证任务（数学、代码调试、复杂数据推理）值得用；创意写作、
      闲聊、简单提取任务用了反而又慢又贵，甚至过度思考把简单问题复杂化。【实际案例】
      我在一个财报分析功能里做过路由实验：直接把全部查询切到推理模型，整体成本涨了
      11 倍但准确率只升 4%；改成路由制——"涉及多步计算/同比环比推导"的查询（约 18%）
      走推理模型，其余走普通模型——总成本只涨 1.9 倍，而复杂题准确率从 71% 提到 93%。
      结论：推理模型是特种武器不是常规武器，路由层按任务复杂度分流才是正解。
      【举一反三】这个"按任务复杂度分配算力"的思路在前端就是按交互优先级分配主线程
      （关键路径同步、非关键 idle 回调），资源永远花在刀刃上。【扣分点对照】只说
      "推理模型会思考所以更准"的是名词党；能讲出 test-time compute、思维链计费、
      路由分流实验数据的，才是算过账的工程师。
    followups:
      - 推理模型的思维链要不要展示给终端用户？怎么展示？
      - 怎么在路由层判断一个查询"需要推理"？
  - q: 推理模型的思维链要不要展示给终端用户？如果要展示，产品形态应该怎么设计？
    answerSkeleton: >-
      【分层原理】先拆三件事：展示的价值、代价与边界。价值上，思维链是信任组件——
      用户看到模型一步步推导，对答案的接受度明显提升，DeepSeek R1 把思考过程做成
      可展开的流式输出后，"看它思考"本身成了产品的传播点；在教育、金融这类高
      stakes 场景，过程透明还是合规与问责的刚需。代价有三：一是思维链动辄上千
      token，全量展示会淹没最终答案，信息层级必须重新设计；二是思维链是草稿不是
      承诺——模型可能自我怀疑、中途改口，原样展示会削弱专业感；三是安全，思维链
      里可能出现被最终答案过滤掉的不当内容，不能当免检区。稳妥基线是：默认折叠、
      摘要化呈现状态、完整版按需展开并标注"草稿属性"。【实际案例】我在财报分析
      助手里做过两版对比：第一版把 reasoning_content 原样流式铺开，用户反馈
      "太吵，看完思考已经忘了问题"，还出过一次思维链引用内部调试标记的客诉；
      改成"思考状态条（滚动显示'正在核对同比数据'这类摘要短句）+ 最终答案 +
      可展开的完整思维链（默认折叠，标注'AI 草稿，可能与结论不一致'）"后，答案
      采纳率从 61% 升到 78%，而完整思维链展开率只有 12%——多数用户要的是
      "知道它认真想过"，不是逐字阅读。【举一反三】这和前端加载态设计同构：骨架屏
      告诉用户"在干活"但不暴露细节，详情面板默认折叠按需展开——思维链展示就是
      把 loading 态做成了有内容的信任组件。【扣分点对照】一刀切"全展示"或"全
      隐藏"的都是没权衡过；能讲出信任价值/噪音/安全三难、给出折叠 + 摘要 + 免责
      标注具体形态的，才是做过 AI 产品的人。
    followups:
      - 思维链里出现不当内容但最终答案合规，责任怎么算？上线前怎么防？
      - 思考过程长达几十秒时，流式体验怎么设计才不显得"卡死"？
      - 摘要化短句用什么生成？为展示层再调一次模型的成本值得吗？
  - q: 没有推理模型可用的老模型上，怎么获得类似效果？Prompt 里写"let's think step by step"就够了吗？
    answerSkeleton: >-
      【分层原理】零样本 CoT（加一句"让我们一步步思考"）确实是免费的性能杠杆，对
      多步问题有稳定提升，但它有三个明显局限：一是可靠性——模型可能"形式上分步、
      内容上跳步"，步骤写出来了但关键计算还是拍脑袋；二是无自我纠错——推理模型
      训练了"发现矛盾就回头改"的行为，prompt 诱导的 CoT 是一条道走到黑；三是
      无法验证中间步骤对不对。要更接近推理模型效果，工程上有三板斧：few-shot CoT
      （给 2-3 个带完整推理过程的示例，格式与质量都更稳）、self-consistency
      （同一问题采样多条推理链，多数投票取答案，用算力换可靠性）、把计算步骤
      外置给工具（让模型写表达式、代码执行算结果，绕开 LLM 不擅长算术的短板）。
      【实际案例】我在一个数据问答功能里对比过：裸模型多步计算准确率 54%，零样本
      CoT 到 68%，few-shot CoT + 计算步骤外置给代码执行后到 89%，逼近推理模型
      的 91%，而单次成本只有推理模型的三分之一。【举一反三】self-consistency
      的"多次采样取共识"和前端用多个数据源交叉验证是同一思想；计算外置则呼应
      Agent 的工具调用原则——LLM 负责理解与规划，确定性计算交给程序。
      【扣分点对照】只答"加 step by step"的是看过标题党文章；能讲清它的三个
      失效模式、给出 few-shot/self-consistency/工具外置的递进方案的，才是
      真正压榨过模型性能的人。
    followups:
      - self-consistency 采样多少条合适？成本与收益怎么平衡？
      - 为什么说"让模型写代码算数"比"让模型心算"可靠？
  - q: 老代码切到推理模型后有哪些"静默失效"的坑？推理模型"想太多"（overthinking）又该怎么控制？
    answerSkeleton: >-
      【分层原理】静默失效的根源是 API 兼容性幻觉：推理模型的参数契约和普通模型
      不同——temperature、top_p 等采样参数往往被忽略或干脆不支持；max_tokens 的
      语义也变了，推理 token 计入输出上限，老配置设小了会"想不完就没预算"，返回
      截断甚至空答案。这类失效最危险的地方在于不报错：请求 200、答案照返，只是
      行为悄悄变了。防御三板斧：参数兼容层（封装统一调用入口，按模型类型白名单
      过滤参数，传入不支持的参数直接告警而非静默丢弃）、升级前逐条核对官方文档
      的参数支持矩阵、灰度期对输出长度分布/空答案率/token 消耗分布做对比监控。
      overthinking 的控制对应三招：设 max_tokens 或推理强度档位上限、路由分流
      （简单题别进推理模型）、对"想太久"的请求设超时降级链。【实际案例】我们切
      模型时踩过两个真坑：老代码带 temperature=0.2，以为锁住了随机性，实际参数
      被忽略，线上答案风格漂移排查了半天；另一次老配置 max_tokens=1000 导致
      推理模型 23% 的请求截断在思考阶段。之后建了参数兼容层加输出分布监控，
      同类事故清零；同时给路由层加了"推理 token 超 4000 就告警"的哨兵，抓住过
      一批把简单分类题误路由进推理模型的流量，单这一项省回 30% 推理成本。
      【举一反三】这就是前端"依赖升级后默认值变了"的问题——对策一样是封装
      适配层加行为回归测试，而不是全局搜索替换版本号。【扣分点对照】只说
      "换个模型名就行"的是没上过线；能讲出参数静默失效、max_tokens 语义变化、
      用监控抓 overthinking 的，才是真的迁移过模型的人。
    followups:
      - 推理强度档位（如 reasoning effort 的低/中/高）怎么选？什么任务才配用高档？
      - 模型"想太多"有什么可量化的监控信号？怎么区分"认真想"和"兜圈子"？
      - 推理输出被 max_tokens 截断后应该给用户看什么？重试策略怎么设？
masteryCheck:
  level: V2
  type: code-challenge
  description: 在同一批 20 道多步计算题上对比四种方案（裸模型/零样本CoT/few-shot CoT/推理模型）的准确率与单次成本，输出对比表并给出路由建议
