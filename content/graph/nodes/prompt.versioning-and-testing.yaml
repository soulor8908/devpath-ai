id: prompt.versioning-and-testing
title: Prompt 版本化与可测试性
summary: 把 Prompt 当代码对待：版本管理、测试数据集、回归评估。Prompt 改动必须有数据支撑，不靠手感。
tracks: [frontend-to-ai-engineer]
phase: 1
prerequisites: [prompt.system-and-fewshot]
estimatedMinutes: 90
difficulty: 3
frontendBridge: >-
  这就是你在前端做的 A/B 测试 + CI：Prompt 是代码，测试用例是标注数据，
  准确率是指标。每次改 Prompt 都跑一遍回归——不过"测试框架"换成了
  LLM 评估（LLM-as-judge 或规则校验）。你的工程纪律是最大优势。
concepts:
  - Prompt 模板化：变量插值、环境分离（dev/staging/prod）
  - 测试数据集：50-200 条标注样本，覆盖典型与边界
  - LLM-as-judge：用强模型评估弱模型输出，需人工抽检校准
  - 回归门禁：改动 Prompt 后准确率下降 > 阈值则阻止合并
sourceIds: [anthropic-prompt-engineering, openai-cookbook, hamel-husain-evals]
gotchas:
  - 测试集太小（<30 条）时，指标波动大于真实差异——统计显著性被忽视
  - LLM-as-judge 有偏见（偏爱长回答、自信语气）——必须人工抽检 10% 校准
  - Prompt 改动 + 模型版本升级会交互影响——变量要分开控制
interview:
  - q: 怎么验证一次 Prompt 优化是真的改进而不是自欺欺人？
    answerSkeleton: >-
      【分层原理】六步闭环，缺一不可。固定变量：测试集固定（50-200 条标注样本，覆盖典型与边界）、
      模型版本固定——prompt 改动和模型升级必须分开测，混在一起无法归因。全量对比：改动前后各跑
      完整测试集，不能挑几条好看的 case 就收工——cherry-pick 是 prompt 工程最大的自欺。多维指标：
      准确率之外看格式正确率、长度分布、延迟、成本，单一指标会骗人（准确率涨 2 点可能伴随输出长度
      翻倍、成本涨 40%）。统计显著性：30 条样本下 5% 的指标差异大概率是噪声，样本量决定你能分辨
      多小的改进。评委校准：LLM-as-judge 有系统性偏见（偏爱长回答、自信语气、和自己同源的输出），
      必须人工抽检 10% 校准评委本身。灰度验证：离线指标再好也要小流量上线看真实业务指标，离线
      在线上的 gap 是常态。【实际案例】我在客服话术生成项目被"假改进"打过脸：优化后的 prompt 在
      50 条测试集上准确率 88%→92%，全量上线后投诉率反升——复盘发现测试集里"愤怒客户"场景只有
      3 条，新 prompt 在该场景从 85% 跌到 60%，被平均数淹没了。之后立了纪律：测试集按场景分桶、
      每桶独立设门槛，任何桶跌超 5% 一票否决；回归报告必须带分桶明细，不许只报总分。【举一反三】
      这就是前端的 A/B 测试 + CI 门禁：对照组/实验组、显著性检验、分渠道看指标——你把增长实验的
      方法论平移过来就是 prompt 评测。【扣分点对照】答"找几条 case 试试感觉变好了"的是手感派；
      能讲出 cherry-pick 自欺、场景分桶一票否决、评委偏见人工校准这三条纪律及背后事故的，才是
      被回归事故教育过的人。
    followups:
      - 样本量不够时怎么判断改进真假？（提示：置信区间、重复采样、配对比较）
      - LLM 评委的偏见具体怎么检测和校准？
      - 离线指标涨、线上指标跌，可能的原因有哪些？
  - q: Prompt 怎么做版本管理与线上回滚？讲一个你处理过的 prompt 变更事故。
    answerSkeleton: >-
      【分层原理】核心原则：prompt 是代码不是配置文案——要进 git、走 code review、带版本号、
      可灰度可回滚。版本化落地三件事：模板与变量分离（prompt 文件独立管理、变量运行时注入，
      dev/staging/prod 环境隔离）；每次变更带元数据（改了什么、预期影响哪个指标、评测报告链接）；
      线上按版本号下发（配置中心或 feature flag），而不是改代码重新部署——回滚 = 切回旧版本号，
      秒级生效。事故处理链路：线上监控（业务指标 + 线上抽样评测）先发现 → 按版本号秒级回滚止血
      → 离线复现，把线上失败 case 补进测试集 → 归因（是 prompt 本身，还是与模型版本/数据分布的
      交互）→ 修复后重走完整评测再放行。【实际案例】我在电商客服项目经历过典型事故：运营优化
      "退换货话术"的 prompt 下午直接全量上线，晚上监控报警——转人工率从 12% 冲到 27%。新版为了
      "共情"加了一段安抚话术，结果模型把"需要人工审核的退款"也安抚着自行答复了。当时 prompt
      硬编码在代码里，回滚要走发布流程，从报警到恢复花了 50 分钟。事故后三个改造：prompt 全部迁到
      配置中心按版本号下发（回滚压到 1 分钟内）；变更必须附离线评测报告才能上灰度；转人工率这类
      guardrail 指标接分钟级告警。半年后同类改动的一次回滚只用了 40 秒。【举一反三】这套就是你
      熟悉的前端发布体系：feature flag、灰度发布、秒级回滚、监控告警——只是发布物从 JS bundle
      换成 prompt 文本，而 prompt 的"灰度"甚至更简单，因为它本来就是数据。【扣分点对照】答"用
      git 管理 prompt"的只说对三分之一；能讲出配置中心版本号下发（回滚免部署）、guardrail 指标
      分钟级告警、"把线上失败 case 回补测试集"这条事故闭环的，才是真为 prompt 上过生产发布体系
      的人。
    followups:
      - prompt 走配置中心下发后，怎么防止"配置版本和代码版本不匹配"？
      - 灰度阶段看哪些指标决定全量还是回滚？
      - 模型供应商悄悄升级了模型版本，你的评测体系怎么发现？
