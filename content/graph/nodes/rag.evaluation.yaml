id: rag.evaluation
title: RAG 评估（RAGAS 与离线评测）
summary: 没有评测的 RAG 是玄学。RAGAS 三维度（faithfulness/answer relevancy/context relevancy）+ 人工标注集是生产 RAG 的质量底线。
tracks: [frontend-to-ai-engineer]
phase: 2
prerequisites: [rag.retrieval-strategies]
estimatedMinutes: 90
difficulty: 3
frontendBridge: >-
  RAG 评测 ≈ 你做前端的单元测试 + E2E：检索召回率像单元测试（每个 query 该召回哪条文档），
  生成质量像 E2E（端到端答案对不对）。RAGAS 用 LLM-as-judge 自动评分，相当于 snapshot 测试——
  快但不绝对可靠，必须人工抽检校准。
concepts:
  - 检索评估：recall@k（应召回的文档是否在 top-k）/ precision@k（top-k 里有多少相关）/ MRR（正确文档排名）
  - 生成评估：faithfulness（答案是否忠于上下文，防幻觉）/ answer relevancy（答案是否切题）/ context relevancy（上下文是否相关）
  - RAGAS 框架：用 LLM-as-judge 自动跑三维度评分，开源 Python 库
  - 评测集构建：50-200 条 (query, ground-truth answer, relevant docs) 三元组，人工标注成本是大头
  - 在线监控：记录查询日志 + 抽样人工评分，离线指标与线上效果未必一致
sourceIds: [jerry-liu-rag-eval, hamel-husain-evals]
gotchas:
  - 没有评测集的 RAG 优化是瞎调——你以为召回率提升了，其实只是 cherry-pick 的案例
  - RAGAS 的 faithfulness 评分有偏向——偏爱短答案（短答案不易"不忠于上下文"）
  - 评测集会被"见过"——模型迭代时若用评测集做 prompt 调优，等于作弊，必须留 holdout
interview:
  - q: 怎么评测一个 RAG 系统的好坏？哪些指标最重要？
    answerSkeleton: >-
      【分层原理】评测分两层，必须分开看。检索层：recall@k（应召回的文档是否进
      top-k，这是最底层的命门——检索不到，生成再好也白搭）、precision@k（top-k
      里相关占比，防噪声稀释）、MRR（正确文档排多靠前）。生成层：faithfulness
      （答案每个论点能否被检索上下文支撑，防幻觉，这是 RAG 区别于纯生成的核心
      价值）、answer relevancy（答案是否切题）、context relevancy（检索内容是否
      真的相关）。工具上 RAGAS 用 LLM-as-judge 自动跑这些维度，但它只是加速器，
      必须配人工标注的评测集做基准，还要人工抽检校准评委本身的偏差（已知它偏爱
      短答案）。【实际案例】我用指标分层定位法驱动过一轮优化：第一版系统
      recall@5 61%、faithfulness 0.78，先攻检索（切分 + 混合检索）把 recall 拉
      到 87%，再攻生成（强制引用 + temperature 0）把 faithfulness 拉到 0.93——
      每一步改动都跑同一套评测集回归，彻底告别"感觉变好了"式瞎调。【举一反三】
      这就是前端的单测 vs E2E：检索指标像单测（每个 query 该召回哪条文档是确定
      的），生成指标像 E2E（端到端答案对不对），两层缺一不可。【扣分点对照】
      罗列指标名词的是背书；能讲出"按指标分层定位瓶颈、每次改动跑回归、LLM
      评委要人工抽检校准"这套工作流的，才真做过 RAG 优化。
    followups:
      - faithfulness 的评分原理是什么？LLM 评委判错怎么办？
      - RAGAS 自动评分和人工评分冲突时信谁？
  - q: RAG 的评测集怎么建？多少条够、怎么标注、怎么防止被"见过"？
    answerSkeleton: >-
      【分层原理】评测集是 (query, 标准答案, 相关文档 id) 的三元组集合。来源优先级：
      真实查询日志（脱敏后）> 业务方提需求 > LLM 合成扩充——合成数据分布和真实用户
      差得远，只能垫底。规模 50-200 条起步，太少指标不稳、太多标注不起。标注要双人
      背靠背 + 分歧仲裁，相关文档要标到块级而非文档级（否则召回指标虚高）。防泄漏
      三条纪律：评测集不进 prompt 调优、不进 few-shot 示例、留一部分 holdout 只在
      里程碑时用；且评测集要定期换血，因为业务查询分布在漂移。【实际案例】我建评测
      集的做法：从客服系统导出 3 个月真实 query 日志 2 万条，聚类去重后按频次分层
      抽 120 条，请两位业务同学背靠背标注、不一致的第三人仲裁——花了 3 人日，但从
      此每次优化的"提升"第一次变得可复现。踩过的坑：早期图省事用 LLM 合成评测
      query，全是书面语长句，而真实用户平均只输 6 个字，优化方向被带偏了一个月。
      【举一反三】这和前端测试 fixture 同理：脱离真实数据分布的 fixture 测出来的
      都是假阳性。【扣分点对照】只说"用 RAGAS 自动生成评测集"的是把评估当开箱
      即用；能讲出真实日志分层抽样、双人标注仲裁、合成数据分布偏差、holdout
      纪律的，才真建过评测集。
    followups:
      - 标注"相关文档"时边界怎么定？（提示：沾边就算 vs 必须能支撑答案）
      - 业务查询分布每月都在变，评测集怎么保鲜？
  - q: 如果你的系统召回率 90%，但生成的答案还是很烂，你往哪查？
    answerSkeleton: >-
      【分层原理】召回率高只证明"正确文档进了 top-k"，答案烂说明断点在召回之后，
      按链路逐段排查。第一查 context relevancy 与排序：正确文档可能排在第 7-9 位，
      被 prompt 的 top-5 截断丢掉了——召回率统计的是 top-10，喂模型的只有 top-5，
      两个口径不一样。第二查上下文组装：正确块进了 prompt 但被切分切碎、表头丢失，
      模型读不懂。第三查生成层：prompt 约束太弱、模型无视上下文自由发挥——看
      faithfulness 与 answer relevancy 哪个掉。第四查评测口径：召回标注可能太松
      （标了整篇文档而非具体块），指标本身就虚高。【实际案例】这道题我真遇到过：
      recall@10 92% 但端到端人工评分只有 60 分。排查动作是 dump 实际拼进 prompt
      的上下文逐条看——发现正确块在 top-10 里排 7-9 位、被 top-5 截断，加 rerank
      把它顶进前 3 后评分到 78；剩下的烂答案再查，是表格块被切散导致模型张冠
      李戴，修切分后到 88。【举一反三】这就是前端全链路 tracing 的思路："页面慢"
      要拆网络/渲染/数据逐段定位，"答案烂"要拆排序/组装/生成逐段 dump——指标好
      ≠ 体验好，单个聚合指标永远会掩盖断点位置。【扣分点对照】只会回答"继续提高
      召回率"的是单点思维；能讲出"dump 实际 prompt 上下文、逐段对照排查"这套
      方法论的，才真 debug 过 RAG 系统。
    followups:
      - 怎么自动化发现"正确块排名靠后被截断"这类问题？
      - 如果 dump 发现上下文完全正确、模型就是不照着答，怎么办？
  - q: RAG 系统的离线回归和线上监控怎么做？有没有遇到过"离线全绿、线上退化"的情况？
    answerSkeleton: >-
      【分层原理】分三层闭环。离线回归：评测集当发版门禁，recall/faithfulness 掉
      超阈值（如 2 个点）就 block 上线——防"改 A 坏 B"。线上抽样：每天抽 1% 真实
      问答对过 faithfulness 校验器做趋势监控——防慢退化，这类退化离线测不出来
      因为离线数据是静态的。业务信号：点踩率、拒答率、转人工率接告警——这才是
      最终裁判。三层的关系是：离线保不犯新错，线上保不错过漂移，业务信号保不
      自欺。【实际案例】我亲历的慢退化：上线第三周线上抽样的 faithfulness 从
      0.93 缓跌到 0.87，而离线回归全绿——排查发现业务侧新上线了三个产品线文档，
      真实查询分布漂移了，旧评测集根本没覆盖这类 query。之后给评测集加了换血
      机制（每月从线上日志补 20 条新 query），同类问题能提前一周在离线暴露。
      另一次向量库版本升级后 p95 翻倍，也是线上延迟监控先于用户投诉报警。
      【举一反三】这和前端质量体系完全同构：Lighthouse CI 是发版门禁、RUM
      采样是线上趋势、转化漏斗是业务裁判——离线指标与线上体验之间的鸿沟，
      两个行业一模一样。【扣分点对照】把评估当"上线前跑一次 RAGAS"的是一次性
      思维；能讲出发版门禁阈值、线上抽样成本控制、慢退化真实案例与评测集换血
      机制的，才是把 eval 当体系做过。
    followups:
      - 线上抽样跑 faithfulness 的成本怎么控制？
      - 发版门禁的阈值怎么定？卡太严把正常迭代也 block 了怎么办？
