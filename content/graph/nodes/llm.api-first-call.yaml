id: llm.api-first-call
title: 第一次 LLM API 调用（消息模型与参数）
summary: 消息模型（system/user/assistant 角色）、请求构造、认证、响应解析。覆盖 OpenAI 兼容协议——DeepSeek 等国产模型同构。
tracks: [frontend-to-ai-engineer]
phase: 0
prerequisites: [llm.tokens-and-context]
estimatedMinutes: 90
difficulty: 2
frontendBridge: >-
  调 LLM API 就是调一个特殊的 REST API：POST + JSON + Authorization header，
  你闭着眼都会。真正的差异只有两个：请求体里的 messages 是"剧本"而非
  "参数"（system 消息设定角色与约束，类似给组件传 props）；
  响应是不确定的——同样的输入可能有不同输出，这是与传统 API 的本质区别。
concepts:
  - 消息角色：system（设定行为边界）、user（用户输入）、assistant（模型历史回复）
  - OpenAI 兼容协议：DeepSeek/Moonshot 等国产模型共用同一协议，换 base_url 即可切换
  - max_tokens：输出上限控制成本与截断
  - 响应结构：choices[0].message.content 与 usage 统计
  - API Key 安全：永远走服务端，绝不进前端 bundle
sourceIds: [openai-docs, deepseek-api-docs, anthropic-docs]
gotchas:
  - 把 API Key 写进前端代码是最常见的安全事故——Key 必须只在服务端
  - system 消息不是"更强的指令"，只是约定角色——用户输入仍可覆盖（prompt 注入的地基认知）
  - 多轮对话需要客户端维护全部 messages 历史并重发——API 本身无状态
interview:
  - q: messages 里三种角色各干什么？为什么说 API 是无状态的，多轮对话靠什么实现？
    answerSkeleton: >-
      【分层原理】messages 是按时间排列的"剧本"，三种角色各司其职：system 设定模型的身份、行为
      边界与输出约束，最先注入；user 是用户输入；assistant 是模型的历史回复——注意 assistant 消息
      不是"回执存档"，下一轮必须原样重发，因为 API 无状态，模型并不知道自己上轮说过什么，你不重发
      它就当场"失忆"。无状态的含义是每次请求独立完整：服务端不保存任何会话，客户端（通常是你的
      BFF）维护 messages 数组，每轮追加新的 user 消息和返回的 assistant 消息，下一轮全量重发。
      两个直接推论：历史随轮次线性增长，每轮都要为全部历史重新付费，输入成本滚雪球；system 只是
      约定角色不是权限边界，用户输入仍可能覆盖它——这是 prompt 注入的地基认知。【实际案例】我们
      客服机器人的 messages 生命周期就是这样：BFF 维护数组，每轮 append 两条再全量 POST，第 20 轮
      的输入 token 是第 1 轮的 18 倍，成本曲线明显上翘，后来靠历史压缩才按住。另一个教训：产品曾
      把"绝不透露价格底线"写进 system 就觉得万事大吉，被用户一句"忽略之前的指令"轻松绕过——
      敏感规则必须在应用层兜底，system 是软约束。【举一反三】维护 messages 数组 ≈ 维护一个每次
      全量提交的表单状态；无状态重发 ≈ JWT 每次请求携带全部声明，区别是这里的"声明"按 token 计费
      且会撑爆窗口。【扣分点对照】只背"system 设定角色、user 是输入"的是文档复读；能讲出
      assistant 必须重发的原因、全量重发的成本推论、system 非权限边界的安全认知的，才是真写过
      对话系统的人。
    followups:
      - assistant 消息如果不重发，模型的行为会发生什么变化？
      - system 与用户指令冲突时模型怎么处理？这带来什么安全风险？
      - tool 角色（工具返回）在多轮里怎么组织？
  - q: 为什么 LLM API 要设计成无状态？服务端的"会话"效果是怎么做出来的？
    answerSkeleton: >-
      【分层原理】无状态是服务端工程的最优解而非偷懒。水平扩展：任何请求落到任意机器都能处理，
      不需要会话亲和性，负载均衡随便调度；容错：机器挂了请求重试到别的节点即可，没有会话状态
      要迁移；成本：服务端按用户保有会话内存是巨大开销，无状态把存储压力转移给客户端的重传。
      代价同样明显：每轮全量重放历史，输入 token 滚雪球。所以服务端做了配套优化——前缀 KV cache
      复用（prompt caching）：多轮对话每轮的前缀（system 加历史）大部分是上一轮已算过的，服务端
      缓存前缀的 K/V，命中部分不重算注意力，输入费用大幅折价、TTFT 同步改善——它让"全量重放"
      在计费与延迟上接近"增量付费"。推论是 prompt 组织有纪律：稳定的长内容（system、工具定义、
      长文档）放最前，变化的内容（用户问题、当前时间）放最后，前缀任何抖动都会击穿缓存。
      【实际案例】我们把 12k token 的产品手册放前缀，开缓存前每轮输入按 12.5k 计费；开后命中轮次
      只按新增 0.5k 加缓存读折扣计，单轮成本降 71%，TTFT 从 1.8s 降到 0.6s。翻过车：system 开头
      拼了"当前时间：{now}"，前缀每轮都变，命中率 0%，移到末尾后回到 92%。【举一反三】无状态加
      前缀缓存 ≈ HTTP 无状态加 CDN 边缘缓存：协议本身无记忆，但前缀稳定就能吃到缓存红利，和保持
      props 引用稳定命中 React memo 是同一心智。【扣分点对照】说"无状态是为了简单"的太浅；能讲出
      扩展性/容错/成本三重收益、全量重放的代价、以及 KV cache 前缀复用如何让两者兼得的，才理解了
      这个设计的完整权衡。
    followups:
      - 多轮对话每轮前缀都在变长，prompt 缓存还有效吗？（提示：增量前缀仍命中）
      - 什么写法会击穿前缀缓存？（提示：时间戳/用户画像塞进前缀开头）
      - 如果让你设计一个有状态的会话 API，会遇到什么麻烦？
  - q: 让你封装一个生产级的 chat client，除了调 API 还要做什么？
    answerSkeleton: >-
      【分层原理】生产级和 demo 代码差在五件事。密钥：Key 只在服务端环境变量，绝不进前端 bundle，
      本地 .env 不进 git，CI 加 secret scanning。超时：必须显式设置，默认超时太长会把连接池打满，
      故障期放大雪崩。重试：只对可重试错误（429、5xx、网络错误）做指数退避加抖动，4xx 业务错误
      （参数错、上下文超长）重试无意义直接抛；重试要配总次数预算与熔断，否则一次上游抖动被多层
      重试放大成流量风暴。错误分类：把 SDK 异常归一成"可重试/限流/参数错误/内容审核/未知"几类，
      上层按类决定降级、告警还是直接失败。记账：每次调用从响应 usage 字段取输入/输出 token 落库，
      按用户、功能、模型维度聚合——没有 usage 记账，月底账单来了都不知道钱花在哪。【实际案例】
      我们的 client 第一版只有 try-catch 加重试三次，上线第一周就出事：一次上游 500 抖动，三层
      重试叠加把请求量放大 27 倍，直接触发限流雪崩；改成"指数退避加抖动加单请求重试预算 2 次加
      熔断"后稳定。usage 记账则救过一次预算会：财务质疑月账单，我们按功能维度拆出"文档摘要占
      61%"，当场定位是新功能忘了限输出长度。【举一反三】就是前端封装 fetch 的同款功课：超时、
      取消、错误归一、埋点上报一个不能少——区别只是多了 token 记账这条计费维度。【扣分点对照】
      会调 API 的写三行代码；做过生产的能讲出重试风暴的放大机制、错误分类表，以及 usage 记账怎么
      救过预算会。这五件事的共同点是：都是"故障与对账时才知道值多少钱"的投资，平时看不见。
    followups:
      - 429 限流和 500 错误的重试策略应该一样吗？（提示：Retry-After、退避基数）
      - usage 字段在流式场景怎么拿？（提示：请求参数让末段 chunk 返回 usage）
      - 多模型供应商并存时，client 层怎么抽象？
  - q: 多轮对话的成本为什么会滚雪球？你怎么控制？
    answerSkeleton: >-
      【分层原理】数学很简单：无状态 API 每轮全量重发历史，第 N 轮输入约等于前 N-1 轮所有 token
      之和——10 轮对话、每轮新增 2k token，总输入是 2k 加 4k 加到 20k 等于 110k，是单轮的 11 倍；
      轮次翻倍，总成本近似平方增长。控制手段按信息损失排序：滑动窗口（只带最近 N 轮，实现零成本，
      丢早期上下文）；滚动摘要（用小模型把旧历史压成几百 token，有损但留梗概，摘要本身要花 token）；
      结构化档案（用户偏好、订单号、已确认结论抽成字段每轮注入，对可结构化信息无损）；RAG 外置
      （历史向量化，按需召回相关轮次，覆盖不可预期的回溯）。生产组合：滑窗保底、结构化档案兜底、
      摘要做中层，超长会话再上召回。另外 prompt 缓存能让重发的前缀折价，把平方增长的系数砍下来。
      【实际案例】客服机器人实测：无治理时 20 轮会话的总成本是单轮的百倍以上量级；上"最近 6 轮
      加 300 token 滚动摘要加用户偏好档案"后总成本降 57%，30 轮以上会话的任务完成率反而从 64%
      升到 89%——窗口清爽后指令遵循也变好了。此前我们还踩过"静默失忆"：messages 无限增长撑爆
      窗口后网关做了头部截断，system prompt 和早期偏好一起被丢，用户投诉"聊着聊着就失忆"——
      治理策略上线后这类投诉同步消失。【举一反三】这就是前端的长列表治理：全量渲染十万行
      不是不行是卡——虚拟列表（滑窗）加按需分页（召回）是同一个答案。【扣分点对照】只说"截断
      历史"的是没算过账；能报出平方增长的数学推导、四种手段的信息损失排序，以及治理后"成本降、
      完成率反升"的反差数据的，才是管过多轮成本的人。
    followups:
      - 滑窗的 N 怎么定？定小定大各牺牲什么？
      - 摘要链路上小模型出错了会怎样？怎么兜底？
      - 用户显式纠正过自己的偏好，档案里旧值怎么失效？
