id: llm.api-first-call
title: 第一次 LLM API 调用（消息模型与参数）
summary: 消息模型（system/user/assistant 角色）、请求构造、认证、响应解析。覆盖 OpenAI 兼容协议——DeepSeek 等国产模型同构。
tracks: [frontend-to-ai-engineer]
phase: 0
prerequisites: [llm.tokens-and-context]
estimatedMinutes: 90
difficulty: 2
frontendBridge: >-
  调 LLM API 就是调一个特殊的 REST API：POST + JSON + Authorization header，
  你闭着眼都会。真正的差异只有两个：请求体里的 messages 是"剧本"而非
  "参数"（system 消息设定角色与约束，类似给组件传 props）；
  响应是不确定的——同样的输入可能有不同输出，这是与传统 API 的本质区别。
concepts:
  - 消息角色：system（设定行为边界）、user（用户输入）、assistant（模型历史回复）
  - OpenAI 兼容协议：DeepSeek/Moonshot 等国产模型共用同一协议，换 base_url 即可切换
  - max_tokens：输出上限控制成本与截断
  - 响应结构：choices[0].message.content 与 usage 统计
  - API Key 安全：永远走服务端，绝不进前端 bundle
sourceIds: [openai-docs, deepseek-api-docs, anthropic-docs]
gotchas:
  - 把 API Key 写进前端代码是最常见的安全事故——Key 必须只在服务端
  - system 消息不是"更强的指令"，只是约定角色——用户输入仍可覆盖（prompt 注入的地基认知）
  - 多轮对话需要客户端维护全部 messages 历史并重发——API 本身无状态
interview:
  - q: LLM API 是无状态的，多轮对话是怎么实现的？
    answerSkeleton: >-
      【分层原理】分三层讲透。机制层：API 每次请求独立，服务端不保存任何会话状态——"记忆"
      完全在客户端：你的代码维护 messages 数组，每轮把新的 user 消息与模型返回的 assistant
      消息追加进去，下一轮全量重发。assistant 消息也必须重发，否则模型不知道自己上轮说了
      什么。成本层：这带来一个直接推论——历史随轮次线性增长，而每次请求都要为全部历史
      付费，输入 token 成本是滚雪球：第 20 轮请求要重新为前 19 轮的每一个 token 买单。
      治理层：所以多轮对话必须有历史管理策略——滑动窗口、摘要压缩、或把长期记忆外置成
      结构化档案按需注入。角色分工也要讲清：system 设定行为边界、user 是用户输入、assistant
      是模型历史回复；system 不是"更强的指令"，只是约定角色，用户输入仍可覆盖它——这是
      prompt 注入的地基认知。【实际案例】我们的客服机器人第 20 轮对话的输入 token 是第 1 轮
      的 18 倍，单会话成本曲线是明显的上抛物线；加"最近 6 轮加摘要"策略后，20 轮会话总
      成本降了 57%，满意度没掉。另一个教训关于角色认知：产品同学曾把"绝不透露价格底线"
      写进 system prompt 就当万事大吉，被用户一句"忽略之前的指令"轻松绕过——system 是
      约定不是权限，敏感规则必须在应用层兜底。【举一反三】这和 REST 的无状态会话同构：
      cookie/JWT 每次请求重发状态，区别是这里"重发的状态"按 token 计费且会撑爆窗口——
      所以必须主动管理。维护 messages 数组 ≈ 维护一个每次请求全量提交的表单状态。
      【扣分点对照】背八股的只说"把历史放进 messages 重发"；真做过的能讲出成本雪球的
      具体量级、压缩策略的取舍，以及"system 不是权限边界"的安全认知。
    followups:
      - 全量重发把上下文窗口撑爆了怎么办？（提示：截断/摘要/滑窗的取舍与代价）
      - 多轮里 assistant 消息为什么要重发？（提示：模型不知道自己的上轮输出）
      - system 与用户指令冲突时模型怎么处理？这带来什么安全风险？（提示：prompt 注入的地基）
  - q: API Key 为什么不能放前端？真实的风险链路和正确架构是什么？
    answerSkeleton: >-
      【分层原理】三层原因。暴露面：打进前端 bundle 的任何内容都是公开信息——构建产物、
      sourcemap、浏览器 devtools 网络面板，Key 一旦进前端等于发给全世界，混淆和"客户端
      加密"都救不了，因为代码在客户端运行就必须能被客户端读取。滥用面：LLM API 按 token
      计费且无状态，被盗的 Key 可以被脚本无限调用，账单爆炸没有自然上限；还会被用来跑违规
      内容，账号连带被封。架构面：正确模式是 BFF/代理层——前端只调自己的后端，后端持有
      Key 并做鉴权、限流、审计、按用户维度记账；这层顺便解决"不同用户配额不同"和"敏感
      prompt 模板不下发"两个问题。【实际案例】圈内反复有真实事故：独立开发者把 Key 硬编码
      进前端代码、仓库公开，几小时内 Key 被爬虫扫走，账单一夜跑出几千美元。我们自己 Code
      Review 也拦下过一次：实习生图方便在前端直连 LLM 做调试功能，把 Key 字符串写进了客户端
      组件——不是 NEXT_PUBLIC_ 前缀也照样会进 bundle，因为引用它的模块是客户端模块。拦下
      后立了两条防线：CI 加 secret scanning 扫仓库与历史提交，前端目录加 lint 规则禁止
      import 服务端 env 模块——把"祈祷人不出错"换成"出错即红"。【举一反三】这和"不要把
      数据库密码写进小程序"是同一课，只是 LLM Key 变现更快、爬虫更饥渴。反向理解也有价值：
      正因为 API 无状态，谁拿到 Key 谁就是"你"，没有会话可吊销，只能换 Key 并审计调用
      记录。【扣分点对照】背八股的会说"会泄露"三个字；真做过安全治理的能讲出完整风险链路
      （bundle 公开到爬虫到无上限账单）、BFF 代理层的附加收益，以及 CI 防线怎么落地。
    followups:
      - Key 已经泄露过一次，应急处置流程是什么？（提示：吊销换 Key、审计调用记录、账单申诉）
      - BFF 代理层除了藏 Key 还要做什么？（提示：限流、审计、按用户记账、prompt 服务端化）
      - 本地开发的 Key 管理有什么纪律？（提示：.env 不进 git、secret scanning、最小权限）
