id: llm.model-routing
title: 模型选择与路由
summary: 不同任务用不同模型：分类用小模型、复杂推理用大模型、敏感场景用本地模型。路由是成本与质量的杠杆。
tracks: [frontend-to-ai-engineer]
phase: 1
prerequisites: [llm.cost-and-latency]
estimatedMinutes: 90
difficulty: 3
frontendBridge: >-
  这就是前端的"按需加载"策略：首屏用轻量资源，交互复杂时再加载重型组件。
  模型路由同理——简单任务（意图分类、格式转换）用 GPT-4o-mini/DeepSeek-V3，
  复杂任务（多步推理、代码生成）才上 Claude Sonnet/GPT-4o。
  路由器本身也可以是一个小模型。
concepts:
  - 任务分级：简单（分类/提取）、中等（摘要/改写）、复杂（推理/代码）
  - 路由策略：规则路由（if-else）、模型路由（小模型判断任务复杂度）、混合
  - 级联模式：先小模型尝试，置信度低则升级大模型
  - 本地模型：Ollama + 开源模型，隐私敏感场景的出路
sourceIds: [openai-cookbook, anthropic-effective-agents, eugene-yan-llm-patterns]
gotchas:
  - 路由器本身也是模型，有错误率——路由错误比直接用大模型更糟
  - 级联模式增加了延迟：小模型尝试失败再上大模型，总耗时 = 两次调用
  - 本地模型的"免费"是幻觉：硬件成本 + 运维成本 + 质量差距要算总账
interview:
  - q: 设计一个多模型路由系统，考虑哪些因素？
    answerSkeleton: >-
      设计多模型路由系统要依次考虑：首先是任务分级——把请求按复杂度分成简单（分类/提取）、中等
      （摘要/改写）、复杂（推理/代码）三档；其次是路由策略——规则路由（if-else，可解释但僵硬）、
      模型路由（小模型判断复杂度，灵活但有错误率）、级联（先小模型试，置信度低再升级，质量高但延迟翻倍）；
      第三是成本与延迟权衡——小模型便宜快但质量低，大模型贵慢但质量高，路由的价值就在中间地带。
      一个容易被忽视的工程点：路由决策本身必须便宜且快——模型路由器的调用要控制在 100ms 级且结果
      可缓存（相似 query 直接复用路由结论），否则路由层会吃掉小模型省下的成本与延迟。第四是质量监控
      ——必须按路由分支分别统计准确率，路由错误比直接用大模型更糟；最后是降级与兜底，
      主模型不可用时回落到备用或缓存。前端迁移映射：路由 ≈ 按需加载（首屏轻量，交互时再加载重型组件），
      级联 ≈ 渐进增强。Tradeoff：路由器本身也是模型有错误率，路由错误比直接用大模型更糟，必须 A/B 验证。
    followups:
      - 路由器用规则还是模型？各自优劣？
      - 怎么度量"这个任务该用大模型还是小模型"？
