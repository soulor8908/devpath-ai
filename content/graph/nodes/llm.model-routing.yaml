id: llm.model-routing
title: 模型选择与路由
summary: 不同任务用不同模型：分类用小模型、复杂推理用大模型、敏感场景用本地模型。路由是成本与质量的杠杆。
tracks: [frontend-to-ai-engineer]
phase: 1
prerequisites: [llm.cost-and-latency]
estimatedMinutes: 90
difficulty: 3
frontendBridge: >-
  这就是前端的"按需加载"策略：首屏用轻量资源，交互复杂时再加载重型组件。
  模型路由同理——简单任务（意图分类、格式转换）用 GPT-4o-mini/DeepSeek-V3，
  复杂任务（多步推理、代码生成）才上 Claude Sonnet/GPT-4o。
  路由器本身也可以是一个小模型。
concepts:
  - 任务分级：简单（分类/提取）、中等（摘要/改写）、复杂（推理/代码）
  - 路由策略：规则路由（if-else）、模型路由（小模型判断任务复杂度）、混合
  - 级联模式：先小模型尝试，置信度低则升级大模型
  - 本地模型：Ollama + 开源模型，隐私敏感场景的出路
sourceIds: [openai-cookbook, anthropic-effective-agents, eugene-yan-llm-patterns]
gotchas:
  - 路由器本身也是模型，有错误率——路由错误比直接用大模型更糟
  - 级联模式增加了延迟：小模型尝试失败再上大模型，总耗时 = 两次调用
  - 本地模型的"免费"是幻觉：硬件成本 + 运维成本 + 质量差距要算总账
interview:
  - q: 设计一个多模型路由系统，需要考虑哪些因素？
    answerSkeleton: >-
      【分层原理】拆四层设计。任务分级：按复杂度把流量分桶——分类/提取是简单档，摘要/改写是中档，
      多步推理/代码是复杂档，分级标准要用真实流量的标注数据校准，不拍脑袋。路由策略三选或组合：
      规则路由（关键词、长度、意图标签做 if-else，零成本、可解释、覆盖有限）、模型路由（小模型当
      分类器，灵活但有错误率）、级联（先小后大按置信度升级，省成本但升级路径延迟翻倍）。路由层
      自身的硬约束：决策必须便宜且快——路由调用控制在 100ms 级，结论对相似 query 可缓存复用
      （embedding 近邻命中历史路由结论），否则路由层会吃掉小模型省下的成本与延迟，变成负资产。
      质量治理：必须按路由分支分别统计准确率，overall 指标会掩盖某条分支的塌陷；路由错误两头都
      输——比直接用大模型更糟。【实际案例】我在智能客服做过三级路由：规则层先拦 FAQ 和闲聊
      （占 35%，零 LLM 成本），小模型分类器把剩余流量分到"政策咨询→大模型"与"工单查询→工具链"
      两支。上线首月 overall 准确率 91% 看着不错，按分支拆开才发现"投诉建议"支误判率 23%——该支
      标注样本只有 40 条。补样本加低置信转人工后整体到 95%，LLM 成本比全量大模型方案降 67%。
      【举一反三】路由 ≈ 前端的按需加载加 CDN 分流：首屏走轻量资源、重交互再加载，静态走 CDN、
      动态回源——判断"任务该去哪"就像判断"哪个组件该拆包懒加载"，看真实访问分布，不看感觉。
      【扣分点对照】背题的答"简单任务小模型、复杂任务大模型"一句话；真做过的能讲出路由层 100ms
      与可缓存的硬约束、按分支统计准确率的必要性，以及"误判 23% 被 overall 掩盖"的实战教训。
    followups:
      - 路由决策怎么做到又便宜又准？（提示：规则先行、结论缓存、分类器选型）
      - 什么情况下你会放弃路由、全量用大模型？
      - 按分支统计准确率具体怎么落地？
  - q: 级联模式（小模型先试、置信度低再升级）为什么能省成本不掉质量？置信度信号从哪来？
    answerSkeleton: >-
      【分层原理】省成本的数学：若小模型能直接答对的比例是 p，这部分成本降到约十分之一，只有
      1-p 的流量升级走大模型——p 到 70-80% 时总成本常能砍半以上。不掉质量的前提是"该升级的真的
      升级了"，这全押在置信度信号上。信号四个来源：模型自评（让模型输出置信度或打标"我不确定"）
      ——最便宜但校准差，模型对"自己不知道什么"缺乏自知；代理信号（输出对数概率/熵、多次采样
      一致性、是否触发拒答模板）——中等可靠；判别器（另一个轻量模型判断答案质量或任务难度）——
      较可靠但多一次调用；规则兜底（财务报表等高风险类目不问置信度直接走大模型）。生产上是组合：
      规则先切高风险，代理信号定阈值，判别器定期抽检校准。代价也要算：升级路径总延迟 = 两次串行
      调用，P95 被这条路径拉高。【实际案例】我在文档摘要场景实测：小模型直答占 78%，这部分成本
      降 85%；阈值用标注集按"漏升级率小于 2%"反推定档。教训是初期信模型自评置信度，漏升级率
      11%，换成输出熵加采样一致性后降到 2.3%；被升级的 22% 请求延迟从 2.1s 涨到 4.6s，用并行
      预热（低置信瞬间就并发调大模型）回落到 2.8s。【举一反三】就是前端的渐进增强加资源竞速：
      先渲染骨架屏（小模型快速兜底），数据到了再 hydration（大模型精修）；并行预热 ≈ preload
      关键资源。【扣分点对照】只答"省成本"的没算过置信度账；能列出四类信号来源、报出漏升级率与
      阈值反推方法、讲出并行预热补救手段的，才是真调过级联的。级联的适用前提也别忘了：p 不够高
      （如低于五成）时，延迟与复杂度代价会吞掉成本收益，不如直接分流。
    followups:
      - 置信度阈值怎么定？用什么数据校准？
      - 并行预热会浪费"小模型本来能答对"的大模型调用，这笔浪费怎么算？
      - 多次采样一致性做置信度，成本会不会吃掉级联省的钱？
  - q: 给客服场景设计一套路由系统：任务怎么分级、占比多少、怎么监控和迭代？
    answerSkeleton: >-
      【分层原理】设计从流量盘点开始，不是从模型清单开始。任务分级表（客服实测分布）：FAQ 与闲聊
      约 35%——规则/缓存直接答，零 LLM 成本；工单与订单查询约 25%——工具调用链，小模型做参数
      抽取；政策咨询约 25%——RAG 加中档模型；投诉与复杂售后约 15%——大模型加低置信转人工。
      占比每季度用真实流量重新标注校准——业务一变占比就漂移，分级表不是一次性的。监控：按分支
      统计准确率与误判率，路由层记录每条决策的置信度与去向，抽样人工标注；核心认知是误判方向的
      不对称——把复杂问题误判为简单（用户拿到劣质答案，质量事故）远比反向（多花钱）危险，所以
      置信度模糊地带默认升级。bad case 回流：所有低置信、用户点踩、转人工的会话自动进标注队列，
      每周评审后补进分类器训练集或修规则——路由系统是靠 bad case 养大的，不回流就永远停在上线
      那天的水平。【实际案例】我们的路由上线后建立了这套回流：每周约 300 条 bad case 进队列，
      三个月补了 4000 条标注，"投诉建议"支误判率从 23% 降到 6%，整体准确率从 91% 到 95%，成本
      仍比全量大模型低 67%。【举一反三】和前端监控同构：分页面/分浏览器看错误率而不是只看大盘，
      错误日志回流成修复 backlog——大盘绿掩盖局部红是同一个陷阱。【扣分点对照】只画架构图的答
      不出占比与指标；能给出分级表、报出误判方向的不对称代价、讲清 bad case 周回流机制的，才是
      运营过路由系统的人。另一个常考点：路由表不是架构师的品味产物，每一档的占比都要能从线上
      日志里数出来——讲不出分布的设计图都是空中楼阁。
    followups:
      - 分级占比多久校准一次？触发重新校准的信号是什么？
      - 新业务上线没有历史流量，路由怎么冷启动？（提示：默认走高配再降级）
      - 转人工的会话除了回流标注，还能挖出什么价值？
  - q: 路由器判断错误的代价怎么控制？误判率怎么测量、新策略怎么验证？
    answerSkeleton: >-
      【分层原理】先承认路由器必然犯错，设计目标是把错误代价控在可接受区间。代价不对称：把复杂
      误判为简单——用户拿到劣质答案，是质量事故；把简单误判为复杂——多花了大模型的钱，是成本
      小损。所以默认策略永远向大模型倾斜：置信度模糊地带默认升级，宁可费钱不可费质量。误判率
      测量：持续抽样人工标注（每周几百条），按分支算混淆矩阵，重点盯"复杂被误判为简单"的漏判率，
      给它定红线（如小于 2%）；在线侧用代理信号监控——低置信占比、转人工率、点踩率异常波动即
      告警。A/B 验证：新路由策略灰度 5-10% 流量，对照组全量大模型，比质量分（人工抽检加用户反馈）、
      成本、延迟三项指标，质量不降且成本显著降才放量；回滚开关必须是一键的。【实际案例】我们上
      小模型分类器时灰度两周：A 组路由、B 组全量大模型，抽检 500 条质量分持平（4.31 vs 4.35），
      成本降 61%，但"投诉"支漏判率 8% 超红线——该支改成默认升级后才全量。红线思维帮我们躲过一次
      大事故：上线第三周告警显示转人工率突增，排查是新上的一类业务 query 被规则误拦到 FAQ 分支，
      一键回滚后修复规则再放量。【举一反三】就是灰度发布加特性开关的 LLM 版：新策略小流量验证、
      指标看板、一键回滚——你做过的发布纪律原样适用，只是指标从错误率变成质量分。【扣分点对照】
      只说"提高路由准确率"的是把必然犯错当可消灭；能讲出代价不对称、默认升级、漏判红线、灰度
      对照四件套的，才是真被路由错误教训过的。核心心智一句话：路由系统的质量下限由"默认升级"
      兜底，上限才靠分类器准确率去够。
    followups:
      - 漏判率红线 2% 是怎么定的？不同业务应该一样吗？
      - 灰度期间质量分怎么快速获得？人工标注跟不上怎么办？
      - 路由策略和大模型版本升级同时发生，怎么归因质量变化？
