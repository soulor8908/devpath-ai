id: llm.model-routing
title: 模型选择与路由
summary: 不同任务用不同模型：分类用小模型、复杂推理用大模型、敏感场景用本地模型。路由是成本与质量的杠杆。
tracks: [frontend-to-ai-engineer]
phase: 1
prerequisites: [llm.cost-and-latency]
estimatedMinutes: 90
difficulty: 3
frontendBridge: >-
  这就是前端的"按需加载"策略：首屏用轻量资源，交互复杂时再加载重型组件。
  模型路由同理——简单任务（意图分类、格式转换）用 GPT-4o-mini/DeepSeek-V3，
  复杂任务（多步推理、代码生成）才上 Claude Sonnet/GPT-4o。
  路由器本身也可以是一个小模型。
concepts:
  - 任务分级：简单（分类/提取）、中等（摘要/改写）、复杂（推理/代码）
  - 路由策略：规则路由（if-else）、模型路由（小模型判断任务复杂度）、混合
  - 级联模式：先小模型尝试，置信度低则升级大模型
  - 本地模型：Ollama + 开源模型，隐私敏感场景的出路
sourceIds: [openai-cookbook, anthropic-effective-agents, eugene-yan-llm-patterns]
gotchas:
  - 路由器本身也是模型，有错误率——路由错误比直接用大模型更糟
  - 级联模式增加了延迟：小模型尝试失败再上大模型，总耗时 = 两次调用
  - 本地模型的"免费"是幻觉：硬件成本 + 运维成本 + 质量差距要算总账
interview:
  - q: 设计一个多模型路由系统，需要考虑哪些因素？
    answerSkeleton: >-
      【分层原理】拆四层来设计。任务分级：先把流量按复杂度分桶——分类/提取是简单档，摘要/改写是
      中档，多步推理/代码是复杂档，分级标准要用真实流量数据校准而不是拍脑袋。路由策略：规则路由
      （关键词/长度/意图标签做 if-else，零成本可解释但覆盖有限）、模型路由（小模型当分类器，灵活但
      有错误率）、级联（先小后大按置信度升级）三选一或组合。路由层自身的硬约束：决策必须便宜且快
      ——路由调用控制在 100ms 级、结论对相似 query 可缓存复用，否则路由层会吃掉小模型省下的成本
      与延迟。质量治理：必须按路由分支分别统计准确率，overall 指标会掩盖某条分支的塌陷；路由错误
      比直接用大模型更糟，因为它两头都输。【实际案例】我在智能客服项目做过三级路由：规则层先拦截
      FAQ 和闲聊（占 35%，零 LLM 成本），小模型分类器把剩余流量分到"政策咨询→大模型"与"工单查询
      →工具链"两支。上线首月 overall 准确率 91% 看着不错，按分支拆开才发现"投诉建议"支被误判率
      23%——该支训练样本只有 40 条。补样本 + 低置信度请求转人工复核后整体到 95%，LLM 成本比
      全量大模型方案降 67%。【举一反三】路由 ≈ 前端的按需加载 + CDN 分流：首屏走轻量资源、重交互
      再加载，静态资源走 CDN、动态请求回源。判断"任务该去哪"就像判断"哪个组件该拆包懒加载"——看
      真实访问分布，不看感觉。【扣分点对照】背八股的答案是"简单任务小模型、复杂任务大模型"一句话；
      真做过的能讲出路由器本身的成本延迟约束、按分支统计准确率的必要性，以及"某分支误判 23% 被
      overall 指标掩盖"这种实战教训。
    followups:
      - 路由决策怎么做到又便宜又准？（提示：规则先行、结论缓存、分类器选型）
      - 按分支统计准确率具体怎么落地？发现某分支塌陷后怎么修？
      - 什么情况下你会放弃路由、全量用大模型？
  - q: 级联策略（先小模型尝试、置信度低再升级大模型）的代价是什么？怎么判断值不值得用？
    answerSkeleton: >-
      【分层原理】级联的收益是"大部分简单请求用小模型的价格解决"，代价有三笔账。延迟账：小模型
      失败再调大模型，总延迟 = 两次串行调用之和，被升级的那部分请求体验明显变差，P95 延迟被这条
      路径拉高。置信度账：小模型的置信度本身不可靠——模型对"自己不知道什么"缺乏校准，阈值定低
      了漏升级（质量受损），定高了全升级（省钱失效）。复杂度账：多一条分支就多一套监控与评测，
      双模型的 bad case 归因也变难。判断值不值得用，核心看"小模型直接答对的比例"够不够高、以及
      被升级路径的延迟业务能不能忍。【实际案例】我在文档摘要场景实测过级联：小模型直接答的占 78%，
      这部分成本降 85%；但被升级的 22% 请求端到端延迟从 2.1s 涨到 4.6s，用户反馈"有时快有时慢"。
      后来两招补救：按业务分流（财务报表类请求直接走大模型不试小模型），升级路径并行预热（小模型
      输出低置信度的瞬间就并发调大模型，不等小模型出完）——延迟回落到 2.8s。最终算账：成本降
      58%，质量分与全量大模型持平，值得。【举一反三】这就是前端的渐进增强 + 资源竞速：先渲染骨架
      屏（小模型快速兜底），数据到了再 hydration（大模型精修）；并行预热 ≈ preload 关键资源。判断
      值不值得上，同样看轻量路径的命中率。【扣分点对照】只答"省成本"的是没算过延迟账；能说出升级
      路径 P95 恶化、置信度校准难、并行预热这种工程补救手段的，才是真上过级联的人。
    followups:
      - 置信度阈值怎么定？用什么数据校准小模型的置信度？
      - 并行预热会浪费掉"小模型本来能答对"的那些大模型调用，这笔浪费怎么算？
