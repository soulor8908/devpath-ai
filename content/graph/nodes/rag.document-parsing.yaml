id: rag.document-parsing
title: 文档解析（PDF / 表格 / 扫描件）
summary: 生产 RAG 的第一大坑不是检索而是解析：PDF 双栏错位、表格切碎、扫描件要 OCR。解析质量差，下游切分 embedding 再强也救不回来。
tracks: [frontend-to-ai-engineer]
phase: 2
prerequisites: [llm.transformer-intuition]
estimatedMinutes: 90
difficulty: 3
frontendBridge: >-
  文档解析 ≈ 前端把"非结构化输入"（用户粘贴的富文本、上传的 Excel）清洗成结构化数据。你做过
  富文本编辑器就知道：表面是文本，底层是树，暴力 textContent 会丢一切结构。PDF 更糟——
  它存的是"字符 + 坐标"的绘制指令，根本没有"段落"概念，得靠布局分析重建阅读顺序。
concepts:
  - PDF 的本质：绘制指令流而非结构化文档——"段落/标题/表格"要靠坐标与字体聚类重建
  - 布局分析（layout analysis）：双栏论文按 x 坐标分列、按 y 排序，否则左右栏文字交错成乱码
  - 表格抽取：保留结构（转 HTML/Markdown 表）而非拍平成文本——表头与单元格的关系就是信息
  - 扫描件 = 图片：必须 OCR（Tesseract/PaddleOCR），且要处理倾斜、印章、低分辨率
  - 分区提取（partitioning）：Unstructured 等库把文档分成 Title/NarrativeText/Table/ListItem 等元素类型，下游按类型定切分策略
sourceIds: [unstructured-docs, langchain-rag]
gotchas:
  - 解析失败是静默的：抽出来的文本看着像文字但语序错乱，不抽查 bad case 根本发现不了
  - 表格拍平成纯文本后，模型经常张冠李戴（把 A 行的表头配到 B 行的数值）——表格必须保结构
  - 页眉页脚页码会污染每个块：要在解析阶段剔除，否则检索时被"第 3 页 共 10 页"稀释相似度
interview:
  - q: 为什么说文档解析是生产 RAG 的第一大坑？PDF 解析有哪些具体坑、怎么处理？
    answerSkeleton: >-
      【分层原理】坑分三层：一是 PDF 格式本质——它存的是"字符+坐标"的绘制指令，没有段落、
      标题概念，阅读顺序要靠坐标聚类重建；二是版式复杂——双栏论文按文本流抽取会把左右栏
      交错成乱码，页眉页脚页码混进正文污染每个块；三是特殊元素——表格拍平后表头与数值
      关系丢失，扫描件本质是图片必须 OCR，印章和倾斜还会拉高 OCR 错误率。处理方案对应
      分层：用 Unstructured/pdfplumber 做分区提取，把元素标成 Title/Table/Text 类型；
      表格单独转 HTML 或 Markdown 保结构；扫描件走 OCR 并设置信度阈值，低于阈值进人工队列。
      【实际案例】我接过一个企业知识库，第一批文档里有 30% 是扫描版合同，直接用 PyPDF 抽出来
      全是空字符串——系统静默"成功"入库了几百个空块，上线后相关问题全部拒答才发现。加了
      解析后校验（块字符数分布监控 + 抽样人工核对）才堵住。另一次双栏研报检索效果奇差，
      对着原文看抽取结果才发现左右栏交错，换布局分析后召回率从 58% 升到 81%。【举一反三】
      同样的"输入校验前置"思路在前端就是表单边界校验——垃圾进垃圾出，越早在管道入口拦住
      成本越低；Excel/PPT/邮件各有自己的解析坑（合并单元格、母版文字、引用链），原则都是
      按元素类型分流处理。【扣分点对照】只答"用 LangChain 的 PyPDFLoader"的是 Demo 选手；
      能讲出 PDF 是绘制指令、双栏重建、表格保结构、扫描件 OCR 置信度这四层的，才碰过
      真实文档。
    followups:
      - 怎么监控解析质量、及早发现静默失败？
      - 表格转 Markdown 保结构后，切分时还要注意什么？
  - q: 表格在 RAG 里怎么处理？直接拍平成文本会有什么问题？
    answerSkeleton: >-
      【分层原理】表格的信息在"行列关系"里：表头定义列语义，行是实体。拍平成文本后关系
      丢失——"iPhone 15 | 5999 | 256G" 这串字符里模型分不清哪个是价格哪个是容量，跨行
      对比类问题（"哪款更便宜"）几乎必错。三种主流处理：一是转 HTML/Markdown 表格文本，
      让模型用符号重建结构，简单但长表格爆 token；二是整块保留不切分 + 块内前置一句
      自然语言摘要（"下表是各型号价格对比"）帮助 embedding 命中；三是结构化路线——
      表格入关系库/做 Text-to-SQL，与向量检索双路并行。【实际案例】我在产品参数库项目
      实测：拍平方案下"256G 的 iPhone 多少钱"这类题准确率只有 44%，因为相似度把多个
      型号的碎片行都捞了进来；改成整块保留 + 块摘要后准确率到 82%，再把高频对比类
      问题路由到 Text-to-SQL 后到 91%。【举一反三】"按数据形态选管道"可以推广：代码块
      保缩进整块切、公式转 LaTeX、图片走多模态 embedding——核心都是别让转换过程丢掉
      承载信息的结构。【扣分点对照】背题答案只说"表格要特殊处理"；做过的人能说出拍平后
      张冠李戴的具体错误形态、整块保留的 token 代价、以及 Text-to-SQL 双路方案各自适合
      什么查询类型。
    followups:
      - 整块保留的长表格超 embedding 窗口怎么办？
      - Text-to-SQL 路线有什么新风险（提示：生成 SQL 的正确性怎么保证）？
  - q: 扫描件和纯图片型 PDF 怎么处理？OCR 置信度与人工兜底队列怎么设计？
    answerSkeleton: >-
      【分层原理】扫描件本质是图片，PDF 里的文本层是空的或只有劣质 OCR 残留，必须走
      OCR（Tesseract 开源够用，PaddleOCR 对中文印章和表格更友好）。关键不是"能不能
      识别"而是"识别错了怎么办"：OCR 引擎对每个字符块输出置信度，低置信度集中在印章
      覆盖、手写批注、倾斜扫描、低分辨率区域——而这些低分区往往压着合同金额、日期
      这类最关键字段。工程上要分层处置：高置信度直接入库，中间档进人工校对队列，
      过低档标记"不可解析"而不是硬塞入库；入库块还要在 metadata 标 ocr_source=true，
      让下游能对 OCR 块降权或加提示。版面信息同样重要：表格线、印章位置要参与结构
      重建，直接按 OCR 文本流拼段落必乱序。【实际案例】我处理过 3000 份扫描版合同
      入库：第一版全部直接 OCR 入库，印章遮挡处的关键字段错字率 15%，而这类字段恰是
      用户最常问的；改成 PaddleOCR + 置信度 0.85 分流后，22% 的块进人工校对（两名
      兼职一周消化完），关键字段错误率降到 2% 以内。【举一反三】这就是前端"表单
      校验 + 服务端二次校验 + 人工审核后台"的三层分流：机器能确定的自动化，不确定的
      诚实交给人，假装全自动才是事故源头。【扣分点对照】只答"用 OCR 识别一下"的是
      玩具理解；能讲出置信度分层策略、关键字段错误率的业务后果、OCR 来源标记对
      下游检索影响的，才真处理过扫描件。
    followups:
      - 人工校对队列优先级怎么排？全量校对不现实时先校对什么？
      - 扫描件里的表格怎么抽？直接按 OCR 文本流拼表格会有什么问题？
  - q: 多模态大模型能直接"看"PDF 截图，传统解析管道会被取代吗？
    answerSkeleton: >-
      【分层原理】两条路线的本质区别是"程序化重建"与"模型理解"。传统管道
      （Unstructured/pdfplumber）按坐标规则重建结构：确定性强、每页成本可忽略、
      可解释，但对复杂版面（双栏嵌表格、图文混排）规则覆盖不全；多模态路线把每页
      截图喂给视觉模型（GPT-4o/Qwen-VL 这类通用模型，或 Docling/Marker 这类专用
      版面模型），让模型直接读懂版面语义，复杂版式鲁棒性显著更好，但每页一次视觉
      模型调用，成本与延迟比传统管道高一到两个量级，且输出是生成式的——可能编造
      不存在的字符。2025-2026 年的生产共识是混合架构：规整文档走传统管道，传统
      管道置信度低的页路由到多模态兜底。【实际案例】我在研报解析项目实测过：纯
      传统管道在标准双栏论文上字符准确率 97%、成本可忽略，但嵌套表格页跌到 71%；
      给"表格面积占比高的页"加多模态兜底后整体到 94%，而成本只涨 30%——因为只有
      15% 的页走了视觉模型。全量多模态方案的账单我们算过：2000 篇研报每月解析费
      是混合方案的 8 倍，不值。【举一反三】这和前端"全量 SSR vs 按路由分级渲染"
      同构：贵的方案只用在便宜方案兜不住的路径上，按页面类型分流而不是一刀切。
      【扣分点对照】张口"多模态直接取代传统解析"的是追热点；能讲出两条路线的
      成本量级差、按页类型路由的混合架构、生成式解析的编造风险与交叉校验手段的，
      才真算过这笔账。
    followups:
      - 怎么判断一页该走传统管道还是多模态？路由信号有哪些？
      - 多模态解析输出是生成式的，怎么防编造字符？（提示：与 OCR 结果交叉校验）
