id: eng.llm-eval-system
title: LLM Eval 体系（离线 + 在线）
summary: 没有评测的 LLM 应用是玄学。离线 eval（标注集 + LLM-as-judge）防回归，在线 eval（用户反馈 + 抽样）监控真实质量。
tracks: [frontend-to-ai-engineer]
phase: 4
prerequisites: [rag.evaluation, agent.hitl-safety]
estimatedMinutes: 120
difficulty: 3
frontendBridge: >-
  LLM eval ≈ 你做前端的测试金字塔：离线 eval 像 CI（标注集 + 断言，防回归），在线 eval 像线上监控
  （用户反馈 + 抽样，看真实质量）。区别是 LLM 输出是概率性的，"断言"常变成"LLM-as-judge 打分"，
  快但不绝对可靠，必须人工抽检校准。
concepts:
  - 离线 eval：固定标注集（50-500 条），跑指标（准确率/格式正确率/faithfulness），防回归
  - 在线 eval：用户 thumbs up/down + 抽样人工评分，监控真实分布漂移
  - LLM-as-judge：用强模型给弱模型输出打分，快但有偏见（偏爱长答案/自信语气），需人工校准
  - 黄金集：少量人工精标的高质量评测集，每次改动必跑，是"回归测试"的 LLM 版
  - eval 即文档：测试名描述规则，指标定义产品质量标准
sourceIds: [hamel-husain-evals, langfuse-docs]
gotchas:
  - LLM-as-judge 有系统性偏见——偏爱长答案与自信语气，必须人工抽检 10% 校准
  - 离线指标与线上效果未必一致——离线涨点线上掉点是常见现象，两者都要看
  - eval 集会被"见过"——用 eval 集调 prompt 等于作弊，必须留 holdout
interview:
  - q: 怎么给一个 LLM 应用搭 eval 体系？离线和在线各做什么？
    answerSkeleton: >-
      【分层原理】eval 体系分离线、在线两层，中间用 bad case 驱动闭环。离线层防回归：构建 50-500
      条标注评测集（覆盖典型问法+边界 case+对抗样本），每次 prompt/模型/检索策略改动全量跑，指标
      按任务定——RAG 看 faithfulness（答案是否忠于检索内容）与 answer relevancy，Agent 看任务
      完成率与工具调用正确率。其中 10-50 条人工精标的黄金集是回归基线，且离线指标要接进 CI 当
      门禁：faithfulness 低于阈值（比如较基线掉 2 个点或绝对值跌破 0.9）直接 block 发版。在线层
      看真实分布：用户 thumbs up/down+抽样人工评分，重点盯分布漂移——用户问题分布变了离线集测
      不出来。打分主力是 LLM-as-judge，便宜快速但有系统偏见，必须人工抽检校准。闭环靠 bad case：
      线上差评与离线失败 case 进统一池，每周归因（检索错/生成错/意图理解错），修复后把 case 补进
      评测集——评测集因此越滚越厚，回归防护越来越强。【实际案例】我在企业知识库项目把这套跑通
      过。初版没有门禁，一次 prompt"优化"让 faithfulness 从 0.91 掉到 0.83，上线三天客服投诉才
      发现。之后定了流程：120 条评测集+20 条黄金集，CI 里 faithfulness<0.90 或黄金集任何一条退化
      即 block；线上差评 24 小时内进 bad case 池，双周归因会定修复优先级。印象最深的一次：一批
      "对比类问题"差评集中爆发，归因发现是检索只召回了单方文档，补了多文档召回策略+把 12 条对比
      case 入集，该类差评率从 18% 降到 4%。【举一反三】前端测试金字塔直觉直接迁移：黄金集≈单测
      （快、必跑）、全量评测集≈集成测试（改动触发）、线上监控≈真实用户遥测。bad case 入集就是
      你的"bug 必须带回归测试"纪律。【扣分点对照】说"用 LLM 评委打个分看平均分"的是玩具级；能
      讲出门禁阈值怎么定、bad case 归因闭环、评测集滚动生长的，才是把 eval 当工程体系做过。
    followups:
      - LLM-as-judge 的偏见怎么量化与校正？
      - 离线涨点但线上掉点，怎么排查？
  - q: LLM-as-judge 有哪些系统性偏差？怎么校准？评测集怎么防污染？
    answerSkeleton: >-
      【分层原理】LLM 评委的偏差有四种已被反复验证。位置偏差：对比两个答案时偏爱先出现（或后出现，
      因模型而异）的那个。冗长偏差：偏爱更长、结构更满的答案，哪怕信息密度更低。自信语气偏差：
      措辞肯定的答案得分高于措辞谨慎但正确的。自我偏爱：用某模型做评委时倾向给同家族模型的输出
      更高分。校准方法三条：一是与人工标注对齐——抽 10-15% 样本人工精评，算评委与人类的一致率，
      低于可接受线（实践中常以一致率 80%+ 为门槛）就调评委 prompt 或换评委模型；二是偏置对消——
      对比评测时交换答案顺序各评一次取平均，抵消位置偏差；三是评分标准锚定——评委 prompt 里给
      分级 rubric 和每档示例，不让它自由心证。评测集防污染两条纪律：公共 benchmark 数据可能已进
      训练语料，自建集优先；内部评测集不能用来迭代调 prompt——调优用 dev 集、最终判定用 holdout
      集，否则分数虚高。【实际案例】我在知识库项目校准过一次评委：初版评委打 faithfulness 和人工
      抽检的一致率只有 71%，分析发现它把"答案里加了检索内容没有的合理常识"一律判不忠实，过严。
      在评委 prompt 里补了"允许无害常识补全、仅惩罚与检索内容矛盾或关键事实无出处"的 rubric 和
      6 个分级示例后，一致率升到 88%。防污染方面我们吃过大亏：早期拿 120 条评测集反复调 prompt，
      分数从 0.84 涨到 0.95 很开心，换一批新 case 一测只有 0.79——典型的过拟合评测集。之后严格
      分 dev/holdout，holdout 只在版本发布前跑。【举一反三】这和前端"性能测试环境被优化成实验室
      数据"一个性质：指标一旦被当作目标就会失真（Goodhart 定律），评委要校准、评测集要隔离，都是
      对抗指标失真。【扣分点对照】以为"换个大模型当评委就客观了"的是没测过一致率；能说出四种
      偏差、顺序对消、rubric 锚定、dev/holdout 隔离的，才是真把评委当测量仪器校准过。
    followups:
      - 评委模型和被评模型要避开同家族吗？为什么？
      - 评测集规模多大算够？新增 case 的优先级怎么排？
