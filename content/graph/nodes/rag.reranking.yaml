id: rag.reranking
title: 重排序（Reranking）
summary: 检索召回 top-20 后用更贵的模型重排出最相关的 top-5。两阶段检索是生产 RAG 的精度杠杆。
tracks: [frontend-to-ai-engineer]
phase: 2
prerequisites: [rag.retrieval-strategies]
estimatedMinutes: 60
difficulty: 3
frontendBridge: >-
  reranking ≈ 你做列表时的"粗排 + 精排"：先用便宜的方法（向量检索）从一万条里捞 50 条粗排，
  再用贵但准的方法（cross-encoder）从 50 条里精排出 5 条。两阶段是为了在精度与成本间找平衡——
  全用 cross-encoder 太慢，全用向量检索不够准。
concepts:
  - 两阶段检索：召回（retrieve top-k，k=20-100，用 embedding 快）→ 重排（rerank top-n，n=3-5，用 cross-encoder 准）
  - cross-encoder vs bi-encoder：bi-encoder 分别编码 query 和 doc 再算相似度（快但松）；cross-encoder 拼接 query+doc 一起编码（准但慢，无法预计算）
  - 主流 reranker：Cohere Rerank（API）、bge-reranker-large（开源）、Jina Reranker
  - 重排后通常只取 top-3 到 top-5 喂给 LLM——上下文不是越多越好，噪声会稀释注意力
sourceIds: [cohere-rerank-docs, bge-rerank-docs]
gotchas:
  - reranker 模型与 embedding 模型是两回事——不能混用，reranker 是 cross-encoder 不产出向量
  - 重排全部召回会拖慢响应——通常只重排 top-20，更多收益递减
  - 中文 reranker 质量参差，bge-reranker 在中文上表现较好但需实测
interview:
  - q: 为什么 RAG 要用两阶段检索（召回+重排）而不是一步到位？
    answerSkeleton: >-
      【分层原理】一步到位的矛盾在于"准的慢、快的不准"。要最准就得用 cross-encoder
      （把 query 和 doc 拼在一起过模型），但它无法预计算——每次查询都要对全库文档
      逐一打分，10 万文档就是 10 万次模型调用，延迟与成本直接爆炸。bi-encoder
      （embedding 模型）可以离线把文档编码成向量存库，查询时只编码 query 一次、
      O(log n) 完成近邻搜索，但"分别编码再比相似度"丢掉了 query 与 doc 的细粒度
      交互信息，精度有天花板。两阶段检索是工程上的折中：召回阶段用 bi-encoder 从
      全库快速捞 top-50，重排阶段用 cross-encoder 只对这 50 条精排取 top-5——精度
      接近全库 cross-encoder，成本只多 50 次调用。【实际案例】我在企业知识库上过
      这个漏斗：召回 top-50 → bge-reranker 精排 → 取 top-5 喂 LLM，端到端答案
      准确率（人工评测）从 71% 提到 86%，p95 延迟增加 240ms。重排条数也实测过：
      重排 top-50 比 top-20 只多 1 个点精度、延迟却翻倍，最终定在 top-20 重排。
      【举一反三】这和前端列表的"粗排 + 精排"、广告系统的"召回 + 排序"完全同构：
      漏斗每一级用算力换精度，级间宽度按预算分配。【扣分点对照】只答"向量快但不准、
      rerank 准但慢"的是概念复述；能讲出漏斗各级的具体宽度（50→20→5）、延迟预算
      怎么分、精度收益量化的，才真上过两阶段。
    followups:
      - 重排阶段的 top-k 宽度怎么定？放宽到 top-100 值不值？
      - 如果召回阶段漏了正确文档，重排能救回来吗？（提示：漏斗的级联损失）
  - q: cross-encoder 为什么比 bi-encoder 准？rerank 的延迟预算怎么控？
    answerSkeleton: >-
      【分层原理】机制差异在"交互时机"：bi-encoder 把 query 和 doc 各自压成一个
      向量再算相似度，两者在编码阶段零交互，细粒度对应关系（query 的哪个词对应
      doc 的哪个词）被压缩进单向量时丢掉了；cross-encoder 把 query 和 doc 拼接成
      一个输入一起过 Transformer，self-attention 让每个 token 都能 attend 到对方
      的所有 token，词级交互完整保留——这就是它准的原因，也是它慢的根因（无法
      预计算、每次查询逐对打分）。延迟控制有套路：只重排召回的 top-20~50 而非全库、
      一次批处理把候选拼成 batch 过模型、按预算选 reranker 尺寸（base vs large）。
      【实际案例】我给 rerank 定延迟预算的做法是反推：整体 p95 目标 2s，生成占
      1.2s、检索 0.2s，留给 rerank 的配额是 300ms。最初用托管 rerank API，网络
      抖动时 p95 偶发 800ms 超时；换自托管的 bge-reranker base 尺寸 + GPU 批处理
      后，20 条候选重排压到 150ms，精度只比 large 掉 1 个点——用 1 个点精度换
      稳定性，值。【举一反三】这和前端"交互反馈 100ms 预算"同理：先定端到端总
      预算，再反推每个环节的配额，超配额的环节要么降级要么换方案。【扣分点对照】
      只说"cross-encoder 更准"的是背结论；能讲出注意力交互的机制差异、延迟预算
      反推法、reranker 尺寸与托管/自托管取舍的，才真在生产上跑过 rerank。
    followups:
      - rerank 可以和 LLM 生成并行做吗？流水线怎么编排？
      - 没有 GPU 时 rerank 还能上吗？（提示：API、蒸馏小模型、CPU 延迟账）
  - q: 什么场景可以不上 rerank？怎么判断值不值？
    answerSkeleton: >-
      【分层原理】rerank 是精度杠杆不是必需品，三种情况可以缓：一是语料小而干净
      （几百篇内），向量检索 top-k 直接够准；二是查询与文档同分布（如内部工具文档、
      术语统一），embedding 排序已经接近 rerank 效果；三是延迟极度敏感的场景（实时
      语音问答），几百毫秒的重排延迟付不起。判断方法很朴素：先量基线再量增益——
      在自家评测集上对比 rerank 前后的 top-5 命中率，差值小于业务可感知阈值（比如
      3 个点）就不上，别为简历上的"架构完整度"加组件。【实际案例】我做过反例决策：
      一个内部工具文档问答，300 篇文档、术语高度统一，加 rerank 后评测集 top-5
      命中率只从 89% 到 91%，用户无感，但 p95 多了 200ms、还多一个模型服务要
      运维——决定不上，把工程量投到切分优化上收益更大。反面对照是客服知识库：
      5 万篇文档、用户口语化查询，rerank 带来 15 个点的提升，必上。【举一反三】
      "先证明基线不够再引入复杂组件"的决策框架贯穿 RAG 全栈：语义切分、混合检索、
      HyDE、rerank 都一样；前端不滥用 memo、不预设上虚拟列表，是同一个纪律。
      【扣分点对照】把 rerank 当 RAG 标配必答题的是背八股；能讲出"量化增益低于
      阈值就不上"的判断方法、并给出一个主动放弃 rerank 的反例场景的，才真做过
      工程取舍。
    followups:
      - 怎么设计实验量化"rerank 的增益"？
      - 不上 rerank 时，还有哪些便宜的手段能补排序质量？
  - q: reranker 模型怎么选型？Cohere API、bge 开源自托管、直接拿 LLM 排序各有什么坑？
    answerSkeleton: >-
      【分层原理】三条路线的差别在交互深度与工程形态。Cohere Rerank 这类托管 API：
      零运维、多语言均衡，但数据要出域、按调用量计费、网络抖动会直接打进 p95。
      bge-reranker 这类开源 cross-encoder 自托管：数据不出域、可批处理压延迟，但
      要自备 GPU 与模型服务能力，且中文上不同尺寸差异大、必须实测。直接拿 LLM 做
      listwise 排序（把 top-20 拼进一个 prompt 让 LLM 排）：交互最深、能利用 LLM
      的领域知识，但延迟秒级、成本高一个量级，还有明显位置偏置（排 prompt 前部的
      候选占优），只适合离线精排或小批量高价值场景。选型先看硬约束（出域合规、
      延迟预算），再看语料语言，最后算量级账——日均百万次重排的 API 账单往往超过
      自建 GPU 服务的月成本。【实际案例】我在中文客服场景三条路都试过：Cohere API
      首月撞了两个问题——客户数据出域被合规拦、晚高峰 p95 偶发 900ms；换
      bge-reranker-large 自托管后 20 条候选重排稳定在 120ms，中文 query 的 top-5
      命中率还比 Cohere 高 2 个点；LLM 排序只保留在离线评测标注环节当"银牌评委"，
      不进在线链路。【举一反三】这和前端"托管 SDK vs 自研组件"的权衡一致：先用
      托管验证价值，规模与合规压力上来后自研接管；最贵的方案用在离线生产数据而
      不是在线服务。【扣分点对照】只按"哪个榜单分数高"选 reranker 的是榜单思维；
      能讲出出域合规、延迟抖动、量级成本账、LLM 排序的位置偏置与适用边界的，才
      真选过型。
    followups:
      - bge-reranker 的 base 和 large 怎么选？精度与延迟的账怎么算？
      - LLM 排序的位置偏置怎么缓解？（提示：打乱顺序多次投票、分块滑窗）
