id: rag.retrieval-strategies
title: 检索策略（dense / sparse / hybrid）
summary: 纯向量检索会漏掉精确匹配（人名/型号/代码标识符）。混合检索 + 查询改写是生产 RAG 的标配。
tracks: [frontend-to-ai-engineer]
phase: 2
prerequisites: [rag.vector-stores, rag.chunking-strategies]
estimatedMinutes: 120
difficulty: 3
frontendBridge: >-
  混合检索 ≈ 你做过的"全文搜索 + 标签筛选"组合：向量检索像语义模糊匹配，关键词检索（BM25）像
  SQL WHERE 精确匹配。两者互补——向量找"意思相近"，关键词找"字面相同"。查询改写 ≈ 用户输入
  后先"润色"再查，类似你做搜索框时把简短查询扩展成多关键词。
concepts:
  - 稠密检索（dense）：embedding 相似度，擅长语义但漏精确匹配
  - 稀疏检索（sparse/BM25）：关键词倒排索引，擅长精确匹配但不懂同义
  - 混合检索（hybrid）：并行跑 dense + sparse，用 RRF（Reciprocal Rank Fusion）合并排名
  - 查询改写：HyDE（先让 LLM 编答案再 embedding）/ 多查询生成（LLM 把一个查询拆成多个子查询）/ 回溯翻译
  - top-k 选择：k 太小漏召回，k 太大塞噪声——通常 5-20，按评测调
sourceIds: [langchain-rag, eugene-yan-rag]
gotchas:
  - 纯 dense 检索在专有名词（产品名/人名/错误码）上召回惨淡——必须配 BM25
  - RRF 合并的权重不是经验值，要用评测集调——不同语料最优权重不同
  - 查询改写增加一次 LLM 调用，延迟与成本翻倍——短查询场景才划算
interview:
  - q: 纯向量检索有什么盲区？生产上怎么补？
    answerSkeleton: >-
      【分层原理】纯向量（dense）检索的盲区是"字面精确匹配"：embedding 按语义编码，
      会把字面不同但语义相近的内容拉近，也会把字面差一个字符的专名拉得不够远——
      "GPT-4"和"GPT-3.5"在向量空间里是近邻，用户查"GPT-4 的上下文窗口"时完全可能
      召回 GPT-3.5 的文档，语义近但答非所问。重灾区是专有名词：产品型号、人名、
      错误码、代码标识符、数字参数，embedding 模型对它们的区分度天然差。补法是混合
      检索：并行跑 dense（语义召回）+ sparse（BM25 关键词倒排，字面精确命中），用
      RRF 合并排名，两路互补。【实际案例】我在技术支持知识库实测过：用户查
      "ERR_10043 怎么解决"这类含错误码的 query，纯向量召回率只有 54%——bad case
      里全是召回了相邻错误码的文档；加上 BM25 混合检索后，含错误码 query 的召回率
      升到 92%，整体 recall@5 从 71% 提到 86%。【举一反三】这和前端做"全文搜索 +
      筛选"组合同构：模糊匹配负责找意思相近的，精确条件负责锁定字面一致的，单用
      任何一个都有盲区。【扣分点对照】只答"向量不懂精确匹配"的是概念层面；能讲出
      具体失败形态（错误码/型号张冠李戴）、混合前后的量化提升、以及 BM25 补的是
      哪类 query 的，才真在生产上调过检索。
    followups:
      - BM25 的原理是什么？它为什么擅长向量不擅长的那类 query？
      - 所有场景都需要混合检索吗？什么场景纯向量就够？
  - q: 混合检索怎么合并两路结果？RRF 的原理是什么，权重怎么调？
    answerSkeleton: >-
      【分层原理】合并的难点在于两路分数量纲不可比：向量相似度在 0-1 之间，BM25
      分数可以到几十，直接加权求和会被量纲大的一方主导，各种归一化又都很脆弱。
      RRF（Reciprocal Rank Fusion）的解法是只用排名不用分数：每条文档的融合分 =
      Σ 1/(k + rank_i)，k 是平滑常数（常用 60），某一路排第一贡献 1/61，排第十贡献
      1/70——排名融合对分数分布天然鲁棒。调权不是拍脑袋：按 query 类型分桶看 bad
      case，数字/专名密集的 query 调高 BM25 路权重，自然语言描述类调高 dense 路
      权重，用评测集网格搜索定数值。【实际案例】我在企业知识库实测调参：默认等权
      时"2024 年 Q3 营收多少"这类数字问题 recall 只有 68%，bad case 显示 BM25 路
      明明命中了正确文档、排名却被 dense 路的高分噪声稀释；把这类 query 的 sparse
      权重从 1.0 调到 2.0（50 条评测集上网格搜索选的）后，数字类 recall 到 89%，
      且自然语言类指标不掉。后来进一步做了个轻量 query 分类器自动选权重。【举一反三】
      这和前端 A/B 实验调参同理：先分桶定位差在哪类流量，再按桶调参，全局一刀切
      的"最优权重"不存在。【扣分点对照】能背 RRF 公式的是纸面理解；能讲出"为什么
      用排名而非分数融合（量纲不可比）"、按 query 类型分桶调权的方法论的，才真把
      混合检索调优过。
    followups:
      - RRF 里的平滑常数 k 调大调小各有什么效果？
      - 除了 RRF 还有什么融合方法？（提示：学习排序 LTR、线性加权+归一化）
  - q: 查询改写（HyDE、多查询生成）为什么有效？什么时候值得上，代价是什么？
    answerSkeleton: >-
      【分层原理】两类主流改写：HyDE 让 LLM 先编一个假想答案、用答案去检索——原理
      是答案和文档在同一个"文本分布"里，比用户的三五个字短查询更像文档，embedding
      匹配更准；多查询生成是把一个查询拆成多个措辞变体并行检索再合并，缓解"同一
      意思换个说法就召不回"的措辞敏感。代价是实打实的：多一次 LLM 调用，p95 延迟
      增加 200-500ms、token 成本翻倍，且改写可能带偏——HyDE 编出的假想答案如果
      有幻觉，会把检索引向错误方向。【实际案例】我在企业 Wiki 问答场景上过多查询
      改写：用户查询平均只有 6 个字（如"报销流程"），信息密度极低，直接检索 recall
      只有 62%；1 拆 3 并行检索合并后 recall 到 78%，p95 延迟从 1.2s 升到 1.7s，
      业务可接受。但同一个团队在实时客服场景试 HyDE 时放弃了：延迟破 2s 踩到体验
      红线，且偶发假想答案带偏检索。结论是短查询、非实时场景值得，长查询、实时
      场景不划算。【举一反三】这和前端"预取/预渲染"的决策框架一致：用额外计算换
      命中率，先量基线收益再决定付不付延迟，而不是听说先进就上。【扣分点对照】把
      HyDE 当银弹罗列名词的是背概念；能讲出"答案与文档同分布"的原理、延迟与成本
      的量化账、按查询长度和实时性取舍的，才真上过查询改写。
    followups:
      - 怎么检测"改写把检索带偏了"？有什么兜底？
      - 多查询生成的变体数量怎么定？合并去重怎么做？
