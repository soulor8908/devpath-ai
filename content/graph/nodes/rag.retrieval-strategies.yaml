id: rag.retrieval-strategies
title: 检索策略（dense / sparse / hybrid）
summary: 纯向量检索会漏掉精确匹配（人名/型号/代码标识符）。混合检索 + 查询改写是生产 RAG 的标配。
tracks: [frontend-to-ai-engineer]
phase: 2
prerequisites: [rag.vector-stores, rag.chunking-strategies]
estimatedMinutes: 120
difficulty: 3
frontendBridge: >-
  混合检索 ≈ 你做过的"全文搜索 + 标签筛选"组合：向量检索像语义模糊匹配，关键词检索（BM25）像
  SQL WHERE 精确匹配。两者互补——向量找"意思相近"，关键词找"字面相同"。查询改写 ≈ 用户输入
  后先"润色"再查，类似你做搜索框时把简短查询扩展成多关键词。
concepts:
  - 稠密检索（dense）：embedding 相似度，擅长语义但漏精确匹配
  - 稀疏检索（sparse/BM25）：关键词倒排索引，擅长精确匹配但不懂同义
  - 混合检索（hybrid）：并行跑 dense + sparse，用 RRF（Reciprocal Rank Fusion）合并排名
  - 查询改写：HyDE（先让 LLM 编答案再 embedding）/ 多查询生成（LLM 把一个查询拆成多个子查询）/ 回溯翻译
  - top-k 选择：k 太小漏召回，k 太大塞噪声——通常 5-20，按评测调
sourceIds: [langchain-rag, eugene-yan-rag]
gotchas:
  - 纯 dense 检索在专有名词（产品名/人名/错误码）上召回惨淡——必须配 BM25
  - RRF 合并的权重不是经验值，要用评测集调——不同语料最优权重不同
  - 查询改写增加一次 LLM 调用，延迟与成本翻倍——短查询场景才划算
interview:
  - q: 纯向量检索有什么盲区？怎么补？
    answerSkeleton: >-
      纯向量（dense）检索的盲区是精确匹配：embedding 把"GPT-4"和"GPT-3.5"编码成相近向量
      （都是 OpenAI 模型），用户查"GPT-4 的上下文窗口"时可能召回 GPT-3.5 的文档——语义近但答非所问。
      专有名词（产品名/人名/错误码/代码标识符）尤其严重，embedding 模型对它们编码不准。补法是混合
      检索：并行跑 dense（向量相似度）+ sparse（BM25 关键词倒排），用 RRF（Reciprocal Rank Fusion）
      合并排名——dense 贡献语义召回，sparse 贡献精确命中。进一步可用查询改写：HyDE（先让 LLM 编
      假想答案再 embedding，因答案比查询信息密度高）、多查询生成（LLM 把一个查询拆成多个子查询并行
      检索合并）。前端迁移映射：这和你做"全文搜索 + 标签筛选"组合同构。Tradeoff：查询改写增加一次
      LLM 调用，延迟与成本翻倍，只在短查询（信息密度低）场景才划算。
    followups:
      - RRF 合并 dense 和 sparse 排名的原理是什么？
      - HyDE 为什么比直接 embedding 查询效果好？
masteryCheck:
  level: V2
  type: code-challenge
  description: 实现混合检索（Chroma dense + BM25 sparse + RRF 合并），用 10 条含专有名词的 query 对比纯 dense 与 hybrid 的召回率
status: reviewed
lastVerified: "2026-07-25"
