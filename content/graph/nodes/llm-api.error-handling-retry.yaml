id: llm-api.error-handling-retry
title: 错误处理与重试策略
summary: LLM API 的失败模式（限流/超时/内容过滤/模型过载）与对应的工程策略：指数退避、熔断、降级模型。
tracks: [frontend-to-ai-engineer]
phase: 1
prerequisites: [llm.api-first-call]
estimatedMinutes: 60
difficulty: 2
frontendBridge: >-
  和你处理过无数次的上游 API 故障完全同构：429 像 CDN 限流，
  500 像服务端抖动，content_filter 像 WAF 拦截。
  指数退避 + 抖动 + 熔断器，这些模式你闭着眼睛都会写——
  只是这次要额外处理"模型不确定输出"这种新失败类型。
concepts:
  - 失败分类：可重试（429/5xx/超时）vs 不可重试（认证错误/内容过滤/参数错误）
  - 指数退避 + 随机抖动：避免惊群效应
  - 熔断器：连续失败时快速失败，保护下游
  - 降级链：主模型失败 → 备用模型 → 缓存回复 → 人工兜底
sourceIds: [openai-docs, deepseek-api-docs, eugene-yan-llm-patterns]
gotchas:
  - 对所有错误统一重试是灾难：内容过滤错误重试 100 次也过不了
  - 退避不加抖动会导致所有客户端同时重试（thundering herd）
  - 流式响应中途失败的处理最棘手：已输出的部分如何回滚或标注？
interview:
  - q: 你的 LLM 调用收到 429，重试策略怎么设计？
    answerSkeleton: >-
      收到 429 的重试策略要分层设计：首先识别 Retry-After 头，有则按其指定时间等待，无则用指数退避
      （base × 2^n）+ 随机抖动（避免惊群效应）；其次设最大重试次数（3-5 次）防止雪崩；第三是熔断保护
      ——连续失败到阈值时快速失败，保护下游与配额；第四是降级链——主模型持续失败则切备用模型或缓存回复；
      第五是监控告警——429 频率突增往往是产品侧配额预警。关键区分：429 有两种语义，配额耗尽
      （重试无用，需充值或切模型）与速率超限（重试有用，需降并发）。前端迁移映射：这套模式和你处理
      CDN/上游 API 限流完全同构，新增的只是"模型不确定输出"这类新失败类型。绝不重试的错误：认证失败、
      参数错误、内容过滤——重试 100 次也过不了。
    followups:
      - 流式响应中途断开，已渲染的 50 个字怎么处理？
      - 什么错误绝不重试？
masteryCheck:
  level: V2
  type: code-challenge
  description: 实现一个健壮的 LLM 调用封装：分类错误、指数退避、熔断、降级到备用模型，附故障注入测试
