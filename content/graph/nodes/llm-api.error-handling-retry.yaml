id: llm-api.error-handling-retry
title: 错误处理与重试策略
summary: LLM API 的失败模式（限流/超时/内容过滤/模型过载）与对应的工程策略：指数退避、熔断、降级模型。
tracks: [frontend-to-ai-engineer]
phase: 1
prerequisites: [llm.api-first-call]
estimatedMinutes: 60
difficulty: 2
frontendBridge: >-
  和你处理过无数次的上游 API 故障完全同构：429 像 CDN 限流，
  500 像服务端抖动，content_filter 像 WAF 拦截。
  指数退避 + 抖动 + 熔断器，这些模式你闭着眼睛都会写——
  只是这次要额外处理"模型不确定输出"这种新失败类型。
concepts:
  - 失败分类：可重试（429/5xx/超时）vs 不可重试（认证错误/内容过滤/参数错误）
  - 指数退避 + 随机抖动：避免惊群效应
  - 熔断器：连续失败时快速失败，保护下游
  - 降级链：主模型失败 → 备用模型 → 缓存回复 → 人工兜底
sourceIds: [openai-docs, deepseek-api-docs, eugene-yan-llm-patterns]
gotchas:
  - 对所有错误统一重试是灾难：内容过滤错误重试 100 次也过不了
  - 退避不加抖动会导致所有客户端同时重试（thundering herd）
  - 流式响应中途失败的处理最棘手：已输出的部分如何回滚或标注？
interview:
  - q: 你的 LLM 调用收到 429，重试策略怎么设计？
    answerSkeleton: >-
      【分层原理】第一步是分清 429 的两种语义：insufficient_quota 是账户额度耗尽，重试一万次也
      没用，必须告警 + 充值或切备用 key/模型；rate_limit_exceeded 是瞬时速率超限，重试有用但要讲
      方法。看错类型会把钱和时间烧在无效重试上。对 rate_limit 的重试：先尊重 Retry-After 响应头
      （有就按它等）；没有就用指数退避 + full jitter——sleep = random(0, min(cap, base × 2^n))，
      AWS 架构博客实测 full jitter 表现最稳，jitter 的意义是把所有客户端的重试时间点打散，避免
      惊群同步冲击。配三个保险丝：最大重试次数（3-5 次防雪崩）、熔断器（连续失败到阈值直接快速
      失败，保护配额与下游）、降级链（主模型持续失败→备用模型→缓存答案→人工兜底）。【实际案例】
      我在批量文档处理任务里真被惊群打过：200 个并发 worker 收到 429 后都按固定 1s/2s/4s 退避，
      结果第 4 秒全体同时重试再次触发限流，死循环一小时只处理完 8% 的任务。改 full jitter
      （base=500ms，cap=32s）后恢复时间从 1 小时缩到 4 分钟。另一次教训是监控没区分两类 429：
      配额耗尽时重试机制空转 40 分钟才有人发现，白烧了重试调用的费用——后来 insufficient_quota
      直接路由到值班告警，不再进重试队列。【举一反三】这套模式和你处理 CDN/上游 API 限流完全
      同构，退避 + jitter + 熔断是分布式老三样；LLM 场景的新东西只有两点：429 的双语义，以及
      单次调用贵——无效重试的代价从"浪费时间"变成"浪费真金白银"。【扣分点对照】背八股的答案是
      "指数退避加抖动"；真做过的能区分两类 429、写出 full jitter 公式、讲出惊群事故的恢复时间
      对比、以及"配额耗尽时空转重试"这种监控盲区。
    followups:
      - full jitter 和等概率 jitter（equal jitter）有什么区别？为什么 full jitter 更常用？
      - 熔断器的状态机怎么设计？半开状态怎么试探恢复？
      - 哪些错误绝不重试？为什么？（提示：认证、参数错误、内容过滤）
  - q: 流式响应中途断线怎么处理？已经渲染出来的部分内容怎么办？
    answerSkeleton: >-
      【分层原理】流式断线比普通请求失败棘手，因为失败发生时输出已部分交付——用户已经看着它
      打了 200 个字。拆三个决策。已生成内容怎么办：默认保留并明确标注"生成中断"，而不是悄悄丢弃
      （用户可能正在读，内容消失体验更糟）或假装没发生（用户会把残缺答案当完整答案）。能否续传：
      取决于服务端是否支持断点续传；没有续传协议时，客户端带着已有部分作为上下文请求"从这里
      继续"，但模型续写会有接缝（重复或跳变），prompt 里要给足前文。重试策略的差异：流式重试
      不能照搬非流式逻辑——已输出的 token 重试要再花一次钱，所以断线重试次数上限要更保守，且
      优先"续写"而非"从头再来"。还要区分断线和内容过滤截断：后者有 finish_reason 信号，不该
      重试，该降级提示。【实际案例】我在 AI 写作助手项目统计过：移动网络下约 1.7% 的流式会话
      中途断线。第一版处理是弹错误 toast 并把已生成的 300 字清空，用户投诉"写了一半的内容没了"
      ——这等于把服务端的失败转嫁给用户。改成三态 UI：已生成内容保留 + 尾部"连接中断"标记 +
      "继续生成"（带前文续写）和"重新生成"（从头来）两个按钮。续写成功率约 85%，失败的 15% 多是
      前文太长触顶上下文，走截断前文 + 摘要的降级路径。【举一反三】这就是你做的弱网表单提交：
      乐观 UI 已展示的内容不能丢（保留已生成），失败要幂等重试（续写 ≈ 断点续传），错误要可恢复
      而非死路一条。【扣分点对照】答"catch 错误然后重试"的是把流式当普通请求；能讲出已渲染内容
      的去留与标注、续写接缝、重试成本是双份 token 钱这三个流式特有问题的，才是真处理过线上断线
      的人。
    followups:
      - 断线检测本身怎么做？长时间没有新 chunk 是模型在思考还是断线了，怎么区分？
      - '"继续生成"和"重新生成"哪个该做默认按钮？取舍依据是什么？'
  - q: 哪些错误该重试、哪些绝不重试？你的错误分类框架是什么？
    answerSkeleton: >-
      【分层原理】分类的判据只有一条：重试能否改变结果——同一请求原样再发，结果可能不同才可重试，
      结果必然相同就是白烧钱。可重试三类：429 限流（瞬时速率，等一等就过）、5xx 与模型过载（服务端
      抖动）、网络超时与连接重置。绝不重试三类：401/403 认证错误（key 错了重试一万次也错，还会触发
      风控锁号）、400 参数错误（请求本身非法，重试的是同一个非法请求）、内容过滤（输入或输出触发
      安全策略，原样重试必然再触发，该走改写或人工）。灰色地带两个：超时分不清请求没到达还是响应在
      路上，生成类调用直接重试可能产生双份扣费与重复副作用，要靠幂等 key 或保守重试兜住；500 里
      混着少量提示词触发的确定性崩溃，重试多少次都崩，靠重试上限加降级接住。落地动作必须在客户端
      做：catch 后先读 status code 和 error.type 路由到不同策略，而不是一把梭统一重试。【实际案例】
      我在批量摘要项目复盘过一次账单事故：封装层对所有异常统一重试 3 次，上游把某类长文档请求
      稳定打成 500（确定性 bug 而非抖动），3000 个任务每个白烧 3 次调用，那晚费用是平时的 2.6 倍。
      改成错误分类路由后——可重试错误进退避队列、确定性错误进死信队列人工看——重试调用量降了
      70%。另一个坑是 SDK 默认重试：某 SDK 默认对 429 重试 2 次且不带 jitter，高峰期反而加剧限流，
      我关掉默认重试自己实现。【举一反三】这就是封装 fetch 的错误分类：4xx 是调用方的锅、5xx 是
      服务方的锅、网络错误是链路的锅——LLM 只多了内容过滤这个新品类，且单次重试从几分钱变成
      几毛钱后，错加重试的代价被真金白银放大了。【扣分点对照】答失败就重试最多三次的是没分过错的
      人；能按重试能否改变结果分类、讲出超时双份扣费的幂等坑、SDK 默认重试要关这种细节的，才是
      被账单教育过的人。
    followups:
      - 超时重试怎么保证不产生重复副作用？（提示：幂等 key、请求去重、服务端 dedupe）
      - 内容过滤错误不重试，业务上怎么处理？直接报错给用户吗？
      - 超时时间怎么定？TTFT 和总生成时长的超时该分开设吗？
  - q: 主模型挂了怎么保证服务可用？降级链怎么设计？
    answerSkeleton: >-
      【分层原理】降级链的本质是用质量换可用性的分级预案，每一级都要预先回答两个问题：触发条件
      是什么、这一级牺牲什么。典型四级：主模型连续失败熔断器打开 → 同档备用模型（牺牲一致性，
      回答风格突变，要提前测双模型的输出分布差异）→ 小模型兜底（牺牲能力，复杂任务答不了，要
      收窄降级时的功能范围）→ 缓存与模板话术（牺牲个性化，FAQ 命中缓存，其余给体面的繁忙提示）。
      三个工程细节：一是切换要自动但留人工开关，熔断恢复走半开状态试探放量，别一恢复就全量切回；
      二是降级期间所有被降级的会话要打标，事后才能统计影响面和补偿；三是降级链本身要演练——不
      演练的降级方案等于没有，定期故障注入验证每一级真的能用，包括备用模型的 key、配额、输出
      契约都是活的。【实际案例】我在客服助手项目建过完整降级链并真用过一次：主模型供应商故障
      40 分钟，熔断器 30 秒内切备用模型，转人工率只从 12% 升到 15%，用户侧几乎无感。但演练时
      踩过坑：第一次切备用模型，其输出 JSON 细节与主模型不一致（两家对 schema 的遵循习惯不同），
      降级后解析全挂——此后把备用模型输出契约纳入每周演练检查项，双模型共用一套校验加修复层。
      另一个教训是兜底缓存 key 最初不含版本戳，知识库更新后降级期还在发旧答案。【举一反三】这
      就是前端的多级兜底：CDN 挂了回源、接口挂了读本地缓存、超时展示骨架屏——降级的每一级都
      对应你熟悉的优雅降级，只是这里的级是模型能力本身。【扣分点对照】答换个模型重试的是把降级
      当成一次调用的事；能讲出熔断半开恢复、降级打标统计影响面、双模型输出契约差异、故障注入
      演练这四件事的，才是真的在故障夜里活下来的。
    followups:
      - 备用模型和主模型的输出分布差异怎么提前评估？
      - 熔断器半开恢复时怎么试探放量？（提示：小比例流量、成功阈值、失败立刻关）
      - 降级期间要告诉用户现在是降级模式吗？取舍是什么？
