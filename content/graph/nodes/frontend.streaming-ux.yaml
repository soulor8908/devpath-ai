id: frontend.streaming-ux
title: AI 流式 UX（前端主场）
summary: 流式渲染、打字机效果、乐观 UI、中断恢复。这是前端工程师在 AI 时代最锋利的矛——纯后端出身的人做不好这个。
tracks: [frontend-to-ai-engineer]
phase: 1
prerequisites: [llm.streaming-basics]
estimatedMinutes: 120
difficulty: 3
frontendBridge: >-
  这就是你的主场。SSE 增量渲染 ≈ 你处理过的 WebSocket 消息流；
  打字机效果 ≈ CSS 动画 + requestAnimationFrame；中断恢复 ≈ 断线重连。
  区别只在数据源是 LLM——内容逐字到达、可能中途失败、需要 Markdown 实时渲染。
  Vercel AI SDK 的 useChat 把这套封装成了 React hook，和你用 SWR 的体感一致。
concepts:
  - 增量渲染：每收到 chunk 追加到消息 buffer，React 状态驱动 UI
  - Markdown 流式渲染：不完整语法（如未闭合的 ```）需要容错渲染
  - 中断恢复：连接断开时保留已生成内容，用户可重试或继续
  - 乐观 UI：发送即显示用户消息，不等服务端确认
  - Vercel AI SDK：useChat / useCompletion 的状态机与生命周期
sourceIds: [vercel-ai-sdk, mdn-sse, openai-streaming]
lab: content/labs/streaming-chat-ui
gotchas:
  - 直接渲染未闭合的 Markdown 会闪烁或错乱——需要流式感知的渲染器
  - useChat 的 messages 是追加式的，编辑历史消息需要手动管理状态
  - 流式过程中的错误（如内容过滤）可能在第 N 个 chunk 才出现——UI 要能优雅降级
interview:
  - q: 实现一个 AI 聊天界面，流式体验的关键技术点有哪些？
    answerSkeleton: >-
      【分层原理】按渲染链路拆五个工程点。增量渲染：每个 chunk 只含 delta，前端拼 buffer 驱动
      React 重渲染——注意渲染节流，token 到达频率可能高于屏幕刷新率，逐 token setState 会卡帧，
      要按帧或按时间片批量 flush。Markdown 容错：流式中途必然出现未闭合语法（半个代码块、半个
      链接），直接渲染会闪烁错乱——要么用流式感知渲染器，要么对未闭合结构临时补全再渲染。滚动
      管理：自动跟滚要有"用户意图判断"——用户上翻阅读历史时新 chunk 到达不能拽回底部，锁定视野；
      回到底部附近才恢复跟随，这是主流 AI 聊天产品都做对的细节。中断与恢复：停止按钮要真的 abort
      掉请求（AbortController），已生成内容保留可续；流式过程中的错误（内容过滤、断线）可能在
      任意 chunk 后出现，UI 要局部降级而不是整条消息报错。乐观 UI：发送即上屏，不等服务端确认。
      【实际案例】我做 AI 聊天产品时最疼的三个坑：一是 Markdown 闪烁——代码块流式输出时高亮
      每秒重排，屏幕像抽筋，最终方案是流式期间降级为纯文本样式、流结束才做完整高亮，闪烁消失；
      二是跟滚拽回——用户投诉"想复制上面的内容，页面一直自己往下跑"，加了"距底部 80px 内才跟滚"
      的阈值后投诉清零；三是低端机逐 token setState 导致输入框卡顿，改 50ms 节流 flush 后帧率从
      28 回到 55+。【举一反三】这全是前端老本行：增量渲染 ≈ 虚拟列表的增量 patch，渲染节流 ≈
      scroll 事件节流，跟滚判断 ≈ 无限滚动的位置计算，AbortController ≈ 你取消过期请求防竞态。
      AI 流式 UX 是传统前端功底的新考场。【扣分点对照】背八股的答案是"用 EventSource 接收然后
      append 到页面上"；真做过的能讲出 Markdown 流式闪烁的具体解法、跟滚阈值逻辑、渲染节流的帧率
      数据——这些只有真在设备上卡过才知道。
    followups:
      - 流式期间 Markdown 高亮怎么做才既好看又不卡？（提示：降级渲染 + 结束后完整渲染）
      - '"停止生成"按钮前后端各做什么？服务端停止后 token 还在计费吗？'
      - 乐观 UI 发送失败怎么兜底？用户消息已经上屏了。
  - q: 生产环境解析 SSE 为什么不用 EventSource？fetch + ReadableStream 怎么正确解析？粘包/半包怎么处理？
    answerSkeleton: >-
      【分层原理】EventSource 的三个硬伤决定它上不了生产：只支持 GET（带不了大 body）、不能自定义
      请求头（Authorization 没法带）、错误处理粗放。所以生产用 fetch + ReadableStream 手解 SSE
      协议。协议本身简单：事件以 \n\n 分隔、行内 data: 前缀、[DONE] 作结束标记——难在流的不
      完整性。网络分包不按协议边界走：一个 chunk 可能含半个事件（半包），也可能含两个半事件
      （粘包），JSON 可能被从中间切断。正确解法是维护一个跨 chunk 的字符串缓冲区：每次收到数据
      append 进 buffer，按 \n\n 切出完整事件处理，剩下的残段留在 buffer 等下次拼接——绝不能假设
      "这次收到的就是完整的一行/一个 JSON"。还要处理：JSON.parse 失败要区分是截断（等下一段）还是
      真错误；多行 data 按协议拼接；连接 idle 超时要有心跳检测。【实际案例】我第一版实现就栽在
      粘包假设上：本地测试一切正常，上线后约 0.5% 的会话报 JSON 解析错误——排查发现移动网络下
      网关把多个 SSE 事件合并传输，一个 chunk 塞了三个事件，我按"一 chunk 一事件"解析直接炸。改成
      buffer + 分隔符切割后错误清零。第二个坑是某些代理会缓冲响应不实时转发，表现为"攒一大段
      一次性到达"，解法是对响应链路禁用缓冲（如 X-Accel-Buffering: no）并逐段验证 CDN 配置。
      【举一反三】这就是 TCP 粘包在应用层的复刻——你处理过 WebSocket 自定义协议或文件分片上传，
      buffer 切割的套路完全一样；代理缓冲问题 ≈ 你排查过的"接口明明流式返回、前端却一次性收到"。
      【扣分点对照】答"用 EventSource onmessage 就行"的是只写过 demo；能讲出 EventSource 的
      GET/header 限制、buffer 跨 chunk 拼接解法、代理缓冲这种链路层坑的，才是真把 SSE 上过生产
      的人。
    followups:
      - 心跳怎么设计？长时间无 chunk 是模型在思考还是断线了，怎么区分？
      - '为什么 X-Accel-Buffering: no 能解决代理缓冲？链路上还有哪些环节可能缓冲？'
