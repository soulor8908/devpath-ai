id: agent.langgraph-orchestration
title: LangGraph 编排（图结构状态机）
summary: 用图结构定义 Agent 的状态流转：节点是 LLM 调用或工具，边是条件路由。LangGraph 是生产 Agent 编排的事实标准，比 ReAct 循环更可控。
tracks: [frontend-to-ai-engineer]
phase: 3
prerequisites: [agent.fundamentals]
estimatedMinutes: 150
difficulty: 4
frontendBridge: >-
  LangGraph ≈ 给 Agent 画"流程图"：节点是动作（LLM 调用/工具执行），边是条件路由（if 工具结果
  是 X 则走 A 边 else 走 B 边）。你画过状态机图——这里是代码化的状态机，每个节点可读可写共享
  state。比 ReAct 的自由循环多了"显式拓扑"，可控性与可调试性大幅提升。
concepts:
  - StateGraph：节点（函数）+ 边（条件路由）+ 共享 State（TypedDict）
  - 节点类型：LLM 节点（调模型）、Tool 节点（执行工具）、Router 节点（纯条件路由不调模型）
  - 条件边：根据 State 字段决定下一个节点（如 tools_required → tool_node else → END）
  - 持久化：checkpointer 把 State 落盘，支持中断恢复与时间旅行（回放历史状态）
  - 人机回路（HITL）：在关键节点暂停，等人工确认后继续——危险操作的标配
sourceIds: [langgraph-docs, langchain-agent-docs]
gotchas:
  - State 是共享可变的——多节点并发写同一字段会冲突，需用 reducer（如 list 合并）显式声明
  - 条件边的判断函数必须是纯函数——不能有副作用，否则 checkpointer 重放会出错
  - 图太复杂会失去可调试性——节点超过 10 个考虑拆子图
interview:
  - q: LangGraph 的 StateGraph 比纯 ReAct 循环强在哪？什么时候该用？
    answerSkeleton: >-
      【分层原理】强在三点。第一，显式拓扑：ReAct 是模型自由决定下一步的黑盒循环，跳转逻辑藏在
      prompt 里；StateGraph 把节点（LLM 调用/工具执行）和条件边写成白盒流程图，每次跳转都有可审计
      的条件，调试时能对图定位。第二，集中式共享 State：所有节点读写同一个带类型定义的状态对象，
      配合 reducer 声明字段合并策略（比如列表字段是追加还是覆盖），不像 ReAct 把状态全塞进 messages
      里越滚越长。第三，工程化能力：checkpointer 把每步 State 落盘，支持中断恢复、时间旅行回放、
      在危险节点暂停等人工确认——ReAct 循环要做这些得侵入式大改。和手写状态机比：手写 while 循环
      在流程固定时最省，但每个新分支都要改代码；LangGraph 把"路由条件可以是 LLM 输出"这件事一等
      公民化，适合路由本身需要智能的场景。【实际案例】我在一个内容生产 Agent（检索资料→起草→
      事实校验→发布）项目里，第一版是手写 while 循环：90 行胶水代码，产品提了个"审核不过要回退到
      起草并保留修改意见"的需求，我得重构整个循环结构。迁到 StateGraph 后，这个需求就是加一条
      条件边：校验节点写 verdict 字段，router 函数读到 fail 就回起草节点并带上批注，两天活变成
      两小时。踩过的坑是并发写冲突：两个并行节点都往 sources 列表写，默认覆盖语义导致一边的结果
      被吃掉，改成 reducer 显式声明追加合并才解决。【举一反三】选型和前端状态管理同构：流程固定
      用中间件链，状态转移复杂且要可回溯用显式状态机，路由本身需要智能判断才上 LangGraph。面试说
      "我们用 LangGraph 因为需要条件回退+HITL+断点恢复"是加分答案，说"因为它火"是扣分答案。
      【扣分点对照】只会背"节点+边+State"三个名词的没写过图；能讲出 reducer 并发冲突、条件回退
      怎么加边、和手写循环的真实成本对比的，才是真编排过。
    followups:
      - StateGraph 的 reducer 是什么？什么时候必须用？
      - 怎么实现"在危险操作前暂停等人工确认"？
  - q: LangGraph 的 checkpointer 具体解决什么问题？人机中断恢复和节点幂等性怎么设计？
    answerSkeleton: >-
      【分层原理】checkpointer 在每个节点执行完把 State 快照落盘（按 thread_id 组织），解决三件事。
      一是中断恢复：进程重启、用户隔天回来，从最近快照续跑而不是从头再来——长任务 Agent（跑半小时
      的研究任务）没有它根本没法上线。二是人机回路：图执行到 interrupt 点挂起，State 已持久化，等
      人工审批结果写回 State 后从断点继续，审批过程可以跨小时跨天。三是时间旅行：从历史任一快照
      fork 重放，改 prompt 后可以精确回放"当时换个决策会怎样"，调试神器。与 checkpointer 配套的
      硬要求是节点幂等：因为恢复时是"从节点边界重放"，节点内部如果"先调 LLM 再写库再发邮件"，
      崩溃在写库之后，重放会重复发邮件——副作用操作必须要么放节点末尾、要么用幂等键（如以
      step_id 做去重键）防重。【实际案例】我在审批流 Agent 里踩过幂等坑：一个节点负责"生成扣款
      说明+调支付接口"，HITL 确认后服务重启触发重放，同一笔扣款被执行了两次，幸好支付接口有
      幂等键没造成资损。之后定了个铁律：节点要么纯计算（无副作用），要么副作用带幂等键，绝不在
      一个节点里混排多个副作用。另外我们把 checkpointer 存 Postgres，thread_id 就是工单号，客服
      后台能直接看到每个工单"执行到哪个节点、当前 State 是什么"，排障效率提升非常明显。
      【举一反三】这和前端 Redux DevTools 的时间旅行、表单"草稿自动保存+恢复"是同构思想——
      持久化状态+可回放，只是这里的"action"是 LLM 调用，天然更贵更慢，重放的成本意识要更强。
      【扣分点对照】把 checkpointer 说成"就是存个会话记录"的是没用过；能讲出节点边界重放语义、
      幂等键防重复副作用、thread_id 与业务 ID 对齐这些细节的，才是真在生产环境跑过人机回路。
    followups:
      - 一个节点内有多个副作用操作，怎么编排才安全？
      - checkpointer 存内存/SQLite/Postgres 怎么选？
  - q: 图越来越复杂怎么办？节点粒度怎么定、子图怎么拆？
    answerSkeleton: >-
      【分层原理】节点粒度原则一句话：节点是"一次语义完整的决策或副作用单元"。拆太细（一次
      LLM 调用拆三个节点）会让 State 流转噪音淹没业务逻辑，trace 里全是搬运节点；拆太粗
      （一个节点里"检索+生成+校验"）失去断点恢复粒度——节点内部崩溃整段重跑，也没法在
      中间挂 HITL。切分点看三个信号：需要挂人工确认的位置、需要独立重试的位置、可能并发
      执行的位置——这三处必须是节点边界。节点超过 10 个可读性骤降，该拆子图：把内聚的
      一组步骤封装成单个节点暴露给父图，State 通过显式 schema 映射传递而不是整体共享——
      不然子图改内部字段会静默破坏父图。【实际案例】我在内容生产平台演进过这张图：从 4
      节点起步，加了事实校验、风格审校、多平台改写后长到 14 个节点，新人看图要半小时。拆成
      三个子图（资料收集/内容生成/发布适配）后父图只剩 5 个节点，子图各自单测。踩的坑是
      State 隐式耦合：子图改了 draft 字段名，父图没同步，运行时才发现映射丢字段——后来给
      子图边界加显式输入输出 schema 校验，编译期就能抓住。另一次把"生成标题"和"生成摘要"
      塞进一个节点想省流转，标题挂了摘要被迫重跑，按独立重试原则拆开后重试成本降一半。
      【举一反三】这是前端组件拆分的 Agent 版：粒度看状态边界不看代码行数，子图 ≈ 带
      props 契约的复合组件，隐式共享 State ≈ 全局变量耦合。【扣分点对照】把图拆成"一行
      代码一个节点"或"一个节点干完整件事"的都是没维护过大图；能讲出三个切分信号、子图
      schema 契约、隐式耦合事故的，才是真重构过生产图的人。
    followups:
      - 子图和父图的 State 映射怎么设计？双向映射（父传子、子回传父）有什么坑？
      - 什么情况下该把子图拆成独立服务甚至独立 Agent？
  - q: LangGraph 上了生产，最常见的坑有哪些？怎么发现和修？
    answerSkeleton: >-
      【分层原理】高频坑四类，共同点是首次 Demo 不暴露，重放、并发、长任务场景才现形。一，
      条件边不纯：路由函数里顺手发通知写日志，checkpointer 重放时副作用执行两次——路由
      必须是纯函数，只读 State 返回路由名，副作用挪进节点。二，State 膨胀：整段文档、工具
      原始返回都塞 State，每节点拖着几十 KB 序列化，落盘变慢、prompt 拼接失控——State 只放
      决策所需的结论与引用，大对象落外存、State 存指针。三，并发写冲突：并行分支默认后到
      覆盖，一边结果被静默吃掉——字段要用 reducer 显式声明合并语义。四，图级死循环：回退
      边没有计数上限，校验和生成节点互相踢皮球——回退必须带 retry_count，超限强制升级
      人工或失败退出。【实际案例】我在内容生产图里四坑踩过仨。条件边副作用：router 里写了
      "回退次数+1"，重放导致计数翻倍、回退提前熔断，改成计数写在节点里。并发冲突：两个
      并行检索节点都写 sources 字段，一半来源丢失，bad case 是"结论引用了但列不出来源"，
      加 reducer 追加合并才修复。State 膨胀：三篇万 token 原文塞 State，单步序列化涨到
      400ms，一次运行产生 2MB 快照，改成 State 存 doc_id+摘要、原文进对象存储后恢复。
      【举一反三】和前端状态管理一一对应：reducer 必须纯函数（Redux 同款纪律）、store 不是
      垃圾桶、并发更新声明合并策略（CRDT 思路）——LangGraph 只是把这套纪律搬给了 LLM
      工作流。【扣分点对照】照教程跑通 Demo 的讲不出这些；能讲出重放双执行、reducer 合并
      语义、State 膨胀拖慢序列化的，才是被生产教育过的人。
    followups:
      - 并行分支里有一个失败怎么办？部分失败的重试与降级策略怎么设计？
      - State schema 演进（加字段/改字段）时，历史 checkpointer 快照怎么兼容？
