id: llm.cost-and-latency
title: 成本与延迟工程
summary: token 定价模型、TTFT 与总延迟、缓存策略、成本预算。让 AI 功能从"能跑"变成"跑得起"。
tracks: [frontend-to-ai-engineer]
phase: 1
prerequisites: [llm.api-first-call]
estimatedMinutes: 60
difficulty: 2
frontendBridge: >-
  这就是性能优化 + 资源计费，和你做过的图片懒加载、CDN 缓存、
  API 调用配额管理完全同构。区别是资源单位从 MB/次变成了 token。
  输入 token 像上传流量，输出 token 像下载流量——而且下载贵得多。
concepts:
  - 定价模型：输入/输出 token 分开计费，输出通常贵 3-5 倍
  - TTFT（首 token 延迟）：用户感知"快"的核心指标，受模型大小与负载影响
  - 总延迟：TTFT + 生成速度 × 输出长度——流式输出掩盖总延迟但不能掩盖 TTFT
  - Prompt 缓存：重复前缀（如长 system prompt）可缓存以降低成本与 TTFT
  - 预算模型：单次调用成本 × 日活 × 人均调用次数 = 月度账单
sourceIds: [openai-docs, deepseek-api-docs, eugene-yan-llm-patterns]
gotchas:
  - 只看单次调用成本会误判：真实成本 = 单次 × 调用频率 × 重试率 × 多轮历史膨胀
  - 中文场景的 token 消耗常被低估——必须用真实语料实测
  - 长 system prompt 是隐性成本大头：每次都重发，Prompt 缓存能省 50%+
interview:
  - q: LLM 的定价结构是什么样的？你的成本模型公式怎么列？
    answerSkeleton: >-
      【分层原理】定价结构四个维度：输入 token 单价、输出 token 单价（通常是输入的 3-5 倍）、缓存
      写/读单价（命中部分输入大幅折价）、模型档位（旗舰与轻量差一个数量级）。成本模型公式：月账单
      = DAU × 人均日轮次 × 每轮输入 token × 输入单价 + DAU × 人均日轮次 × 每轮输出 token × 输出
      单价，再乘 30 天。其中每轮输入要拆成 system prompt 加历史消息加检索内容加用户输入，中文
      token 数必须用目标模型的 tokenizer 拿真实语料实测，按字符数拍脑袋必然失真；单价要按路由后的
      模型比例加权。最容易漏的三个乘数：失败重试率（线上 3-8% 的调用会重试）、多轮历史膨胀（第 10
      轮输入是第 1 轮的好几倍）、流式中断造成的无效输出 token。【实际案例】客服助手立项时我按
      DAU 1 万、人均 8 轮、实测中文语料每轮输入 1200 token、输出 180 token，估出月账单约 6.5 万；
      上线首月实际 11.2 万——复盘漏了两个因子：用户实际人均 14 轮且历史越滚越大，输入是预估的
      1.9 倍；12% 的请求触发工具调用带来额外中间轮次。补历史压缩加缓存后才回落到预算区间。
      【举一反三】这和估 CDN 流量费同款：UV × PV × 页面大小 × 单价，真实账单总会被命中率与爬虫
      打脸——估算的价值不在一次算准，而在上线后能快速对账定位偏差因子。【扣分点对照】只背
      "token 数乘单价"的是纸上谈兵；能拆输入/输出、报出缓存读写价档、讲出重试率与历史膨胀两个
      隐性乘数并复盘过"估算 vs 实际差近一倍"的，才是管过账单的人。公式人人会列，偏差因子的清单
      才是经验所在。
    followups:
      - 中文 token 实测具体怎么做？（提示：目标模型 tokenizer 跑真实语料采样）
      - 上线后账单超预算 50%，你的排查顺序是什么？
      - 缓存读的价格优势怎么计入成本模型？
  - q: 为什么输出 token 比输入贵 3-5 倍？这对成本优化意味着什么？
    answerSkeleton: >-
      【分层原理】不对称来自生成机制的两阶段。prefill 阶段处理输入：全部输入 token 一次性并行进
      GPU，矩阵乘把硬件吃满，吞吐极高——输入 token 是"批发价"。decode 阶段生成输出：自回归逐
      token 串行，每生成一个 token 都要做一次完整前向、读取全量 KV cache，GPU 算力大量闲置、瓶颈
      在显存带宽——输出 token 是"零售价"，每个都贵。KV cache 账加深这层不对称：每 token 每层要
      存 K 和 V 两份向量，序列越长缓存越大，长输出意味着缓存持续膨胀、显存占用居高不下，单卡能
      并发的请求数被压缩——服务商的机会成本也反映在定价里。所以输出贵 3-5 倍不是商业策略，是
      decode 自回归加显存带宽瓶颈的算法定价。推论：成本优化杠杆最大的永远是压输出——限
      max_tokens、prompt 里约束回复长度、结构化模板替代自由发挥。【实际案例】压测实测：输入固定
      30k token，输出从 200 拉到 2000 token，延迟从 4s 涨到 22s、费用涨 5 倍多；而输入翻倍只让
      TTFT 恶化不到一倍——账单和延迟都是 decode 主导。这条曲线直接定了产品纪律：长文档场景一律
      限输出加模板，宁多轮少长答；客服场景输出限 300 字后输出成本降 35%，满意度没掉。
      【举一反三】prefill 并行 ≈ Promise.all 一把梭，decode 串行 ≈ await 瀑布链——后者每个环节
      都付全价，和前端瀑布请求为什么慢是同一结构。【扣分点对照】说"输出贵因为生成更难"的是含糊
      其辞；能讲出 prefill/decode 两阶段、显存带宽瓶颈、KV cache 并发账，并推出"压输出杠杆最大"
      的，才是懂推理经济学的人。
    followups:
      - 压输出会不会伤质量？怎么验证限长没有误伤？
      - 为什么 decode 瓶颈是显存带宽而不是算力？
      - 批处理（batch API）为什么能半价？它和实时请求争的是什么资源？
  - q: 日活 1 万、人均 800 输入 + 300 输出的客服助手，月度成本多少？降本路线怎么排？
    answerSkeleton: >-
      【分层原理】先算账：DAU 1 万、假设人均日 5 轮、每轮 800 输入加 300 输出。月输入总量 = 1 万
      × 5 × 800 × 30 = 12 亿 token，月输出 = 1 万 × 5 × 300 × 30 = 4.5 亿 token。按主流旗舰模型
      典型价档（输入约 2-3 美元/百万、输出约 8-15 美元/百万）估：输入约 2400-3600 美元，输出约
      3600-6750 美元，合计月账单约 6000-10000 美元；换轻量模型可再低一个数量级。注意一个反直觉点：
      输出 token 量只有输入的约三分之一，费用占比却往往过半——3-5 倍单价结构决定的。降本路线按
      投入产出排序：一，压输出（限长加模板，零风险立省 30%+）；二，prompt 缓存加历史压缩（输入侧
      砍一半）；三，语义/响应缓存命中重复 FAQ（命中部分直接不调模型）；四，任务路由，FAQ 与简单
      意图走小模型（单价差一个数量级）；五，非实时任务走批处理接口（半价）。【实际案例】我接的
      客服账单治理就是这个顺序：输出限长降 35% 输出费；缓存加历史压缩输入降 58%；FAQ 语义缓存
      命中 34%；简单档路由到小模型——三个月账单从 9.8 万降到 2.9 万，满意度指标没掉。最大教训是
      第一步必须拆账单构成，我第一周差点去优化只占 8% 的工具调用。【举一反三】和性能优化同款
      纪律：先拆构成找大头、按杠杆排序、每步留对照指标——别优化占比 8% 的模块。【扣分点对照】
      背题的罗列"换小模型加缓存"名词；真算过的能当场推出具体美元区间、指出"输出占比过半"的反
      直觉点，并给出有序路线图与量化结果——顺序本身就是答案：前两步零质量风险，后两步才需要
      质量回归验证。
    followups:
      - 如果人均轮次从 5 变成 15，账单结构怎么变？
      - 语义缓存的错配风险怎么控？（提示：相似度阈值加领域维度）
      - 降 30% 成本但质量掉 2 个点，你接受吗？怎么决策？
  - q: 优化 TTFT 的手段和优化总时延的手段分别是什么？不同业务场景怎么选？
    answerSkeleton: >-
      【分层原理】两组手段管两个不同指标，混用就是白花钱。TTFT 由排队加 prefill 决定，优化手段：
      流式（不缩短 TTFT 本身，但立刻接管用户注意力，是体验救星）、prompt 瘦身与缓存（前缀命中
      直接少算 prefill，实测可砍一半以上）、小模型（prefill 计算量小）、就近接入点与预留容量
      （降排队）。总时延 = TTFT + 生成速度 × 输出长度，优化手段：压输出长度（杠杆最大，decode 逐
      token 计费）、小模型（decode 也更快）、并发与批处理（提升吞吐降排队，间接改善单请求时延）、
      服务商侧的解码加速能力。选型看业务形态：交互式聊天/助手——TTFT 是生命线，流式必上、prompt
      缓存必上、输出限长定纪律；批量离线任务（夜间摘要、打标）——总时延和吞吐才是指标，走批处理
      接口半价加大并发，流式毫无意义；长报告生成——流式保体验加输出分段结构化，双指标都要管。
      【实际案例】客服场景我们把 TTFT 从 1.8s 压到 0.9s（瘦身加缓存加接入点），满意度涨 11 个
      百分点；文档摘要批任务则走夜间批处理，成本砍半、没人关心单条快慢——两个场景用了完全不同
      的优化组合。【举一反三】就是 FCP 与 TTI 的关系：首屏快不快和完全可交互是两个指标，优化动作
      不同——做过 Web Vitals 的对这个二分天然熟悉。【扣分点对照】把"上流式"当延迟优化万能药的
      是没拆过指标；能按指标拆手段、按业务形态选组合、并报出 TTFT 专项数据的，才是做过延迟工程的。
      面试里主动把"你要优化哪个指标"反问回去确认业务形态，本身就是加分动作。
    followups:
      - prompt 缓存为什么能降 TTFT？原理是什么？
      - 生成速度（tokens/s）受什么影响？你能控制的部分有哪些？
      - 交互场景里 TTFT 和总时延，哪个先优化？判断依据是什么？
