id: llm.cost-and-latency
title: 成本与延迟工程
summary: token 定价模型、TTFT 与总延迟、缓存策略、成本预算。让 AI 功能从"能跑"变成"跑得起"。
tracks: [frontend-to-ai-engineer]
phase: 1
prerequisites: [llm.api-first-call]
estimatedMinutes: 60
difficulty: 2
frontendBridge: >-
  这就是性能优化 + 资源计费，和你做过的图片懒加载、CDN 缓存、
  API 调用配额管理完全同构。区别是资源单位从 MB/次变成了 token。
  输入 token 像上传流量，输出 token 像下载流量——而且下载贵得多。
concepts:
  - 定价模型：输入/输出 token 分开计费，输出通常贵 3-5 倍
  - TTFT（首 token 延迟）：用户感知"快"的核心指标，受模型大小与负载影响
  - 总延迟：TTFT + 生成速度 × 输出长度——流式输出掩盖总延迟但不能掩盖 TTFT
  - Prompt 缓存：重复前缀（如长 system prompt）可缓存以降低成本与 TTFT
  - 预算模型：单次调用成本 × 日活 × 人均调用次数 = 月度账单
sourceIds: [openai-docs, deepseek-api-docs, eugene-yan-llm-patterns]
gotchas:
  - 只看单次调用成本会误判：真实成本 = 单次 × 调用频率 × 重试率 × 多轮历史膨胀
  - 中文场景的 token 消耗常被低估——必须用真实语料实测
  - 长 system prompt 是隐性成本大头：每次都重发，Prompt 缓存能省 50%+
interview:
  - q: 你的 AI 功能月账单 10 万，怎么降本？
    answerSkeleton: >-
      【分层原理】降本要"先审计后优化"，按输入侧/输出侧/模型选择/调用次数四个杠杆排序。输入侧：
      长 system prompt 与多轮历史每轮全量重发是隐性大头——Prompt 缓存让重复前缀的命中部分大幅折价，
      多轮历史做截断或滚动摘要。输出侧：输出 token 单价通常是输入的 3-5 倍，杠杆最大——限 max_tokens、
      prompt 里约束回复长度、能结构化就不闲聊。模型选择：分类/提取/改写路由到小模型，价格差一个
      数量级。调用次数：语义缓存命中重复问答，直接不调模型。【实际案例】我在客服助手项目接过一张
      月 9.8 万的账单。先拆构成：输入占 71%（其中 3k token 的 system prompt 加全量历史每轮重发），
      输出占 29%。治理三步：上 Prompt 缓存 + 历史压缩到最近 5 轮加摘要，输入降 58%；回复限 300 字
      + 结构化模板，输出降 35%；FAQ 类问题（占 42%）路由到小模型。三个月后账单 2.9 万，满意度
      指标没掉。最大教训是第一步必须拆账单——我第一周差点去优化只占 8% 的工具调用。【举一反三】
      这套"先拆构成、再找大头、按杠杆排序"和前端性能优化完全同构：先用 Web Vitals 定位是 LCP
      还是 CLS，再决定压图还是拆包；语义缓存 ≈ CDN 缓存，Prompt 缓存 ≈ 静态片段缓存。【扣分点对照】
      背八股的答案是罗列"换小模型、加缓存、少传历史"三个名词；真做过的会先讲账单拆解（输入/输出/
      功能/模型四维度），说出输出贵 3-5 倍所以限长杠杆最大，以及"优化了占比 8% 的模块"这种弯路。
    followups:
      - Prompt 缓存的命中条件是什么？什么改动会让缓存整批失效？（提示：前缀逐字一致才命中）
      - 输出限长会不会伤质量？怎么验证你的限长没有误伤？
      - 语义缓存的相似度阈值定高定低各有什么风险？
  - q: 怎么估算一个 AI 功能的月度成本？实际账单和估算最容易在哪出现偏差？
    answerSkeleton: >-
      【分层原理】成本模型 = DAU × 人均日轮次 × 每轮 token 数 × 单价，但每个因子都有坑。token 数
      必须拆输入/输出分别算：输入含 system prompt + 历史 + 检索上下文 + 用户输入，中文消耗必须
      用目标模型的 tokenizer 拿真实语料实测，按字符数拍脑袋必然失真；输出按平均回复长度估。单价
      要按路由后的模型比例加权。最容易漏的三个因子：失败重试率（线上 3-8% 的调用会重试）、多轮
      历史膨胀（第 10 轮的输入是第 1 轮的好几倍）、流式中断造成的无效输出 token。【实际案例】我在
      客服助手立项时做预算：DAU 1 万、人均 8 轮、实测中文语料每轮输入 1200 token、输出 180 token，
      算出月账单约 6.5 万。上线首月实际 11.2 万——复盘漏了两个因子：用户平均对话 14 轮不是 8 轮，
      历史越滚越大，实际输入是预估的 1.9 倍；12% 的请求触发工具调用带来额外中间轮次。补了历史
      压缩和缓存后才回落到预算区间。【举一反三】这和前端估 CDN 流量费一样：UV × PV × 页面大小
      × 单价，真实账单总会被"缓存命中率不及预期、爬虫流量、大图未压缩"打脸——估算的价值不在
      一次算准，而在上线后能快速对账定位偏差因子。【扣分点对照】只背出"token 数乘单价"公式的是
      纸上谈兵；能说出输入/输出分开算、中文实测 tokenizer、重试率与历史膨胀两个隐性因子，最好
      真经历过"估算 vs 实际差近一倍"复盘的，才是管过账单的人。
    followups:
      - 中文 token 实测具体怎么做？（提示：目标模型 tokenizer 跑真实语料采样）
      - 上线后账单超预算 50%，你的排查顺序是什么？
