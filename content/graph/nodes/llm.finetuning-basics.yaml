id: llm.finetuning-basics
title: 微调决策（Fine-tuning vs RAG vs Prompt）
summary: '"微调还是 RAG"是面试必问决策题。正确顺序是 Prompt → RAG → 微调：微调教模型"怎么做事"（风格/格式/行为），RAG 给模型"知识"——拿微调灌知识是最常见的错误。'
tracks: [frontend-to-ai-engineer]
phase: 4
prerequisites: [rag.production-pipeline]
estimatedMinutes: 90
difficulty: 4
frontendBridge: >-
  微调 vs RAG ≈ 改组件源码 vs 传 props。微调是改组件本身的行为方式（编译进产物，
  改一次长期生效），RAG 是运行时传数据（灵活、随时更新）。新人最常犯的错就是想
  用"改源码"解决"数据更新"问题。
concepts:
  - 决策顺序：Prompt 工程（零成本先试）→ RAG（知识问题）→ 微调（行为问题）——逐级升级
  - 微调擅长：输出风格/格式统一、领域术语口吻、稳定遵循复杂指令、缩小模型降本
  - 微调不擅长：注入事实知识（会编、会过时）、需要频繁更新的内容——这是 RAG 的地盘
  - LoRA/QLoRA：只训练少量适配参数，显存需求降一个量级，个人显卡也能微调 7B
  - LoRA 低秩分解：冻结原权重、只训 A×B 两个小矩阵——省的不只是参数，更是优化器状态与梯度的显存大头
  - QLoRA：把冻结的基座权重量化到 4bit 加载——LoRA 省训练状态、QLoRA 省基座加载，两者叠加才到消费级显卡
  - 数据质量 >> 数据数量：几百条高质量示例胜过几万条噪声数据；过拟合的信号是训练集完美、验证集翻车
sourceIds: [openai-finetuning, promptingguide]
gotchas:
  - 用微调灌知识是反模式：模型会把训练数据里的事实"记串"，新知识又学不进——知识归 RAG
  - 数据集的格式不一致会被模型忠实学走——清洗数据比调参重要得多
  - 微调后模型通用能力可能退化（灾难性遗忘）——上线前必须跑通用能力回归评测
  - 过拟合不只发生在小数据集：epoch 过多、LoRA rank 过大同样让模型背诵训练样例——验证集指标停滞就该早停
interview:
  - q: 什么场景该微调、什么场景该用 RAG？你的决策框架是什么？
    answerSkeleton: >-
      【分层原理】决策框架一句话：微调教行为，RAG 给知识。先问"问题出在哪"：模型
      不知道某个事实（产品文档、内部政策）→ 知识问题 → RAG，微调灌知识会记串且
      每周更新都要重训；模型知道但做得不稳定（输出格式五花八门、口吻不像品牌、
      复杂指令遵循率低）→ 行为问题 → 微调，几百条高质量示例就能把格式稳定性
      拉到 99%。升级顺序永远是 Prompt → RAG → 微调：prompt 能解决的别上工程，
      RAG 能解决的别碰训练。微调的典型正解场景：输出格式强约束（医疗文书模板）、
      领域风格统一（法律口吻）、用小模型替代大模型降本（蒸馏场景）、工具调用
      可靠性提升。【实际案例】我在客服项目里完整走过这条链：第一期 prompt +
      few-shot 把答案合格率做到 78%；第二期上 RAG 接入产品手册，知识类错误
      基本清零，合格率 91%；剩下 9% 的 bad case 几乎全是格式问题（该列表的
      写成段落、落款缺标准语）——这才是微调的正当场景，用 800 条人工精修的
      对话做 LoRA 微调后格式合规率从 88% 到 99.2%。反过来我们否掉过一个
      "用微调让模型记住全部 SKU 价格"的提案：价格天天变，微调必然产生过时
      幻觉，正确解是 RAG + 实时价格接口。【举一反三】这和前端"配置 vs 代码"
      决策同构：变化快的走配置（RAG），稳定的行为模式才编译进代码（微调）。
      【扣分点对照】张口就"微调效果更好"的是没算过更新成本；能按知识/行为
      二分、讲出递进路线和反例的，才是做过真实技术选型的人。
    followups:
      - LoRA 和全量微调怎么选？LoRA 省的是什么？
      - 微调数据集怎么准备？为什么说质量大于数量？
      - 怎么发现微调导致了灾难性遗忘？
  - q: 没做过微调怎么在面试里答微调题不扣分？LoRA 微调的完整流程是什么？
    answerSkeleton: >-
      【分层原理】诚实但有深度是最佳策略——面试官反感的是装做过。正确姿势：
      明说"没独立做过，但理解原理边界与决策依据"，然后用决策框架证明你懂
      什么时候该用它。LoRA 流程真懂的人是这样讲的：准备数据（几百到几千条
      指令-回答对，格式统一、人工抽检）→ 选基座模型（7B 级，如 Qwen/Llama
      系）→ 用 PEFT 库挂 LoRA 适配器（只训练低秩矩阵，7B 模型可训练参数
      从 70 亿降到几百万，单张消费级显卡可跑）→ 训练并监控（训练集/验证集
      分开，验证集指标不再下降就早停）→ 评估（任务指标 + 通用能力回归 +
      人工抽检）→ 合并权重或运行时挂载部署。过拟合的信号是训练集准确率
      接近 100% 但验证集明显差，对策是减 epoch、增数据多样性、降 LoRA 秩。
      【实际案例】我用这个框架答过真题：面试官问"你做过得分最高的微调项目"，
      我如实说没独立做过，但讲了我们团队为什么否决微调 SKU 价格的提案、
      什么场景我会选 LoRA、数据集怎么建——面试官反馈"比很多自称做过的
      答得清楚"。装做过的人会在追问链第二环（"你的验证集多大""过拟合
      怎么处理的"）当场露馅。【举一反三】"诚实 + 展示判断框架"适用于所有
      没亲手做过的技术：没上过 K8s 就讲清"什么规模该上、上的代价是什么"。
      【扣分点对照】编造项目数据是红线——资深面试官三个追问就能戳穿；
      只说"了解原理"但讲不出流程细节和决策边界的，同样拿不到分。
    followups:
      - LoRA 的"秩"（rank）是什么？调大调小各有什么影响？
      - 微调模型的线上回滚方案是什么？
  - q: LoRA 为什么能省显存？低秩分解的直觉是什么？rank 调大调小各有什么影响？QLoRA 又进一步省了什么？
    answerSkeleton: >-
      【分层原理】直觉一句话：微调对权重的改动是低秩的——预训练模型已具备通用
      能力，适配新任务只需给权重矩阵加一个低维扰动。LoRA 把更新量 ΔW 分解为
      A×B 两个小矩阵（rank r 远小于原矩阵维度），训练时冻结原权重、只训 A 和 B：
      7B 模型 r=16 时可训练参数从 70 亿降到几百万。关键认知是显存大头从来不是
      权重本身，而是优化器状态和梯度——Adam 要为每个可训练参数存两份动量，
      冻结主干后这部分直接砍掉三个量级。rank 的影响：调大则适配容量更大、能学
      更复杂的行为偏移，但参数与显存线性上涨、数据少时更易过拟合；调小则省
      且稳，但复杂任务学不动——格式/风格类任务 r=8 到 16 够用，领域口吻类
      可到 32 至 64。QLoRA 再进一步：把冻结的基座权重量化到 4bit（NF4）加载，
      7B 基座从约 14GB 压到 4GB 上下——LoRA 省的是训练状态，QLoRA 省的是
      基座加载，两者叠加才让单张消费级显卡微调 7B 成立。【实际案例】我在客服
      格式微调里实测：全量微调 7B 需要 80GB 以上显存，LoRA r=16 压进 20GB；
      把 r 从 16 提到 64 后格式合规率只从 99.2% 挪到 99.3% 而训练时间涨 40%，
      果断回退——rank 是旋钮不是越大越好。【举一反三】这和前端"补丁 vs 全量
      重打包"同构：LoRA 是 diff patch，QLoRA 是把静态资源再压缩一轮，目的都是
      不动主干、最小化变更面。【扣分点对照】只会背"LoRA 参数少"的是名词党；
      能讲清省的真大头是优化器状态、rank 的容量-过拟合权衡、QLoRA 与 LoRA
      省的东西不是同一件的，才是真跑过训练的人。
    followups:
      - LoRA 适配器一般挂在哪些层？只挂 attention 和挂全部线性层有区别吗？
      - 训练完合并权重进基座、还是运行时挂载适配器？各适合什么部署场景？
      - 4bit 量化基座会不会掉点？怎么验证量化对任务指标的影响？
  - q: 微调后怎么发现灾难性遗忘？怎么缓解？过拟合的早期信号又是什么？
    answerSkeleton: >-
      【分层原理】灾难性遗忘是模型学新行为时把通用能力"挤掉"：训练只见过窄分布
      数据，权重向新分布偏移，旧分布表现退化——危险在于它不影响你的任务指标，
      只在上线后被用户撞见。发现靠两道闸：上线前跑通用能力回归评测（公开基准
      加自建常用任务集，和基座对比掉点幅度），上线后监控通用类 query 的
      bad case 率。缓解三招按代价排序：降学习率减 epoch（改动最小、往往就够用）、
      训练数据里混 5-15% 通用指令数据（让模型边学边"复习"旧分布）、换更保守的
      方法（LoRA 冻结原权重，天然比全量微调遗忘少）。过拟合是另一件事，早期
      信号有三个：训练集指标接近满分而验证集停滞甚至变差、输出开始背诵训练
      样例的原句措辞、对训练集外的问法泛化明显变差；对策是早停、扩数据多样性、
      降 LoRA rank。注意两者可能同时发生：任务上过拟合、通用能力又退化。
      【实际案例】我们第一次格式微调后任务指标全绿，上线三天客服反映"模型不会
      闲聊了，用户寒暄它也回模板"——补跑回归评测发现通用对话能力掉了 18 个点。
      混入 10% 通用对话数据、学习率减半重训后，格式合规率保持 99.1% 不变、
      通用能力恢复到只掉 2 个点以内。此后回归评测进了训练流水线：公开基准抽
      500 题加 30 条内部高频通用 query，每轮训练自动跑，掉点超阈值直接拦发版。
      【举一反三】这就是前端"重构把旁边功能改挂了"——对策一样：改动范围最小化，
      回归测试覆盖非目标路径，且回归集跟着 CI 走而不是靠人记得跑。
      【扣分点对照】只看任务指标就上线的是新手事故高发区；能讲出回归评测集
      怎么建、混入通用数据的比例、过拟合三个早期信号的，才是真的翻过车的人。
    followups:
      - 通用能力回归评测集怎么建？规模多大才可信？
      - 学习率和 epoch 哪个对遗忘影响更大？先降哪个？
      - 线上发现遗忘后应该回滚还是重训？决策依据是什么？
