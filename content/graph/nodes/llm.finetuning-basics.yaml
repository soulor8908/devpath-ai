id: llm.finetuning-basics
title: 微调决策（Fine-tuning vs RAG vs Prompt）
summary: '"微调还是 RAG"是面试必问决策题。正确顺序是 Prompt → RAG → 微调：微调教模型"怎么做事"（风格/格式/行为），RAG 给模型"知识"——拿微调灌知识是最常见的错误。'
tracks: [frontend-to-ai-engineer]
phase: 4
prerequisites: [rag.production-pipeline]
estimatedMinutes: 90
difficulty: 4
frontendBridge: >-
  微调 vs RAG ≈ 改组件源码 vs 传 props。微调是改组件本身的行为方式（编译进产物，
  改一次长期生效），RAG 是运行时传数据（灵活、随时更新）。新人最常犯的错就是想
  用"改源码"解决"数据更新"问题。
concepts:
  - 决策顺序：Prompt 工程（零成本先试）→ RAG（知识问题）→ 微调（行为问题）——逐级升级
  - 微调擅长：输出风格/格式统一、领域术语口吻、稳定遵循复杂指令、缩小模型降本
  - 微调不擅长：注入事实知识（会编、会过时）、需要频繁更新的内容——这是 RAG 的地盘
  - LoRA/QLoRA：只训练少量适配参数，显存需求降一个量级，个人显卡也能微调 7B
  - 数据质量 >> 数据数量：几百条高质量示例胜过几万条噪声数据；过拟合的信号是训练集完美、验证集翻车
sourceIds: [openai-finetuning, promptingguide]
gotchas:
  - 用微调灌知识是反模式：模型会把训练数据里的事实"记串"，新知识又学不进——知识归 RAG
  - 数据集的格式不一致会被模型忠实学走——清洗数据比调参重要得多
  - 微调后模型通用能力可能退化（灾难性遗忘）——上线前必须跑通用能力回归评测
interview:
  - q: 什么场景该微调、什么场景该用 RAG？你的决策框架是什么？
    answerSkeleton: >-
      【分层原理】决策框架一句话：微调教行为，RAG 给知识。先问"问题出在哪"：模型
      不知道某个事实（产品文档、内部政策）→ 知识问题 → RAG，微调灌知识会记串且
      每周更新都要重训；模型知道但做得不稳定（输出格式五花八门、口吻不像品牌、
      复杂指令遵循率低）→ 行为问题 → 微调，几百条高质量示例就能把格式稳定性
      拉到 99%。升级顺序永远是 Prompt → RAG → 微调：prompt 能解决的别上工程，
      RAG 能解决的别碰训练。微调的典型正解场景：输出格式强约束（医疗文书模板）、
      领域风格统一（法律口吻）、用小模型替代大模型降本（蒸馏场景）、工具调用
      可靠性提升。【实际案例】我在客服项目里完整走过这条链：第一期 prompt +
      few-shot 把答案合格率做到 78%；第二期上 RAG 接入产品手册，知识类错误
      基本清零，合格率 91%；剩下 9% 的 bad case 几乎全是格式问题（该列表的
      写成段落、落款缺标准语）——这才是微调的正当场景，用 800 条人工精修的
      对话做 LoRA 微调后格式合规率从 88% 到 99.2%。反过来我们否掉过一个
      "用微调让模型记住全部 SKU 价格"的提案：价格天天变，微调必然产生过时
      幻觉，正确解是 RAG + 实时价格接口。【举一反三】这和前端"配置 vs 代码"
      决策同构：变化快的走配置（RAG），稳定的行为模式才编译进代码（微调）。
      【扣分点对照】张口就"微调效果更好"的是没算过更新成本；能按知识/行为
      二分、讲出递进路线和反例的，才是做过真实技术选型的人。
    followups:
      - LoRA 和全量微调怎么选？LoRA 省的是什么？
      - 微调数据集怎么准备？为什么说质量大于数量？
      - 怎么发现微调导致了灾难性遗忘？
  - q: 没做过微调怎么在面试里答微调题不扣分？LoRA 微调的完整流程是什么？
    answerSkeleton: >-
      【分层原理】诚实但有深度是最佳策略——面试官反感的是装做过。正确姿势：
      明说"没独立做过，但理解原理边界与决策依据"，然后用决策框架证明你懂
      什么时候该用它。LoRA 流程真懂的人是这样讲的：准备数据（几百到几千条
      指令-回答对，格式统一、人工抽检）→ 选基座模型（7B 级，如 Qwen/Llama
      系）→ 用 PEFT 库挂 LoRA 适配器（只训练低秩矩阵，7B 模型可训练参数
      从 70 亿降到几百万，单张消费级显卡可跑）→ 训练并监控（训练集/验证集
      分开，验证集指标不再下降就早停）→ 评估（任务指标 + 通用能力回归 +
      人工抽检）→ 合并权重或运行时挂载部署。过拟合的信号是训练集准确率
      接近 100% 但验证集明显差，对策是减 epoch、增数据多样性、降 LoRA 秩。
      【实际案例】我用这个框架答过真题：面试官问"你做过得分最高的微调项目"，
      我如实说没独立做过，但讲了我们团队为什么否决微调 SKU 价格的提案、
      什么场景我会选 LoRA、数据集怎么建——面试官反馈"比很多自称做过的
      答得清楚"。装做过的人会在追问链第二环（"你的验证集多大""过拟合
      怎么处理的"）当场露馅。【举一反三】"诚实 + 展示判断框架"适用于所有
      没亲手做过的技术：没上过 K8s 就讲清"什么规模该上、上的代价是什么"。
      【扣分点对照】编造项目数据是红线——资深面试官三个追问就能戳穿；
      只说"了解原理"但讲不出流程细节和决策边界的，同样拿不到分。
    followups:
      - LoRA 的"秩"（rank）是什么？调大调小各有什么影响？
      - 微调模型的线上回滚方案是什么？
