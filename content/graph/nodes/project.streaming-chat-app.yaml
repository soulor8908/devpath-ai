id: project.streaming-chat-app
title: 里程碑项目 · 流式对话应用
summary: Phase 1 出口项目：完整的 AI 对话产品——流式 UI、结构化输出、错误恢复、成本仪表盘。从前端到后端再到部署，全流程独立完成。
tracks: [frontend-to-ai-engineer]
phase: 1
prerequisites: [frontend.streaming-ux, llm-api.structured-output, llm-api.error-handling-retry]
estimatedMinutes: 360
difficulty: 4
frontendBridge: >-
  这是你前端技能的集大成者：Next.js 全栈、SSE 流式、状态管理、错误边界、
  仪表盘可视化——每一块你都做过，只是这次数据源是 LLM。
  后端用 Next.js API Routes 或 FastAPI 均可，重点是产品完整度而非技术炫技。
concepts:
  - 全栈架构：前端（React）→ API 层（Next.js Routes / FastAPI）→ LLM API
  - 流式状态机：idle → streaming → done / error / aborted
  - 结构化输出应用：用 Function Calling 让模型返回 UI 指令（如"生成图表"）
  - 成本仪表盘：实时显示本次会话 token 消耗与估算成本
  - 部署：Vercel / Cloudflare Pages，环境变量管理 API Key
sourceIds: [vercel-ai-sdk, openai-cookbook, anthropic-docs]
lab: content/labs/streaming-chat-app
gotchas:
  - API Key 泄露：Next.js 的 NEXT_PUBLIC_ 前缀变量会打进前端 bundle——Key 绝不能用这个前缀
  - 流式中断后的状态错乱：messages 数组与服务端不同步——需要乐观 UI + 服务端确认的两阶段提交
  - 成本统计造假：不要用估算值，必须用 API 返回的 usage 字段
interview:
  - q: 介绍一下你的流式对话应用——架构分几层？有哪些能量化的核心指标？
    answerSkeleton: >-
      【分层原理】一句话定调：这是一个生产可用的 AI 对话产品，重点不在"能聊天"，而在
      流式体验、状态一致性、成本透明三件前端出身的人最擅长的事。架构分四层：UI 层负责
      消息列表与流式渲染（markdown 增量解析 + 代码块高亮）；状态层是一台显式状态机
      （idle → streaming → done/error/aborted），所有 UI 行为由状态驱动，不允许出现
      "状态之外的界面"；API 层用 Next.js Route Handler 做 SSE 代理，隔离 API Key、
      做鉴权与限流；数据层按会话持久化消息，token usage 落库供成本仪表盘。
      【实际案例】几个体现完成度的数字：首 token 延迟 P50 约 1.2 秒，其中网络与排队
      占大头，LLM 首 token 本身约 700ms；流式渲染做了 markdown 增量解析，未闭合代码块
      先按纯文本渲染、闭合后平滑切换，避免了一半渲染一半乱跳的廉价感；Token 用量面板
      实时显示本次会话输入/输出 token 与估算成本，数据全部来自 API 返回的 usage 字段
      而非本地估算——这一点面试官问"成本数字可信吗"时答得理直气壮；错误恢复上，中断后
      用户可一键"从断点重试"，重试消息按稳定 ID 幂等合并，灰度期间重复消息率为 0。
      【举一反三】这套架构搬到贵司的对话类产品只换皮不换骨：SSE 代理层换成你们的网关、
      状态机逻辑原样复用、成本面板接上你们的计费系统。而且流式状态机这套思路同样适用
      于任何长任务 UI——文件上传、批量导出、实时协作，都是"乐观 UI + 服务端真相 +
      幂等合并"的变体。【扣分点对照】Demo 级回答："前端 fetch 流式接口，追加到数组里
      渲染"。生产级回答：能讲清 SSE 粘包怎么解析、markdown 增量渲染怎么处理未闭合语法
      块、中断重试怎么保证不重复、成本数字为什么可信（usage 字段而非估算）——四点都
      答得出细节的，才是真上线过对话产品的人。
    followups:
      - SSE 和 WebSocket 怎么选？对话场景为什么 SSE 更合适？
      - 首 token 延迟 1.2 秒里各环节耗时分布是什么？还能怎么压？
  - q: 你的对话应用在生产环境出现大量"流式中断后消息重复"，怎么排查？
    answerSkeleton: >-
      【分层原理】按"从近到远"的因果链排查，六步走。第一步定位断点层级：是前端连接
      管理、网络中间层（网关/Nginx 缓冲）、还是 LLM API 侧中断——看断线率监控与分层
      日志。第二步查重连逻辑：重连后是否重复追加已收到的 chunk——必须记录 chunk
      offset 或 event id 做续传去重。第三步查状态同步：乐观 UI 先显示用户消息，服务端
      确认回来若用"全量覆盖"而非"按 ID 合并"就会重复。第四步查消息 ID 幂等：每条
      消息必须有稳定唯一 ID，任何重发/重试都按 ID 去重。第五步补监控：断线率、重连率、
      重复消息率三个核心指标。第六步灰度验证：先 5% 流量观察再全量。【实际案例】我
      真撞过这个 bug：上线第二天重复消息投诉 17 起。按链路排查，断点在移动端弱网切换
      （Wi-Fi 切 4G 触发重连），根因是重连后我从零重新消费 SSE 流，已收到的 200 多字
      又追加了一遍——我没记录 event offset。修复是双重的：服务端 SSE 每条事件带自增
      id，前端断线重连时用 Last-Event-ID 带上最后收到的 offset，服务端从该位置续传；
      同时渲染层按消息 ID + chunk 序号幂等合并，双重保险。灰度 5% 观察 24 小时重复率
      为零后全量，投诉归零。【举一反三】这就是前端状态同步的经典问题换了个壳：乐观
      更新与服务端真相的冲突，解法永远是"唯一 ID + 幂等合并 + 可回放"。贵司任何有
      实时推送的产品（IM、协作编辑、行情推送）都是同一套。【扣分点对照】Demo 级回答：
      "重连前去重一下就行"。生产级回答：能讲出断点定位的分层思路、Last-Event-ID 续传
      机制、幂等合并的双重保险、灰度验证的发布纪律——答出"移动端弱网切换"这种真实
      触发场景的，才是被线上毒打过的人。
    followups:
      - 如何实现"重新生成"功能而不污染消息历史？
      - 多标签页同时聊天，状态怎么同步？
      - Nginx/网关对 SSE 的缓冲会导致什么问题？怎么配？
  - q: 流式渲染 markdown 最难处理的问题是什么？SSE 粘包你实际遇到过吗？
    answerSkeleton: >-
      【分层原理】这是流式应用的两块硬骨头。SSE 粘包：TCP 是字节流，一次 read 可能
      拿到半条事件或多条事件粘连，必须自己实现按空行分割的增量解析器——维护滚动
      buffer，只消费完整事件段，不完整的留 buffer 等下一片数据拼齐。markdown 流式
      渲染：模型逐 token 吐出的内容在任意位置截断都可能是"半个语法结构"——未闭合的
      代码块、表格、加粗标记，直接交给渲染器会不停闪跳。【实际案例】粘包我踩过实的：
      起初对每个 read 结果直接 split 处理，桌面端正常，移动端偶发 JSON 解析失败、
      界面出现乱码——根因是一个 data 事件被拆进两个 TCP 包，我把半截 JSON 拿去
      parse 了。修复后解析失败率从 0.4% 降到 0，关键是 buffer 里只放行以空行结尾的
      完整事件段。markdown 渲染用"两段式"策略：流式过程中检测到最后一个代码块标记
      未闭合时，剩余内容先按纯文本降级渲染，闭合瞬间再触发完整高亮；表格同理，行未
      完整时按纯文本。用户观感从"不停跳动"变成"稳定追加"，内测时对"输出抖动"的
      负面反馈直接消失。【举一反三】粘包解析的思维迁移到所有流式协议：WebSocket
      frame、gRPC streaming、HTTP/2 data frame——都是"buffer + 帧边界 + 不完整
      保留"。增量降级渲染的思路迁移到任何增量数据 UI：日志流、行情流，都是"不完整
      数据先降级渲染，完整后升级"。【扣分点对照】Demo 级回答："用 EventSource 或
      第三方库，没处理过粘包"——库帮你处理了，但问原理要答得出。生产级回答：能讲清
      TCP 字节流与事件边界的本质矛盾、滚动 buffer 的实现要点、未闭合语法块的降级
      渲染策略——能说出"移动端偶发乱码"这种只在真机上才暴露的问题的，是真在真实
      环境验证过的人。
    followups:
      - EventSource 能帮你解决粘包，它的局限又是什么？什么场景必须手写解析？
      - 流式过程中用户点"停止"，前后端各要做什么清理？
  - q: 这个应用的 API Key 安全和防滥用是怎么做的？部署上线踩过什么坑？
    answerSkeleton: >-
      【分层原理】Key 安全的第一原则：模型 API Key 永远不出服务端边界。三层防线：
      隔离层——前端只调自己的 Next.js Route Handler，Key 存服务端环境变量，绝不
      用 NEXT_PUBLIC_ 前缀，那个前缀的变量会打进前端 bundle 等于公开；防滥用层——
      自有路由先过会话鉴权，再按用户维度限 RPM 与每日 token 配额，否则任何人拿到
      端点就等于拿到你的 Key 刷量；出账监控层——按用户聚合 usage 落库，异常增速
      告警。部署的坑集中在流式链路：平台函数超时、代理缓冲、空闲断连。【实际案例】
      坑踩全了。上线第一天用 serverless 部署，长回答跑到 60 秒被函数超时截断，
      用户看到"话说一半"——迁到支持长连接的 runtime 并给单条回复设 max_tokens
      硬上限。第二个坑是反代缓冲：SSE 过一层 Nginx 默认缓冲响应，首 token 从
      1.2 秒劣化到 8 秒整段吐出，加 X-Accel-Buffering: no 响应头才恢复逐字流式。
      第三个最疼：一张公开 README 截图里带出了测试会话链接，当晚端点被刷了 40
      多万 token——万幸有按用户配额和增速告警，损失停在 3 美元，之后给所有路由
      补鉴权并把配额告警接进 IM。【举一反三】"Key 不出服务端、端点默认会被滥用、
      流式链路逐跳验超时与缓冲"这张清单，对贵司任何把 LLM 能力暴露给 C 端的产品
      都适用——暴露面越大，配额与告警越要是第一版功能。【扣分点对照】Demo 级
      回答："Key 放 .env 就安全了"——.env 只解决不进 git，不解决被刷量。生产级
      回答：能讲出 NEXT_PUBLIC_ 的打包机制、按用户配额设计、SSE 每层代理的超时与
      缓冲配置——答得出"截图泄露被刷量"这种事故的，是真上过公网的人。
    followups:
      - 用户配额的额度怎么定？正常用户被限流了怎么补偿体验？
      - SSE 链路上每一跳（CDN/网关/函数）的超时和缓冲要怎么逐层验证？
      - 如果要做游客免登录体验，防滥用策略怎么调整？
