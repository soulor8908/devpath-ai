id: rag.advanced-patterns
title: 高级检索范式（Self-RAG / CRAG / GraphRAG）
summary: 基础 RAG 是"检索一次就生成"，高级范式让系统会判断要不要检索、检索结果够不够好、问题是否需要全局视角。面试用来区分 Demo 与生产理解。
tracks: [frontend-to-ai-engineer]
phase: 2
prerequisites: [rag.reranking]
estimatedMinutes: 120
difficulty: 4
frontendBridge: >-
  高级范式 ≈ 前端的"智能缓存策略"：不是所有请求都打缓存（Self-RAG 判断要不要检索），
  缓存miss或数据过期要降级重试（CRAG 评估检索质量并纠正），而有些答案要靠聚合多张表
  才能算出来（GraphRAG 回答全局性问题）。都是给"无脑一刀切"加上判断层。
concepts:
  - Self-RAG：模型自己判断"要不要检索"（retrieve on demand）并批判生成质量——训练特殊反思 token
  - CRAG（Corrective RAG）：检索后先评估结果质量，置信度低则触发纠正（重写查询/联网补充/换数据源）
  - GraphRAG：抽取实体与关系建知识图谱 + 社区摘要，回答"整体上""趋势如何"这类全局性问题
  - 三者与基础 RAG 的关系：基础 RAG 假设"每题都要检索且一次就够"，高级范式各自打破一个假设
  - 工程代价：判断层 = 额外的模型调用 = 延迟与成本，必须先证明基础版不够再引入
sourceIds: [self-rag-paper, microsoft-graphrag]
gotchas:
  - 高级范式不是免费午餐：每加一层判断就多一次 LLM 调用，p95 延迟可能翻倍——按 bad case 占比决定值不值
  - GraphRAG 索引构建成本极高（全库实体抽取要过一遍 LLM），文档频繁更新的场景索引会腐烂
  - 不要把范式当简历装饰：面试官会追问"你的场景为什么需要它、解决了基础 RAG 的什么具体失败"
interview:
  - q: Self-RAG、CRAG 和基础 RAG 有什么区别？各自的触发条件是什么？
    answerSkeleton: >-
      【分层原理】三者打破的假设不同。基础 RAG：每题必检索、检索结果直接用，两个假设在
      生产里都会塌。Self-RAG 打破第一个假设——训练模型生成特殊反思 token，先判断"这题
      需要外部知识吗"，常识题直接答、知识题才检索，生成后再自我批判是否忠于检索内容；
      收益是省掉无谓检索（实测约 30-40% 的查询可以不检索），代价是要微调模型。CRAG 打破
      第二个假设——检索后加一个轻量评估器给结果打分，分高直接用、分低触发纠正动作
      （重写查询再检索、联网搜索补充、明确拒答），本质是承认"检索器会失败"并给出降级链；
      不用微调、工程上最易落地。【实际案例】我在客服知识库落地的是 CRAG 思路的简化版：
      用 top-1 相似度分数做评估器，低于 0.62 的查询走"查询改写 + 扩大 top-k 重试"，仍低
      则拒答转人工。上线后"因检索不到而硬答"的幻觉投诉每周从十几起降到个位数，而平均
      延迟只增加了 180ms（只有 15% 的查询触发重试）。【举一反三】这个"给关键节点加质量
      门"的思路可以推广：生成后加 faithfulness 校验、工具调用前加参数校验、输出前加
      合规过滤——都是同一个模式的不同挂载点。【扣分点对照】背题答案是背三个名词的
      全称；有深度的答案能讲清"各自打破什么假设、判断层的延迟成本怎么算、为什么
      CRAG 工程上比 Self-RAG 更容易先落地"。
    followups:
      - CRAG 的评估器用什么信号？除了相似度分数还有什么？
      - Self-RAG 要微调模型，团队没有微调能力时怎么获得类似效果？（提示：用 prompt 实现判断层）
  - q: GraphRAG 解决什么问题？为什么传统 RAG 回答不了"整个知识库主要在讨论什么"这类问题？
    answerSkeleton: >-
      【分层原理】传统 RAG 是"局部检索"：top-k 块只能覆盖问题的局部语义，而"这个知识库
      主要讨论什么""过去一年政策变化的脉络是什么"是全局性问题——答案分散在成百上千个
      块里，没有单个块与问题的字面相似度高，检索天然失灵。GraphRAG 的解法是换索引结构：
      入库时用 LLM 抽取实体与关系建知识图谱，再用社区检测算法把图谱聚类成主题社区、
      为每个社区预生成摘要；查询时全局问题路由到社区摘要（map-reduce 式汇总），局部
      细节问题仍走向量检索。【实际案例】我评估过它在一套 2000 篇研报的问答场景：传统
      RAG 回答"最近三个月研究主线怎么迁移的"只能抓到某一篇的只言片语，GraphRAG 能
      给出按主题演化的结构化综述。但代价同样真实：建索引时全库过一遍 LLM 抽实体，
      2000 篇文档的索引构建花了数万元 token 费和十几个小时，且每周新增研报都要增量
      入图，运维成本陡增。结论：只有全局性/跨文档问题占比高的场景（研报、尽调、
      法律文书综述）才值得，客服问答这类局部问题为主的场景纯属浪费。【举一反三】
      "换索引结构适配查询形态"的思维和前端按查询模式选数据库（OLTP vs OLAP vs ES）
      完全同构——先统计真实查询分布，再决定索引投入。【扣分点对照】只说"GraphRAG
      用了知识图谱所以更强"的是概念复读；能说出"全局性问题为什么让向量检索失灵、
      社区摘要的 map-reduce 机制、索引构建成本"的才是真理解。
    followups:
      - GraphRAG 索引在文档高频更新场景怎么保鲜？
      - 怎么判断一个业务的查询分布适不适合上 GraphRAG？
  - q: 什么时候该从基础 RAG 升级到高级范式？怎么论证判断层多花的延迟和成本是值得的？
    answerSkeleton: >-
      【分层原理】升级的唯一理由是"基础版的失败模式已被量化证明"。高级范式的每层判断
      都是额外模型调用：Self-RAG 的检索判断加 200-400ms，CRAG 的评估加纠正链最坏多
      一轮检索加一次改写，p95 可能翻倍；GraphRAG 则把成本挪到索引期。正确决策顺序是：
      先用基础版上线攒 bad case，按失败类型归类——"该检索没检、不该检索乱检"占比高
      选 Self-RAG 思路；"检索结果质量差导致答错"占比高选 CRAG；"全局性问题答不出"占
      比高才选 GraphRAG。没有 bad case 分布数据就升级，等于没 profiling 就优化。
      【实际案例】我在客服知识库项目顶着"上 GraphRAG"的声音做了相反决策：拉两周
      3000 条 query 标注 bad case，78% 的失败是"新政策没入库"和"召回块不对"，全局性
      问题只占 4%——工程量全投给入库 SLA 和 CRAG 式评估纠正，幻觉投诉降了八成；
      GraphRAG 留到后来的研报场景才用。论证话术也朴素：判断层成本 = 触发率 × 单次
      开销，15% 触发率时平均延迟只加 180ms，换幻觉投诉量级下降，ROI 一目了然。
      【举一反三】这和前端"先量 LCP 再决定上不上 SSR/边缘渲染"完全同构：优化对象
      必须是数据证明的瓶颈，bad case 分布就是 RAG 系统的性能 profile。
      【扣分点对照】把三个范式当简历关键词全堆上的是名词党；能讲出按 bad case 类型
      选范式、判断层成本按触发率摊薄、并用分布数据否决过某个范式的，才是做过生产
      决策的人。
    followups:
      - 攒 bad case 时怎么归类失败类型？标注成本怎么控？
      - 判断层本身判断错了怎么办？（提示：评估器误判的兜底与降级）
  - q: 团队没有微调能力，怎么获得 Self-RAG 类似的效果？prompt 版判断层怎么搭？
    answerSkeleton: >-
      【分层原理】Self-RAG 的本质是"生成前判断要不要检索 + 生成后自我批判"，特殊反思
      token 只是实现手段，用 prompt 编排也能搭出同构判断层。工程做法是拆成多次调用：
      第一次给模型看 query 与知识库简介，输出结构化判断（需要检索吗、缺什么信息），
      常识题与闲聊直接答不走检索；检索完生成答案后，再来一次批判调用，让模型逐条核对
      答案与检索块的一致性，不通过就重写或拒答。与微调版相比，prompt 版零训练成本、
      当天能上线，但每次判断都付 prompt 的 token 与延迟，且判断稳定性依赖基座模型的
      指令遵循能力，天花板低于微调版。【实际案例】我在企业 Wiki 问答落地过这套：检索
      判断层挡掉 35% 的查询（打招呼、感谢、纯闲聊），生成后的批判调用拦截 12% 的不
      忠实答案触发重生成——bad case 率从 11% 降到 4%，代价是非拦截请求平均多花
      350ms。关键工程细节：判断层 prompt 压到 300 token 以内、输出限定 JSON、相同
      query 的判断结果进缓存，缓存命中率约 40%。【举一反三】这和前端"没有后端权限
      就先上纯前端路由守卫顶一阵"同构：能力不够时用编排补，但要在文档里写明这是过渡
      方案、天花板在哪。【扣分点对照】只会说"可以微调"或"可以写 prompt"的是口号；
      能讲出判断层拆成哪几次调用、各花多少延迟、prompt 版与微调版的天花板差异的，
      才真搭过这层。
    followups:
      - 判断层的 prompt 怎么设计才能稳定输出结构化判断？格式漂移怎么兜底？
      - 怎么评测检索判断层本身的准确率？误判和漏判的代价各是什么？
