id: rag.chunking-strategies
title: 文本切分策略（Chunking）
summary: 把长文档切成可检索的小块是 RAG 的第一道工序，切得好坏直接决定召回质量。固定窗口、语义切分、递归切分各有取舍。
tracks: [frontend-to-ai-engineer]
phase: 2
prerequisites: [rag.embedding-fundamentals, rag.document-parsing]
estimatedMinutes: 90
difficulty: 3
frontendBridge: >-
  chunking ≈ 前端的分页/虚拟列表：把大文档切成"刚好够用"的块。区别是这里的块大小要兼顾
  embedding 模型的上下文窗口（通常 512-8192 token）与检索精度——块太大召回粗、块太小丢上下文。
  你处理过"每页多少条"的权衡，这里只是维度从"渲染性能"换成"召回质量"。
concepts:
  - 固定窗口切分：按字符/token 数固定切，最简单但可能切断语义
  - 重叠切分：相邻块共享一部分内容（如 overlap=10-20%），避免边界信息丢失
  - 语义切分：按段落/标题/句子边界切，保留语义完整性
  - 递归切分：先按大结构（章/节）切，过大再按段落切，仍过大再按句子切（LangChain RecursiveCharacterTextSplitter）
  - 块大小经验值：500-1000 token 是常见区间，太小召回准但上下文不足，太大召回粗但上下文全
sourceIds: [langchain-rag, greg-kamradt-rag]
gotchas:
  - 块大小没有银弹：必须用真实文档 + 评测集测召回率，不同语料（代码/法律/对话）最优块大小不同
  - 切分时丢失元数据（如文档标题、章节路径）会让检索结果失去来源——每个块要带 metadata
  - 表格和代码块被切断是常见灾难——需要按结构识别特殊切分
interview:
  - q: RAG 里文本切分的块大小怎么选？太大太小各有什么问题？
    answerSkeleton: >-
      【分层原理】块大小本质是召回精度与上下文完整性的权衡。块太小（如 100 token）：召回准——
      查询能精确命中讲某个细节的块，但上下文不足，模型只看到一句孤立的话，可能误判或无法生成
      完整答案；块太大（如 4000 token）：上下文全，但召回粗——一个块混杂多个主题，主题embedding
      被稀释，查"某具体细节"时相似度排名下降、进不了 top-k，还会把无关内容灌进 prompt 抬高成本。
      【实际案例】我在企业知识库项目里起步用 LangChain 默认的 1000 字符固定切分，评测集召回率
      只有 61%。对着 bad case 逐条分析发现两类典型失败：一是答案句正好被从中间切断，前后两半
      各自召不回；二是产品参数表被切成三块，检索到的那块没有表头、模型读不懂。改成递归切分
      （先按标题层级、再按段落、最后 800 token 兜底）+ 15% overlap + 表格整块保留后，召回率
      升到 87%，答案 faithfulness 从 0.78 升到 0.93——这是我第一次体会到"切分是 RAG 的第一
      道工序"不是空话。【举一反三】代码库场景应改按函数/类边界切（tree-sitter 解析），法律合同
      按条款编号切，对话记录按轮次切——原则不变：先保语义完整、再控长度，只是"语义边界"的
      定义随语料变。【扣分点对照】只答"500-1000 token 加 overlap"的是背八股；能讲出对着
      bad case 迭代过切分策略、说出具体失败形态（切断答案句/切散表格）的，才是真调过 RAG。
    followups:
      - 怎么评测一个切分策略的好坏？（提示：评测集怎么建、看召回率还是端到端答案质量）
      - 表格和代码块切分有什么特殊处理？
      - overlap 是不是越大越好？代价是什么？
  - q: 语义切分（semantic chunking）和递归切分（recursive splitting）有什么区别？什么时候值得用语义切分？
    answerSkeleton: >-
      【分层原理】递归切分是"结构驱动"：按预定义分隔符优先级（章→节→段落→句子）贪心切，快到
      长度上限就停，它假设排版结构≈语义结构。语义切分是"内容驱动"：先按句子切，再对相邻句子
      算 embedding 相似度，相似度骤降处判定为话题转换点下刀——它不切"看起来该切的位置"，而是
      切"意思变了的位置"。代价是每份文档要多跑 N 次 embedding，入库成本与耗时显著上升。
      【实际案例】我在技术文档场景实测对比过：API 参考文档排版规范，递归切分和语义切分的召回率
      只差 2 个点，语义切分不值得；但内部 Wiki 是多人随手写的、段落经常一段里塞三个话题，
      递归切分召回率 74%，语义切分提到 83%。结论是按语料的"结构规整度"选，不是越先进越好。
      【举一反三】这个"简单方法够好就不上复杂方法"的判断可以迁移到很多 RAG 决策：混合检索、
      rerank、HyDE 都是先证明基线不够再引入。面试里被问"为什么不用更先进的 X"时，这个回答
      框架（先量基线、再量增益、最后算成本）直接通用。【扣分点对照】背题答案是罗列两个名词的
      定义；有深度的答案能说出"语义切分的入库成本、它解决的是结构不规整语料、以及怎么验证
      值不值"这三个工程维度。
    followups:
      - 语义切分的相似度阈值怎么定？
      - 入库成本翻倍的情况下，你会怎么向团队论证上语义切分是值得的？
  - q: 切分之后的块需要带哪些元数据（metadata）？少了会有什么后果？
    answerSkeleton: >-
      【分层原理】元数据分四类：一是来源定位（doc_id、文档标题、章节路径、页码）——让答案
      可引用、可溯源；二是版本治理（version、update_time、content_hash）——支撑增量更新与
      软删除，文档改版时按 doc_id 找到旧块标记 superseded 再插新块，不用全量重建；三是权限
      过滤（department、acl_role）——检索时 pre-filter，保证普通员工搜不到高管薪酬文档，
      这是企业 RAG 的合规红线；四是业务标签（product_line、language）——支撑按域过滤与
      加权排序。【实际案例】我踩过的坑是第一版只存了纯文本块，上线后用户问"这是哪份文档说的"
      答不出来，客服场景里无法溯源的答案等于不可用；补 doc_id + 章节路径后，答案末尾能挂
      引用链接，用户信任度明显提升。另一次是文档改版后新旧两版块同时在库，模型交替引用
      新旧政策互相矛盾，加了 version + superseded 过滤才根治。【举一反三】同样的元数据
      设计思路在前端就是列表项的 key + 缓存失效标记 + 权限字段——你设计过带权限的前端
      列表，就知道检索前过滤和检索后过滤的安全性差别。【扣分点对照】只说"带个 source 字段"
      的是 Demo 级理解；能讲出版本治理（软删除）与权限 pre-filter 两个生产场景的，才是
      做过企业级 RAG。
    followups:
      - 权限过滤放检索前（pre-filter）还是检索后（post-filter）？各有什么坑？
      - 文档频繁更新时，元数据怎么支撑增量索引？
