id: eng.observability
title: LLM 可观测性（trace 与监控）
summary: LLM 应用是黑盒——没有 trace 就只能盲猜。Langfuse/Phoenix 记录每次调用的 prompt/响应/延迟/成本，是生产 LLM 应用的眼睛。
tracks: [frontend-to-ai-engineer]
phase: 4
prerequisites: [eng.llm-eval-system]
estimatedMinutes: 90
difficulty: 3
frontendBridge: >-
  LLM trace ≈ 你做前端的 performance trace（Performance API/火焰图）：记录每次请求的全链路——
  prompt 输入、token 用量、延迟、模型版本、中间步骤。区别是 LLM 调用是"黑盒概率"而非确定性计算，
  没有日志就无法复现"为什么这次答错了"。你的可观测直觉直接适用。
concepts:
  - trace 三要素：input（prompt+context）/ output（response+usage）/ metadata（model/latency/cost/user）
  - 链路追踪：RAG/Agent 的多步调用（检索→重排→生成）要串成一条 trace，而非孤立日志
  - 成本可观测：每次调用的 token 成本落盘，按用户/功能/模型维度聚合
  - 质量监控：抽样 trace 做人工/LLM 评分，监控 faithfulness/answer relevancy 漂移
  - 告警：延迟 p99 / 错误率 / 成本突增 / 质量评分下降的阈值告警
sourceIds: [langfuse-docs, phoenix-docs]
gotchas:
  - 只记 input/output 不记中间步骤——RAG 的检索结果、Agent 的 trajectory 不落盘就无法定位问题
  - trace 全量记录成本高——高频调用要采样（如 1%）+ 错误全量记录
  - PII 脱敏——trace 里的 prompt 可能含用户敏感信息，落盘前必须脱敏
interview:
  - q: 生产 LLM 应用要做哪些可观测？trace 要记什么？
    answerSkeleton: >-
      【分层原理】LLM 可观测的核心是 trace：把一次用户请求的全链路——检索、重排、每次 LLM 调用、
      每次工具调用——串成一棵调用树，每个节点记录输入（prompt+上下文）、输出（响应原文）、用量
      （input/output token 与折算成本）、延迟（TTFT 与总时长）、元数据（模型版本、user id、功能
      入口）。为什么必须是树不是平铺日志：RAG 答错可能是检索召回差也可能是生成偏，只有链路级
      trace 能定位锅在哪一段。配套三类信号：一是成本归因，按功能/租户/模型维度聚合 token 成本；
      二是质量监控，抽样 trace 送 LLM 评委或人工打分，盯 faithfulness 漂移；三是告警，p99 延迟、
      错误率、成本突增、质量分下降四条基线。工程落点上 Langfuse（开源自部署友好）、Phoenix（偏
      实验与评估）是主流选项，SDK 埋点或 OpenTelemetry 接入。两条纪律：高频场景采样（如 1-5%）+
      错误全量，平衡存储成本；prompt 落盘前 PII 脱敏，trace 里常有用户隐私。【实际案例】我在
      Agent 项目里靠 trace 破过一次悬案：用户报"Agent 偶尔会答非所问"，日志一切正常。拉出错
      样本的链路 trace 逐节点看，发现是第 3 步工具返回被截断，模型基于半截数据继续推理——平铺
      日志里这步显示"调用成功"，只看输入输出根本看不出问题。另一次是成本告警：某租户成本日环比
      涨 5 倍，按租户维度下钻发现对方把导出脚本写成了轮询，同一请求每分钟打一次。没有成本归因，
      这种滥用要等月底账单才暴露。【举一反三】这就是前端的 Performance 火焰图+Sentry 事务追踪
      搬到 LLM 链路：你早就知道"没有 trace 的性能问题靠算命"，LLM 只是让每条 span 更贵、更
      不确定。【扣分点对照】说"把 prompt 和响应存日志里"的是单体 Demo 思维；能讲出调用树定位
      归因、采样+错误全量、PII 脱敏、成本按租户下钻的，才是真运维过生产 LLM 应用。
    followups:
      - RAG 链路 trace 怎么把检索和生成串起来？
      - 怎么对 trace 做质量评分而不全靠人工？
  - q: LLM 应用上线后质量"慢慢变差"但技术指标全绿，怎么发现？成本怎么归因到具体功能和租户？
    answerSkeleton: >-
      【分层原理】慢退化的本质是"分布漂移不被技术指标捕获"：延迟、错误率都正常，但用户提问分布
      变了、上游文档更新了、或供应商模型静默微调了，答案质量缓慢下滑。检测体系三层。一是质量
      信号在线化：用户反馈（thumbs down 率、追问率、"重新生成"点击率）按天聚合，这些行为指标
      比显式投诉早一两周暴露问题。二是抽样评测流水线：每天从线上 trace 随机抽样（如 100 条）送
      LLM 评委打分，绘制 faithfulness/relevancy 趋势图，配统计告警（连续 3 天低于基线 2 个标准差
      触发），把季度级别的缓慢下滑拉成可见曲线。三是金丝雀集：固定 50 条代表性问题每天定时重跑，
      答案与历史版本比对——它能捕捉"模型静默变更"这类与流量无关的退化。成本归因侧：每次调用
      打标（功能入口、租户 id、模型、链路节点），账单按维度下钻；重点看"单位业务价值成本"（如
      每次成功问答成本）而非总账——总量涨可能是业务增长，单位成本涨才是异常。【实际案例】我在
      知识库产品里被慢退化咬过：供应商一次模型小版本更新后，faithfulness 抽样分三周从 0.91 滑到
      0.86，延迟和错误率纹丝不动，是金丝雀集第 5 天先报警（答案与基线版本相似度骤降），抽样
      趋势线随后确认。定位后锁定模型版本回滚，分数当天恢复。成本归因也救过场：按功能下钻发现
      "周报自动生成"功能占成本 42% 但月活使用不到 5%——其 prompt 里塞了全量历史数据，优化后
      该功能成本降 70%。【举一反三】前端对应物是 RUM 与合成监控的分工：真实用户行为信号（RUM）
      看趋势，固定脚本定时探测（合成监控）抓环境变更——金丝雀集就是 LLM 版的合成监控。
      【扣分点对照】只配延迟和错误率告警的，会在供应商静默更新时裸奔；能讲出行为指标先行、抽样
      评测趋势、金丝雀集抓静默变更、单位价值成本归因的，才是真盯过线上质量曲线。
    followups:
      - 抽样评测的 LLM 评委成本本身怎么控制？
      - 金丝雀集发现退化后，怎么区分是模型变了还是数据/检索变了？
