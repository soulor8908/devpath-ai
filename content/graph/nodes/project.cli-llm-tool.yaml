id: project.cli-llm-tool
title: 里程碑项目 · CLI 文本批处理工具
summary: Phase 0 出口项目：一个命令行工具，读取本地文件列表，调用 LLM API 批量处理（如翻译/摘要/打标签），流式输出进度，统计 token 成本。
tracks: [frontend-to-ai-engineer]
phase: 0
prerequisites: [llm.streaming-basics, python.env-tooling]
estimatedMinutes: 240
difficulty: 3
frontendBridge: >-
  这是你写过无数遍的 CLI/脚本任务，只是数据源换成了 LLM API。
  文件遍历 ≈ Node fs，异步并发 ≈ Promise 池，进度输出 ≈ CLI spinner。
  重点不在功能，在于第一次用 Python 工程规范（uv + 类型 + pytest）
  完成一个真实可交付的工具。
concepts:
  - 项目脚手架：uv init + pyproject.toml + src 布局
  - 异步并发池：asyncio.Semaphore 限制并发数，防止触发 API 限流
  - 成本统计：从 usage 字段累计 token，按单价估算 USD 成本
  - 断点续跑：处理结果落盘，重跑时跳过已完成项
sourceIds: [openai-cookbook, deepseek-api-docs, python-docs]
lab: content/labs/cli-llm-tool
gotchas:
  - 并发不设上限会立刻触发 429 限流——Semaphore 或队列必须第一版就加
  - 批量任务中单个文件失败不该中断全局——错误隔离与最终报告分开
  - token 成本要在设计时就算清：批处理 1000 个文件的预算可能是原型期的 100 倍
interview:
  - q: 介绍一下你的 CLI 批量处理工具项目——它解决什么问题，架构怎么分的？
    answerSkeleton: >-
      【分层原理】一句话定调：它把"调一次 LLM API"工程化成"稳定处理十万条"的批处理管线，
      价值不在调用本身，而在吞吐、可靠性、成本三条线的工程保障。架构分四层：输入层遍历
      文件列表并做格式与编码校验；调度层用 asyncio.Semaphore 并发池控速，配合对端 RPM
      限制动态调整；执行层每条任务独立 try/except 做错误隔离，429/5xx 指数退避重试；
      持久层每条结果即时落盘 JSONL，记录 status/input_hash/output/usage，同时支撑断点
      续跑与成本统计。【实际案例】我用它处理过 3.2 万条商品描述打标：第一版没设并发上限，
      30 秒就被 429 打满、一半请求失败；把并发压到 8、加 RPM 自适应（连续 429 就把
      并发减半，稳定 5 分钟再缓慢回升）后跑通。预算环节先抽 300 条样本，测出输入均值
      410 token、输出均值 90 token，外推总成本约 42 美元，实际结算 47 美元，偏差 12%
      在可接受范围。断点续跑救过三次——两次本地断电、一次 API 侧故障，重跑时按
      input_hash 跳过已完成项，一分钱重复调用都没浪费。最终交付附失败明细报告：失败
      217 条按错误类型分类，失败率 0.68%。【举一反三】这套模式原样搬到贵司任何批量
      场景：批量生成商品文案、批量审核 UGC、历史工单批量打标——换的只是输入源和
      prompt，并发池、断点续跑、样本外推预算、失败报告四件套是通用的。前端视角看它
      就是 Promise 池 + IndexedDB 中间态缓存 + 错误边界的组合拳，我熟。【扣分点对照】
      Demo 级回答："写个 for 循环调 API，加 try/except"。生产级回答：并发上限能从对端
      RPM 反推、预算用样本外推而非均长估算、中途挂了有断点续跑、交付有失败明细报告
      ——四点都答得出具体数字的，才是真跑过批量任务的人。
    followups:
      - 断点续跑的去重 key 怎么设计？源文件内容变了怎么办？
      - 并发上限怎么从对端 RPM 反推？动态调整的具体算法是什么？
      - 失败明细报告应该包含哪些字段，才能支撑快速复盘？
  - q: 设计一个批量处理 10 万条文本的 LLM 管线，你会考虑哪些工程问题？
    answerSkeleton: >-
      【分层原理】这是工程题不是算法题，按五条线拆。吞吐线：并发池与批 API 二选一——
      并发池延迟低但要自己控速，批 API 单价低但延迟按小时计，选型看业务的延迟敏感度。
      可靠性线：指数退避重试、断点续跑、单条失败不阻断全局的错误隔离。成本线：先抽样
      测 token 分布再外推总预算，任务按复杂度分级路由不同档位模型。可观测线：实时进度、
      累计成本、失败明细报告。合规线：数据能否出域，敏感数据走本地模型或私有部署。
      【实际案例】我在 10 万条评论情感分析任务上完整跑过这套设计。吞吐上，对端限
      500 RPM，按"RPM÷60×单请求平均耗时"反推并发上限 12，再留 20% 余量防突发；可靠性上，
      429 看 Retry-After、5xx 指数退避最多 4 次、彻底失败进死信队列不阻塞全局；成本上
      先跑 500 条样本，发现 20% 的长文本贡献了 55% 的 token，于是长文本路由到长上下文
      低价模型、短文本走标准模型，预算从粗估的 180 美元压到 110 美元，实际结算 103
      美元；可观测上每 1000 条输出一次进度与累计成本，结束产出按错误码分类的失败报告。
      【举一反三】面试官所在公司的典型场景是"运营要批量处理一批数据，明天要结果"——
      这套打法直接落地：今晚先跑 300 条样本出预算与耗时预估，明早交结果附失败明细。
      同样的"先小样本验证再全量"思路，迁移到爬虫、数据迁移、批量通知发送都成立。
      【扣分点对照】Demo 级：只说"并发 + 重试"两个词。生产级：吞吐有量化反推（RPM→
      并发数）、成本有样本外推与模型分级、可靠性有死信兜底、交付有失败报告——能讲出
      "20% 长文本贡献 55% token"这种分布洞察的，说明真分析过数据。
    followups:
      - 限流 429 的退避策略怎么设计？（提示：Retry-After、指数退避、抖动）
      - 如何向老板证明这 10 万条处理结果的质量？
      - 批 API 和实时并发池怎么选？各自的延迟与成本特征？
  - q: 这个项目里你踩过最大的坑是什么？怎么发现和修复的？
    answerSkeleton: >-
      【分层原理】批量任务最危险的坑不是报错，而是"静默错误"——任务跑完、状态全是
      success，结果却是错的。讲清楚这个坑分三层：坑的现象、定位过程、修复与防御。
      防御有三道：输入校验前置（脏数据入队前拦截）、输出质量校验（机器可判的格式/长度/
      关键词检查）、抽样人工核对（每批随机抽 1% 人工过目）。【实际案例】我在 2.4 万条
      工单摘要任务里踩过实的：凌晨跑完全量，早上发现 6000 多条摘要是"对不起，我无法
      处理该请求"这类拒答文本——HTTP 200、usage 正常、程序判定成功。根因是那批工单
      含用户粘贴的身份证号，触发模型安全策略拒答，而我的成功判定只看状态码。定位靠
      失败模式聚类：把输出按相似度分组，发现拒答文本高度同质，回溯输入找到共性。修复
      两步：输出侧加"拒答模式检测"，命中即标记 failed 而非 success；输入侧对敏感字段
      先脱敏再送模型。重跑那 6000 条后失败率降到 0.3%。这件事让我把"业务成功 ≠
      HTTP 成功"刻进了骨子里。【举一反三】静默错误在所有 LLM 批量场景都存在：批量
      翻译可能整段漏翻、批量审核可能模型"和稀泥"全标通过。防御思路通用——输出必须有
      机器可判的质量校验，不能只看调用成功。到贵司的批处理场景，我第一件事就是问
      "输出的质量校验器是什么"。【扣分点对照】Demo 级回答只会讲"429 限流被卡过"这种
      明面错误；生产级回答能讲出静默错误的形态（200 但内容错）、定位方法（失败模式
      聚类）、系统性防御（输入校验 + 输出校验 + 抽样人工）。踩过暗坑的人和只踩过明坑
      的人，一讲就分得出来。
    followups:
      - 拒答检测用规则还是用小模型？误判率怎么控制？
      - 抽样人工核对的成本怎么算？抽样比例怎么定？
