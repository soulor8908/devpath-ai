id: llm.context-engineering
title: 上下文工程（Context Engineering）
summary: Prompt 工程写"指令"，上下文工程管"喂给模型的全部信息"：历史、检索结果、工具输出、记忆。上下文不是越长越好——lost-in-the-middle 让长上下文变成噪音池。
tracks: [frontend-to-ai-engineer]
phase: 1
prerequisites: [llm.tokens-and-context, prompt.system-and-fewshot]
estimatedMinutes: 90
difficulty: 4
frontendBridge: >-
  上下文工程 ≈ 前端的"状态管理 + 数据组装"：组件（模型）渲染什么，取决于你喂给它的
  props（上下文）。你不会把整个 Redux store 塞给每个组件——只选它需要的 slice、
  做 memo 防重算。上下文工程就是给模型做精准 props drilling。
concepts:
  - 上下文工程 vs Prompt 工程：前者管"信息的筛选/组装/压缩"，后者管"指令的措辞"——生产系统的瓶颈在前者
  - lost-in-the-middle：模型对上下文开头与结尾的信息利用最好，中段信息利用率显著下降
  - 上下文压缩：对话摘要、检索结果去重裁剪、工具输出裁剪——用更小上下文保住关键信息
  - 上下文隔离：多 Agent/多任务场景把不同任务的上下文分开，避免互相污染
  - 上下文层级：system（规则）< 检索内容（事实）< 近期对话（状态）——组装顺序影响注意力分配
sourceIds: [anthropic-prompt-engineering, anthropic-context-engineering]
gotchas:
  - '"窗口够大就全塞进去"是最常见的错误——长上下文同时推高成本、延迟与 lost-in-the-middle 风险'
  - 检索结果直接拼接不去重：top-k 块经常内容高度重叠，等于花 5 倍的 token 说同一件事
  - 工具原始输出（整页 HTML/整个 JSON）原样进上下文是灾难——先裁剪到模型需要的最小字段
interview:
  - q: 什么是上下文工程？和 Prompt 工程有什么区别？为什么"长上下文模型"没有让它变得不重要？
    answerSkeleton: >-
      【分层原理】Prompt 工程关注"指令怎么写"，上下文工程关注"进模型的全部信息怎么选、
      怎么组装、怎么压缩"——包括对话历史、检索块、工具输出、记忆、few-shot 示例的取舍
      与排序。长上下文没有消灭它，原因有三：一是 lost-in-the-middle——大量实验表明模型
      对上下文中段信息的利用率显著低于头尾，塞得越多中段越成噪音池；二是成本与延迟随
      长度近似线性上涨，全塞等于每轮对话都为历史买全单；三是干扰——无关信息不仅浪费，
      还会主动带偏模型（检索到相似但错误的块时模型经常被带跑）。【实际案例】我在一个
      多轮客服助手里做过上下文重构：原方案是把全部历史 + top-8 检索块直接拼接，第 15
      轮对话时单轮成本到了 0.4 元且答案开始"记混"用户前面说过的话。改成三层组装——
      最近 4 轮原文保留 + 更早历史滚动摘要 + 检索块去重裁剪到 top-3——单轮成本降 62%，
      多轮一致性（答案与历史事实冲突率）从 11% 降到 3%。【举一反三】前端同构：列表
      虚拟化（只渲染可视区）≈ 只保留近期上下文；Redux selector 精确订阅 ≈ 检索块精准
      筛选；数据规范化防冗余 ≈ 检索去重。你早就懂上下文工程，只是换了个战场。
      【扣分点对照】只答"写好 prompt 就行、窗口够大"的是没算过账；能讲出
      lost-in-the-middle、组装三层结构、去重裁剪的量化收益的，才是做过生产上下文
      设计的人。
    followups:
      - 对话历史压缩成摘要时，怎么防止摘要丢关键信息（如用户手机号）？
      - 上下文里各部分的顺序怎么影响模型行为？system prompt 放最前还是最后？
  - q: 设计一个多轮 Agent 的上下文管理方案：对话很长、有工具调用、有用户画像，怎么组装每一轮的上下文？
    answerSkeleton: >-
      【分层原理】按"信息生命期"分层管理。稳定层：system prompt + 用户画像（长期记忆
      提取的偏好标签）——每轮都带且内容稳定，利于 prompt 缓存命中；会话层：对话历史
      ——最近 N 轮原文 + 更早的滚动摘要，关键实体（订单号、手机号）用结构化字段单独
      抽取防摘要丢失；工作层：当前任务的工具调用记录——只保留结论不保留原始输出，
      原始输出裁剪成模型需要的最小字段；注入层：本轮检索/工具的即时结果——放最靠近
      问题的位置利用 recency 效应。再加两条工程纪律：每轮组装前算 token 预算，超预算
      按"工作层→会话层→稳定层"的顺序裁剪；上下文版本化（记录每轮实际喂了什么），
      否则线上问题无法复现。【实际案例】我在运维助手里实现过这套：早期把工具返回的
      完整监控 JSON（单次 8k token）原样进上下文，五轮对话后窗口就爆了；改成"工具
      输出即时裁剪 + 结论留存"后，单轮工作层稳定在 800 token 以内，50 轮长会话也
      不爆。另一个教训是关键实体丢失：用户第 3 轮给的服务器 IP 在第 20 轮被摘要
      磨没了，Agent 开始"重新询问"，加了实体卡（entity card）机制才根治。
      【举一反三】这个分层和前端的缓存分层（内存缓存→localStorage→网络）同构：
      按变化频率与重要度决定放哪层、留多久。【扣分点对照】只说"把历史都带上、
      不够用 RAG"的是单层思维；能按生命期分层、讲出实体丢失/工具输出爆炸这两个
      真实坑的，才是运维过长会话 Agent 的人。
    followups:
      - 上下文版本化具体记什么？为什么它对线上排查重要？
      - prompt 缓存（prompt caching）和你的分层设计怎么配合？
