id: llm.transformer-intuition
title: Transformer 架构直觉（不推公式）
summary: 通过 nanoGPT 代码理解 Transformer 的工作机制：Embedding、Attention、前馈网络、生成循环。目标是可以向同事讲清楚"模型是怎么吐出下一个词的"，而非推导数学。
tracks: [frontend-to-ai-engineer]
phase: 0
prerequisites: [llm.tokens-and-context]
estimatedMinutes: 120
difficulty: 3
frontendBridge: >-
  把 Transformer 想成一个极致优化的"查表 + 加权投票"状态机：
  Embedding ≈ 把 token 映射成向量的字典；Attention ≈ 每个位置
  对所有历史位置做一次带权重的 reduce；生成循环 ≈ 一个
  每次把输出拼回输入的递归渲染。不需要懂矩阵求导，
  需要懂"信息在层间如何流动"。
concepts:
  - Embedding：token → 高维向量，语义距离 ≈ 向量距离（这也是 RAG 的地基）
  - Self-Attention：每个位置对上下文加权求和，权重由 Q/K 相似度决定
  - 多头注意力：多组权重并行关注不同模式
  - 因果掩码：生成时只能看左边，保证自回归
  - 生成循环：一次前向 = 一个 token，输出拼回输入再算下一个——这就是流式 API 存在的原因
sourceIds: [attention-paper, karpathy-nanogpt, karpathy-lets-build-gpt]
gotchas:
  - 不要陷入数学推导：应用层工程师需要的是架构直觉与复杂度认知（Attention 是 O(n²)），不是反向传播
  - '"上下文窗口"的物理来源就是 Attention 的 O(n²) 计算量——窗口越长越贵不是商业定价是算法定价'
  - nanoGPT 是教学实现，生产模型有大量工程优化（KV Cache 等），别把教学代码当性能基准
interview:
  - q: 不用数学公式，解释 Attention 在做什么？
    answerSkeleton: >-
      【分层原理】分三层讲直觉。第一层查表：Embedding 把每个 token 映射成一个高维向量，语义
      相近的词向量距离也近——这是"词变成数字"的入口，也是 RAG 向量检索的地基。第二层加权
      投票：Self-Attention 让每个位置对上下文里所有位置做一次"我想找什么（Q）vs 我能提供
      什么（K）"的相似度匹配，softmax 归一化成权重后对内容（V）加权求和——效果是每个词
      参考最相关的上下文来更新自己的表示。"苹果"在"吃苹果"和"苹果手机"里得到不同的新
      表示，靠的就是它；多头注意力则是多组 Q/K/V 并行，各关注语法、指代、语义等不同模式。
      第三层生成循环：因果掩码保证每个位置只能看左边，模型一次前向吐一个 token，把输出拼回
      输入再算下一个——这就是自回归，也是流式 API 存在的物理原因。【实际案例】我给团队做
      内部分享时用 nanoGPT 逐行走过这个流程：把"The animal didn't cross the street because
      it was too tired"喂进去再可视化注意力权重，能清楚看到"it"的权重压在"animal"上——
      指代消解不是模型"懂语法"，而是注意力真的把信息从 animal 位置搬到了 it 位置。这个
      demo 之后组里前端同学对"embedding 是语义的地基"再没疑问，因为他们亲眼看到向量距离
      和注意力权重是同一枚硬币的两面。【举一反三】前端映射：Attention ≈ 对数组做 reduce，
      每个元素对其他所有元素加权聚合；生成循环 ≈ 每次把输出拼回输入的递归渲染。O(n²) 的
      直觉也因此成立——n 个位置两两算相似度，长度翻倍算力翻四倍，这就是上下文窗口"越长
      越贵"的算法定价来源，不是商业定价。【扣分点对照】背八股的会背 Q、K、V 三个名词加
      "缩放点积"四个字；真有直觉的能拿具体句子讲清指代消解中信息怎么流动，并把 O(n²) 与
      "窗口越长越贵"的因果链讲完整。
    followups:
      - 为什么上下文变长推理成本显著上升？（提示：O(n²) 的计算账加 KV cache 的内存账）
      - KV Cache 缓存了什么？为什么能加速？（提示：历史 K/V 不重复计算，空间换时间）
      - 因果掩码去掉会怎样？（提示：训练时看到答案，生成与训练不一致）
  - q: 为什么说"模型没有记忆，只有上下文"？这和幻觉有什么关系？
    answerSkeleton: >-
      【分层原理】三层含义。第一层推理无状态：模型权重在训练后冻结，推理时唯一的信息来源就是
      当前请求的上下文窗口——窗口外的东西对它来说不存在。你昨天和它聊的内容、它上一轮
      "知道"的事实，只要不在这轮的 context 里，就等于从未发生。第二层生成机制：模型只做
      一件事——根据上下文预测下一个 token 的概率分布再采样。它不是在"查数据库回答问题"，
      而是在"续写一段看起来像答案的文本"。第三层由此推出幻觉的本质：当上下文里没有支撑
      事实时，概率分布照样给出一个流畅的续写——训练数据里高频出现的模式会被当作"最可能的
      下一个 token"输出，编造由此发生。幻觉不是偶发 bug，而是"下一个 token 预测"这一机制
      的必然副产品。【实际案例】我在知识库问答项目里验证过这个机制：同一篇文档摘要，放在
      上下文里时模型回答准确率 91%；不放、直接问同样的问题，它照样给出结构完整、语气自信的
      答案，准确率却只有 34%——剩下的全是训练数据里"最像答案"的编造。这直接定了工程
      纪律：事实性回答必须有检索上下文支撑，宁可拒答也不让模型裸奔。另一个推论也被反复
      验证：多轮对话里模型"记住"的偏好，其实只是 messages 数组被全量重发——把那条消息
      从数组里删掉，它立刻"忘记"。【举一反三】这和前端的纯函数组件完全同构：输出等于
      f(props)，组件本身没有记忆，状态全靠外部传入再渲染。useState 相当于客户端维护
      messages 数组——记忆是应用层的工程，不是模型的能力。【扣分点对照】背八股的会说
      "模型是概率模型所以会幻觉"；真有直觉的能把"推理无状态到唯一信息源是上下文到缺失
      时照样流畅续写"这条因果链讲完整，并举出"放不放上下文、准确率差三倍"的对照实验。
    followups:
      - 既然无状态，ChatGPT 的"记忆"功能是怎么回事？（提示：应用层抽取记忆再注入上下文）
      - KV cache 算不算模型的"记忆"？（提示：单次生成内的计算缓存，跨请求不存在）
      - 这个机制认知如何直接指导 RAG 设计？（提示：无上下文宁可拒答、强制引用来源）
