id: python.for-js-devs
title: Python 语法速通（TS 工程师视角）
summary: 只学与 TypeScript 有映射关系的 Python 核心语法：变量、数据结构、函数、类、模块。跳过与 JS 同构的部分，聚焦差异点。
tracks: [frontend-to-ai-engineer]
phase: 0
prerequisites: []
estimatedMinutes: 90
difficulty: 2
frontendBridge: >-
  Python 与 TS 共享绝大多数概念：list≈Array、dict≈Object/Map、
  f-string≈模板字符串、切片≈slice。真正的差异只有四个：
  缩进即作用域、无可变/不可变声明区分（const 缺失）、
  鸭子类型 + 运行时报错文化、import 机制基于文件路径。
concepts:
  - 缩进即作用域：Python 用缩进表达代码块，这是语法而非风格
  - 可变与不可变：list/dict/set 可变，str/tuple/int 不可变——影响函数传参行为
  - 鸭子类型："看起来像鸭子就是鸭子"，类型约束靠约定与运行时检查
  - 解包与切片：a, b = pair、items[1:3]，对应 JS 解构但更强
  - 推导式：[x*2 for x in items if x > 0] ≈ filter+map 链
  - dict 自 3.7 起保证插入序：遍历顺序可预测，工程上可以依赖
sourceIds: [python-docs, learn-python-repo]
gotchas:
  - 默认参数是可变对象（如 def f(x=[])) 会在多次调用间共享状态——经典面试坑
  - == 与 is 的区别：is 比较身份，== 比较值；小整数与短字符串会被驻留导致 is 偶然为真
  - 除法 / 永远返回 float，整除用 //
  - 浅拷贝只拷外层：嵌套 list 的内层仍是引用，改一处另一处跟着动
interview:
  - q: Python 的核心数据类型和 JS 比，关键差异在哪？你们前端转过来的人最容易在哪栽跟头？
    answerSkeleton: >-
      【分层原理】差异集中在三处。一是可变性：list/dict/set 可变，str/tuple/int 不可变，
      且 Python 传参传的是对象引用——函数内对可变对象原地修改会穿透到调用方，而 Python 没有
      const，"约定不改"全靠纪律。二是 == vs is：== 调 __eq__ 比值，is 比对象身份（CPython
      里就是内存地址）；CPython 对 -5 到 256 的小整数和短字符串做驻留，is 偶然为真，让人
      误以为 is 能当 == 用，换台机器、换个数据规模就翻车。三是布尔语义：空容器、0、None
      全是 falsy，if items 是惯用写法，但这意味着"空列表"和"None"在布尔上下文里不可区分，
      需要区分时必须显式 is None。【实际案例】我写日志分析脚本时踩过 bool 语义的坑：函数
      返回匹配结果列表，调用方写 if result 处理，结果"匹配到 0 条"和"查询失败返回 None"
      走了同一分支，失败被静默吞掉，两天后看监控才发现上游接口一直在报错——改成 if result
      is not None 才修复。is 的坑也踩过：if tag is "admin" 本地恰好为真（驻留命中），预发
      环境就是假，改 == 才稳定。【举一反三】映射回 TS：readonly 对应不可变约定，Object.is
      vs === 对应 is vs ==，JS 的 falsy 家族（空串/0/null/undefined/NaN）和 Python 一一
      对应——但 Python 函数返回 None 是常态，None 混入布尔判断的坑比 JS 的 undefined 更深。
      【扣分点对照】背题答案是"list 可变 tuple 不可变、== 比值 is 比地址"两句话；有深度的
      能讲出驻留机制制造的 is 假象、falsy 语义吞掉错误的真实 bug 形态，以及无 const 带来的
      纪律成本。
    followups:
      - 为什么 f(None) 和 f() 不传参不一样？怎么区分"没传"和"传了 None"？
      - float('nan') == float('nan') 是什么结果？JS 里呢？
      - is 比较在两个看起来一样的字符串上结果不一致，为什么？
  - q: def f(x=[]) 这种写法为什么会"记住"上一次的值？从原理讲清楚，再说怎么修。
    answerSkeleton: >-
      【分层原理】根因是默认参数的求值时机：def 语句执行时（即函数定义时），默认参数表达式
      只求值一次，结果对象被存进函数对象的 __defaults__ 元组，之后每次调用只要没传该参数，
      用的都是同一个对象——f.__defaults__[0] 就是那个跨调用共享的 list。这和 JS 本质不同：
      JS 默认参数在每次调用时重新求值，思维直接平移必中招。正确修法是用不可变哨兵：
      def f(x=None)，函数体内 if x is None: x = []。注意必须用 None 而不是空 list 当哨兵，
      因为空 list 一样是定义时求值的可变对象；判断也必须写 is None 而不是 if not x——否则
      调用方显式传进来的空 list、0、空串都会被误判成"没传"。【实际案例】我在 Flask 后端项目
      里写过 def collect_tags(tag, tags=[]) 的辅助函数，本地单测怎么跑都对——每个测试进程
      独立，状态不跨进程。上线后用户反馈"别人的标签串到了我的文章上"，排查发现那个默认 list
      在多请求间累积，两天污染了三百多篇文章的标签。改成 None 哨兵模式才根治，并补了
      flake8-bugbear 的 B006 规则做团队级防线，CI 上同类写法直接打回。【举一反三】这和 JS
      var 时代 for 循环包 setTimeout 的经典闭包题同构——都是"绑定时机"理解偏差，默认参数
      就是那个"定义时绑定"的陷阱；修复思路也同构：把值在正确的时机（每次调用）重新创建。
      【扣分点对照】背题答案是"可变默认参数有坑，用 None 代替"；有深度的能讲出 __defaults__
      的存储位置、定义时求值一次的机制、"单测不复现、上线才爆"的状态污染形态，以及为什么
      判断必须 is None 而不是 not x。
    followups:
      - 为什么不可变默认参数（如 x=0、x="abc"）就没有这个问题？
      - 想在函数间共享计数器，正确做法是什么？（提示：闭包、类属性、显式传参）
      - 装饰器叠加默认参数时，这个坑会以什么新形式出现？
  - q: 真实脚本里 list/tuple/dict/set 你怎么选？比如统计日志词频、配置常量、去重这些场景。dict 保序对你有实际意义吗？
    answerSkeleton: >-
      【分层原理】选型看三件事：语义、可变性、查询模式。list 是同质有序集合，tuple 是固定
      结构的记录（坐标、函数多返回值），dict 是键值映射，set 是成员判断与去重。实战映射：
      统计日志词频用 dict（或 collections.Counter），key 是词、value 是计数，O(1) 累加；
      配置常量用 tuple 或 dict——"不该变"要用类型表达出来，比如 ALLOWED_METHODS = ("GET",
      "POST")，读代码的人一看就知道意图；去重先转 set 再决定要不要回 list。dict 在 3.7+
      保证插入序（3.6 是 CPython 实现细节，3.7 才写进语言规范），工程意义很实际：配置文件
      按书写顺序遍历、JSON 序列化输出字段顺序稳定、用 dict 当"有序去重容器"（dict.fromkeys）
      都依赖这个保证。【实际案例】我在数据管道项目里用 dict 做去重缓存，key 是
      (user_id, date) 二元组，一切正常；后来需求加标签维度，同事把 key 改成嵌了 list 的
      tuple，直接 TypeError: unhashable type 打爆线上日志——tuple 只在"元素全部可哈希"时
      才可哈希。更隐蔽的一次是缓存 value 存了 list 引用，别处原地 append 了一个元素，缓存
      命中率从 92% 掉到 71%，key 没变但 value 被"隔空改了"。从此团队约定：跨函数传递的固定
      结构一律 tuple 或 NamedTuple，多返回值不塞 list 充数。【举一反三】映射回前端：tuple
      ≈ TS 的 readonly tuple，dict 保序 ≈ JS 的 Map（Object 的键序规则反而坑多），set ≈
      Set——语义选型思维完全平移。【扣分点对照】背题答案是"要改就用 list，不改就用 tuple"；
      有深度的能讲出 unhashable 的边界场景、dict.fromkeys 有序去重、保序对序列化稳定性的
      工程价值。
    followups:
      - Counter 和手写 dict 统计比，多了哪些能力？（提示：most_common、加减运算）
      - 去重后要保持原顺序，怎么做？（提示：dict.fromkeys）
      - 什么场景下 set 会反而害了你？（提示：无序、不可索引、元素必须可哈希）
  - q: 嵌套列表浅拷贝后改一处另一处跟着动，这种 bug 你怎么排查？
    answerSkeleton: >-
      【分层原理】先讲机制：浅拷贝（copy.copy、list.copy、切片 [:]）只复制最外层容器，内层
      对象仍是引用共享——外层 list 是新的，里面的每个子 list 还是原来那几个对象。排查三板斧：
      先用 id() 或 is 确认"两个看着独立的对象是不是同一个"（id(a[0]) == id(b[0]) 即坐实引用
      共享）；再用 == 排除干扰——== 为 True 只说明值相等，不说明身份独立，很多人在这一步把
      "值相等"误判成"拷贝成功"；确认是引用问题后，嵌套结构必须 copy.deepcopy 递归复制，单层
      结构用 list.copy 就够。deepcopy 的代价也要知道：递归遍历整张对象图，大对象图上有性能
      成本，且遇到自引用结构靠 memo 字典防死循环。【实际案例】我在评测平台做过一个矩阵配置
      功能：用 template = [[0] * 3] * 3 初始化表格，改 template[0][1] = 1 后整列都变成
      1——[[0]*3]*3 外层是同一子 list 的三次引用，内层 * 复制的是 int 所以内层没事。单测
      没抓到是因为断言只查了总和。上线后报表数据全错位，排查时先把两个"独立"行的 id 打印
      出来，发现 id 相同才定位到初始化写法。修复改列表推导 [[0]*3 for _ in range(3)]，并给
      团队 Wiki 加了"乘法初始化只适用于不可变元素"的条目。【举一反三】这和前端
      {...obj, list: obj.list} 浅展开后改 list 影响原对象是同一个坑，React 状态不可变更新
      要 spread 到修改路径的每一层——JS 的 structuredClone 对应 Python 的 deepcopy。
      【扣分点对照】背题答案是"浅拷贝只拷一层"；有深度的能讲出 id()/is 确认引用共享的排查
      路径、[[0]*3]*3 这种乘法初始化的具体炸法，以及 deepcopy 的性能代价与适用边界。
    followups:
      - deepcopy 遇到循环引用为什么不会死循环？（提示：memo 字典记录已拷贝对象）
      - 自定义对象怎么控制它被 copy/deepcopy 时的行为？（提示：__copy__ / __deepcopy__）
      - 什么时候浅拷贝反而是对的？（提示：共享只读大对象、拷贝意图本就是"新容器旧内容"）
