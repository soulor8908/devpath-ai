id: python.for-js-devs
title: Python 语法速通（TS 工程师视角）
summary: 只学与 TypeScript 有映射关系的 Python 核心语法：变量、数据结构、函数、类、模块。跳过与 JS 同构的部分，聚焦差异点。
tracks: [frontend-to-ai-engineer]
phase: 0
prerequisites: []
estimatedMinutes: 90
difficulty: 2
frontendBridge: >-
  Python 与 TS 共享绝大多数概念：list≈Array、dict≈Object/Map、
  f-string≈模板字符串、切片≈slice。真正的差异只有四个：
  缩进即作用域、无可变/不可变声明区分（const 缺失）、
  鸭子类型 + 运行时报错文化、import 机制基于文件路径。
concepts:
  - 缩进即作用域：Python 用缩进表达代码块，这是语法而非风格
  - 可变与不可变：list/dict/set 可变，str/tuple/int 不可变——影响函数传参行为
  - 鸭子类型："看起来像鸭子就是鸭子"，类型约束靠约定与运行时检查
  - 解包与切片：a, b = pair、items[1:3]，对应 JS 解构但更强
  - 推导式：[x*2 for x in items if x > 0] ≈ filter+map 链
sourceIds: [python-docs, learn-python-repo]
gotchas:
  - 默认参数是可变对象（如 def f(x=[])) 会在多次调用间共享状态——经典面试坑
  - == 与 is 的区别：is 比较身份，== 比较值；小整数与短字符串会被驻留导致 is 偶然为真
  - 除法 / 永远返回 float，整除用 //
interview:
  - q: Python 的列表和元组有什么区别？工程上怎么选？
    answerSkeleton: >-
      list 与 tuple 的本质差异是可变性：list 可变（append/pop/in-place 修改），tuple 不可变。
      由此派生两个工程意义：一是 tuple 在元素全部可哈希时可哈希，能作为 dict 的 key 或 set 的元素
      （注意是"元素全部可哈希"才成立——tuple 里套 list 照样不可哈希，这是资深面试官爱挖的坑），
      list 不行；二是语义约定——tuple 表"固定结构的记录"（如坐标、数据库行），list 表"同质集合"。
      性能上 tuple 略快且内存更省，但这是微优化不应作为首选依据。选择规则：字段位置稳定、长度不变
      用 tuple；需要增删或长度可变用 list。前端迁移映射：tuple ≈ TypeScript 的 readonly tuple 类型
      （如 [string, number]），list ≈ T[]。Tradeoff：不可变带来 hashable 与线程安全，但失去灵活性
      ——这也是 React 状态要用不可变更新的同源理由。坑点：可变默认参数（def f(x=[])）会在多次调用间
      共享状态，是经典面试陷阱，用 None + 内部赋值规避。
    followups:
      - 不可变对象作为函数默认参数为什么安全？
      - 深拷贝与浅拷贝在嵌套 list 上的行为差异？
