id: prompt.system-and-fewshot
title: Prompt 工程基础（System 设定与 Few-shot）
summary: System Prompt 的结构化写法、Few-shot 示例的设计原则、输出格式约束。把"写提示词"从玄学变成可复用的工程模板。
tracks: [frontend-to-ai-engineer]
phase: 1
prerequisites: [llm.api-first-call]
estimatedMinutes: 90
difficulty: 2
frontendBridge: >-
  System Prompt ≈ 组件的 props + slots：你在声明"这个对话实例"的行为契约。
  Few-shot ≈ 写测试用例：给模型 2-3 个输入输出示例，
  等价于给函数写了类型签名 + 单元测试——模型按示例归纳模式。
  你在前端写组件接口定义的经验，决定了你写 Prompt 的天花板。
concepts:
  - System Prompt 三段式：角色与目标 → 行为约束 → 输出格式
  - Few-shot：示例质量 > 数量；示例要覆盖边界情况
  - 指令层级：system > user，但都可被后续输入稀释——关键约束要重复与后置
  - 输出格式约束：明确给出 JSON 模板或分隔符，比"请输出 JSON"可靠一个量级
sourceIds: [anthropic-prompt-engineering, openai-cookbook, promptingguide]
gotchas:
  - 提示词不是越长越好：无关细节稀释注意力，关键约束被淹没
  - 示例中的错误格式会被模型忠实模仿——Few-shot 必须人工校对
  - '"请确保输出合法 JSON" 是祈祷不是工程——格式约束要配合结构化输出或后处理校验'
interview:
  - q: Few-shot 示例的选择原则是什么？
    answerSkeleton: >-
      【分层原理】四条原则，每条背后都有翻车形态。覆盖性：示例要覆盖典型 case 和边界 case（空输入、
      异常格式、多义场景），只给"顺境"示例，模型遇到逆境就自由发挥。格式严格一致：所有示例的
      输入输出结构、标点、字段顺序必须完全统一——模型对格式的模仿是字面级的，示例里的瑕疵会被
      忠实复制放大。数量与顺序：2-5 个为宜，再多边际收益递减还推高成本；顺序敏感，靠近用户真实
      query 的示例权重更高（recency bias），把最相似的示例放最后。分布对齐：示例的输入分布要和
      线上真实分布一致——示例全是短句、线上全是长段落，学到的模式会错位。【实际案例】我在"用户
      反馈自动分类"任务上踩过格式一致性的坑：5 个示例里有一个的输出 JSON 多了个尾逗号（手滑），
      模型在约 11% 的输出里也带上同样的尾逗号，下游解析批量失败——一个标点污染了整个 prompt。
      修复后立下纪律：示例必须过和线上一致的校验器才能进 prompt。另一次是边界示例的价值：业务方
      反馈"模型把表扬信分成投诉"，加了两条"表面抱怨实则表扬"的边界示例后，这类误判从 17% 降到
      4%。【举一反三】Few-shot ≈ 给函数写测试用例：要正例也要反例，断言格式要统一，用例要贴近
      真实输入分布——你写测试的直觉全部适用，区别只是"被测对象"是个概率模型。【扣分点对照】
      背八股的答案是"示例要好、要多样"；真做过的能讲出格式瑕疵被字面模仿的翻车案例、recency bias
      的顺序策略、以及"示例也要过校验器"这种工程纪律。
    followups:
      - 边界示例（反例）给多少合适？给多了有什么副作用？
      - 多个示例的排列顺序具体怎么定？（提示：recency bias，最相似的放最后）
      - 怎么验证示例本身的质量？（提示：过校验器、人工校对、A/B 对比）
  - q: 静态 Few-shot 有什么局限？动态 Few-shot 怎么做？System prompt 里的关键约束为什么会被模型"忘掉"？
    answerSkeleton: >-
      【分层原理】静态 few-shot 的局限是"一套示例打天下"：输入分布稍广，固定示例对很多 query 就
      不相关，不相关的示例不但没帮助还会带偏输出。动态 few-shot 把示例库当检索库：离线把所有候选
      示例 embedding 入库，运行时按当前 query 的语义相似度召回 top 2-3 条注入 prompt——本质是把
      RAG 用在 prompt 组装上，示例从"常量"变成"按 query 定制的上下文"，代价是每次调用多一次检索
      （几十毫秒）和一套示例库治理工作。指令稀释是另一个相关坑：system prompt 的约束会在长输入中
      被后续内容"冲淡"——模型对靠近末尾的内容权重更高（recency bias），所以关键约束（输出格式、
      安全红线）光在 system 里说一遍不够，要在用户消息侧重复或后置；这也是动态示例放在 query 附近
      更有效的原因之一。【实际案例】我在多行业工单分类项目实测过动静对比：静态 5 条通用示例，跨
      行业准确率 83%；换成按 query 检索的动态示例（示例库 200 条带行业标签）后到 91%，提升集中在
      长尾行业——它们的 query 终于能召回到同行业示例。踩的坑是示例库治理：早期示例不带标签，
      检索经常召回"语义像但业务规则不同"的示例（把售后政策示例召回给售前咨询），准确率反而比静态
      低 3 个点，加了行业/意图两级过滤才转正。【举一反三】动态 few-shot ≈ 前端按上下文渲染不同
      内容：静态示例是写死的 skeleton，动态示例是按路由参数请求的数据；示例库的过滤治理 ≈ 你做
      搜索推荐时的过滤与排序。【扣分点对照】只会背"给模型几个例子"的是入门级；能讲出动态 few-shot
      的检索架构与成本、示例库不带业务标签会负优化、指令稀释/recency bias 为什么让"示例放最后"
      成为共识的，才是把 prompt 当系统做过的人。
    followups:
      - 动态 few-shot 检索召回了错误示例，会比静态示例更糟吗？怎么兜底？
      - 关键约束放 system 里还是 user 消息末尾？你做过实测对比吗？
