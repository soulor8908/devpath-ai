id: python.type-hints-pydantic
title: 类型提示与 Pydantic 数据校验
summary: Python type hints 的语法与工程价值；Pydantic 模型定义、校验与序列化——这是 AI 系统中校验 LLM 输出的标准工具。
tracks: [frontend-to-ai-engineer]
phase: 0
prerequisites: [python.for-js-devs]
estimatedMinutes: 90
difficulty: 2
frontendBridge: >-
  type hints ≈ TypeScript 类型标注，但只是"提示"，运行时不强制。
  Pydantic ≈ Zod：schema 定义 + 运行时校验 + 类型推导一体。
  你在前端用 Zod 校验 API 响应的心智模型可以直接平移——
  区别是 Pydantic 更深地进入了语言生态（FastAPI、LangChain 全部建立在它之上）。
concepts:
  - type hints 是静态检查工具（mypy/pyright）的输入，运行时不生效
  - Pydantic BaseModel：声明式 schema，校验失败抛 ValidationError
  - Field 约束：默认值、范围、正则、自定义 validator
  - model_dump / model_validate：序列化与反序列化的显式边界
  - 在 AI 工程中的角色：LLM 输出的第一道类型闸门
sourceIds: [pydantic-docs, python-docs]
gotchas:
  - type hints 不阻止运行时类型错误——把它当文档 + lint，别当运行时保障
  - Pydantic v1 与 v2 API 差异巨大（parse_obj → model_validate），网上旧教程需甄别
  - 严格模式（strict=True）下 "1" 不会自动转 1——处理 LLM 输出时要明确选择
interview:
  - q: 为什么 Python 有了 type hints 还需要 Pydantic？
    answerSkeleton: >-
      Python 有了 type hints 还需要 Pydantic 的根本原因是 type hints 只在静态检查（mypy/pyright）时生效，
      运行时完全不强制——而真实世界的运行时数据（网络响应、用户输入、LLM 输出）从来不可信。type hints 是
      "文档 + lint"，Pydantic 是"运行时闸门"：它提供 BaseModel 声明式 schema、运行时校验、类型 coercion
      （可配置严格度）、序列化（model_dump / model_validate）、错误结构化（ValidationError）。在 AI 工程中
      Pydantic 是 LLM 输出的第一道类型闸门——配合 Structured Outputs 用 schema 约束生成，再用 Pydantic
      校验解析结果，失败时把 ValidationError 信息回喂模型重试。生态集成是关键：FastAPI、LangChain 全部建立
      在 Pydantic 之上。前端迁移映射：type hints ≈ TypeScript 类型标注，Pydantic ≈ Zod——你在前端用 Zod
      校验 API 响应的心智直接平移，区别是 Pydantic 在 Python 生态渗透更深。Tradeoff：strict 模式不自动
      coercion，处理 LLM 输出要明确选择严格还是宽松。
    followups:
      - Pydantic 校验失败的错误信息结构是怎样的？怎么用于 LLM 输出重试？
      - strict 模式与 lax 模式各自适合什么场景？
