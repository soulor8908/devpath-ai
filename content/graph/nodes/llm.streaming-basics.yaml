id: llm.streaming-basics
title: 流式响应（SSE 基础）
summary: 服务端推送的流式协议、增量事件解析、客户端断线处理。流式是 AI UX 的物理基础——首 token 延迟决定产品的"快"感。
tracks: [frontend-to-ai-engineer]
phase: 0
prerequisites: [llm.api-first-call]
estimatedMinutes: 90
difficulty: 2
frontendBridge: >-
  SSE ≈ 一个不会自动关闭的 fetch 响应，服务端持续往连接里写文本块。
  你处理过分块传输、做过打字机效果，这里的增量心智完全一致：
  区别是数据语义——每个 chunk 是一小段 JSON delta，
  需要按 OpenAI 协议拼接成完整消息，中途断线要能续传或降级。
concepts:
  - "SSE 协议：text/event-stream，data: 前缀行，[DONE] 终止标记"
  - 增量 delta：每个 chunk 只含新增 token，客户端负责拼接
  - 首 token 延迟（TTFT）：用户感知"快"的核心指标
  - 断线与重连：网络抖动时的续传、幂等与内容去重
sourceIds: [openai-streaming, mdn-sse, deepseek-api-docs]
gotchas:
  - SSE 是单向协议：客户端→服务端仍走普通 POST，别试图在 SSE 里回写
  - 浏览器原生 EventSource 不支持自定义 header/POST，生产环境用 fetch + ReadableStream 解析
  - 拼 chunk 时绝不能假设每次收到完整 JSON——缓冲区必须按 \n\n 分割事件
interview:
  - q: 讲讲 SSE 协议的报文格式。TTFT 为什么是 AI 产品的关键体验指标？
    answerSkeleton: >-
      【分层原理】SSE（Server-Sent Events）是基于 HTTP 的单向文本推送协议：响应头 Content-Type:
      text/event-stream，连接保持不断开，服务端持续往里写事件；每个事件由若干 data: 前缀行组成，
      事件之间用空行（两个换行）分隔；OpenAI 兼容协议里每个 data 载荷是一个 JSON chunk，内含增量
      delta，客户端拼接成完整消息，流末尾发 data: [DONE] 标记终止。TTFT（首 token 延迟）是关键的
      原因：LLM 逐 token 生成，一段 300 token 的回复完整生成要 8-15 秒，但首 token 只要几百毫秒到
      2 秒——流式把用户感知延迟从"TTFT 加全量生成时间"压到"TTFT"，等待从盯空白变成看字往外冒。
      所以 AI 产品的"快"感由两个独立指标构成：TTFT 决定第一下快不快，生成速度决定后面顺不顺，
      优化手段完全不同。【实际案例】我们 A/B 过流式与非流式：同样 12 秒总生成时间，非流式组约三成
      用户 5 秒内关掉页面，流式组中途退出率只有 7%——内容一个字没变，只是呈现节奏变了。之后把
      TTFT 从 1.8s 优化到 0.9s（prompt 瘦身加换更近的接入点），首响满意度又提 11 个百分点：流式
      解决"等待中的体验"，TTFT 优化解决"等待本身"，两者是乘积关系。【举一反三】TTFT ≈ FCP，逐字
      渲染 ≈ 渐进式渲染，SSE ≈ 不自动关闭的 fetch 响应——你做过骨架屏和流式 SSR，就是同一种"先给
      确定性、再给完整性"的哲学。【扣分点对照】背题的会说"流式提升用户体验"；真做过的能默写 SSE
      报文格式（text/event-stream、data: 前缀、空行分隔、[DONE]），并区分 TTFT 与总时延两个指标、
      给出 A/B 量化结果。
    followups:
      - 浏览器原生 EventSource 有什么限制？生产替代方案？
      - 客户端按什么边界切事件？为什么不能收到就 JSON.parse？
      - SSE 和 WebSocket 在这个场景怎么选？
  - q: 流式输出能降低成本或总延迟吗？为什么？
    answerSkeleton: >-
      【分层原理】都不能——流式改变的是呈现节奏，不改变生成机制。模型仍是全量自回归：每个 token
      都要等前一个生成完才能算，总生成时间 = TTFT + 生成速度 × 输出长度，一个 token 都不会少算；
      计费按 token 数，流式与非流式输入输出完全相同，账单一分不差。它唯一压缩的是用户感知延迟：
      从"TTFT 加全量时长"压到"TTFT"，因为第一个 token 到达后用户就开始读了，阅读和生成并行。把
      时延拆开看更清楚：TTFT 由排队加 prefill（输入处理）决定，流式帮不上；总时延由 decode（逐
      token 生成）主导，流式也帮不上；流式优化的是介于两者之间的心理体验层。推论：要真降延迟手段
      在别处——小模型、限输出长度、prompt 缓存降 TTFT、并发与批处理降排队；流式是必做项但不是
      性能优化项。【实际案例】我们踩过"以为上了流式就快了"的误区：客服场景流式上线后满意度涨了，
      但用户还是嫌"等第一段要两秒"。后来专项压 TTFT——system prompt 从 800 token 砍到 350、上
      prompt 缓存、换同区域接入点——TTFT 从 1.8s 到 0.9s，满意度才又跳一档。两个优化解决的是
      不同指标，账要分开算。还有个副作用常被忽略：流式让用户更早看到答案开头，答案跑偏时用户能
      更早打断，反而省下了后半段的无效输出 token。【举一反三】和"骨架屏不缩短接口耗时但降低感知
      等待"一模一样——感知
      优化与真实优化是两条线，汇报指标时混用就是自欺欺人。【扣分点对照】说"流式更快所以更省钱"
      的暴露了没算过账；能拆出 TTFT/decode/感知三层、讲清流式只动第三层、并举出 TTFT 专项数据的，
      才是懂延迟结构的人。
    followups:
      - TTFT 由哪几部分构成？各自的优化手段是什么？
      - 既然不省成本，说服产品上流式的论据是什么？（提示：A/B 退出率数据）
      - 非流式在什么场景反而是正确选择？（提示：离线批处理、结构化提取）
  - q: 后端转发 LLM 的流式响应，完整链路上有哪些坑？
    answerSkeleton: >-
      【分层原理】链路是 LLM 服务商到我们的后端再到 Nginx 再到浏览器，每一跳都可能把"流"憋成
      "批"。Nginx 反向代理默认开 proxy_buffering，会把上游响应攒在缓冲区再发——用户看到"憋十秒
      一整段弹出来"，必须 proxy_buffering off（或上游返回 X-Accel-Buffering: no 头）。gzip 与压缩
      中间件同理：压缩器要攒够数据块才输出，SSE 路由必须绕过压缩。后端转发要用流式读写（Node 里
      pipe 流，别 await res.text()），框架自带的响应缓存、body 解析中间件也可能先收全量再转发。
      连接管理：SSE 是长连接，LB 与代理的空闲超时要调大，否则几十秒无数据就被掐断；长连接吃并发
      连接数，容量要重算；读超时与写超时分开配。另外每一跳写完 chunk 都要立即 flush，否则缓冲区
      攒批。【实际案例】我们上线第一天就翻车：本地直连 LLM 测试打字机正常，过 Nginx 后用户反馈
      "一整段弹出"，查了两小时定位到 proxy_buffering，加 X-Accel-Buffering: no 立刻恢复。第二坑是
      框架的全局 gzip 中间件没排除 SSE 路由，随机性攒批。两坑后来都进了团队 checklist，并补了
      mock 拆包流的集成测试。【举一反三】和你处理大文件下载流式转发是同一条链路：任何一跳"先收
      全量再转发"，流式就死了——检查清单就是逐跳问"你缓冲吗"。【扣分点对照】只会前端 EventSource
      的讲不到这一层；能按链路逐跳报出 buffering/gzip/超时/flush 四个坑位与对应修复的，才是真接过
      流的生产流量。
    followups:
      - 为什么本地开发测不出这些坑？（提示：本地无代理、无中间件、无 LB）
      - 长连接的容量怎么算？和普通短请求 API 有什么差别？
      - 怎么给这条链路写集成测试？（提示：mock 故意拆包、慢速 drip feed）
  - q: 流式中途断了怎么处理？讲完整的恢复与幂等设计。
    answerSkeleton: >-
      【分层原理】分检测、保活、恢复、幂等四件事。检测：客户端设读超时（如 15 秒无新 chunk 判死），
      不能依赖 TCP 层——代理可能静默掐断，连接"看起来活着"。保活：服务端定期发心跳（SSE 注释行
      ":ping"），既防 LB 空闲超时掐连接，也让客户端区分"模型还在想"与"连接已死"。恢复：LLM API
      多数不支持从第 N 个 token 续传，工程上是保留已生成的部分内容展示、提供重试——重发整个请求
      重新生成，新流开始时替换或接续旧内容；关键场景把部分结果边收边落盘，刷新页面不丢。幂等：
      重试就是重新计费，费用与结果都要想清楚——用请求级 idempotency key（提供商支持的话）防重复
      扣费，UI 上重试按钮防连点，自动重试限次数，避免弱网环境反复烧钱。【实际案例】我们的对话
      产品做了三层：心跳每 10 秒一行注释，客户端 15 秒无数据判死；中断后已生成的 200 字保留，用户
      点重试则全量重发并在新流到达时替换旧内容，idempotency key 复用；长报告场景每收到一段就写
      IndexedDB，断网刷新后内容还在。上线后"内容丢一半"的投诉归零，重试产生的重复计费控制在 3%
      以内。【举一反三】和大文件分片上传断点续传、WebSocket 心跳重连是同一套工程词汇：心跳、幂等
      key、本地落盘——只是这里的"已传字节"是已生成 token。【扣分点对照】背题的会说"断线重连"；
      真做过的能讲出心跳帧格式、无续传协议下的"保留加重发"策略、idempotency key 防重复计费，以及
      落盘兜底的层级设计。四件事的优先级是：先让用户不丢内容，再让系统不重复花钱。
    followups:
      - 自动重试和用户手动重试，策略应该一样吗？
      - 已生成部分内容和新流内容冲突时怎么合并？
      - 弱网移动场景下，流式体验怎么兜底？（提示：超时降级非流式）
