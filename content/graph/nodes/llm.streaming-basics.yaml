id: llm.streaming-basics
title: 流式响应（SSE 基础）
summary: 服务端推送的流式协议、增量事件解析、客户端断线处理。流式是 AI UX 的物理基础——首 token 延迟决定产品的"快"感。
tracks: [frontend-to-ai-engineer]
phase: 0
prerequisites: [llm.api-first-call]
estimatedMinutes: 90
difficulty: 2
frontendBridge: >-
  SSE ≈ 一个不会自动关闭的 fetch 响应，服务端持续往连接里写文本块。
  你处理过分块传输、做过打字机效果，这里的增量心智完全一致：
  区别是数据语义——每个 chunk 是一小段 JSON delta，
  需要按 OpenAI 协议拼接成完整消息，中途断线要能续传或降级。
concepts:
  - "SSE 协议：text/event-stream，data: 前缀行，[DONE] 终止标记"
  - 增量 delta：每个 chunk 只含新增 token，客户端负责拼接
  - 首 token 延迟（TTFT）：用户感知"快"的核心指标
  - 断线与重连：网络抖动时的续传、幂等与内容去重
sourceIds: [openai-streaming, mdn-sse, deepseek-api-docs]
gotchas:
  - SSE 是单向协议：客户端→服务端仍走普通 POST，别试图在 SSE 里回写
  - 浏览器原生 EventSource 不支持自定义 header/POST，生产环境用 fetch + ReadableStream 解析
  - 拼 chunk 时绝不能假设每次收到完整 JSON——缓冲区必须按 \n\n 分割事件
interview:
  - q: 为什么 AI 聊天应用都用流式输出？技术上怎么实现？
    answerSkeleton: >-
      【分层原理】分四层讲。价值层：LLM 逐 token 生成，一段 300 token 的回复完整生成要 8-15
      秒，但首 token 只要几百毫秒到 2 秒。流式把用户感知延迟从"TTFT 加全量生成时间"压缩到
      "TTFT"——等待从盯空白变成看字往外冒，感知快 5-10 倍，这是 AI 产品"快"感的物理
      基础。协议层：SSE（text/event-stream）是主流——单向、基于 HTTP、文本协议、自带重连
      语义；每个事件以 data: 前缀行加空行分隔，[DONE] 标记终止，每个 chunk 携带增量 delta，
      客户端拼接成完整消息。实现层：浏览器原生 EventSource 不支持 POST 和自定义 header，
      生产环境用 fetch 加 ReadableStream 手动解析：按字节流读、按空行切事件、逐个解析 data
      载荷。权衡层：流式掩盖不了 TTFT 本身（首字前还是要等），总延迟也不变——它优化的是
      感知不是吞吐；中途断线与 JSON 跨 chunk 边界是必踩的工程坑。【实际案例】我们的对话产品
      A/B 过流式与非流式：同样 12 秒的总生成时间，非流式组约三成用户在 5 秒内关掉页面，流式
      组中途退出率只有 7%——内容一个字没变，只是呈现节奏变了。之后把 TTFT 从 1.8 秒优化到
      0.9 秒（prompt 瘦身加换更近的接入点），首响满意度又提了 11 个百分点：流式解决"等待中
      的体验"，TTFT 优化解决"等待本身"，两者是乘积关系。【举一反三】前端映射完全同构：
      SSE ≈ 不自动关闭的 fetch 响应，chunk 拼接 ≈ 分块传输解码，TTFT ≈ FCP，逐字渲染 ≈
      渐进式渲染。你做过骨架屏和流式 SSR，那是同一种"先给确定性、再给完整性"的哲学。
      【扣分点对照】背八股的会说"提升用户体验"；真做过的能区分 TTFT 与总延迟两个指标、
      给出 A/B 量化结果，并指出流式不省总时间、只改感知。
    followups:
      - 连接在第 50 个 token 时断了，恢复策略是什么？（提示：保留已生成内容加重试，注意费用幂等）
      - EventSource 有哪些限制？生产替代方案？（提示：只支持 GET、无自定义 header）
      - 流式场景怎么统计 token 用量？（提示：请求参数让末段返回 usage，或客户端估算）
  - q: 手写 SSE 解析有哪些坑？讲你踩过的。
    answerSkeleton: >-
      【分层原理】三个坑按出现频率排。一分包边界：TCP 字节流不保证按语义边界送达——一个
      data: 事件可能被拆到两个 chunk 里，一个 chunk 也可能装着两个半事件；绝不能假设每次
      收到完整 JSON，必须维护缓冲区、只按空行切完整事件、切不动的尾巴留给下一轮。二断线
      重连：SSE 是长连接，负载均衡空闲超时、移动网络切换、代理层都会掐断；LLM API 多数不
      支持从第 N 个 token 续传，工程上是保留已生成内容、让用户重试或自动重发——要想清楚
      幂等与费用，重发一次就是重新计费一次。三缓冲陷阱：nginx/网关默认缓冲响应体，不加
      X-Accel-Buffering: no 的话用户看到的是"憋 10 秒一次性全出来"，流式白做；浏览器侧
      TextDecoder 也要用流式模式（stream: true），否则多字节 UTF-8 字符跨 chunk 时乱码。
      【实际案例】我们的流式解析器第一版是"每收到一个 chunk 就 JSON.parse"，灰度时约 3%
      的请求抛解析异常——大响应下 chunk 几乎必跨边界。改成"缓冲区加按空行切加不完整事件
      留存"后归零。第二次踩的是 nginx：上线后用户反馈"不是打字机，是一整段弹出来"，查了
      两小时发现是反向代理缓冲，加 X-Accel-Buffering: no 立刻恢复打字机效果。这两个坑后来
      都进了团队 checklist，还补了集成测试：mock 一个故意拆包的 SSE 流来回归。【举一反三】
      这和前端处理 WebSocket 粘包半包、分块下载断点续传是同一类问题：字节流没有消息边界，
      应用层必须自己定义帧。做过大文件分片上传的人对"缓冲区加边界标记"的心智直接平移。
      【扣分点对照】背八股的会说"监听 message 事件拼起来"；真写过的能讲出空行分包 bug 的
      具体形态、nginx 缓冲导致的"假流式"，以及 TextDecoder 流式模式这种字符级细节。
    followups:
      - SSE 和 WebSocket 在这个场景怎么选？（提示：单向推送 vs 双向、HTTP 友好性、重连语义）
      - 怎么测试流式解析器？（提示：mock 故意拆包、慢速 drip feed 的字节流）
      - 移动弱网下流式体验怎么兜底？（提示：超时降级非流式、已生成内容保留）
