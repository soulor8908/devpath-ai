id: llm.streaming-basics
title: 流式响应（SSE 基础）
summary: 服务端推送的流式协议、增量事件解析、客户端断线处理。流式是 AI UX 的物理基础——首 token 延迟决定产品的"快"感。
tracks: [frontend-to-ai-engineer]
phase: 0
prerequisites: [llm.api-first-call]
estimatedMinutes: 90
difficulty: 2
frontendBridge: >-
  SSE ≈ 一个不会自动关闭的 fetch 响应，服务端持续往连接里写文本块。
  你处理过分块传输、做过打字机效果，这里的增量心智完全一致：
  区别是数据语义——每个 chunk 是一小段 JSON delta，
  需要按 OpenAI 协议拼接成完整消息，中途断线要能续传或降级。
concepts:
  - "SSE 协议：text/event-stream，data: 前缀行，[DONE] 终止标记"
  - 增量 delta：每个 chunk 只含新增 token，客户端负责拼接
  - 首 token 延迟（TTFT）：用户感知"快"的核心指标
  - 断线与重连：网络抖动时的续传、幂等与内容去重
sourceIds: [openai-streaming, mdn-sse, deepseek-api-docs]
gotchas:
  - SSE 是单向协议：客户端→服务端仍走普通 POST，别试图在 SSE 里回写
  - 浏览器原生 EventSource 不支持自定义 header/POST，生产环境用 fetch + ReadableStream 解析
  - 拼 chunk 时绝不能假设每次收到完整 JSON——缓冲区必须按 \n\n 分割事件
interview:
  - q: 为什么 AI 聊天应用都用流式输出？技术上怎么实现？
    answerSkeleton: >-
      流式输出的核心价值是把用户感知延迟从"TTFT + 全量生成时间"降到"TTFT"。本质原因：LLM 生成是逐
      token 的 O(n) 过程，一段 200 token 的回复完整生成要 5-10 秒，但首 token 只要 300-800ms。全量等待
      让用户盯着空白 5 秒，流式让用户立刻看到字一个一个冒出来——感知上"快了 10 倍"。技术实现上，服务端
      用 SSE 协议（text/event-stream）逐 chunk 推送 delta，每个 chunk 含一小段 JSON delta，客户端按
      OpenAI 协议拼接成完整消息并增量渲染。前端迁移映射：SSE ≈ 一个不自动关闭的 fetch 响应，chunk 拼接
      ≈ 处理分块传输，TTFT ≈ FCP（首屏渲染）。Tradeoff：流式不能掩盖 TTFT（首字延迟仍要等），且中途断线
      需要续传与去重逻辑——但产品收益远大于工程复杂度，断线恢复策略是保留已生成内容 + 用户可重试。
    followups:
      - 如果连接在第 50 个 token 时断了，你的恢复策略是什么？
      - EventSource 有哪些限制？生产环境替代方案？
masteryCheck:
  level: V2
  type: code-challenge
  description: 用 fetch + ReadableStream 手写 SSE 解析器（不依赖 SDK），正确处理分块跨边界与 [DONE] 终止
status: reviewed
