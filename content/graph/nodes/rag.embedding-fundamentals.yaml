id: rag.embedding-fundamentals
title: Embedding 与向量空间基础
summary: 把文本映射成高维向量，语义相似度 ≈ 向量距离。这是 RAG 检索的物理基础——没有 embedding 就没有"按语义找"。
tracks: [frontend-to-ai-engineer]
phase: 2
prerequisites: [llm.transformer-intuition]
estimatedMinutes: 90
difficulty: 2
frontendBridge: >-
  embedding ≈ 把文本变成一个"语义指纹"数组（如 1536 维浮点数），相似内容的指纹在空间里靠得近。
  你处理过颜色相似度（RGB 欧氏距离）——这里是 1536 维的同类问题，只是维度高到无法想象。
  直觉：国王-男人+女人≈女王，向量加减法捕捉语义关系。
concepts:
  - embedding：文本 → 固定维度向量，语义距离 ≈ 向量距离（余弦相似度最常用）
  - 维度与模型：text-embedding-3-small=1536 维，text-embedding-3-large=3072 维，开源 bge-large=1024 维
  - 余弦相似度 vs 欧氏距离：余弦只看方向不看长度，对文本长度不敏感，RAG 默认用余弦
  - 归一化：很多向量库要求 embedding 归一化到单位长度（L2 norm=1）
sourceIds: [openai-embeddings, eugene-yan-rag]
gotchas:
  - 不同 embedding 模型维度不同，不能混用——切模型必须全量重建索引
  - 中文 embedding 质量差异大：开源模型在中文上常落后于英文，必须用真实语料测召回率
  - embedding 模型也有"知识截止"——2024 年后的新词（如新框架名）可能编码不准
interview:
  - q: 为什么 RAG 用余弦相似度而不是欧氏距离？工程上有什么连带影响？
    answerSkeleton: >-
      【分层原理】两个度量对"模长"的处理不同：余弦只看方向夹角、忽略向量长度，欧氏距离把模长
      也算进去。文本 embedding 的模长受文本长度与信息量影响——同一主题，三行短查询和八百字
      长段落的向量"指向"几乎一致，但"长短"差很多。RAG 的查询与文档块长度天然不对等，用欧氏
      会把"长文档 vs 短查询"系统性判远，余弦则免疫。工程上的连带影响常被忽略：向量 L2 归一化
      后，余弦相似度数学上等价于点积——这意味着可以用更便宜的内积索引替代余弦计算。
      【实际案例】我在 PGVector 项目里实测过这个细节：OpenAI text-embedding-3 系列输出默认
      已归一化（模长=1），于是把索引从 vector_cosine_ops 换成 vector_ip_ops 内积索引，
      省掉每条向量的模长计算，80 万块的查询 p95 从 38ms 降到 21ms。但同一年换开源模型时
      踩了对称的坑：该模型输出未归一化，团队直接套用了内积索引，内积 ≠ 余弦，召回排序悄悄
      错掉，评测集 recall@5 掉了 9 个点才定位到——补一道显式 L2 归一化才恢复。【举一反三】
      前端做颜色相似度用 RGB 欧氏距离，那是 3 维且有物理对应；这里是 1536 维、语义距离全靠
      模型学出来——所以对任何 embedding 模型，接入前先用几条已知相似/不相似语料验证排序
      是否符合直觉，是最便宜的质量冒烟。【扣分点对照】只答"余弦对长度不敏感"的是背定义；
      能讲出"归一化后余弦退化为点积、可以换内积索引、换模型必须验证是否归一化"这三层
      工程连带的，才是真在生产里用过向量索引。
    followups:
      - embedding 维度越高越好吗？维度对存储和延迟的影响怎么算？
      - 怎么验证一个 embedding 模型在你的语料上"排序符合直觉"？
  - q: embedding 模型怎么选型？OpenAI 的 API 和开源 bge 这类模型怎么权衡，中文场景有什么特殊性？
    answerSkeleton: >-
      【分层原理】选型看五个维度：一是语义质量——必须用自家真实语料建评测集实测召回率，
      公开排行榜（多为英文）不能直接用；二是维度与成本——1536 维 vs 1024 维，存储和计算
      随维度线性涨，百万块量级下是实打实的预算差；三是部署与合规——API 方案数据要出域，
      政企/金融客户常因此一票否决，开源自托管数据不出域但要自己扛可用性；四是语言适配——
      英文霸榜的模型在中文上未必强，中文有专门优化的开源模型；五是升级成本——换模型必须
      全量重建索引，选型时要想清楚迭代空间。【实际案例】我在中文企业知识库项目做过对比
      实测：baseline 用 text-embedding-3-small，中文 query 评测集 recall@5 是 79%；换
      中文优化的 bge 开源模型自托管后 recall@5 到 84%，且数据不出域满足了客户合规要求。
      代价同样真实：要自己维护 GPU 推理服务、做批处理压吞吐，embedding 从"调 API"变成
      "养服务"。另一个英文为主的开源文档问答项目则直接用 OpenAI API，省运维、上线快。
      【举一反三】这和前端选构建工具同理：benchmark 要用自家真实代码库跑，不信通用榜单；
      "托管省心 vs 自建可控"的权衡在 Vercel vs 自建 CI 上也一样。【扣分点对照】背
      "OpenAI 1536 维、bge 开源免费"的是参数复读；能说出"用自家语料实测、中文场景开源
      可反超、合规出域是一票否决项、自托管的隐性运维成本"的，才是真做过选型决策。
    followups:
      - 没有 GPU 资源时，开源自托管这条路还成立吗？（提示：CPU 推理的吞吐账、量化）
      - 评测集怎么建才能反映"自家语料"？
  - q: 升级 embedding 模型时要注意什么？为什么必须全量重建索引而不是增量混入？
    answerSkeleton: >-
      【分层原理】核心事实：不同 embedding 模型的向量是不同的坐标系。即使维度恰好相同，
      同一段文本在新旧模型下的向量位置也毫无对应关系——跨空间算相似度等于拿摄氏度和
      华氏度直接比大小。因此升级模型必须全量重嵌入、重建索引；增量混入（新文档用新模型、
      旧文档留旧向量）会让检索在新旧两个空间之间乱序，且这种劣化是静默的——系统不报错，
      只是召回质量慢慢烂掉。【实际案例】我亲历过这个坑：团队升级 embedding 模型时为省
      成本只重嵌了新增文档，离线回归碰巧通过（评测集大多命中新文档），但线上抽样的
      faithfulness 三天内从 0.94 缓跌到 0.89——旧文档的旧向量与新查询向量不在同一空间，
      检索质量慢性退化。最终的正确姿势是：新模型离线全量建新索引 → 评测集回归通过 →
      按流量灰度切到新索引 → 旧索引保留一个观察期再下线，全程可回滚。【举一反三】这
      就是数据库 schema 迁移的向量版，和前端做接口版本升级同一套纪律：双写/双索引、
      灰度切流、校验后下线。任何"不可逆的数据格式升级"都该走这个流程。【扣分点对照】
      以为"维度一样就能混用"或"增量更新就行"的是没踩过坑；能讲出向量空间不可比的原理、
      静默劣化的发现路径、双索引灰度切换完整流程的，才真做过模型升级。
    followups:
      - 全量重建期间新旧索引怎么保证查询不中断？
      - 灰度切流时用什么指标判断新索引"更好了"？
