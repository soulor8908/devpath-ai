id: agent.tool-ecosystem
title: 工具生态与 MCP
summary: Model Context Protocol 让工具定义与 Agent 解耦——任何 MCP server 可被任何 Agent 消费。这是 Agent 生态的"USB-C"。
tracks: [frontend-to-ai-engineer]
phase: 3
prerequisites: [agent.fundamentals]
estimatedMinutes: 90
difficulty: 3
frontendBridge: >-
  MCP ≈ 工具的"USB-C 接口"：定义了"工具如何被发现、被调用、被授权"的统一协议。你写组件库时
  定义 props 接口让组件可复用——MCP 让工具可被任何 Agent 复用。区别是这里的"消费者"是 LLM，
  "接口"是 JSON Schema + 协议消息。前端工程师对"接口设计决定生态质量"的直觉直接适用。
concepts:
  - MCP 三角色：Host（如 Claude Desktop）/ Client（连接器）/ Server（工具实现）
  - 工具发现：MCP server 自描述能力（list_tools），Agent 动态加载而非硬编码
  - 工具分类：resources（读数据，无副作用）/ tools（执行动作，有副作用）/ prompts（模板）
  - 授权模型：危险工具调用前 Host 弹窗确认，Agent 不能静默执行
  - 与 Function Calling 的关系：Function Calling 是"模型→工具"协议，MCP 是"工具→生态"协议，互补
sourceIds: [mcp-spec, anthropic-tool-use]
gotchas:
  - MCP server 是进程间通信——启动开销与稳定性要管，不像本地函数调用
  - 工具数量爆炸时模型选择准确率下降——MCP 不解决"工具太多"，只解决"工具复用"
  - 授权边界模糊是安全隐患——server 暴露的工具默认 Agent 可调，危险工具必须显式授权
interview:
  - q: MCP 解决了什么问题？它和 Function Calling 是什么关系？
    answerSkeleton: >-
      MCP 解决的是"工具碎片化"问题：在 MCP 之前，每个 Agent 框架（LangChain/AutoGen/OpenAI Assistants）
      各自定义工具接口，一个工具要被多个 Agent 用就得为每个框架写适配——N 个 Agent × M 个工具 =
      N×M 份胶水代码。MCP 定义了"工具如何被发现、被调用、被授权"的统一协议，任何 MCP server 可被
      任何 MCP-compatible Agent 消费，把 N×M 降到 N+M。它和 Function Calling 的关系是互补：Function
      Calling 是"模型→工具"的调用协议（模型返回 tool_call，你执行），MCP 是"工具→生态"的复用协议
      （工具自描述能力，Agent 动态加载）。一个 Agent 可以用 Function Calling 调用从 MCP server 动态
      发现的工具。前端迁移映射：MCP ≈ 工具的 USB-C，接口设计决定生态质量。Tradeoff：MCP 是进程间
      通信有启动开销，且不解决"工具太多选择准确率下降"的问题——工具治理仍需上层做。
    followups:
      - 工具数量到几十上百个时，Agent 怎么选？
      - MCP server 暴露的危险工具怎么防误调用？
masteryCheck:
  level: V2
  type: code-challenge
  description: 实现一个 MCP server（暴露 2 个工具：读文件/查天气 mock），用 Claude Desktop 或自写 Host 调用它
status: reviewed
