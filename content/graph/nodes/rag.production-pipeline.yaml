id: rag.production-pipeline
title: 生产级 RAG 全链路
summary: 把前面的组件串成可上线的管线：增量索引、缓存、失败降级、可观测。从 demo 到生产的最后一公里。
tracks: [frontend-to-ai-engineer]
phase: 2
prerequisites: [rag.reranking, rag.evaluation]
estimatedMinutes: 120
difficulty: 4
frontendBridge: >-
  串管线 ≈ 你做前端工程化：把分散的组件按数据流向连起来，加上缓存、错误边界、监控。这里的
  "组件"是 embedding/检索/重排/生成，"错误边界"是检索失败降级到关键词搜索，"监控"是 trace
  每一步延迟与召回率。你的工程纪律是最大优势。
concepts:
  - 增量索引：文档变更时只更新变化的 chunk，而非全量重建——用文档 hash + 变更队列
  - 多级缓存：embedding 缓存（同文本不重复编码）/ 查询结果缓存（语义缓存，相似查询复用）/ LLM 响应缓存
  - 失败降级链：向量库挂 → BM25 兜底 → 缓存回复 → 兜底文案；LLM 超时 → 流式截断 → 重试
  - 可观测：trace 每步延迟（embedding/检索/重排/生成）、记录查询日志供离线评测、监控召回率漂移
  - 上下文组装：检索到的 chunks 按相关性排序拼进 prompt，控制总 token 不超窗口
sourceIds: [eugene-yan-rag, langchain-rag, jerry-liu-rag-eval]
gotchas:
  - 语义缓存是双刃剑：相似查询复用答案会放大错误——缓存命中率要配人工抽检
  - 增量索引的边界：embedding 模型升级时必须全量重建，增量只适用于文档变更
  - 上下文组装不是"越多越好"：top-20 全塞进 prompt 会稀释注意力，通常 top-3 到 top-5 最优
interview:
  - q: 一个生产 RAG 系统要做哪些工程保障？demo 和生产差在哪？
    answerSkeleton: >-
      demo 到生产差在五道工程保障。第一，增量索引——文档变更时只更新变化的 chunk（用文档 hash +
      变更队列），而非全量重建，否则更新成本不可控。第二，多级缓存——embedding 缓存（同文本不重复
      编码）、查询结果缓存（语义缓存复用相似查询答案，但需人工抽检防放大错误）、LLM 响应缓存。
      第三，失败降级链——向量库挂掉时降级到 BM25 关键词搜索，再降级到缓存回复，最后兜底文案；
      LLM 超时则流式截断 + 重试。第四，可观测——trace 每步延迟（embedding/检索/重排/生成）、记录
      查询日志供离线评测、监控召回率漂移（数据分布变了召回率会掉）。第五，上下文组装——检索到的
      chunks 按相关性排序拼进 prompt，控制总 token 不超窗口，且 top-k 不是越多越好（top-3 到 top-5
      通常最优，更多会稀释注意力）。前端迁移映射：这和你做前端工程化（组件串接 + 缓存 + 错误边界 +
      监控）同构。Tradeoff：语义缓存省成本但会放大错误，必须配人工抽检。
    followups:
      - 语义缓存怎么判断两个查询"足够相似"可以复用答案？
      - 增量索引怎么处理 embedding 模型升级？
