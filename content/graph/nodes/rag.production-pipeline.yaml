id: rag.production-pipeline
title: 生产级 RAG 全链路
summary: 把前面的组件串成可上线的管线：增量索引、缓存、失败降级、可观测。从 demo 到生产的最后一公里。
tracks: [frontend-to-ai-engineer]
phase: 2
prerequisites: [rag.reranking, rag.evaluation]
estimatedMinutes: 120
difficulty: 4
frontendBridge: >-
  串管线 ≈ 你做前端工程化：把分散的组件按数据流向连起来，加上缓存、错误边界、监控。这里的
  "组件"是 embedding/检索/重排/生成，"错误边界"是检索失败降级到关键词搜索，"监控"是 trace
  每一步延迟与召回率。你的工程纪律是最大优势。
concepts:
  - 增量索引：文档变更时只更新变化的 chunk，而非全量重建——用文档 hash + 变更队列
  - 多级缓存：embedding 缓存（同文本不重复编码）/ 查询结果缓存（语义缓存，相似查询复用）/ LLM 响应缓存
  - 失败降级链：向量库挂 → BM25 兜底 → 缓存回复 → 兜底文案；LLM 超时 → 流式截断 → 重试
  - 可观测：trace 每步延迟（embedding/检索/重排/生成）、记录查询日志供离线评测、监控召回率漂移
  - 上下文组装：检索到的 chunks 按相关性排序拼进 prompt，控制总 token 不超窗口
sourceIds: [eugene-yan-rag, langchain-rag, jerry-liu-rag-eval]
gotchas:
  - 语义缓存是双刃剑：相似查询复用答案会放大错误——缓存命中率要配人工抽检
  - 增量索引的边界：embedding 模型升级时必须全量重建，增量只适用于文档变更
  - 上下文组装不是"越多越好"：top-20 全塞进 prompt 会稀释注意力，通常 top-3 到 top-5 最优
interview:
  - q: 介绍一个你做过的生产级 RAG 系统：端到端架构是什么样的？demo 和生产的差距在哪？
    answerSkeleton: >-
      【分层原理】生产 RAG 按数据流向分五层。数据层：文档解析 → 切分 → embedding
      → 向量库，带增量索引支撑文档日常更新。检索层：混合检索（向量 + BM25）召回
      top-50，rerank 精排到 top-5。生成层：上下文按相关性拼装、控 token 预算，
      强制引用 + temperature 0。保障层：多级缓存（embedding 缓存、语义缓存）、
      失败降级链（向量库挂 → BM25 兜底 → 缓存 → 兜底文案）、全链路 trace。评估层：
      离线评测集回归当发版门禁，线上抽样监控 faithfulness 趋势。demo 和生产的
      差距就在后两层——demo 只跑通前三层，生产要在缓存、降级、监控、评估上
      持续投入。【实际案例】我负责的企业知识库问答：5 万篇文档、日均 8000 查询。
      数据管道用 Unstructured 解析 + 递归切分 800 token + 自托管 bge 嵌入入
      PGVector；检索是 BM25 + 向量 RRF 融合、top-50 召回、bge-reranker 精排
      top-5；生成强制逐条引用；语义缓存命中 35% 省了三分之一的 LLM 成本。上线
      六个月的数据收尾：recall@5 87%、faithfulness 0.93、用户点赞率 81%、
      端到端 p95 2.1s。【举一反三】这和前端工程化同构：组件串接只是起点，
      缓存策略、错误边界、监控告警才是"能上线"和"敢上线"的区别。【扣分点对照】
      流水账背组件名的是搭过 demo；能按数据流向讲清五层、每层给出自己系统的
      真实参数、收尾有业务指标的，才真扛过生产。
    followups:
      - 这条链路上最薄弱、最先出问题的是哪一环？
      - 语义缓存的"相似即命中"会不会把错误答案也缓存放大？怎么防？
  - q: 文档频繁更新时索引怎么保鲜？增量索引怎么设计，删除怎么处理？
    answerSkeleton: >-
      【分层原理】核心是围绕 doc_id 的版本治理：每个块带 doc_id + version +
      content_hash。文档变更走队列驱动——比对 content_hash，变了才重解析、重
      切分、重嵌入该文档的块，而不是全量重建。删除用软删除：旧版本块标记
      superseded、检索时过滤掉，异步物理清理——好处是误删可回滚、重建故障时
      旧数据仍可服务。两条边界要记清：embedding 模型升级不在增量范围内（向量
      空间变了必须全量重建）；高频删改会产生墓碑节点，需要定期重建索引兜底。
      【实际案例】我在政策库项目做过演进：第一版每晚全量重建，5 万篇要跑 4 小时、
      更新延迟 T+1，业务部门投诉新政策当天搜不到。改增量后按 doc_id 定位旧块
      标 superseded、新块入库，单篇更新 30 秒内可检索。踩过的坑：曾经图省事
      直接物理删除旧块，恰逢重建窗口故障，旧政策相关查询全部拒答——从此只
      软删 + 异步清理，物理删除永远滞后一周。【举一反三】这就是前端缓存失效的
      stale-while-revalidate 思路：旧数据先标记后清理，保证任何时刻系统可服务；
      增量更新的本质是把"重建成本"从全量摊到单文档。【扣分点对照】只说"定时
      全量重建"的是没扛过更新时效；能讲出 doc_id + version 数据模型、软删除的
      容灾意义、增量与全量两条边界的，才真运维过索引。
    followups:
      - 文档改了但 content_hash 没变的情况存在吗？（提示：解析/切分逻辑升级）
      - 切分策略升级时，增量索引怎么处理存量文档？
  - q: 企业场景的权限与多租户怎么做？RBAC 怎么落到检索链路上？
    answerSkeleton: >-
      【分层原理】第一原则：无权限数据不进候选集——权限过滤必须 pre-filter 注入
      检索条件，绝不能检索后过滤，因为只要内容进了模型上下文就可能被引用进答案，
      等于泄漏。落法：块级 metadata 带 acl 字段（部门/角色/租户 id），检索时在
      网关层统一注入过滤条件——不让各业务代码自己传，防遗漏。多租户两案：共享
      索引 + tenant_id 强制过滤，省成本但隔离弱、依赖过滤逻辑零 bug；独立
      collection/索引，隔离强但成本随租户数线性涨。权限变更还要近实时同步到
      索引，否则"已调岗的人还能搜旧部门文档"。【实际案例】我经历过权限事故：
      SaaS 知识库第一版用 post-filter，A 公司员工搜到了 B 公司文档片段——
      过滤发生在检索后，但模型已经把过滤前的上下文引用进了答案，客户差点
      解约。之后改成 pre-filter + 网关层强制注入 tenant_id，并对权限变更做了
      变更流同步（调岗 5 分钟内旧部门文档不可见），再没出过事。【举一反三】
      这和前端权限的路由守卫 vs 渲染后隐藏完全同构：安全必须前置到数据入口，
      后置过滤在安全语义上永远有洞。【扣分点对照】只说"加个权限字段过滤一下"
      的是没想过攻击面；能讲出 post-filter 的泄漏事故形态、共享索引与独立索引
      的隔离/成本权衡、权限变更同步链路的，才真做过企业级。
    followups:
      - 租户数量到几千个时，独立索引方案还成立吗？怎么折中？
      - 权限过滤的 pre-filter 和 HNSW 的图遍历怎么配合，会不会伤召回？
  - q: 拒答与兜底怎么设计？什么情况该明确说"不知道"？
    answerSkeleton: >-
      【分层原理】拒答是 RAG 的安全阀：检索质量不足时明确说不知道，比硬答一个
      幻觉答案好得多。触发信号用 top-1 相似度或 rerank 分数设阈值，低于阈值判定
      "库里没有"，走拒答话术 + 转人工/反馈入口。阈值不是拍的：在评测集上画
      PR 曲线，按业务能接受的幻觉率/拒答率平衡点选。兜底链分层：向量库挂 →
      降级 BM25 关键词检索 → 缓存的热门答案 → 兜底文案；LLM 超时 → 重试 →
      流式截断。关键认知：拒答率本身是运营指标——太高说明知识库有缺口该补库，
      太低可能阈值太松放进了幻觉，要双向解读。【实际案例】我在客服场景定的
      阈值是 0.62（评测集 PR 曲线上选的），拒答率 8%，幻觉投诉从每周十几起降到
      个位数。后来业务扩张拒答率升到 15%，分析拒答日志发现 60% 集中在新产品
      相关查询——针对性补了两周文档，拒答率回落到 9%，形成了"拒答日志驱动
      知识库运营"的闭环。【举一反三】这和前端的错误边界 + 骨架屏降级 + 监控
      告警同款分层：每一层假设上一层会失败，且兜底数据要回流成运营动作。
      【扣分点对照】只说"prompt 里写不知道就说不知道"的是单点思维；能讲出
      阈值用 PR 曲线定、拒答率双向解读、拒答日志驱动补库闭环的，才真做过
      线上兜底。
    followups:
      - 用户反复问库里没有的内容，拒答体验怎么做得不挫败？
      - 阈值拒答和 faithfulness 校验器拦截，两道防线怎么分工？
