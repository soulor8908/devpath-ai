id: agent.memory-and-state
title: Agent 记忆与状态管理
summary: 短期记忆（trajectory 上下文）vs 长期记忆（跨会话持久化）。Agent 跑久了上下文会爆，记忆管理是生产 Agent 的核心难题。
tracks: [frontend-to-ai-engineer]
phase: 3
prerequisites: [agent.langgraph-orchestration]
estimatedMinutes: 90
difficulty: 3
frontendBridge: >-
  Agent 记忆 ≈ 你做 SPA 的状态管理：短期记忆是组件内 state（trajectory 在上下文里），长期记忆是
  localStorage/IndexedDB（跨会话持久化）。区别是 Agent 的"state"是文本且会按 token 计费——
  trajectory 越长越贵且越慢，必须主动压缩或外存。
concepts:
  - 短期记忆：当前会话的 trajectory（thought+action+observation），塞在 prompt 上下文里
  - 长期记忆：跨会话持久化，通常用向量库存"过去经验"，按需检索召回
  - 上下文压缩：trajectory 过长时用 LLM 摘要历史步骤，或只保留最近 N 步 + 摘要
  - 记忆类型：episodic（具体事件）/ semantic（抽象知识）/ procedural（怎么做某事，类似 SOP）
  - 记忆写入策略：不是所有 trajectory 都值得记——只记"成功/失败的关键决策点"
sourceIds: [langchain-memory, langgraph-docs]
gotchas:
  - 把全部 trajectory 塞进上下文是最常见错误——10 步后 token 就爆，且模型注意力被稀释
  - 长期记忆不是"存 everything"——写入要筛选（只记关键决策），检索要精准（否则召回噪声）
  - 记忆与 RAG 的边界：长期记忆本质是"对自己过往经验的 RAG"，但写入策略比文档 RAG 更难
interview:
  - q: Agent 跑了 20 步，trajectory 上下文要爆了，怎么办？
    answerSkeleton: >-
      【分层原理】按代价递增有四招。第一，滑动窗口：只保留最近 N 步完整 trajectory，更早的丢弃——
      实现最简单，但早期关键决策（用户第 2 步说的约束）会丢。第二，摘要压缩：用 LLM 把早期步骤压成
      一段摘要替换原文，保留要点省 token，代价是摘要是有损压缩，细节型任务（代码调试的具体报错）
      可能被压掉。第三，结构化状态外提：把"已收集的事实/已排除的假设/当前结论"写进显式 state
      字段而不是塞在自然语言历史里——模型读 200 token 的结构化 state 比读 5000 token 历史对话
      高效得多。第四，外存+检索：历史 trajectory 进向量库，当前步只带最近 N 步+按需召回相关历史，
      本质是对自己经验做 RAG，最省 token 但有检索延迟和召回噪声。生产上通常组合拳：结构化 state
      打底+滑动窗口保底+超长任务上摘要或外存。【实际案例】我在一个多轮调研 Agent（平均 25 步）
      项目里演进过三轮。第一版全量塞历史，第 15 步开始频繁"忘记"用户开头定的输出格式，且单轮
      token 成本线性涨到 3 倍。第二版上滑动窗口（最近 8 步），格式遵守好了，但用户第 3 步说的
      "不要引用某来源"在第 10 步被违反——早期约束丢了。第三版定型：显式 state 存"用户约束/已
      确认事实/排除项"三个结构化字段（每步由节点负责增量维护）+最近 6 步窗口+更早步骤每 5 步
      滚动摘要一次。改后约束违反率从 12% 降到 1.5%，单轮成本稳定在初始的 1.4 倍不再增长。
      【举一反三】这就是前端状态管理的 Agent 版：组件内 state（窗口内 trajectory）、全局 store
      （结构化 state）、IndexedDB（外存检索）三层各司其职——你在 SPA 里早就做过"什么状态放哪层"
      的判断。【扣分点对照】只说"用摘要压缩"的是背方案清单；能讲出四层手段的取舍顺序、早期约束
      丢失这种具体失败形态、以及"结构化 state 增量维护"这个工程动作的，才是真调过长程 Agent。
    followups:
      - 长期记忆该存什么？不该存什么？
      - 结构化 state 和自然语言 trajectory 各自适合存什么？
  - q: Agent 的长期记忆怎么设计？存什么、什么时候写入更新、怎么防止记忆污染？
    answerSkeleton: >-
      【分层原理】生产级记忆通常是双层。短期层：当前会话的 trajectory，生命周期随会话结束。长期层：
      跨会话的用户画像与偏好，结构化 JSON 入库（如 {偏好、事实、历史结论}），新会话开始时按需注入
      或检索召回。写入策略是核心难点，常见三种触发：显式触发——用户说"还记得吗""记住这个"，
      Agent 把对应内容写入，可控性最高；周期触发——每 N 轮或会话结束时用 LLM 对整段对话做摘要
      提炼，把值得长期记住的合并进画像；事件触发——检测到画像相关新信息（用户换了城市、改了
      技术栈）即时更新对应字段。合并时要带时间戳与来源，新旧冲突按"新的覆盖旧的+保留历史"处理。
      记忆污染是最大的坑：错误信息一旦写入长期层，会在未来所有会话里反复被召回、自我强化——所以
      写入要有置信门槛（模型明确提取的事实才写，猜测不写真），用户可见可改（记忆面板让用户删改），
      召回要带时间与来源便于判断时效。【实际案例】我在学习助手项目里做过这套双层记忆。长期层存
      用户的技术栈、学习目标、已掌握知识点，每 5 轮对话触发一次摘要合并。上线后用 200 条多会话
      测试集测"记忆召回正确率"（该记住的能否在新会话被正确用上），初版只有 68%：bad case 集中在
      两类——摘要把"用户随口说想学 Rust"当成确定目标写死，以及旧偏好没被新信息覆盖。加了两个
      机制：写入分"确认事实/初步意向"两档置信度，召回时低置信记忆标注"可能已过时"；画像字段
      合并时新值覆盖旧值并保留变更历史。召回正确率升到 92%，且用户投诉"它记错了还嘴硬"基本消失
      ——因为记忆面板能直接改。【举一反三】前端视角：长期记忆 ≈ 用户设置中心的持久化，只是
      "读写者"从用户自己变成了 LLM——所以必须补上"用户可审计可纠正"这层 UI，这是纯后端思维
      容易漏的。【扣分点对照】说"存向量库语义检索就完事"的是把记忆等同于 RAG；能讲出写入触发
      策略、置信度分档、污染自我强化机制、用户可纠正设计的，才是真运营过有记忆的 Agent。
    followups:
      - 长期记忆用结构化画像还是向量库自由文本？怎么选？
      - 记忆召回怎么和当轮意图对齐——如何避免"强行套用历史偏好"？
  - q: Agent 的长期记忆和 RAG 是一回事吗？边界在哪？架构上怎么区分？
    answerSkeleton: >-
      【分层原理】底层技术同构——都是写入+检索+注入上下文，很多记忆系统就是向量库实现；
      但写入对象、时效要求、隔离维度完全不同，混为一谈会做错架构。RAG 管"世界知识"：文档
      共享、相对静态、面向所有用户，写入是离线批处理，检索目标是正确答案。长期记忆管"个体
      经验"：每用户隔离、高频变化、对错因人而异，写入是运行时在线发生，检索目标是"关于这个
      用户的背景"——它本质是"对自己过往经验的 RAG"，但多两个 RAG 没有的难题：写入筛选
      （不是每句话都值得记）和冲突合并（上周说喜欢简洁、这周说要详细，哪个有效）。架构推论：
      分库分管道——知识库全用户共享、按 doc_version 失效；记忆库按 user_id 隔离、按时间与
      置信度衰减；检索时并行召回，拼进上下文不同段落（system 区放画像，检索区放文档）。
      【实际案例】我在学习助手里吃过混用的亏：第一版把"用户已掌握知识点"标进共享知识库，
      A 用户的掌握状态被召回到 B 用户上下文——隐私事故级别。拆开后：知识库走共享 RAG 管道，
      记忆走 user_id 强隔离集合，写入走会话结束摘要+置信度分档。另一坑：记忆召回和文档召回
      混在一个相关性排序里，"我上周说过不喜欢冗长回答"的时效压不过高相似旧文档，给记忆加
      独立 quota 与衰减排序才稳定。【举一反三】前端视角：RAG ≈ 全站共享 CDN，记忆 ≈ 每用户
      localStorage——一个公共缓存一个私有状态，存错地方就是事故。【扣分点对照】说"记忆
      就是 RAG 换名字"的是只看见技术栈没看见数据语义；能讲出共享/私有隔离、在线写入筛选、
      冲突合并与衰减的，才是真设计过双管道的人。
    followups:
      - 记忆和文档召回冲突时（记忆说 A、文档说 B），上下文里怎么呈现才不让模型混乱？
      - 同一用户在多个产品间的记忆要不要互通？隐私边界在哪？
  - q: 记忆召回什么时候触发、注入到上下文什么位置？怎么防止记忆把当前任务带偏？
    answerSkeleton: >-
      【分层原理】召回时机的权衡："每轮都召回"贵且噪声大，"只在开头注入一次"会错过对话中
      新出现的话题。三种触发：每轮召回——按当轮 query 检索，相关性最高但每轮多一次检索
      延迟，且易召回无关记忆稀释注意力；开头注入画像——只注入高置信核心画像（200 token
      以内），便宜稳定但覆盖不了细粒度历史；事件触发——检测到当轮话题与某段记忆强相关才
      召回，性价比最高但要一层轻量分类。注入位置同样讲究：稳定画像放 system prompt 前部
      （还能吃 prompt 缓存），当轮召回的细粒度记忆放最近一条用户消息附近——模型对上下文
      尾部注意力最强。防带偏三条纪律：召回带相关性阈值宁缺毋滥；注入的记忆显式标注"这是
      历史偏好，与当前请求冲突时以当前请求为准"；冲突时当前指令赢要写进 prompt，不指望模型
      自觉。【实际案例】我在学习助手里演进过：第一版每轮全量召回 top5 记忆，11% 的回答
      "强行套用历史偏好"——用户问 Rust，模型硬扯回他历史里的 Python。改成开头注入 200
      token 核心画像 + 事件触发召回（相关性>0.82 才注入），滥用率降到 2%。位置也调过：
      画像从 system 尾部挪到前部后，长对话里"忘记用户偏好"的投诉少了大半——尾部被
      trajectory 稀释了。【举一反三】这是前端"全局配置 vs 当前 props"的优先级问题：记忆是
      全局配置，当轮输入是 props，冲突时 props 赢；注入位置 ≈ CSS 特异性，位置决定权重。
      【扣分点对照】只说"向量检索 topK 塞 prompt"的是没算过噪声账；能讲出三种触发取舍、
      注入位置与注意力分布、冲突优先级显式声明的，才是真调过记忆系统的人。
    followups:
      - 相关性阈值怎么定？不同类型记忆（偏好/事实/计划）该用不同阈值吗？
      - 用户明确要求"忘掉我之前说的"，系统层面怎么保证真的忘掉？
