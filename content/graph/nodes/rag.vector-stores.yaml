id: rag.vector-stores
title: 向量数据库与索引
summary: 把 embedding 存进专门的数据库做高效近邻搜索。Pinecone/Chroma/Qdrant/PGVector 的选型与权衡，HNSW 索引的直觉。
tracks: [frontend-to-ai-engineer]
phase: 2
prerequisites: [rag.embedding-fundamentals]
estimatedMinutes: 120
difficulty: 3
frontendBridge: >-
  向量库 ≈ 专门存"语义指纹"的数据库，按相似度而非精确匹配查询。传统 DB 你用 WHERE 精确查，
  向量库你用"ORDER BY 相似度 LIMIT k"模糊查。HNSW 索引 ≈ 给向量建"快速跳表"，用空间换时间。
  选型心智和你选 Redis/MySQL/ES 一样：按读写比、规模、延迟要求选。
concepts:
  - 精确近邻（kNN）vs 近似近邻（ANN）：精确 O(n) 太慢，ANN 牺牲少量精度换数量级提速
  - HNSW（Hierarchical Navigable Small World）：分层图索引，主流向量库默认，查询 O(log n)
  - 主流选型：Pinecone（托管 SaaS）/ Chroma（嵌入式，开发友好）/ Qdrant（开源，Rust 高性能）/ PGVector（Postgres 扩展，复用现有 DB）
  - 元数据过滤：先按 metadata（如 source、date）过滤再向量搜索，生产 RAG 必备
  - 索引参数：ef_construction（建图质量）/ ef_search（查询质量）—— 越高越准越慢
sourceIds: [pinecone-docs, chroma-docs]
gotchas:
  - 嵌入式（Chroma）和托管（Pinecone）的边界：原型用嵌入式，生产上托管——迁移成本不只是改连接串
  - HNSW 对纯增量插入是鲁棒的，但高频删除/更新会产生大量墓碑（tombstone）节点使图退化——churn 高的业务需定期重建索引
  - 元数据过滤在向量搜索"之前"还是"之后"做差别巨大：pre-filter 省计算但可能丢候选，post-filter 精确但慢
interview:
  - q: 选向量数据库时考虑哪些因素？Pinecone vs Chroma vs PGVector vs Qdrant 怎么选？
    answerSkeleton: >-
      【分层原理】选型按六个维度：一是规模——十万级以下嵌入式够用，千万到亿级要专用库
      或托管服务；二是运维——托管 SaaS 零运维但按用量计费，自托管省成本但要自己保可用性，
      复用现有数据库（PGVector 搭 Postgres 的备份/监控栈）运维最省；三是延迟——嵌入式
      本地调用微秒级，托管服务多一跳网络往返；四是元数据过滤能力——生产 RAG 的权限与
      多租户都依赖 pre-filter，各家支持深度参差；五是合规——数据能否出域常是一票否决项；
      六是生态——与所用框架的集成成熟度。【实际案例】我做企业知识库时走过完整路径：原型期
      用 Chroma 嵌入式一天跑通，验证完检索链路；上生产时两个硬约束直接拍板——客户要求
      数据不出域（托管 SaaS 出局）、运维团队已有成熟的 Postgres 体系，最终选 PGVector，
      80 万块 + HNSW 索引查询 p95 45ms 完全够用。另一个无合规约束、数据量更大的互联网
      项目则选了 Qdrant 自托管，看中它的过滤性能和水平扩展。【举一反三】这和前端选
      Redis/MySQL/ES 的心智完全同构：先列硬约束（合规/运维），再按规模与延迟实测，
      口诀只能当起点。【扣分点对照】背"原型 Chroma、生产 Pinecone"口诀的是没上过生产；
      能讲出数据出域合规、复用现有运维栈、按自家规模实测延迟这三个真实决策变量的，
      才真做过选型。
    followups:
      - 从 Chroma 迁移到 PGVector 时，除了改连接串还有哪些迁移成本？
      - 托管方案按用量计费，怎么估算和控制成本？
  - q: HNSW 索引为什么查询快？牺牲了什么？ef、M 这些参数怎么调？
    answerSkeleton: >-
      【分层原理】HNSW 是分层图：顶层是稀疏的"高速公路"，几步跳到目标大致区域，底层是
      稠密连接做精细查找，整体查询复杂度 O(log n)——这就是它快的原因。牺牲有三：一是
      内存，图结构的存储开销常比向量本身还大；二是召回是近似的，典型 95-99%，不是 100%；
      三是高频删除/更新会留下墓碑（tombstone）节点，图结构逐渐退化。参数上 M 是每个
      节点的邻居数（越大图越连通、越准但内存越大）、ef_construction 决定建图质量、
      ef_search 决定查询时探索多少候选——它是召回率与延迟的旋钮，调参就是对着这条
      曲线找平衡点。【实际案例】我在客服知识库实测过 ef_search 的曲线：ef=64 时
      recall@10 为 91%、p95 延迟 12ms，ef=256 时 recall 97%、p95 38ms——按业务对
      延迟的容忍取 ef=128 的平衡点。另一次教训：文档每天约 20% 的高频更新跑了三个月，
      recall 悄悄掉了 6 个点，排查确认是墓碑节点堆积，后来定了每周低峰增量重建 +
      每月全量重建的策略才稳定。【举一反三】这和前端任何"空间换时间"的优化（缓存、
      冗余索引）同一思路：近似换性能的系统必须持续监控"近似度"，否则退化是静默的。
      【扣分点对照】只答"HNSW 是图索引所以快"的是名词解释；能讲出 ef_search 的
      recall-延迟实测曲线、墓碑节点退化与定期重建运维策略的，才真运维过向量库。
    followups:
      - 怎么监控 HNSW 的近似召回率有没有退化？
      - 为什么不能每次都全量重建？增量重建和全量重建怎么搭配？
  - q: 元数据过滤放向量搜索之前（pre-filter）还是之后（post-filter）？各自的坑是什么？
    answerSkeleton: >-
      【分层原理】post-filter 是先向量搜出 top-k 再按元数据过滤：实现简单，但如果 top-k
      里大半被滤掉，返回条数不足、召回质量直接崩——而且候选集里已经混进了不该看到的
      数据，有安全语义问题。pre-filter 是先按元数据圈定子集再在子集内向量搜索（或在
      HNSW 遍历时带过滤条件）：结果保证满足条件，安全语义正确，但过滤条件太狠时候选池
      变小、召回不足。生产上的正确姿势是用支持 filtered ANN 的向量库，并把过滤条件的
      选择度（filter selectivity）纳入 top-k 设计。【实际案例】我在企业权限场景两个坑
      都踩过：第一版 post-filter，普通员工搜"薪酬"，top-20 里 18 条是无权限的高管文档，
      过滤后只剩 2 条、答案质量崩掉；改成 pre-filter（按 department + acl 先圈可见集合）
      后遇到对称的坑——小部门可见文档少，候选池太小召回不足，最后对小部门把召回 top-k
      从 20 放大到 100 才稳定。【举一反三】这和前端"服务端过滤 vs 前端过滤"的权衡
      同构：涉及安全时必须前置——无权限数据根本不该进候选集；数量不足要靠放大候选
      补偿，而不是放弃过滤。【扣分点对照】只说"pre-filter 快、post-filter 准"的是
      背书；能讲出 post-filter 返回不足的具体崩法、pre-filter 候选池缩小的坑、以及
      放大 top-k 的补偿手段的，才真做过带权限的检索。
    followups:
      - 过滤条件的选择度很高（只剩 0.1% 数据）时，HNSW 还能正常工作吗？
      - 权限数据为什么必须在检索前过滤而不是检索后过滤？
  - q: 向量规模上百万后内存和成本撑不住怎么办？量化压缩的原理与代价是什么？
    answerSkeleton: >-
      【分层原理】先算账：1536 维 float32 向量每条 6KB，100 万条裸向量约 6GB，再加
      HNSW 图结构开销（常与向量本体相当甚至更大），内存轻松破 10GB。量化的思路是
      用精度换空间：标量量化（SQ8）把每维从 float32 压到 int8，体积直接除以 4，
      召回损失通常 1-2 个点；乘积量化（PQ）把向量切成若干子段、每段用码本质心 id
      代替，能压到十分之一甚至更小，但召回损失更大且要训练码本；二值量化更激进，
      每维 1bit，需配合过采样加精排才可用。工程上的标准姿势是两段式：量化索引把
      候选从百万粗筛到几百，再用磁盘上的原始向量对小候选集精确重排，召回率能补回
      到接近未量化水平。【实际案例】我把一个 300 万条的 PGVector 库迁到 Qdrant 时
      实测过：全 float32 + HNSW 内存要 38GB，开 SQ8 量化后降到 11GB，recall@10 从
      96% 掉到 94%，加上"量化粗筛 200 条 + 原向量重排"后回到 96%，p95 延迟只多了
      6ms——云主机规格降一档，月成本省四成。【举一反三】这和前端"缩略图列表 +
      原图懒加载"完全同构：列表页用有损压缩图快速筛选，用户点开了才加载原图；
      索引分层、冷热分离也是同一思想。【扣分点对照】只会说"上量化省内存"的是
      名词党；能讲出 SQ 与 PQ 的压缩比和召回损失量级、两段式粗筛加精排的架构、
      以及实测的内存与延迟账的，才真扛过规模化。
    followups:
      - 量化后的召回损失怎么监控？怎么判断该加精排层？
      - PQ 的码本怎么训练？数据分布变了要不要重训码本？
